<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة العقود والمشتريات | PCM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏗️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0b1220; --bg2:#0f172a; --panel:#111c33; --panel2:#15213b; --border:#22304d; --border2:#2c3c5e;
  --text:#e7edf7; --muted:#93a4c3; --muted2:#6b7d9e;
  --blue:#2563eb; --blue2:#3b82f6; --blue-soft:#1d3a6b;
  --gold:#c9a24b; --gold-soft:#3a3120;
  --green:#22c55e; --green-soft:#0f2e1c;
  --red:#ef4444; --red-soft:#3a1620;
  --amber:#f59e0b; --amber-soft:#3a2c10;
  --radius:12px; --radius-sm:8px;
  --shadow:0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Cairo',sans-serif; background:
    radial-gradient(1100px 500px at 90% -10%, #14213f 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 10%, #17243f 0%, transparent 55%),
    var(--bg);
  color:var(--text); min-height:100vh; display:flex;
}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border2); border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== Layout ===== */
#sidebar{
  width:264px; min-width:264px; background:linear-gradient(180deg,#0d1830,#0a1224);
  border-inline-end:1px solid var(--border); display:flex; flex-direction:column;
  height:100vh; position:sticky; top:0;
}
[dir="ltr"] #sidebar{border-inline-start:1px solid var(--border);}
.brand{
  padding:20px 18px 14px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.brand .logo{
  width:42px; height:42px; border-radius:11px; background:linear-gradient(135deg,var(--gold),#8a6d24);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex:none;
  box-shadow:0 4px 14px rgba(201,162,75,.35);
}
.brand h1{font-size:15.5px; font-weight:800; line-height:1.35;}
.brand p{font-size:11px; color:var(--muted2); margin-top:2px; letter-spacing:.3px;}

nav.menu{flex:1; overflow-y:auto; padding:12px 10px;}
.menu .grp-label{font-size:10.5px; color:var(--muted2); text-transform:uppercase; letter-spacing:1px; padding:14px 10px 6px;}
.menu button{
  width:100%; display:flex; align-items:center; gap:10px; text-align:start;
  background:transparent; border:none; color:var(--muted); padding:10px 12px; border-radius:9px;
  font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:2px;
  transition:.15s;
}
.menu button .ic{font-size:16px; width:20px; text-align:center; flex:none;}
.menu button:hover{background:#15213b; color:var(--text);}
.menu button.active{background:linear-gradient(90deg, var(--blue-soft), rgba(37,99,235,.08)); color:#fff; box-shadow:inset 2px 0 0 var(--blue2);}
[dir="ltr"] .menu button.active{box-shadow:inset -2px 0 0 var(--blue2);}
.menu .badge{margin-inline-start:auto; background:var(--red); color:#fff; font-size:10px; font-weight:800; border-radius:20px; padding:1px 7px; min-width:18px; text-align:center;}

.side-footer{padding:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
.side-footer .btn{width:100%; justify-content:center;}

/* ===== Main ===== */
#main{flex:1; min-width:0; height:100vh; overflow-y:auto;}
header.topbar{
  position:sticky; top:0; z-index:30; background:rgba(11,18,32,.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; gap:14px;
}
header.topbar h2{font-size:18px; font-weight:800;}
header.topbar .sub{font-size:12px; color:var(--muted2); margin-top:2px;}
header.topbar .spacer{flex:1;}
.top-actions{display:flex; gap:8px; flex-wrap:wrap;}

.wrap{padding:22px 24px 60px; max-width:1500px;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:9px; border:1px solid var(--border2);
  background:#152037; color:var(--text); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:.15s; white-space:nowrap;
}
.btn:hover{background:#1b2a48; border-color:#3c507a;}
.btn-primary{background:linear-gradient(180deg,var(--blue2),var(--blue)); border-color:var(--blue); color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:linear-gradient(180deg,#d9b45e,var(--gold)); border-color:var(--gold); color:#1a1305;}
.btn-danger{background:var(--red-soft); border-color:#5a2430; color:#ff9aa4;}
.btn-danger:hover{background:#4a1c26;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ===== Cards / KPI ===== */
.grid{display:grid; gap:16px;}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:22px;}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow);
}
.kpi{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.kpi .lbl{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:700;}
.kpi .val{font-size:24px; font-weight:800; margin-top:6px;}
.kpi .icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;}
.kpi .note{font-size:11.5px; color:var(--muted2); margin-top:10px;}
.ic-blue{background:rgba(37,99,235,.15); color:#60a5fa;}
.ic-green{background:rgba(34,197,94,.15); color:#4ade80;}
.ic-gold{background:rgba(201,162,75,.18); color:#e0bd6b;}
.ic-red{background:rgba(239,68,68,.15); color:#f87171;}
.ic-amber{background:rgba(245,158,11,.15); color:#fbbf24;}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-title h3{font-size:15.5px; font-weight:800;}
.section-title .hint{font-size:12px; color:var(--muted2);}

/* ===== Table ===== */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel);}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
thead th{
  background:#0d1830; color:var(--muted); text-align:start; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
  padding:11px 12px; border-bottom:1px solid var(--border); font-weight:800; white-space:nowrap;
}
tbody td{padding:11px 12px; border-bottom:1px solid #1a2740; vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#0f1a30;}
.empty-row td{text-align:center; padding:34px; color:var(--muted2);}
.mono{font-family:'JetBrains Mono',monospace; font-size:12px;}
.num{font-variant-numeric:tabular-nums;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:800; white-space:nowrap;}
.pill-blue{background:rgba(37,99,235,.15); color:#7fb0ff;}
.pill-green{background:rgba(34,197,94,.16); color:#5be08a;}
.pill-red{background:rgba(239,68,68,.16); color:#ff8f97;}
.pill-amber{background:rgba(245,158,11,.16); color:#ffc35c;}
.pill-gray{background:#22304d; color:var(--muted);}

.row-actions{display:flex; gap:6px;}
.iconbtn{
  background:#182746; border:1px solid var(--border2); color:var(--muted); width:28px; height:28px; border-radius:7px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px;
}
.iconbtn:hover{background:#22345a; color:#fff;}
.iconbtn.danger:hover{background:var(--red-soft); color:#ff9aa4;}

/* ===== Forms / Modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,8,18,.72); backdrop-filter:blur(3px); display:none;
  align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;
}
.modal-overlay.show{display:flex;}
.modal{
  background:linear-gradient(180deg,#12203e,#0e1830); border:1px solid var(--border2); border-radius:16px;
  width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.5); overflow:hidden;
}
.modal.wide{max-width:900px;}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-close{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1;}
.modal-body{padding:20px 22px; max-height:72vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
input,select,textarea{
  width:100%; background:#0c1830; border:1px solid var(--border2); color:var(--text); border-radius:8px;
  padding:9px 11px; font-family:inherit; font-size:13.5px; outline:none; transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue2); box-shadow:0 0 0 3px rgba(59,130,246,.15);}
textarea{resize:vertical; min-height:64px;}
.helptext{font-size:11px; color:var(--muted2); margin-top:5px;}

.items-editor{border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:8px;}
.items-editor table{min-width:0;}
.items-editor input{padding:6px 8px; font-size:12.5px;}
.tiny-btn{font-size:11px; padding:5px 9px;}

.subtabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:0;}
.subtabs button{background:none; border:none; color:var(--muted); font-family:inherit; font-weight:700; font-size:13px; padding:9px 4px; margin-inline-end:18px; cursor:pointer; border-bottom:2px solid transparent;}
.subtabs button.active{color:#fff; border-color:var(--blue2);}

.alert-item{display:flex; gap:12px; padding:13px; border-radius:10px; background:#0e1830; border:1px solid var(--border); margin-bottom:10px;}
.alert-item .aic{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; font-size:15px;}
.alert-item h4{font-size:13px; font-weight:800; margin-bottom:3px;}
.alert-item p{font-size:11.5px; color:var(--muted2);}
.alert-item .adl{font-size:11.5px; font-weight:800; margin-top:6px;}

.toast{
  position:fixed; bottom:24px; inset-inline-end:24px; background:#12203e; border:1px solid var(--border2); color:#fff;
  padding:12px 18px; border-radius:10px; box-shadow:var(--shadow); z-index:200; font-size:13px; font-weight:700;
  display:flex; align-items:center; gap:9px; animation:slideup .25s ease;
}
@keyframes slideup{from{transform:translateY(14px); opacity:0;} to{transform:translateY(0); opacity:1;}}

.doc-preview{background:#fff; color:#111; border-radius:10px; padding:26px; font-size:12.5px; line-height:1.7;}
.doc-preview h2{font-size:17px; margin-bottom:4px; text-align:center;}
.doc-preview .sub{text-align:center; color:#555; font-size:11px; margin-bottom:16px;}
.doc-preview table{width:100%; border-collapse:collapse; margin:10px 0; font-size:12px;}
.doc-preview th,.doc-preview td{border:1px solid #ccc; padding:6px 8px;}
.doc-preview th{background:#f1f5f9;}
.doc-preview .totalrow td{font-weight:800; background:#f8fafc;}
.doc-preview .sign{display:flex; justify-content:space-between; margin-top:36px;}
.doc-preview .sign div{width:45%; border-top:1px solid #333; padding-top:6px; font-size:11.5px; text-align:center;}
.doc-preview .signed-block{margin-top:26px; border:1px dashed #999; border-radius:8px; padding:14px; display:flex; gap:18px; align-items:center;}
.doc-preview .signed-block img{height:60px; background:#fff; border:1px solid #ddd; border-radius:4px;}
.doc-preview .signed-block .sig-meta{font-size:10.5px; color:#333; line-height:1.6;}
.doc-preview .signed-block .sig-hash{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:#666; word-break:break-all; margin-top:3px;}
.sigpad-box{border:1px solid var(--border2); border-radius:10px; padding:14px; background:#0c1830; margin-top:18px;}
.sigpad-box h4{font-size:13px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
#sigCanvas{width:100%; height:150px; background:#fff; border-radius:8px; touch-action:none; cursor:crosshair; display:block;}
.sigpad-actions{display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px; flex-wrap:wrap;}
.hash-chip{font-family:'JetBrains Mono',monospace; font-size:10.5px; background:#0e1830; border:1px solid var(--border2); border-radius:6px; padding:6px 9px; color:#7fb0ff; word-break:break-all;}

.empty-state{text-align:center; padding:50px 20px; color:var(--muted2);}
.empty-state .ic{font-size:38px; margin-bottom:10px;}

.progress-track{height:6px; background:#1a2740; border-radius:6px; overflow:hidden; margin-top:6px;}
.progress-fill{height:100%; border-radius:6px;}

.tag-select{display:flex; flex-wrap:wrap; gap:8px;}
.tag-select label{display:flex; align-items:center; gap:6px; background:#0c1830; border:1px solid var(--border2); padding:6px 10px; border-radius:20px; font-size:12px; cursor:pointer;}

@media print{
  #sidebar, header.topbar, .no-print{display:none !important;}
  #main{height:auto; overflow:visible;}
  body{background:#fff; color:#111;}
  .wrap{padding:0;}
}
@media (max-width:900px){
  #sidebar{position:fixed; inset-inline-start:0; top:0; z-index:90; transform:translateX(-110%); transition:.2s;}
  [dir="rtl"] #sidebar{transform:translateX(110%);}
  #sidebar.open{transform:translateX(0);}
  .mobile-toggle{display:flex !important;}
  .field-row,.field-row3{grid-template-columns:1fr;}
}
.mobile-toggle{display:none; background:#152037; border:1px solid var(--border2); color:#fff; width:38px; height:38px; border-radius:9px; align-items:center; justify-content:center; font-size:16px; cursor:pointer;}
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <div class="logo">🏗️</div>
    <div>
      <h1 id="brandTitleAr" data-i18n="brandName">إدارة العقود والمشتريات</h1>
      <p data-i18n="brandSub">Bena Strategic Development</p>
    </div>
  </div>
  <nav class="menu" id="menuNav"></nav>
  <div class="side-footer">
    <button class="btn btn-gold no-print" onclick="openCloudSyncModal()">
      <span>☁️</span> <span id="cloudBtnLabel">المزامنة السحابية</span>
    </button>
    <button class="btn no-print" onclick="toggleLang()">
      <span>🌐</span> <span id="langBtnLabel">English</span>
    </button>
    <button class="btn no-print" onclick="exportData()"><span>⬇️</span> <span data-i18n="exportBtn">تصدير نسخة احتياطية</span></button>
    <label class="btn no-print" style="cursor:pointer;">
      <span>⬆️</span> <span data-i18n="importBtn">استيراد نسخة</span>
      <input type="file" accept=".json" style="display:none" onchange="importData(event)">
    </label>
  </div>
</div>

<div id="main">
  <header class="topbar no-print">
    <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div>
      <h2 id="pageTitle">لوحة التحكم التنفيذية</h2>
      <div class="sub" id="pageSub">نظرة عامة استراتيجية على المشتريات والتعاقدات</div>
    </div>
    <div class="spacer"></div>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div class="wrap" id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">-</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
/* ============================================================
   إدارة العقود والمشتريات — PCM Unified Platform
   Single-file HTML app — bilingual AR/EN, localStorage persistence
   ============================================================ */

const STORAGE_KEY = 'pcm_wael_v1';
const uid = () => 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const fmt = (n) => (isNaN(n)?0:n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayISO = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

let LANG = localStorage.getItem('pcm_lang') || 'ar';

/* ---------- Default / seed data ---------- */
function seedData(){
  const pid = uid(), pid2 = uid();
  const vId1 = uid(), vId2 = uid(), vId3 = uid();
  const cId1 = uid(), cId2 = uid();
  return {
    projects:[
      {id:pid, code:'PRJ-01', name:'مشروع تطوير وتوسعة مركز البيانات', budget:14000000},
      {id:pid2, code:'PRJ-02', name:'مشروع البنية التحتية والطرق', budget:9500000},
    ],
    vendors:[
      {id:vId1, name:'شركة التقنية المتقدمة للمقاولات', cr:'CR-10023', vat:'VAT-77410', contact:'م. أحمد سالم', phone:'01000000001', email:'info@advtech.com', score:4.6, vetted:true},
      {id:vId2, name:'مجموعة الحلول الرقمية', cr:'CR-10087', vat:'VAT-77522', contact:'م. منى فؤاد', phone:'01000000002', email:'sales@digisol.com', score:4.2, vetted:true},
      {id:vId3, name:'ستيل وركس المحدودة', cr:'CR-10151', vat:'VAT-77633', contact:'Eng. Adam', phone:'01000000003', email:'ops@steelworks.co', score:3.8, vetted:false},
    ],
    contracts:[
      {id:cId1, code:'CNT-2026-0001', title:'عقد إنشاء وتوسعة مركز البيانات - المرحلة 2', projectId:pid, vendorId:vId1,
        originalValue:8600000, currentValue:8850000, advanceRate:10, retentionRate:5, vatRate:14,
        startDate:'2026-02-01', endDate:'2026-12-31', status:'ACTIVE', prevPaid:3200000},
      {id:cId2, code:'CNT-2026-0002', title:'عقد الأعمال الكهروميكانيكية', projectId:pid, vendorId:vId2,
        originalValue:2400000, currentValue:2400000, advanceRate:10, retentionRate:5, vatRate:14,
        startDate:'2026-03-15', endDate:'2026-10-30', status:'ACTIVE', prevPaid:640000},
    ],
    purchaseRequisitions:[],
    rfqs:[],
    purchaseOrders:[],
    bankGuarantees:[
      {id:uid(), code:'BG-2026-0011', contractId:cId1, bank:'البنك الأهلي المصري', type:'PERFORMANCE_BOND', amount:442500, issueDate:'2026-02-05', expiryDate: addDays(todayISO(),12), status:'ACTIVE'},
      {id:uid(), code:'BG-2026-0012', contractId:cId2, bank:'بنك مصر', type:'ADVANCE_GUARANTEE', amount:240000, issueDate:'2026-03-20', expiryDate: addDays(todayISO(),120), status:'ACTIVE'},
    ],
    slaMilestones:[
      {id:uid(), contractId:cId1, title:'تقديم خطاب الضمان النهائي', dueDate: addDays(todayISO(),20), completed:false},
      {id:uid(), contractId:cId1, title:'التوريد الميداني للشحنة الأولى', dueDate: addDays(todayISO(),-3), completed:false},
    ],
    changeOrders:[],
    claims:[
      {id:uid(), code:'CLM-2026-0004', contractId:cId1, clause:'20.1', incidentDate: addDays(todayISO(),-10), timeBarDeadline: addDays(todayISO(),4), claimedAmount:185000, claimedDays:14, status:'NOTIFIED', title:'تأخر تسليم الموقع'},
    ],
    grns:[],
    inspections:[],
    ipcs:[
      {id:uid(), code:'IPC-2026-0089', contractId:cId1, ipcNo:5, periodStart:'2026-08-01', periodEnd:'2026-08-31',
        grossWorkDone:4650000, status:'CONSULTANT_APPROVED', threeWayMatched:true, submissionDate:'2026-09-05'},
    ],
  };
}
function addDays(iso,n){ const d = new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

let DB = loadData();
DB.evmInputs = DB.evmInputs || {}; // {contractId: {plannedPct, actualCost, whatIfFactor}}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const seeded = seedData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
  return seeded;
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }

function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pcm-backup-'+todayISO()+'.json';
  a.click();
  toast(t('exportedMsg'));
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      DB = data; save(); toast(t('importedMsg')); render();
    }catch(err){ alert(t('importErr')); }
  };
  reader.readAsText(file);
}

/* ---------- Cloud Sync (Supabase) ---------- */
const CLOUD_CFG_KEY = 'pcm_cloud_cfg';
const CLOUD_TABLE = 'pcm_backups';
const CLOUD_ROW_ID = 'main';
function getCloudCfg(){
  try{ return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)) || {url:'', key:'', lastSync:''}; }
  catch(e){ return {url:'', key:'', lastSync:''}; }
}
function setCloudCfg(cfg){ localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg)); }

function openCloudSyncModal(){
  const cfg = getCloudCfg();
  const connected = !!(cfg.url && cfg.key);
  const body = `
    <p class="helptext" style="margin-bottom:16px; font-size:12.5px;">${t('cloud_intro')}</p>
    <div class="field"><label>${t('cloud_url')}</label><input id="cloudUrl" placeholder="https://xxxxx.supabase.co" value="${cfg.url||''}"></div>
    <div class="field"><label>${t('cloud_key')}</label><input id="cloudKey" placeholder="eyJhbGciOi..." value="${cfg.key||''}"></div>
    <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <button class="btn btn-sm" onclick="saveCloudCfgFromForm()">💾 ${t('cloud_save_cfg')}</button>
      <button class="btn btn-sm" onclick="testCloudConnection()">🔌 ${t('cloud_test')}</button>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:9px; background:#0e1830; border:1px solid var(--border); margin-bottom:16px;">
      <span style="font-size:12.5px; color:var(--muted);">${connected ? '🟢 '+t('cloud_status_connected') : '⚪ '+t('cloud_status_none')}</span>
      <span style="font-size:11.5px; color:var(--muted2);">${t('cloud_last_sync')}: ${cfg.lastSync || t('cloud_never')}</span>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;">
      <button class="btn btn-primary" style="flex:1;" onclick="pushToCloud()">${t('cloud_push')}</button>
      <button class="btn btn-gold" style="flex:1;" onclick="pullFromCloud()">${t('cloud_pull')}</button>
    </div>
    <div class="field">
      <label>🛠️ ${t('cloud_sql_title')}</label>
      <textarea readonly style="min-height:150px; font-family:'JetBrains Mono',monospace; font-size:11.5px;" onclick="this.select()">create table if not exists ${CLOUD_TABLE} (
  id text primary key,
  payload jsonb,
  updated_at timestamptz default now()
);

alter table ${CLOUD_TABLE} enable row level security;

create policy "allow anon read/write"
on ${CLOUD_TABLE} for all
using (true) with check (true);</textarea>
      <div class="helptext">${LANG==='ar'?'انسخ الكود ده وشغّله مرة واحدة بس في SQL Editor بمشروعك على Supabase. السياسة هنا مفتوحة للتبسيط — لو محتاج حماية أكثر قوللي نضيف مفتاح دخول.':'Copy this once into your Supabase SQL Editor. The policy is permissive for simplicity — tell me if you want it locked down further.'}</div>
    </div>
  `;
  const foot = `<button class="btn" onclick="closeModal()">${t('cancel')}</button>`;
  openModal(t('cloud_title'), body, foot, true);
}
function saveCloudCfgFromForm(){
  const cfg = getCloudCfg();
  cfg.url = val('cloudUrl').replace(/\/+$/,'');
  cfg.key = val('cloudKey');
  setCloudCfg(cfg);
  toast(t('formSaved'));
}
async function supabaseRequest(method, extraHeaders, body){
  const cfg = getCloudCfg();
  if(!cfg.url || !cfg.key){ alert(t('cloud_no_cfg')); return null; }
  const res = await fetch(`${cfg.url}/rest/v1/${CLOUD_TABLE}?id=eq.${CLOUD_ROW_ID}`, {
    method,
    headers: Object.assign({
      'apikey': cfg.key,
      'Authorization': `Bearer ${cfg.key}`,
      'Content-Type': 'application/json',
    }, extraHeaders || {}),
    body: body ? JSON.stringify(body) : undefined
  });
  return res;
}
async function testCloudConnection(){
  saveCloudCfgFromForm();
  try{
    const res = await supabaseRequest('GET', {'Prefer':'count=exact'});
    if(res && (res.ok || res.status===206)){ toast(t('cloud_test_ok')); }
    else { toast(t('cloud_test_fail')); }
  }catch(e){ toast(t('cloud_test_fail')); }
}
async function pushToCloud(){
  saveCloudCfgFromForm();
  try{
    const res = await supabaseRequest('POST', {'Prefer':'resolution=merge-duplicates,return=minimal'}, { id: CLOUD_ROW_ID, payload: DB, updated_at: new Date().toISOString() });
    if(res && res.ok){
      const cfg = getCloudCfg(); cfg.lastSync = new Date().toLocaleString(LANG==='ar'?'ar-EG':'en-US'); setCloudCfg(cfg);
      toast(t('cloud_pushed_msg')); closeModal();
    } else { toast(t('cloud_test_fail')); }
  }catch(e){ toast(t('cloud_test_fail')); }
}
async function pullFromCloud(){
  if(!confirm(t('cloud_confirm_overwrite'))) return;
  saveCloudCfgFromForm();
  try{
    const res = await supabaseRequest('GET', {'Accept':'application/vnd.pgrst.object+json'});
    if(res && res.ok){
      const row = await res.json();
      if(row && row.payload){
        DB = row.payload; save();
        const cfg = getCloudCfg(); cfg.lastSync = new Date().toLocaleString(LANG==='ar'?'ar-EG':'en-US'); setCloudCfg(cfg);
        toast(t('cloud_pulled_msg')); closeModal(); render();
      } else { toast(t('cloud_test_fail')); }
    } else { toast(t('cloud_test_fail')); }
  }catch(e){ toast(t('cloud_test_fail')); }
}

const vendorName = id => DB.vendors.find(v=>v.id===id)?.name || '—';
const projectName = id => DB.projects.find(p=>p.id===id)?.name || '—';
const contractLabel = id => { const c = DB.contracts.find(x=>x.id===id); return c ? `${c.code} — ${c.title}` : '—'; };
const poLabel = id => { const p = DB.purchaseOrders.find(x=>x.id===id); return p ? `${p.code} — ${vendorName(p.vendorId)}` : '—'; };

function statusPill(status){
  const map = {
    DRAFT:['pill-gray','statusDraft'], ACTIVE:['pill-green','statusActive'], CLOSED:['pill-gray','statusClosed'],
    SUBMITTED:['pill-blue','statusSubmitted'], APPROVED:['pill-green','statusApproved'], REJECTED:['pill-red','statusRejected'],
    ISSUED:['pill-blue',null], PENDING:['pill-amber',null], NOTIFIED:['pill-amber',null],
    ACTIVE_BG:['pill-green',null], EXPIRING_SOON:['pill-amber',null], EXPIRED:['pill-red',null], RELEASED:['pill-gray',null],
    PERFORMANCE_BOND:['pill-blue',null], ADVANCE_GUARANTEE:['pill-gold',null], BID_BOND:['pill-gray',null],
    DRAFTIPC:['pill-gray',null], QS_IN_REVIEW:['pill-amber',null], CONSULTANT_APPROVED:['pill-blue',null],
    FINANCE_AUDITED:['pill-blue',null], APPROVED_FOR_PAYMENT:['pill-green',null], PAID:['pill-green',null],
  };
  const [cls, key] = map[status] || ['pill-gray', null];
  const label = key ? t(key) : humanize(status);
  return `<span class="pill ${cls}">${label}</span>`;
}
function humanize(s){ return (s||'').toString().replaceAll('_',' '); }

function bgStatusOf(bg){
  const days = daysBetween(todayISO(), bg.expiryDate);
  if(bg.status === 'RELEASED' || bg.status === 'CLAIMED') return bg.status;
  if(days < 0) return 'EXPIRED';
  if(days <= 30) return 'EXPIRING_SOON';
  return 'ACTIVE_BG';
}

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';

  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 2600);
}

function render(){
  applyDirection();

  const titles = {
    dashboard:['dash_title','dash_sub'], vendors:['nav_vendors',null], projects:['nav_projects',null],
    pr:['nav_pr',null], rfq:['nav_rfq',null], po:['nav_po',null],

    grn:['nav_grn',null], mir:['nav_mir',null], ipc:['nav_ipc',null], evm:['nav_evm','evm_sub'], reports:['reports_title','reports_sub'],
  };

  document.getElementById('pageTitle').textContent = t(tk);
  document.getElementById('pageSub').textContent = sk ? t(sk) : '';

  const content = document.getElementById('content');

  switch(CURRENT){
    case 'dashboard': renderDashboard(content); break;
    case 'vendors': renderVendors(content, topActions); break;
    case 'projects': renderProjects(content, topActions); break;
    case 'pr': renderPR(content, topActions); break;
    case 'rfq': renderRFQ(content, topActions); break;
    case 'po': renderPO(content, topActions); break;
    case 'contracts': renderContracts(content, topActions); break;
    case 'bg': renderBG(content, topActions); break;
    case 'sla': renderSLA(content, topActions); break;
    case 'co': renderCO(content, topActions); break;
    case 'claims': renderClaims(content, topActions); break;
    case 'fidic': renderFIDIC(content, topActions); break;
    case 'grn': renderGRN(content, topActions); break;
    case 'mir': renderMIR(content, topActions); break;
    case 'ipc': renderIPC(content, topActions); break;
    case 'evm': renderEVM(content, topActions); break;
    case 'reports': renderReports(content, topActions); break;
  }
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(content){
  const activeContracts = DB.contracts.filter(c=>c.status==='ACTIVE');
  const totalActiveValue = activeContracts.reduce((s,c)=> s + Number(c.currentValue||0), 0);
  const paidIPCs = DB.ipcs.filter(i=>['APPROVED_FOR_PAYMENT','PAID','FINANCE_AUDITED'].includes(i.status));
  const totalPaidIPC = paidIPCs.reduce((s,i)=> s + ipcCalc(i).finalPayable, 0);
  const retentionPool = DB.contracts.reduce((s,c)=> s + Math.min((c.currentValue||0)*(c.retentionRate||0)/100, (c.currentValue||0)*(c.retentionRate||0)/100), 0);

  const bgExpiring = DB.bankGuarantees.filter(b=> bgStatusOf(b)==='EXPIRING_SOON' || bgStatusOf(b)==='EXPIRED');
  const claimsUrgent = DB.claims.filter(c=> c.status!=='REJECTED' && daysBetween(todayISO(), c.timeBarDeadline) <= 14);
  const slaOverdue = DB.slaMilestones.filter(m=> !m.completed && daysBetween(todayISO(), m.dueDate) < 0);
  const riskCount = bgExpiring.length + claimsUrgent.length + slaOverdue.length;

  const matched = DB.ipcs.filter(i=>i.threeWayMatched).length;
  const matchRate = DB.ipcs.length ? Math.round((matched/DB.ipcs.length)*100) : 100;

  let html = `<div class="grid kpi-grid">
    ${kpiCard('kpi_active_contracts', '$'+fmt(totalActiveValue), 'ic-blue','📜', activeContracts.length + ' ' + (LANG==='ar'?'عقد نشط':'active contracts'))}
    ${kpiCard('kpi_paid_ipc', '$'+fmt(totalPaidIPC), 'ic-green','💳', paidIPCs.length + ' ' + (LANG==='ar'?'مستخلص':'certificates'))}
    ${kpiCard('kpi_retention', '$'+fmt(retentionPool), 'ic-gold','🔒', (LANG==='ar'?'إجمالي محتجزات حسن التنفيذ':'total performance retentions'))}
    ${kpiCard('kpi_match', matchRate+'%', matchRate>=90?'ic-green':'ic-amber','✅', (LANG==='ar'?'PO + GRN/MIR + IPC':'PO + GRN/MIR + IPC'))}
  </div>`;

  html += `<div class="grid" style="grid-template-columns:1.6fr 1fr; align-items:start;">`;

  // Recent IPC pipeline
  html += `<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="font-size:15px; font-weight:800;">${t('recent_ipc')}</h3>
      <button class="btn btn-sm" onclick="CURRENT='ipc'; render();">${t('view_all')}</button>
    </div>
    ${DB.ipcs.length===0 ? emptyState() : `<div class="table-wrap"><table><thead><tr>
      <th>${t('col_code')}</th><th>${t('contractTitle')}</th><th>${t('col_amount')}</th><th>${t('ipcStatus')}</th><th>${t('ipcMatch')}</th>
    </tr></thead><tbody>
      ${DB.ipcs.slice().reverse().slice(0,6).map(i=>{
        const calc = ipcCalc(i);
        return `<tr>
          <td class="mono">${i.code}</td>
          <td>${contractLabel(i.contractId)}</td>
          <td class="num">$${fmt(calc.finalPayable)}</td>
          <td>${statusPill(i.status)}</td>
          <td>${i.threeWayMatched ? '<span class="pill pill-green">'+t('matchedYes')+'</span>' : '<span class="pill pill-amber">'+t('matchedNo')+'</span>'}</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`}
  </div>`;

  // Risk radar
  html += `<div class="card">
    <h3 style="font-size:15px; font-weight:800; margin-bottom:4px;">${t('alerts_title')}</h3>
    <p style="font-size:11.5px; color:var(--muted2); margin-bottom:14px;">${t('alerts_sub')}</p>`;

  const alerts = [];
  bgExpiring.forEach(b=>{
    const days = daysBetween(todayISO(), b.expiryDate);
    alerts.push({
      icon:'🏦', sev: days<0?'red':'amber',
      title: LANG==='ar' ? 'خطاب ضمان قارب على الانتهاء' : 'Bank guarantee expiring soon',
      sub: b.code + ' — ' + contractLabel(b.contractId),
      dl: days<0 ? `${t('overdueLabel')} ${Math.abs(days)} ${t('daysLabel')}` : `${t('dueIn')} ${days} ${t('daysLabel')}`
    });
  });
  claimsUrgent.forEach(c=>{
    const days = daysBetween(todayISO(), c.timeBarDeadline);
    alerts.push({
      icon:'⚖️', sev: days<=3?'red':'amber',
      title: LANG==='ar' ? 'مهلة إشعار مطالبة تعاقدية' : 'Claim notice time-bar',
      sub: c.code + ' — ' + contractLabel(c.contractId),
      dl: days<0 ? `${t('overdueLabel')} ${Math.abs(days)} ${t('daysLabel')}` : `${t('dueIn')} ${days} ${t('daysLabel')}`
    });
  });
  slaOverdue.forEach(m=>{
    alerts.push({
      icon:'⏱️', sev:'red',
      title: LANG==='ar' ? 'شرط SLA متأخر عن الموعد' : 'Overdue SLA milestone',
      sub: m.title + ' — ' + contractLabel(m.contractId),
      dl: `${t('overdueLabel')} ${Math.abs(daysBetween(todayISO(), m.dueDate))} ${t('daysLabel')}`
    });
  });

  html += alerts.length===0 ? `<div class="empty-state"><div class="ic">✅</div>${t('no_alerts')}</div>` :
    alerts.map(a=> `<div class="alert-item">
      <div class="aic ${a.sev==='red'?'ic-red':'ic-amber'}">${a.icon}</div>
      <div><h4>${a.title}</h4><p>${a.sub}</p><div class="adl" style="color:${a.sev==='red'?'#ff8f97':'#ffc35c'}">${a.dl}</div></div>
    </div>`).join('');

  html += `</div></div>`;
  content.innerHTML = html;
}
function kpiCard(labelKey, val, iconCls, icon, note){
  return `<div class="card kpi">
    <div>
      <div class="lbl">${t(labelKey)}</div>
      <div class="val">${val}</div>
      <div class="note">${note}</div>
    </div>
    <div class="icon ${iconCls}">${icon}</div>
  </div>`;
}
function emptyState(){
  return `<div class="empty-state"><div class="ic">🗂️</div><div>${t('noData')}</div></div>`;
}

/* ---------- Digital signature (Canvas + SHA-256) ---------- */
let _sigCtx = null; // {collection, id, fingerprint}
let _sigDrawing = false, _sigCanvasEl = null, _sigCanvasCtx = null;

function docFingerprint(record){
  // Stable string of the record's meaningful content, used to detect later edits that should invalidate a signature
  const clone = Object.assign({}, record);
  delete clone.signature;
  return JSON.stringify(clone);
}

function renderSignatureSection(collection, id, fingerprint){
  const record = DB[collection].find(x=>x.id===id);
  const sig = record?.signature;
  const stillValid = sig && sig.fingerprint === fingerprint;
  if(stillValid){
    return `<div class="signed-block">
      <img src="${sig.dataUrl}" alt="signature">
      <div class="sig-meta">
        <div><strong>${t('sig_signed_title')}</strong></div>
        <div>${t('sig_signed_by')}: ${sig.signerName}</div>
        <div>${t('sig_signed_at')}: ${sig.signedAt}</div>

    <canvas id="sigCanvas" width="760" height="150"></canvas>

function initSigCanvas(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  // scale for crispness
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  _sigCanvasEl = canvas; _sigCanvasCtx = ctx;

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x:cx, y:cy};
  };
  const start = (e) => { _sigDrawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
  const move = (e) => { if(!_sigDrawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
  const end = () => { _sigDrawing = false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSigCanvas(){
  if(!_sigCanvasEl) return;
  const ratio = window.devicePixelRatio || 1;
  _sigCanvasCtx.clearRect(0,0,_sigCanvasEl.width/ratio, _sigCanvasEl.height/ratio);
}
function isCanvasBlank(canvas){
  const blank = document.createElement('canvas');
  blank.width = canvas.width; blank.height = canvas.height;
  return canvas.toDataURL() === blank.toDataURL();
}
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function certifySignature(){
  const name = document.getElementById('sigSignerName')?.value.trim();
  if(!name){ alert(t('sig_name_required')); return; }
  if(!_sigCanvasEl || isCanvasBlank(_sigCanvasEl)){ alert(t('sig_draw_required')); return; }
  const { collection, id, fingerprint } = _sigCtx;
  const record = DB[collection].find(x=>x.id===id);
  const dataUrl = _sigCanvasEl.toDataURL('image/png');
  const signedAt = new Date().toISOString().replace('T',' ').slice(0,19);
  const payload = fingerprint + '|' + name + '|' + signedAt;
  const hash = await sha256Hex(payload);
  record.signature = { dataUrl, signerName:name, signedAt, hash, fingerprint };
  save(); toast(t('sig_certified_msg'));
  // refresh the same print preview to show the signed block
  if(collection === 'purchaseOrders') printPO(id); else if(collection === 'ipcs') printIPC(id);
}
function copySigHash(hash){
  navigator.clipboard?.writeText(hash);
  toast(t('sig_copy'));
}

function openPrintPreview(innerHTML, collection, id, fingerprint, docName){
  let sigHTML = '';
  if(collection && id){
    _sigCtx = { collection, id, fingerprint };
    sigHTML = renderSignatureSection(collection, id, fingerprint);
  }
  window._currentPdfName = docName || 'document';
  const body = `<div class="doc-preview">${innerHTML}${sigHTML}</div>`;
  const foot = `<button class="btn" onclick="closeModal()">${t('cancel')}</button>
    <button class="btn btn-gold" id="pdfDownloadBtn" onclick="downloadAsPDF()">📄 ${t('downloadPdf')}</button>
    <button class="btn btn-primary" onclick="window.print()">🖨️ ${t('printDoc')}</button>`;
  openModal(t('printDoc'), body, foot, true);
  if(collection && id){ setTimeout(initSigCanvas, 30); }
}

async function downloadAsPDF(selector, filenameOverride){
  const btn = document.getElementById('pdfDownloadBtn');
  const el = document.querySelector(selector || '#modalBody .doc-preview');
  if(!el) return;
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    alert(t('pdf_lib_error'));
    return;
  }
  const originalLabel = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳ ' + t('pdf_generating'); }
  try{
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`${filenameOverride || window._currentPdfName || 'document'}.pdf`);
    toast(t('pdf_saved_msg'));
  }catch(e){
    alert(t('pdf_lib_error'));
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = originalLabel; }
  }
}

    cost:parseFloat(val('f_cost'))||0, timeImpact:parseInt(val('f_time'))||0, approved:document.getElementById('f_approved').checked };
  let record;
  if(id){ record = DB.changeOrders.find(c=>c.id===id); Object.assign(record, data); }
  else { data.id = uid(); DB.changeOrders.push(data); record = data; }
  // Apply financial impact once, on transition to approved
  if(record.approved && !wasApproved){
    const contract = DB.contracts.find(c=>c.id===record.contractId);
    if(contract){ contract.currentValue = (Number(contract.currentValue)||0) + record.cost; }
  } else if(!record.approved && wasApproved){
    const contract = DB.contracts.find(c=>c.id===record.contractId);
    if(contract){ contract.currentValue = (Number(contract.currentValue)||0) - record.cost; }
  }
  save(); closeModal(); toast(t('formSaved')); render();
}

      <td class="mono">${c.code}</td><td>${c.title}</td><td>${contractLabel(c.contractId)}</td>
      <td class="num">$${fmt(c.claimedAmount)}</td>
      <td class="mono" style="color:${days<0?'#ff8f97':days<=14?'#ffc35c':'inherit'}">${c.timeBarDeadline}</td>
      <td>${statusPill(c.status)}</td>
      <td><div class="row-actions">
        <button class="iconbtn" onclick="openClaimForm('${c.id}')">✏️</button>
        <button class="iconbtn danger" onclick="deleteRecord('claims','${c.id}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
  content.innerHTML = `<div class="table-wrap"><table><thead><tr>
    <th>${t('col_code')}</th><th>${t('clmTitle')}</th><th>${t('clmContract')}</th><th>${t('clmAmount')}</th>
    <th>${t('clmDeadline')}</th><th>${t('col_status')}</th><th>${t('col_actions')}</th>
  </tr></thead><tbody>${rows || `<tr class="empty-row"><td colspan="7">${t('noData')}</td></tr>`}</tbody></table></div>`;
}
function openClaimForm(id){
  const c = id ? DB.claims.find(x=>x.id===id) : {code:'CLM-2026-'+String(DB.claims.length+1).padStart(4,'0'), title:'', contractId:DB.contracts[0]?.id||'', clause:'', incidentDate:todayISO(), timeBarDeadline:addDays(todayISO(),28), claimedAmount:0, claimedDays:0, status:'NOTIFIED'};
  const body = `
    <div class="field-row">
      <div class="field"><label>${t('col_code')}</label><input id="f_code" value="${c.code}"></div>
      <div class="field"><label>${t('clmContract')}</label><select id="f_contract">${contractOptions(c.contractId)}</select></div>
    </div>
    <div class="field"><label>${t('clmTitle')}</label><input id="f_title" value="${c.title}"></div>
    <div class="field-row3">
      <div class="field"><label>${t('clmClause')}</label><input id="f_clause" value="${c.clause}"></div>
      <div class="field"><label>${t('clmIncident')}</label><input id="f_incident" type="date" value="${c.incidentDate}"></div>
      <div class="field"><label>${t('clmDeadline')}</label><input id="f_deadline" type="date" value="${c.timeBarDeadline}"></div>
    </div>
    <div class="field-row3">
      <div class="field"><label>${t('clmAmount')}</label><input id="f_amount" type="number" value="${c.claimedAmount}"></div>
      <div class="field"><label>${t('clmDays')}</label><input id="f_days" type="number" value="${c.claimedDays}"></div>
      <div class="field"><label>${t('clmStatus')}</label><select id="f_status">${statusOptions(['NOTIFIED','SUBMITTED','APPROVED','REJECTED'], c.status)}</select></div>
    </div>
  `;
  const foot = `<button class="btn" onclick="closeModal()">${t('cancel')}</button>
    <button class="btn btn-primary" onclick="saveClaim('${id||''}')">${t('save')}</button>`;
  openModal(id ? t('edit') : (LANG==='ar'?'مطالبة جديدة':'New Claim'), body, foot, true);
}
function saveClaim(id){
  const data = { code:val('f_code'), title:val('f_title'), contractId:val('f_contract'), clause:val('f_clause'),
    incidentDate:val('f_incident'), timeBarDeadline:val('f_deadline'), claimedAmount:parseFloat(val('f_amount'))||0,
    claimedDays:parseInt(val('f_days'))||0, status:val('f_status') };
  if(id){ Object.assign(DB.claims.find(c=>c.id===id), data); }
  else { data.id = uid(); DB.claims.push(data); }
  save(); closeModal(); toast(t('formSaved')); render();
}

function renderFIDIC(content, topActions){
  content.innerHTML = `
    <div class="card" style="margin-bottom:18px;">
      <div style="font-size:13px; font-weight:800; margin-bottom:4px;">📚 ${t('fidic_book')}</div>
      <div class="helptext" style="margin-bottom:14px;">${t('fidic_disclaimer')}</div>
      <input id="fidicSearch" placeholder="${t('fidic_search_ph')}" oninput="renderFidicResults()" style="font-size:14.5px; padding:12px 14px;">
    </div>
    <div id="fidicResultsMeta" class="helptext" style="margin-bottom:10px;"></div>
    <div id="fidicResults" class="grid" style="grid-template-columns:1fr;"></div>
  `;
  renderFidicResults();
}
function renderFidicResults(){
  const q = (document.getElementById('fidicSearch')?.value || '').trim().toLowerCase();
  const list = !q ? FIDIC_CLAUSES : FIDIC_CLAUSES.filter(c => {
    const hay = [c.no, c.title_ar, c.title_en, c.sum_ar, c.sum_en, ...(c.kw||[])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const meta = document.getElementById('fidicResultsMeta');
  if(meta) meta.textContent = `${list.length} ${t('fidic_results_count')}`;
  const wrap = document.getElementById('fidicResults');
  if(!wrap) return;
  if(list.length===0){ wrap.innerHTML = `<div class="empty-state"><div class="ic">🔍</div>${t('fidic_noresults')}</div>`; return; }
  wrap.innerHTML = list.map(c => `
    <div class="card" style="padding:16px 18px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;">
        <div>
          <span class="pill pill-blue">${t('fidic_clause_no')} ${c.no}</span>
          <h4 style="font-size:14.5px; font-weight:800; margin-top:8px;">${LANG==='ar'?c.title_ar:c.title_en}</h4>
        </div>
        <button class="iconbtn" title="${t('fidic_copy_ref')}" onclick="navigator.clipboard?.writeText('${c.no}'); toast(t('fidic_copy_ref'))">📋</button>
      </div>
      <p style="font-size:13px; color:var(--muted); line-height:1.8;">${LANG==='ar'?c.sum_ar:c.sum_en}</p>
    </div>
  `).join('');
}

function renderGRN(content, topActions){

      <button class="iconbtn" onclick="openGRNForm('${g.id}')">✏️</button>

function openGRNForm(id){

/* ============================================================
   IPC — Interim Payment Certificates
   ============================================================ */
function ipcCalc(ipc){
  const contract = DB.contracts.find(c=>c.id===ipc.contractId) || {advanceRate:0,retentionRate:0,vatRate:0,currentValue:0,prevPaid:0};
  const gross = Number(ipc.grossWorkDone)||0;
  const advDeduction = Math.min(gross * (contract.advanceRate||0)/100, (contract.currentValue||0) * (contract.advanceRate||0)/100);
  const retCap = (contract.currentValue||0) * (contract.retentionRate||0)/100;
  const retDeduction = Math.min(gross * (contract.retentionRate||0)/100, retCap);
  const totalDeductions = advDeduction + retDeduction;
  const netCumulative = gross - totalDeductions;
  // sum of previously approved IPCs for same contract (excluding this one) + contract.prevPaid baseline
  const priorIpcs = DB.ipcs.filter(i => i.contractId===ipc.contractId && i.id!==ipc.id && (i.ipcNo||0) < (ipc.ipcNo||0));
  const priorFromIpcs = priorIpcs.reduce((s,i)=> s + ipcCalcBase(i, contract).netCumulative, 0);
  const previousPaid = (contract.prevPaid||0) + priorFromIpcs;
  const netCurrent = netCumulative - previousPaid;
  const vat = netCurrent * (contract.vatRate||0)/100;
  const finalPayable = netCurrent + vat;
  return { gross, advDeduction, retDeduction, totalDeductions, netCumulative, previousPaid, netCurrent, vat, finalPayable };
}
// lightweight version to avoid infinite recursion when summing priors
function ipcCalcBase(ipc, contract){
  const gross = Number(ipc.grossWorkDone)||0;
  const advDeduction = Math.min(gross * (contract.advanceRate||0)/100, (contract.currentValue||0) * (contract.advanceRate||0)/100);
  const retCap = (contract.currentValue||0) * (contract.retentionRate||0)/100;
  const retDeduction = Math.min(gross * (contract.retentionRate||0)/100, retCap);
  return { netCumulative: gross - advDeduction - retDeduction };
}
function threeWayMatchCheck(ipc){
  // Sum accepted GRN value linked via POs tied to this contract
  const contractPOs = DB.purchaseOrders.filter(p=>p.contractId===ipc.contractId).map(p=>p.id);
  let acceptedTotal = 0;
  DB.grns.filter(g=>contractPOs.includes(g.poId)).forEach(g=>{
    const po = DB.purchaseOrders.find(p=>p.id===g.poId);
    (g.items||[]).forEach(it=>{
      const poItem = (po?.items||[]).find(pi=>pi.desc===it.poItemDesc);
      const rate = poItem ? Number(poItem.price)||0 : 0;
      acceptedTotal += (Number(it.accepted)||0) * rate;
    });
  });
  if(acceptedTotal === 0) return null; // no GRN data to compare — leave manual
  return Number(ipc.grossWorkDone||0) <= acceptedTotal * 1.02; // 2% tolerance
}

/* ============================================================
   EVM CALCULATOR & WHAT-IF SIMULATION
   ============================================================ */
function evmDefaultPlannedPct(c){
  const start = new Date(c.startDate), end = new Date(c.endDate), now = new Date();
  const totalSpan = end - start;
  if(totalSpan <= 0) return 0;
  const elapsed = Math.min(Math.max(now - start, 0), totalSpan);
  return Math.round((elapsed/totalSpan)*1000)/10; // one decimal
}
function evmLatestEV(contractId){
  const list = DB.ipcs.filter(i=>i.contractId===contractId);
  if(list.length===0) return 0;
  return list.reduce((max,i)=> Math.max(max, Number(i.grossWorkDone)||0), 0);
}
function getEvmInput(contractId, contract){
  if(!DB.evmInputs[contractId]){
    DB.evmInputs[contractId] = {
      plannedPct: evmDefaultPlannedPct(contract),
      actualCost: evmLatestEV(contractId),
      whatIfFactor: 100
    };
  }
  return DB.evmInputs[contractId];
}
function computeEVM(contractId){
  const contract = DB.contracts.find(c=>c.id===contractId);
  if(!contract) return null;
  const input = getEvmInput(contractId, contract);
  const bac = Number(contract.currentValue)||0;
  const ev = evmLatestEV(contractId);
  const pv = bac * (Number(input.plannedPct)||0)/100;
  const ac = Number(input.actualCost)||0;
  const cv = ev - ac;
  const sv = ev - pv;
  const cpi = ac > 0 ? ev/ac : 0;
  const spi = pv > 0 ? ev/pv : 0;
  const baseEac = cpi > 0 ? bac/cpi : bac;
  const etc = baseEac - ac;
  const vac = bac - baseEac;
  // what-if: apply assumed future productivity factor to the *remaining* work's efficiency
  const factor = (Number(input.whatIfFactor)||100)/100;
  const effectiveFutureCpi = cpi>0 ? cpi*factor : factor;
  const remainingWork = Math.max(bac - ev, 0);
  const projectedEtc = effectiveFutureCpi > 0 ? remainingWork/effectiveFutureCpi : remainingWork;
  const projectedEac = ac + projectedEtc;
  return { bac, pv, ev, ac, cv, sv, cpi, spi, eac:baseEac, etc, vac, projectedEac, projectedEtc };
}
function renderEVM(content, topActions){
  if(DB.contracts.length===0){ content.innerHTML = `<div class="empty-state"><div class="ic">📐</div>${t('evm_no_contracts')}</div>`; return; }
  if(!window._evmContractId || !DB.contracts.find(c=>c.id===window._evmContractId)) window._evmContractId = DB.contracts[0].id;
  content.innerHTML = `
    <div class="card" style="margin-bottom:18px;">
      <div class="field" style="margin-bottom:0;">
        <label>${t('evm_select_contract')}</label>
        <select id="evmContractSelect" onchange="window._evmContractId=this.value; renderEvmBody();">${contractOptions(window._evmContractId)}</select>
      </div>
    </div>
    <div id="evmBody"></div>
  `;
  renderEvmBody();
}
function renderEvmBody(){
  const contractId = window._evmContractId;
  const contract = DB.contracts.find(c=>c.id===contractId);
  const input = getEvmInput(contractId, contract);
  const body = document.getElementById('evmBody');
  if(!body) return;

  body.innerHTML = `
    <div class="grid" style="grid-template-columns:1fr 1fr; align-items:start;">
      <div class="card">
        <h3 style="font-size:14.5px; font-weight:800; margin-bottom:14px;">${t('evm_select_contract')}: ${contract.title}</h3>
        <div class="field">
          <label>${t('evm_planned_pct')}</label>
          <input type="range" min="0" max="100" step="1" id="evmPlannedPct" value="${input.plannedPct}" oninput="updateEvmInput('plannedPct', this.value)">
          <div class="helptext num" style="text-align:end; font-weight:800; color:#7fb0ff;">${input.plannedPct}%</div>
        </div>
        <div class="field">
          <label>${t('evm_actual_cost')}</label>
          <input type="number" id="evmActualCost" value="${input.actualCost}" oninput="updateEvmInput('actualCost', this.value)">
          <div class="helptext">${t('evm_use_latest_ipc')}: $${fmt(evmLatestEV(contractId))}</div>
        </div>
      </div>
      <div class="card" id="evmMetricsCard"></div>
    </div>
    <div class="card" style="margin-top:18px;">
      <h3 style="font-size:14.5px; font-weight:800; margin-bottom:6px;">🎛️ ${t('evm_whatif_title')}</h3>
      <p class="helptext" style="margin-bottom:14px;">${t('evm_whatif_note')}</p>
      <div class="field">
        <label>${t('evm_whatif_factor')}</label>
        <input type="range" min="40" max="160" step="5" id="evmWhatIf" value="${input.whatIfFactor}" oninput="updateEvmInput('whatIfFactor', this.value)">
        <div class="helptext num" style="text-align:end; font-weight:800; color:#e0bd6b;">${input.whatIfFactor}%</div>
      </div>
      <div id="evmWhatIfResult" style="margin-top:14px;"></div>
    </div>
  `;
  renderEvmMetrics();
}
function updateEvmInput(key, value){
  const input = getEvmInput(window._evmContractId, DB.contracts.find(c=>c.id===window._evmContractId));
  input[key] = parseFloat(value)||0;
  save();
  renderEvmBody(); // re-render to refresh slider labels + all computed values together
}
function renderEvmMetrics(){
  const calc = computeEVM(window._evmContractId);
  if(!calc) return;
  const card = document.getElementById('evmMetricsCard');
  if(card){
    card.innerHTML = `
      ${evmMetricLine(t('evm_bac'), calc.bac)}
      ${evmMetricLine(t('evm_pv'), calc.pv)}
      ${evmMetricLine(t('evm_ev'), calc.ev)}
      ${evmMetricLine(t('evm_ac'), calc.ac)}
      <div style="border-top:1px dashed var(--border2); margin:10px 0;"></div>
      ${evmMetricLine(t('evm_cv'), calc.cv, calc.cv>=0?'#5be08a':'#ff8f97')}
      ${evmMetricLine(t('evm_sv'), calc.sv, calc.sv>=0?'#5be08a':'#ff8f97')}
      ${evmIndexLine(t('evm_cpi'), calc.cpi)}
      ${evmIndexLine(t('evm_spi'), calc.spi)}
      <div style="border-top:1px dashed var(--border2); margin:10px 0;"></div>
      ${evmMetricLine(t('evm_eac'), calc.eac)}
      ${evmMetricLine(t('evm_etc'), calc.etc)}
      ${evmMetricLine(t('evm_vac'), calc.vac, calc.vac>=0?'#5be08a':'#ff8f97')}
      <div style="margin-top:14px; padding:10px 12px; border-radius:9px; background:${evmHealthColor(calc).bg};">
        <div style="font-size:11px; font-weight:800; color:var(--muted); margin-bottom:3px;">${t('evm_health')}</div>
        <div style="font-size:13px; font-weight:800; color:${evmHealthColor(calc).fg};">${evmHealthColor(calc).label}</div>
      </div>
    `;
  }
  const wr = document.getElementById('evmWhatIfResult');
  if(wr){
    wr.innerHTML = `
      <div class="grid" style="grid-template-columns:repeat(2,1fr); gap:14px;">
        <div class="card" style="padding:14px;">
          <div class="lbl" style="font-size:11px; color:var(--muted);">${t('evm_projected_eac')}</div>
          <div style="font-size:20px; font-weight:800; margin-top:6px; color:#e0bd6b;">$${fmt(calc.projectedEac)}</div>
        </div>
        <div class="card" style="padding:14px;">
          <div class="lbl" style="font-size:11px; color:var(--muted);">${t('evm_etc')} (${LANG==='ar'?'بعد المحاكاة':'post-simulation'})</div>
          <div style="font-size:20px; font-weight:800; margin-top:6px;">$${fmt(calc.projectedEtc)}</div>
        </div>
      </div>
    `;
  }
}
function evmMetricLine(label, val, color){
  return `<div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
    <span style="color:var(--muted);">${label}</span>
    <span class="num" style="font-weight:800; ${color?'color:'+color+';':''}">${val<0?'-':''}$${fmt(Math.abs(val))}</span>
  </div>`;
}
function evmIndexLine(label, val){
  const color = val>=1 ? '#5be08a' : val>0 ? '#ffc35c' : 'var(--muted)';
  return `<div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
    <span style="color:var(--muted);">${label}</span>
    <span class="num" style="font-weight:800; color:${color};">${val.toFixed(2)}</span>
  </div>`;
}
function evmHealthColor(calc){
  const goodCost = calc.cpi >= 1, goodSchedule = calc.spi >= 1;
  if(goodCost && goodSchedule) return {label:t('evm_status_ahead'), fg:'#5be08a', bg:'rgba(34,197,94,.1)'};
  if(!goodCost && !goodSchedule) return {label:t('evm_status_behind_over'), fg:'#ff8f97', bg:'rgba(239,68,68,.1)'};
  if(!goodSchedule) return {label:t('evm_status_behind'), fg:'#ffc35c', bg:'rgba(245,158,11,.1)'};
  return {label:t('evm_status_over'), fg:'#ffc35c', bg:'rgba(245,158,11,.1)'};
}


function renderReports(content, topActions){
  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.innerHTML = `🖨️ ${t('printReport')}`;
  btn.onclick = () => window.print();
  topActions.appendChild(btn);

  const pdfBtn = document.createElement('button');
  pdfBtn.className = 'btn btn-gold';
  pdfBtn.innerHTML = `📄 ${t('downloadPdf')}`;
  pdfBtn.onclick = () => downloadAsPDF('#reportPrintArea', 'PCM-Executive-Report-'+todayISO());
  topActions.appendChild(pdfBtn);

  const activeContracts = DB.contracts.filter(c=>c.status==='ACTIVE');
  const totalActiveValue = activeContracts.reduce((s,c)=> s + Number(c.currentValue||0), 0);
  const totalPaidIPC = DB.ipcs.reduce((s,i)=> s + ipcCalc(i).finalPayable, 0);

  let html = `<div class="card" style="margin-bottom:20px;">
    <h3 style="font-size:16px; font-weight:800; margin-bottom:14px;">${LANG==='ar'?'ملخص المحفظة':'Portfolio Summary'}</h3>
    <div class="grid" style="grid-template-columns:repeat(4,1fr);">
      <div><div class="lbl" style="font-size:11px; color:var(--muted);">${t('kpi_active_contracts')}</div><div style="font-size:19px; font-weight:800;">$${fmt(totalActiveValue)}</div></div>
      <div><div class="lbl" style="font-size:11px; color:var(--muted);">${t('kpi_paid_ipc')}</div><div style="font-size:19px; font-weight:800;">$${fmt(totalPaidIPC)}</div></div>
      <div><div class="lbl" style="font-size:11px; color:var(--muted);">${LANG==='ar'?'عدد الموردين':'Vendors'}</div><div style="font-size:19px; font-weight:800;">${DB.vendors.length}</div></div>
      <div><div class="lbl" style="font-size:11px; color:var(--muted);">${LANG==='ar'?'عدد العقود':'Contracts'}</div><div style="font-size:19px; font-weight:800;">${DB.contracts.length}</div></div>
    </div>
  </div>`;

  html += `<div class="section-title"><h3>${t('nav_contracts')}</h3></div><div class="table-wrap"><table><thead><tr>
    <th>${t('col_code')}</th><th>${t('contractTitle')}</th><th>${t('contractVendor')}</th><th>${t('contractCurrent')}</th><th>${t('col_status')}</th>
  </tr></thead><tbody>
    ${DB.contracts.map(c=>`<tr><td class="mono">${c.code}</td><td>${c.title}</td><td>${vendorName(c.vendorId)}</td><td class="num">$${fmt(c.currentValue)}</td><td>${statusPill(c.status)}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="5">${t('noData')}</td></tr>`}
  </tbody></table></div>`;

  html += `<div class="section-title"><h3>${t('nav_ipc')}</h3></div><div class="table-wrap"><table><thead><tr>
    <th>${t('col_code')}</th><th>${t('ipcContract')}</th><th>${t('col_amount')}</th><th>${t('ipcStatus')}</th>
  </tr></thead><tbody>
    ${DB.ipcs.map(i=>`<tr><td class="mono">${i.code}</td><td>${contractLabel(i.contractId)}</td><td class="num">$${fmt(ipcCalc(i).finalPayable)}</td><td>${statusPill(i.status)}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="4">${t('noData')}</td></tr>`}
  </tbody></table></div>`;

  html += `<div class="section-title"><h3>${t('nav_bg')}</h3></div><div class="table-wrap"><table><thead><tr>
    <th>${t('col_code')}</th><th>${t('bgContract')}</th><th>${t('bgAmount')}</th><th>${t('bgExpiry')}</th><th>${t('col_status')}</th>
  </tr></thead><tbody>
    ${DB.bankGuarantees.map(b=>`<tr><td class="mono">${b.code}</td><td>${contractLabel(b.contractId)}</td><td class="num">$${fmt(b.amount)}</td><td class="mono">${b.expiryDate}</td><td>${statusPill(bgStatusOf(b))}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="5">${t('noData')}</td></tr>`}
  </tbody></table></div>`;

  html += `<div class="section-title"><h3>${t('nav_claims')}</h3></div><div class="table-wrap"><table><thead><tr>
    <th>${t('col_code')}</th><th>${t('clmContract')}</th><th>${t('clmAmount')}</th><th>${t('clmDeadline')}</th><th>${t('col_status')}</th>
  </tr></thead><tbody>
    ${DB.claims.map(c=>`<tr><td class="mono">${c.code}</td><td>${contractLabel(c.contractId)}</td><td class="num">$${fmt(c.claimedAmount)}</td><td class="mono">${c.timeBarDeadline}</td><td>${statusPill(c.status)}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="5">${t('noData')}</td></tr>`}
  </tbody></table></div>`;

  content.innerHTML = `<div id="reportPrintArea">${html}</div>`;
}

/* ============================================================
   DELETE
   ============================================================ */
function deleteRecord(collection, id){
  confirmDelete(() => {
    DB[collection] = DB[collection].filter(x=>x.id!==id);
    save(); toast(t('formDeleted')); render();
  });
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
</body>
</html>
