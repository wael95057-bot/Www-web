<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة PMO المؤسسية العالمية | م. وائل علي عويس محمود</title>
<style>
:root{
  --bg:#0b1220; --panel:#0f172a; --panel2:#111c33; --border:#1f2b45;
  --text:#e6ebf5; --muted:#93a1bd; --blue:#3b82f6; --blue-d:#1d4ed8;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444; --purple:#a78bfa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
body.ltr{direction:ltr}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--blue),#1e3a8a);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(59,130,246,.35)}
.brand h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand h1 .badge{font-size:11px;background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.35);padding:2px 8px;border-radius:99px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
button, .btn{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
button:hover,.btn:hover{background:#16233f;border-color:#2a3a5c}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-d)}
.btn-green{background:var(--green);border-color:var(--green);color:#04201a}
.btn-red{background:transparent;border-color:rgba(239,68,68,.4);color:var(--red)}
nav{background:rgba(15,23,42,.7);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:8px;overflow-x:auto;position:sticky;top:73px;z-index:49}
nav button{white-space:nowrap;background:transparent;border-color:transparent;color:var(--muted)}
nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:1300px;margin:0 auto;padding:24px}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:2fr 1fr}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.stat{display:flex;justify-content:space-between;align-items:center}
.stat .val{font-size:26px;font-weight:800}
.stat .icon{width:42px;height:42px;border-radius:10px;background:#16233f;display:flex;align-items:center;justify-content:center;font-size:20px}
.muted{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border)}
body.ltr th,body.ltr td{text-align:left}
th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase}
tr:hover td{background:rgba(255,255,255,.02)}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700}
.pill-r{background:rgba(59,130,246,.15);color:#60a5fa}
.pill-a{background:rgba(245,158,11,.15);color:#fbbf24}
.pill-c{background:rgba(167,139,250,.15);color:#c4b5fd}
.pill-i{background:rgba(148,163,184,.15);color:#cbd5e1}
.pill-green{background:rgba(16,185,129,.15);color:#34d399}
.pill-red{background:rgba(239,68,68,.15);color:#f87171}
input,select,textarea{width:100%;background:#0a1122;border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:9px;font-size:13px;font-family:inherit}
textarea{font-family:'Consolas',monospace;line-height:1.7;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600}
.field{margin-bottom:12px}
.row-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;background:#0a1122cc;padding:14px;border-radius:12px;border:1px solid var(--border);margin-bottom:16px}
@media(max-width:700px){.row-form{grid-template-columns:1fr}}
.doclist{max-height:640px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.doc-item{padding:10px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;background:#0a1122}
.doc-item:hover{background:#16233f}
.doc-item.active{background:rgba(59,130,246,.15);border-color:var(--blue);color:#93c5fd}
.progress{width:100%;height:8px;background:#0a1122;border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa)}
.tag{display:inline-block;background:#16233f;border:1px solid var(--border);padding:2px 8px;border-radius:6px;font-size:11px;margin-inline-end:4px;color:var(--muted)}
.section-title{font-size:20px;font-weight:800;margin:0 0 6px}
.hint{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.orgbox{background:#0a1122;border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;font-size:12.5px;font-weight:700}
.orgline{width:2px;height:20px;background:var(--border);margin:0 auto}
.raci-cell{text-align:center;font-weight:800}
.raci-R{color:#60a5fa}.raci-A{color:#fbbf24}.raci-C{color:#c4b5fd}.raci-I{color:#94a3b8}
footer{padding:24px;text-align:center;color:var(--muted);font-size:12px}
@media print{
  header,nav,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .card{border:1px solid #ccc;box-shadow:none}
  main{max-width:100%}
}
.icon-btn{width:30px;height:30px;padding:0;justify-content:center;border-radius:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.fidic-card{background:#0a1122;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.fidic-card .clause-num{color:var(--blue);font-weight:800;font-size:13px}
canvas#sigpad{background:#fff;border-radius:10px;border:2px dashed var(--border);touch-action:none;cursor:crosshair;width:100%;height:200px}
#bimCanvas{width:100%;height:420px;border-radius:12px;background:#050810;border:1px solid var(--border)}
#gisMap{width:100%;height:440px;border-radius:12px;border:1px solid var(--border)}
.net-note{font-size:11.5px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fbbf24;padding:8px 12px;border-radius:8px;margin-bottom:12px}
.calc-out{background:#0a1122;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.calc-out .v{font-size:22px;font-weight:800}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏗️</div>
    <div>
      <h1><span id="t-title">منصة الصندوق الأسود الرقمي لمكتب إدارة المشاريع (PMO)</span> <span class="badge">v1.0</span></h1>
      <p id="t-subtitle">المؤسس والمشرف الهندسي: م. وائل علي عويس محمود — شركة بناء للتطوير الاستراتيجي</p>
    </div>
  </div>
  <div class="hdr-actions">
    <button onclick="toggleLang()">🌐 <span id="lang-btn-label">English</span></button>
    <button onclick="window.print()">🖨️ <span id="t-print">طباعة</span></button>
    <button class="btn-green" onclick="exportData()">⬇️ <span id="t-export">تصدير البيانات</span></button>
    <button onclick="document.getElementById('importFile').click()">⬆️ <span id="t-import">استيراد</span></button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</header>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<nav id="nav"></nav>

<main id="main"></main>

<footer>
  <span id="t-footer">منصة PMO مؤسسية — تصميم وإشراف م. وائل علي عويس محمود | شركة بناء للتطوير الاستراتيجي</span>
</footer>

<script>
/* ============ STATE ============ */
const LS_KEY = 'pmo_platform_wael_v1';
let lang = 'ar';
let activeTab = 'dashboard';
let selectedDocId = null;

let data = loadData();

function defaultData(){
  return {
    portfolios: [
      {id:1, name:'محفظة البنية التحتية الذكية', budget:'5,000,000 $', status:'نشط'}
    ],
    programs: [
      {id:1, name:'برنامج المدن الجديدة', portfolio:'محفظة البنية التحتية الذكية', status:'قيد التنفيذ'}
    ],
    projects: [
      {id:1, name:'مشروع إنشاء شبكة الطرق والجسور', program:'برنامج المدن الجديدة', progress:65, cpm:'حرج', cpi:1.05, spi:0.96}
    ],
    risks: [
      {id:1, desc:'تعثر توريد مواد إنشائية رئيسية', prob:4, impact:5, mitigation:'مصادر بديلة (Dual Sourcing) وتعاقد مبكر'}
    ],
    hse: [
      {id:1, type:'شبه حادث', date:new Date().toISOString().slice(0,10), location:'الموقع الرئيسي', desc:'انزلاق عامل دون إصابة', action:'تنبيه فريق السلامة وتحديث تعليمات الأرضيات'}
    ],
    ptw: [],
    procurement: [
      {id:1, item:'حديد تسليح', supplier:'مصنع الدلتا للحديد', status:'قيد الفحص', eta:''}
    ],
    signatures: [],
    locations: [
      {id:1, name:'مشروع إنشاء شبكة الطرق والجسور', lat:30.0444, lng:31.2357}
    ],
    supabaseUrl: 'https://obwgcylupvnodsciapee.supabase.co',
    supabaseKey: 'sb_publishable_GbL-OA-GzAZ_y5wZjjtQ1g_uBw0HqQO',
    quickProject: 'مشروع التطوير الاستراتيجي المتكامل',
    quickDate: new Date().toISOString().slice(0,10)
  };
}
function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return Object.assign(defaultData(), JSON.parse(raw));
  }catch(e){}
  return defaultData();
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(data)); }

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `PMO_Data_Wael_Owais_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      data = Object.assign(defaultData(), parsed);
      save(); render();
      alert(lang==='ar' ? 'تم استيراد البيانات بنجاح' : 'Data imported successfully');
    }catch(err){ alert(lang==='ar' ? 'ملف غير صالح' : 'Invalid file'); }
  };
  reader.readAsText(file);
}

/* ============ i18n labels for tabs ============ */
const TABS = [
  {id:'dashboard', ar:'اللوحة التنفيذية', en:'Executive Dashboard', icon:'📊'},
  {id:'structure', ar:'المحافظ والبرامج والمشاريع', en:'Portfolios / Programs / Projects', icon:'🗂️'},
  {id:'raci', ar:'مصفوفة الصلاحيات RACI', en:'RACI Matrix', icon:'👥'},
  {id:'org', ar:'الهيكل التنظيمي', en:'Org Structure', icon:'🏛️'},
  {id:'docs', ar:'مكتبة الوثائق والعقود', en:'Documents & Contracts Hub', icon:'📄'},
  {id:'risk', ar:'سجل المخاطر FMEA', en:'Risk Register (FMEA)', icon:'⚠️'},
  {id:'hse', ar:'السلامة والصحة المهنية', en:'HSE Management', icon:'🦺'},
  {id:'procurement', ar:'المشتريات والتوريد', en:'Procurement & Supply', icon:'📦'},
  {id:'fidic', ar:'مساعد الفيديك FIDIC', en:'FIDIC Assistant', icon:'⚖️'},
  {id:'signature', ar:'التوقيع الرقمي وسجل التدقيق', en:'Digital Signature & Audit', icon:'✍️'},
  {id:'bim', ar:'عارض BIM / النماذج 3D', en:'BIM / 3D Viewer', icon:'🧊'},
  {id:'gis', ar:'الأرشيف الجغرافي GIS', en:'GIS Archive', icon:'🗺️'},
  {id:'whatif', ar:'حاسبة EVM ومحاكاة السيناريوهات', en:'EVM & What-If Simulator', icon:'🧮'},
  {id:'sync', ar:'المزامنة السحابية', en:'Cloud Sync', icon:'☁️'},
  {id:'reports', ar:'التقرير التنفيذي الشامل', en:'Executive Master Report', icon:'🧾'},
];

function toggleLang(){
  lang = lang === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.className = lang === 'ar' ? '' : 'ltr';
  document.getElementById('lang-btn-label').textContent = lang === 'ar' ? 'English' : 'العربية';
  document.getElementById('t-title').textContent = lang==='ar' ? 'منصة الصندوق الأسود الرقمي لمكتب إدارة المشاريع (PMO)' : 'Black-Box Digital Enterprise PMO Platform';
  document.getElementById('t-subtitle').textContent = lang==='ar' ? 'المؤسس والمشرف الهندسي: م. وائل علي عويس محمود — شركة بناء للتطوير الاستراتيجي' : 'Founder & Chief Engineer: Eng. Wael Ali Owais Mahmoud — Bena Strategic Development Co.';
  document.getElementById('t-print').textContent = lang==='ar' ? 'طباعة' : 'Print';
  document.getElementById('t-export').textContent = lang==='ar' ? 'تصدير البيانات' : 'Export Data';
  document.getElementById('t-import').textContent = lang==='ar' ? 'استيراد' : 'Import';
  document.getElementById('t-footer').textContent = lang==='ar' ? 'منصة PMO مؤسسية — تصميم وإشراف م. وائل علي عويس محمود | شركة بناء للتطوير الاستراتيجي' : 'Enterprise PMO Platform — Designed & Supervised by Eng. Wael Ali Owais Mahmoud | Bena Strategic Development Co.';
  render();
}

/* ============ helpers ============ */
function uid(arr){ return (arr.length ? Math.max(...arr.map(x=>x.id)) : 0) + 1; }
function esc(s){ return (s||'').toString().replace(/</g,'&lt;'); }
function L(ar,en){ return lang==='ar' ? ar : en; }

/* ============ NAV ============ */
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(t => `<button class="${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.icon} ${L(t.ar,t.en)}</button>`).join('');
}
function setTab(id){ activeTab = id; render(); }

/* ============ RENDER ROOT ============ */
function render(){
  renderNav();
  const main = document.getElementById('main');
  const fns = {
    dashboard: renderDashboard, structure: renderStructure, raci: renderRaci,
    org: renderOrg, docs: renderDocs, risk: renderRisk, hse: renderHse,
    procurement: renderProcurement, reports: renderReports,
    fidic: renderFidic, signature: renderSignature, bim: renderBim,
    gis: renderGis, whatif: renderWhatif, sync: renderSync
  };
  main.innerHTML = fns[activeTab]();
  const post = {bim: initBim, gis: initGis, signature: initSigPad};
  if(post[activeTab]) setTimeout(post[activeTab], 30);
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const avgProgress = data.projects.length ? Math.round(data.projects.reduce((a,p)=>a+Number(p.progress||0),0)/data.projects.length) : 0;
  const avgCpi = data.projects.length ? (data.projects.reduce((a,p)=>a+Number(p.cpi||1),0)/data.projects.length).toFixed(2) : '1.00';
  const avgSpi = data.projects.length ? (data.projects.reduce((a,p)=>a+Number(p.spi||1),0)/data.projects.length).toFixed(2) : '1.00';
  const highRisks = data.risks.filter(r=>Number(r.prob)*Number(r.impact) >= 15).length;

  return `
  <h2 class="section-title">${L('اللوحة التنفيذية','Executive Dashboard')}</h2>
  <p class="hint">${L('نظرة لحظية على أداء المحفظة الاستراتيجية بالكامل','Real-time overview of the entire strategic portfolio')}</p>
  <div class="grid grid-4" style="margin-bottom:16px">
    ${statCard('🏗️', L('المشاريع النشطة','Active Projects'), data.projects.length, '#60a5fa')}
    ${statCard('💰', L('مؤشر أداء التكلفة CPI','Cost Performance CPI'), avgCpi, '#34d399')}
    ${statCard('📅', L('مؤشر أداء الجدول SPI','Schedule Performance SPI'), avgSpi, '#fbbf24')}
    ${statCard('⚠️', L('مخاطر عالية الأولوية','High-Priority Risks'), highRisks, '#f87171')}
  </div>
  <div class="grid grid-2">
    <div class="card">
      <h3>📈 ${L('حالة المشاريع الحية','Live Project Status')}</h3>
      ${data.projects.length===0?`<p class="muted">${L('لا توجد مشاريع بعد','No projects yet')}</p>`:''}
      ${data.projects.map(p=>`
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
            <b>${esc(p.name)}</b>
            <span class="pill ${p.cpm==='حرج'||p.cpm==='Critical'?'pill-red':'pill-green'}">${esc(p.cpm)}</span>
          </div>
          <div class="progress"><div style="width:${p.progress}%"></div></div>
          <div class="muted" style="margin-top:4px">${L('نسبة الإنجاز','Progress')}: ${p.progress}% · CPI ${p.cpi} · SPI ${p.spi}</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <h3>🛡️ ${L('اعتماد النظام المؤسسي','Institutional Validation')}</h3>
      <p class="muted" style="line-height:1.8">${L('تم هندسة هذه المنصة تحت الإشراف المباشر لـ م. وائل علي عويس محمود، بما يدمج معايير الإدارة الرشيقة (Lean Six Sigma)، القيمة المكتسبة (EVM)، وعقود الفيديك الدولية (FIDIC).','This platform is architected under the direct supervision of Eng. Wael Ali Owais Mahmoud, integrating Lean Six Sigma, EVM, and international FIDIC standards.')}</p>
      <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">
        <span class="tag">ISO 9001</span><span class="tag">ISO 45001</span><span class="tag">FIDIC</span><span class="tag">PMBOK</span><span class="tag">EVM</span>
      </div>
    </div>
  </div>`;
}
function statCard(icon,title,val,color){
  return `<div class="card"><div class="stat">
    <div><p class="muted">${title}</p><div class="val" style="color:${color}">${val}</div></div>
    <div class="icon">${icon}</div>
  </div></div>`;
}

/* ============ STRUCTURE (Portfolios/Programs/Projects) ============ */
function renderStructure(){
  return `
  <h2 class="section-title">${L('المحافظ، البرامج، والمشاريع التنفيذية','Portfolios, Programs & Projects')}</h2>
  <p class="hint">${L('إدارة هرمية: محفظة استراتيجية ← برنامج ← مشروع تنفيذي','Hierarchical: Portfolio → Program → Project')}</p>

  <div class="card" style="margin-bottom:16px">
    <h3>💼 ${L('المحافظ الاستراتيجية','Strategic Portfolios')}</h3>
    <div class="row-form">
      <div class="field" style="margin:0"><label>${L('اسم المحفظة','Portfolio Name')}</label><input id="pf-name" placeholder="${L('مثال: محفظة الطاقة المتجددة','e.g. Renewable Energy Portfolio')}"></div>
      <div class="field" style="margin:0"><label>${L('الميزانية','Budget')}</label><input id="pf-budget" placeholder="5,000,000 $"></div>
      <button class="btn-blue" onclick="addPortfolio()">+ ${L('إضافة','Add')}</button>
    </div>
    <table><thead><tr><th>#</th><th>${L('الاسم','Name')}</th><th>${L('الميزانية','Budget')}</th><th>${L('الحالة','Status')}</th><th></th></tr></thead>
    <tbody>${data.portfolios.map(p=>`<tr><td>#${p.id}</td><td>${esc(p.name)}</td><td>${esc(p.budget)}</td><td><span class="pill pill-green">${esc(p.status)}</span></td><td><button class="icon-btn btn-red" onclick="delItem('portfolios',${p.id})">🗑️</button></td></tr>`).join('') || emptyRow(5)}</tbody></table>
  </div>

  <div class="card" style="margin-bottom:16px">

function emptyRow(cols){ return `<tr><td colspan="${cols}" class="muted" style="text-align:center;padding:20px">${L('لا توجد بيانات بعد','No data yet')}</td></tr>`; }
function addPortfolio(){
  const name = document.getElementById('pf-name').value.trim();
  const budget = document.getElementById('pf-budget').value.trim() || '1,000,000 $';
  if(!name) return;
  data.portfolios.push({id:uid(data.portfolios), name, budget, status: L('نشط','Active')});
  save(); render();
}
function addProgram(){
  const name = document.getElementById('pg-name').value.trim();
  const portfolio = document.getElementById('pg-portfolio').value;
  if(!name) return;
  data.programs.push({id:uid(data.programs), name, portfolio, status: L('قيد التنفيذ','In Progress')});
  save(); render();
}
function addProject(){
  const name = document.getElementById('pj-name').value.trim();
  const program = document.getElementById('pj-program').value;
  const progress = Number(document.getElementById('pj-progress').value)||0;
  if(!name) return;
  data.projects.push({id:uid(data.projects), name, program, progress, cpm: progress<50 ? L('حرج','Critical') : L('غير حرج','Non-Critical'), cpi:1.0, spi:1.0});
  save(); render();
}
function delItem(key,id){ data[key] = data[key].filter(x=>x.id!==id); save(); render(); }

function renderDocs(){
  const doc = DOCS.find(d=>d.id===selectedDocId) || DOCS[0];
  selectedDocId = doc.id;
  return `
  <h2 class="section-title">${L('مكتبة الوثائق والعقود العالمية','Global Documents & Contracts Hub')}</h2>
  <p class="hint">${L('اختر نموذجاً، عبّئ اسم المشروع والتاريخ تلقائياً، ثم عدّل النص مباشرة واطبعه أو صدّره','Pick a template, auto-fill project & date, edit inline, then print or export')}</p>
  <div class="row-form" style="grid-template-columns:1fr 1fr auto">
    <div class="field" style="margin:0"><label>${L('اسم المشروع','Project Name')}</label><input id="q-project" value="${esc(data.quickProject)}" oninput="data.quickProject=this.value;save()"></div>
    <div class="field" style="margin:0"><label>${L('التاريخ','Date')}</label><input id="q-date" type="date" value="${data.quickDate}" oninput="data.quickDate=this.value;save()"></div>
    <button class="btn-blue" onclick="fillDoc()">✨ ${L('تعبئة تلقائية','Auto-fill')}</button>
  </div>
  <div class="grid" style="grid-template-columns:340px 1fr;gap:16px">
    <div class="card"><h3>📁 ${L('النماذج','Templates')} (${DOCS.length})</h3>
      <div class="doclist">
        ${DOCS.map(d=>`<div class="doc-item ${d.id===doc.id?'active':''}" onclick="selectDoc(${d.id})">${d.id}. ${L(d.titleAr,d.titleEn)}</div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">${L(doc.titleAr,doc.titleEn)}</h3>
        <div style="display:flex;gap:6px">
          <button class="icon-btn" onclick="copyDoc()" title="${L('نسخ','Copy')}">📋</button>
          <button class="icon-btn" onclick="printDoc()" title="${L('طباعة','Print')}">🖨️</button>
          <button class="icon-btn" onclick="downloadDoc()" title="${L('تنزيل','Download')}">⬇️</button>
        </div>
      </div>
      <textarea id="doc-text" rows="22">${esc(doc.template)}</textarea>
    </div>
  </div>`;
}
function selectDoc(id){ selectedDocId = id; render(); }
function fillDoc(){
  const el = document.getElementById('doc-text');
  let txt = el.value;
  txt = txt.replaceAll('[أدخل التاريخ]', data.quickDate).replaceAll('[التاريخ]', data.quickDate);
  txt = txt.replaceAll('[أدخل اسم المشروع]', data.quickProject).replaceAll('[اسم المشروع]', data.quickProject).replaceAll('[أدخل اسم المشروع ورقم العقد]', data.quickProject);
  el.value = txt;
}
function copyDoc(){
  const el = document.getElementById('doc-text');
  el.select(); document.execCommand('copy');
  alert(L('تم نسخ النص','Text copied'));
}
function printDoc(){
  const txt = document.getElementById('doc-text').value;
  const w = window.open('', '_blank');
  w.document.write(`<pre style="font-family:Consolas,monospace;white-space:pre-wrap;font-size:14px;line-height:1.8;padding:30px;direction:${lang==='ar'?'rtl':'ltr'}">${txt.replace(/</g,'&lt;')}</pre>`);
  w.document.close(); w.print();
}
function downloadDoc(){
  const txt = document.getElementById('doc-text').value;
  const doc = DOCS.find(d=>d.id===selectedDocId);
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${doc.titleEn.replace(/[^a-zA-Z0-9]+/g,'_')}.txt`;
  a.click();
}

    <div class="row-form" style="grid-template-columns:2fr 1fr 1fr 2fr auto">
      <div class="field" style="margin:0"><label>${L('وصف المخاطرة','Risk Description')}</label><input id="rk-desc"></div>

      <div class="field" style="margin:0"><label>${L('التأثير 1-5','Impact 1-5')}</label><input id="rk-impact" type="number" min="1" max="5" value="3"></div>

    </div>
    <table><thead><tr><th>#</th><th>${L('المخاطرة','Risk')}</th><th>${L('الاحتمالية','Prob')}</th><th>${L('التأثير','Impact')}</th><th>RPN</th><th>${L('الاستجابة','Mitigation')}</th><th></th></tr></thead>
    <tbody>${data.risks.map(r=>{
      const rpn = Number(r.prob)*Number(r.impact);
      const cls = rpn>=15?'pill-red':rpn>=8?'pill-a':'pill-green';
      return `<tr><td>#${r.id}</td><td>${esc(r.desc)}</td><td>${r.prob}</td><td>${r.impact}</td><td><span class="pill ${cls}">${rpn}</span></td><td class="muted">${esc(r.mitigation)}</td><td><button class="icon-btn btn-red" onclick="delItem('risks',${r.id})">🗑️</button></td></tr>`;

  const desc = document.getElementById('rk-desc').value.trim();

  const mitigation = document.getElementById('rk-mit').value.trim();

  data.risks.push({id:uid(data.risks), desc, prob, impact, mitigation});
  save(); render();
}

/* ============ 2) DIGITAL SIGNATURE & AUDIT TRAIL (100% free, Canvas + SubtleCrypto) ============ */
let sigDrawing = false, sigCtx = null;
function renderSignature(){
  return `
  <h2 class="section-title">${L('التوقيع الرقمي وسجل التدقيق (مجاني — بدون خدمة خارجية)','Digital Signature & Audit Trail (Free — No External Service)')}</h2>
  <p class="hint">${L('وقّع بالماوس أو باللمس، وسيولّد النظام بصمة زمنية وهاش تشفيري (SHA-256) غير قابل للتعديل باستخدام تقنية المتصفح الأصلية.','Sign with mouse or touch — the system generates a timestamp and a tamper-evident SHA-256 hash using native browser crypto.')}</p>
  <div class="two-col">
    <div class="card">
      <h3>✍️ ${L('لوحة التوقيع','Signature Pad')}</h3>
      <canvas id="sigpad" width="500" height="200"></canvas>
      <div class="field" style="margin-top:12px"><label>${L('اسم الموقّع','Signer Name')}</label><input id="sig-name" placeholder="${L('مثال: م. وائل علي عويس محمود','e.g. Eng. Wael Ali Owais')}"></div>
      <div class="field"><label>${L('الوثيقة/المستند المرتبط','Related Document')}</label><input id="sig-doc" placeholder="${L('مثال: IPC-04 أو VOR-003','e.g. IPC-04 or VOR-003')}"></div>
      <div style="display:flex;gap:8px">
        <button onclick="clearSig()">🗑️ ${L('مسح','Clear')}</button>
        <button class="btn-blue" onclick="saveSig()">✅ ${L('اعتماد التوقيع','Confirm Signature')}</button>
      </div>
    </div>
    <div class="card">
      <h3>🔒 ${L('سجل التدقيق (Audit Trail)','Audit Trail Log')}</h3>
      <div class="doclist">
        ${data.signatures.length===0?`<p class="muted">${L('لا توجد توقيعات بعد','No signatures yet')}</p>`:''}
        ${[...data.signatures].reverse().map(s=>`
          <div class="fidic-card">
            <b>${esc(s.name)}</b> — <span class="muted">${esc(s.doc)}</span>
            <div class="muted" style="margin-top:4px">${s.time}</div>
            <div style="font-family:Consolas,monospace;font-size:10.5px;color:#60a5fa;word-break:break-all;margin-top:6px">SHA-256: ${s.hash}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}
function initSigPad(){
  const canvas = document.getElementById('sigpad'); if(!canvas) return;
  sigCtx = canvas.getContext('2d');
  sigCtx.lineWidth = 2.2; sigCtx.lineCap='round'; sigCtx.strokeStyle='#0f172a';
  const pos = (e)=>{
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height)};
  };
  const start = (e)=>{ sigDrawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); };
  const move = (e)=>{ if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = ()=>{ sigDrawing=false; };
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
function clearSig(){ const c=document.getElementById('sigpad'); sigCtx.clearRect(0,0,c.width,c.height); }
async function saveSig(){
  const name = document.getElementById('sig-name').value.trim();
  const doc = document.getElementById('sig-doc').value.trim();
  const canvas = document.getElementById('sigpad');
  if(!name || !doc){ alert(L('يرجى إدخال الاسم والمستند','Please enter name and document')); return; }
  const dataUrl = canvas.toDataURL();
  const time = new Date().toLocaleString(lang==='ar'?'ar-EG':'en-US');
  const payload = name+'|'+doc+'|'+time+'|'+dataUrl.slice(0,200);
  const enc = new TextEncoder().encode(payload);
  const hashBuf = await crypto.subtle.digest('SHA-256', enc);
  const hash = Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  data.signatures.push({id:uid(data.signatures), name, doc, time, hash});
  save(); render();
}

  </div>`;
}
function initBim(){
  const holder = document.getElementById('bimCanvas'); if(!holder || typeof THREE==='undefined') return;
  holder.innerHTML='';
  const w = holder.clientWidth, h = 420;
  bimScene = new THREE.Scene(); bimScene.background = new THREE.Color(0x050810);
  bimCamera = new THREE.PerspectiveCamera(50, w/h, 0.1, 1000); bimCamera.position.set(3,2,5);
  bimRenderer = new THREE.WebGLRenderer({antialias:true}); bimRenderer.setSize(w,h);
  holder.appendChild(bimRenderer.domElement);
  const light = new THREE.DirectionalLight(0xffffff, 1); light.position.set(5,10,7); bimScene.add(light);
  bimScene.add(new THREE.AmbientLight(0x404060, 2));
  const grid = new THREE.GridHelper(10,10,0x2a3a5c,0x16233f); bimScene.add(grid);
  buildDefaultMesh();
  let ang=0;
  cancelAnimationFrame(bimAnimId);
  const animate = ()=>{
    bimAnimId = requestAnimationFrame(animate);
    ang += 0.006; bimCamera.position.x = Math.sin(ang)*6; bimCamera.position.z = Math.cos(ang)*6; bimCamera.lookAt(0,0.5,0);
    bimRenderer.render(bimScene, bimCamera);
  };
  animate();
}
function buildDefaultMesh(){
  if(bimMesh) bimScene.remove(bimMesh);
  const geo = new THREE.BoxGeometry(1.6,1.6,1.6);
  const mat = new THREE.MeshStandardMaterial({color:0x3b82f6, metalness:.3, roughness:.4});
  bimMesh = new THREE.Mesh(geo, mat); bimMesh.position.y=0.8;
  bimScene.add(bimMesh);
}
function resetBim(){ buildDefaultMesh(); }
function loadBimFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  if(typeof THREE.GLTFLoader === 'undefined'){
    alert(L('محمّل GLTF غير متاح في هذه النسخة المبسطة — سيتم عرض النموذج الافتراضي فقط. يمكن إضافة GLTFLoader.js لاحقاً للدعم الكامل.','GLTF loader not available in this lightweight build — showing default model. GLTFLoader.js can be added later for full support.'));
    return;
  }
  const url = URL.createObjectURL(file);
  new THREE.GLTFLoader().load(url, (gltf)=>{
    if(bimMesh) bimScene.remove(bimMesh);
    bimMesh = gltf.scene; bimScene.add(bimMesh);
  });
}

function calcEvm(){
  const bac = Number(document.getElementById('ev-bac').value)||0;
  const pv = Number(document.getElementById('ev-pv').value)||0;
  const ev = Number(document.getElementById('ev-ev').value)||0;
  const ac = Number(document.getElementById('ev-ac').value)||1;
  const dur = Number(document.getElementById('ev-dur').value)||1;
  const elapsed = Number(document.getElementById('ev-elapsed').value)||0;
  const prod = Number(document.getElementById('ev-prod').value)||0;

  const cpi = ev/ac;
  const spi = ev/pv;
  const cv = ev-ac;
  const sv = ev-pv;
  const eac = bac/cpi;
  const etc = eac-ac;
  const vac = bac-eac;
  const adjSpi = spi * (1 + prod/100);
  const projectedDur = dur/adjSpi;
  const box = document.getElementById('evm-results');
  const fmt = (n)=> isFinite(n) ? n.toLocaleString(undefined,{maximumFractionDigits:2}) : '—';
  box.innerHTML = `
    ${calcOut('CPI', fmt(cpi), cpi>=1?'#34d399':'#f87171')}
    ${calcOut('SPI', fmt(spi), spi>=1?'#34d399':'#f87171')}
    ${calcOut('CV', fmt(cv), cv>=0?'#34d399':'#f87171')}
    ${calcOut('SV', fmt(sv), sv>=0?'#34d399':'#f87171')}
    ${calcOut('EAC', fmt(eac), '#60a5fa')}
    ${calcOut('ETC', fmt(etc), '#60a5fa')}
    ${calcOut('VAC', fmt(vac), vac>=0?'#34d399':'#f87171')}
    ${calcOut(L('المدة المتوقعة (يوم)','Projected Duration (days)'), fmt(projectedDur), '#fbbf24')}
  `;
}
function calcOut(label,val,color){
  return `<div class="calc-out"><div class="muted" style="font-size:11px">${label}</div><div class="v" style="color:${color}">${val}</div></div>`;
}
