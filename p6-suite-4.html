<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1F33">
<meta name="format-detection" content="telephone=no">
<title>P6 Suite | Bena Strategic Development</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --navy:#0B1F33; --blue:#2C6E9E; --blueLight:#DCEAF4;
    --amber:#E8A33D; --green:#4CAF6D; --red:#D9534F;
    --paper:#EDEFF2; --line:#DADEE3; --ink:#1A1A1A; --muted:#7C8A96;
    --font-main: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{overflow-x:hidden; width:100%; max-width:100vw;}
  body{margin:0;font-family:var(--font-main);background:var(--paper);color:var(--ink); -webkit-tap-highlight-color:transparent;}
  button, .tabBtn, .drawerItem, input, select, textarea, a{ -webkit-tap-highlight-color:transparent; outline:none; }
  button:focus, .tabBtn:focus, .drawerItem:focus{ outline:none; box-shadow:none; }
  header{background:var(--navy);color:#EDEFF2;padding:16px 16px 0;position:sticky;top:0;z-index:10;}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--amber);display:flex;align-items:center;gap:6px;}
  header h1{margin:6px 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .langBtn{background:transparent;border:1px solid #3a5a75;color:#EDEFF2;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font-mono);}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;}
  .tabBtn{flex-shrink:0;background:#132943;border:1px solid #24405c;color:#9FB4C7;padding:8px 11px;border-radius:8px;font-size:12px;font-family:var(--font-main);cursor:pointer;white-space:nowrap;}
  .tabBtn.active{color:#0B1F33;background:var(--amber);border-color:var(--amber);font-weight:700;}

  main{max-width:760px;margin:0 auto;padding:16px 14px 30px;}
  .page{display:none;}
  .page.active{display:block;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14.5px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .step-badge{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--font-mono);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card .desc{font-size:12px;color:var(--muted);margin:0 0 12px;}
  label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#3a4650;}
  input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--font-mono);font-size:12.5px;background:var(--paper);color:var(--ink);margin-bottom:10px;}
  textarea{resize:vertical;}
  .hint{font-size:11px;color:var(--muted);margin:-6px 0 10px;}
  input[type=file]{width:100%;border:2px dashed #B9C6D0;border-radius:12px;padding:18px 10px;text-align:center;background:#fff;margin-bottom:6px;font-size:12.5px;color:var(--muted);}
  button{width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
  button.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);}
  button:disabled{background:#B9C6D0;cursor:not-allowed;}
  .row-btns{display:flex;gap:8px;}
  .row-btns button{width:auto;flex:1;}
  .status{font-size:12px;border-radius:9px;padding:9px 11px;margin-top:8px;display:none;white-space:pre-wrap;}
  .status.show{display:block;}
  .status.ok{background:#E6F5EA;color:#256b3e;border:1px solid #b7e2c3;}
  .status.err{background:#FBEAEA;color:#8a2c26;border:1px solid #f0bcb8;}
  .status.info{background:var(--blueLight);color:#204a68;border:1px solid #b7d6ea;}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px;}
  th{background:var(--navy);color:var(--blueLight);padding:6px 7px;text-align:right;font-weight:500;}
  td{padding:5px 7px;border-bottom:1px solid var(--line);}
  tr:nth-child(even){background:#F7F8F9;}
  .mono{font-family:var(--font-mono);color:var(--blue);}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:4px 0 12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .gbar-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .gbar-row{display:flex;align-items:center;height:26px;position:relative;border-bottom:1px solid #F0F1F2;}
  .gbar-label{width:130px;flex-shrink:0;font-size:10.5px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gbar-track{position:relative;height:100%;flex:1;}
  .gbar{position:absolute;top:5px;height:16px;border-radius:4px;background:var(--blue);}
  .gbar.critical{background:var(--red);}
  .netbox{border:2px solid var(--blue);border-radius:8px;padding:6px 8px;font-size:10px;background:#fff;display:inline-block;min-width:90px;}
  .netbox.critical{border-color:var(--red);background:#FFF3F2;}
  .netlevel{display:flex;flex-direction:column;gap:10px;padding:8px;border-left:2px dashed var(--line);}
  .netlevels{display:flex;gap:22px;overflow-x:auto;padding:6px 2px;}
  .wbsnode{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:5px 0 5px 18px;background:#fff;font-size:12px;}
  .wbsroot{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:9px 11px;font-size:12.5px;font-weight:600;}
  .chartbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px;}
  .chartbox h3{font-size:12.5px;margin:2px 4px 8px;color:#3a4650;}
  footer{max-width:760px;margin:10px auto 20px;padding:14px 16px;text-align:center;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);}
  footer b{color:var(--ink);}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .kpi-val{font-size:22px;font-weight:700;font-family:var(--font-mono);}
  .kpi-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .kpi-good{color:var(--green);} .kpi-bad{color:var(--red);}
  .dayGrid{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
  .dayChip{flex:1;min-width:38px;text-align:center;padding:8px 2px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:11px;cursor:pointer;user-select:none;}
  .dayChip.off{background:var(--red);color:#fff;border-color:var(--red);}
  .chipRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{background:var(--blueLight);color:#204a68;border-radius:16px;padding:5px 10px;font-size:11px;display:flex;align-items:center;gap:6px;}
  .chip .x{cursor:pointer;font-weight:700;color:#8a2c26;}
  .listRow{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px;gap:8px;}
  .listRow .x{cursor:pointer;color:var(--red);font-weight:700;font-size:16px;padding:0 6px;flex-shrink:0;}
  .fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;}
  .drawerNav{position:fixed;top:0;bottom:0;right:-280px;width:260px;max-width:80vw;background:var(--navy);z-index:21;transition:right .25s;overflow-y:auto;padding:16px 0;visibility:hidden;}
  #drawer.open{right:0;visibility:visible;}
  html[dir=ltr] #drawer{right:auto;left:-280px;}
  html[dir=ltr] #drawer.open{left:0;right:auto;}
  .drawerItem{display:block;width:100%;text-align:right;background:transparent;border:none;color:#9FB4C7;padding:13px 18px;font-size:13.5px;cursor:pointer;font-family:inherit;border-right:3px solid transparent;}
  .drawerItem.active{color:#fff;background:#132943;border-right-color:var(--amber);font-weight:600;}
  html[dir=ltr] .drawerItem{text-align:left;border-right:none;border-left:3px solid transparent;}
  html[dir=ltr] .drawerItem.active{border-left-color:var(--amber);}
  .chartCanvasWrap{width:100%;overflow-x:auto;}
  .chartCanvasWrap canvas{direction:ltr;}
  .reportSection{margin-bottom:18px;}
  .reportSection h3{font-size:13.5px;border-bottom:2px solid var(--navy);padding-bottom:5px;margin-bottom:8px;}
  .reportTable{width:100%;border-collapse:collapse;font-size:11px;}
  .reportTable th{background:var(--navy);color:#fff;padding:6px 7px;text-align:right;}
  .reportTable td{padding:5px 7px;border:1px solid var(--line);}
  .reportHead{text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--navy);}
  .reportHead h2{margin:0 0 3px;font-size:16px;}
  .reportHead p{margin:0;font-size:11.5px;color:var(--muted);}
  @media print{
    header, #drawer, #drawerOverlay, footer, .no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%;padding:0;margin:0;}
    .card{border:none;box-shadow:none;padding:0;}
  }
  .pageToolbar{background:#fff;}
  .pageToolbar .row-btns button{font-size:12.5px;}
  .pageToolbar .tbPdf{background:var(--navy);}
  .quickActions{display:flex;gap:8px;margin-bottom:14px;}
  .quickActions button{width:auto;flex:1;}
  .quickActions .newBtn{background:#fff;color:var(--red);border:1px solid var(--red);}
  .regBook{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .regRow{position:relative;padding:12px 14px 12px 54px;border-bottom:1px dashed #C7CFD6;background-image:repeating-linear-gradient(#fff 0, #fff 27px, #E7ECF1 28px);}
  .regRow::before{content:"";position:absolute;top:0;bottom:0;right:38px;width:2px;background:var(--blue);}
  html[dir=ltr] .regRow{padding:12px 54px 12px 14px;}
  html[dir=ltr] .regRow::before{right:auto;left:38px;}
  .regRow:last-child{border-bottom:none;}
  .regRow .regTop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .regRow .regName{font-weight:700;font-size:13.5px;}
  .regRow .regMeta{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:2px;}
  .regRow .regBtns{display:flex;gap:6px;margin-top:8px;}
  .regRow .regBtns button{width:auto;flex:0 0 auto;padding:6px 10px;font-size:11.5px;}
  .regEmpty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>

<script>
// ================= i18n =================
const I18N = {

    tab_wbs:"WBS", tab_risk:"⚠️ المخاطر والاستدامة", tab_dash:"لوحة التحكم", tab_reports:"التقارير / طباعة", tab_register:"📒 سجل المشاريع",
    loadSample:"تحميل بيانات تجريبية",
    footer:"جميع الحقوق محفوظة",
  },
  en: {
    appTitle:"Primavera P6 Toolkit",
    tab_manual:"Project Data (manual)", tab_excel:"Excel → XER", tab_xerimport:"Import XER", tab_gantt:"Gantt", tab_net:"CPM Network",
    tab_wbs:"WBS", tab_risk:"⚠️ Risk & ESG", tab_dash:"Dashboard", tab_reports:"Reports / Print", tab_register:"📒 Project Register",
    loadSample:"Load sample data",
    footer:"All rights reserved",
  }
};
let LANG = "ar";
function t(key){ return (I18N[LANG] && I18N[LANG][key]) || key; }

const FOOTER_NAME = { ar: "م. وائل علي عويس محمود — شركة بناء للتطوير الاستراتيجي", en: "Eng. Wael Ali Ewis Mahmoud — Bena Strategic Development" };

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.getAttribute("data-t")); });
  document.getElementById("langToggle").textContent = LANG === "ar" ? "EN" : "AR";
  document.getElementById("footerName").innerHTML = "<b>"+FOOTER_NAME[LANG]+"</b> · P6 Suite © " + new Date().getFullYear();
  renderTabs();
  renderActivePage();
}
document.getElementById("langToggle").onclick = () => { LANG = LANG === "ar" ? "en" : "ar"; applyLang(); };

function openDrawer(){ document.getElementById("drawer").classList.add("open"); document.getElementById("drawerOverlay").style.display="block"; }
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerOverlay").style.display="none"; }
document.getElementById("menuToggle").onclick = openDrawer;
document.getElementById("drawerOverlay").onclick = closeDrawer;
window.addEventListener("orientationchange", closeDrawer);
window.addEventListener("resize", closeDrawer);

// ================= Tabs / pages =================
const PAGES = [
  { id:"manual", key:"tab_manual" },
  { id:"excel", key:"tab_excel" },
  { id:"xerimport", key:"tab_xerimport" },
  { id:"gantt", key:"tab_gantt" },
  { id:"net", key:"tab_net" },
  { id:"wbs", key:"tab_wbs" },
  { id:"risk", key:"tab_risk" },
  { id:"dash", key:"tab_dash" },
  { id:"reports", key:"tab_reports" },
  { id:"register", key:"tab_register" },
];
let ACTIVE_PAGE = "manual";

function renderTabs(){
  const bar = document.getElementById("drawerTabs");
  bar.innerHTML = "";
  PAGES.forEach(p=>{
    const b = document.createElement("button");
    b.className = "drawerItem" + (p.id===ACTIVE_PAGE ? " active":"");
    b.textContent = t(p.key);
    b.onclick = () => { ACTIVE_PAGE = p.id; renderTabs(); renderActivePage(); closeDrawer(); window.scrollTo(0,0); };
    bar.appendChild(b);
  });
}

function renderActivePage(){
  const main = document.getElementById("mainArea");
  main.innerHTML = "";
  const container = document.createElement("div");
  container.className = "page active";
  main.appendChild(container);
  ({
    manual: renderManualPage, excel: renderExcelPage, xerimport: renderXerImportPage, gantt: renderGanttPage,
    net: renderNetPage, wbs: renderWbsPage, risk: renderRiskPage, dash: renderDashPage, reports: renderReportsPage, register: renderRegisterPage
  }[ACTIVE_PAGE])(container);
}

// ================= Shared project data =================
let PROJECT_DATA = null;

const SAMPLE = {
  project: { id: "PRJ01", name: "مشروع تجريبي - مبنى إداري", start_date: "2026-09-01", calendar: "6-day" },
  wbs: [
    { id: "W1", name: "الأعمال الإنشائية", parent_id: null },
    { id: "W2", name: "الأعمال المعمارية", parent_id: null }
  ],
  activities: [
    { id:"A1010", name:"أعمال الحفر", wbs_id:"W1", duration_days:5, start_date:"2026-09-01", finish_date:null, predecessors:[], resources:[{name:"عامل حفر",unit:"عامل",qty:12}], budget:50000, percent_complete:100, actual_cost:52000, probability:2, impact:3, risk_reserve:2500, carbon_kg:1800, planned_output:100, actual_output:95, output_unit:"م³/يوم" },
    { id:"A1020", name:"صب القواعد", wbs_id:"W1", duration_days:8, start_date:null, finish_date:null, predecessors:[{activity_id:"A1010",type:"FS",lag_days:0}], resources:[{name:"نجار مسلح",unit:"عامل",qty:10}], budget:120000, percent_complete:60, actual_cost:80000, probability:3, impact:4, risk_reserve:9000, carbon_kg:6200, planned_output:15, actual_output:12, output_unit:"م³/يوم" },
    { id:"A1030", name:"أعمدة الدور الأرضي", wbs_id:"W1", duration_days:12, start_date:null, finish_date:null, predecessors:[{activity_id:"A1020",type:"FS",lag_days:0}], resources:[{name:"حداد",unit:"عامل",qty:8}], budget:150000, percent_complete:10, actual_cost:20000, probability:2, impact:3, risk_reserve:7500, carbon_kg:4100, planned_output:8, actual_output:7, output_unit:"عمود/يوم" },
    { id:"A1040", name:"سقف الدور الأرضي", wbs_id:"W1", duration_days:10, start_date:null, finish_date:null, predecessors:[{activity_id:"A1030",type:"FS",lag_days:0}], resources:[{name:"نجار",unit:"عامل",qty:9}], budget:100000, percent_complete:0, actual_cost:0, probability:3, impact:5, risk_reserve:10000, carbon_kg:5400, planned_output:10, actual_output:0, output_unit:"م³/يوم" },
    { id:"A1050", name:"مباني الطوب", wbs_id:"W2", duration_days:15, start_date:null, finish_date:null, predecessors:[{activity_id:"A1040",type:"FS",lag_days:2}], resources:[{name:"عامل مباني",unit:"عامل",qty:14}], budget:90000, percent_complete:0, actual_cost:0, probability:1, impact:2, risk_reserve:1800, carbon_kg:2600, planned_output:120, actual_output:0, output_unit:"م²/يوم" },
    { id:"A1060", name:"تشطيبات داخلية", wbs_id:"W2", duration_days:20, start_date:null, finish_date:null, predecessors:[{activity_id:"A1050",type:"FS",lag_days:0}], resources:[{name:"عامل تشطيب",unit:"عامل",qty:11}], budget:200000, percent_complete:0, actual_cost:0, probability:2, impact:2, risk_reserve:4000, carbon_kg:1200, planned_output:90, actual_output:0, output_unit:"م²/يوم" }
  ],
  milestones: [
    { id:"M1", name:"دفعة مقدمة", fidic_type:"advance_payment", linked_activity_id:"A1010", date:"2026-09-01", payment_percent:10, amount:71000 },
    { id:"M2", name:"شهادة دفعة مرحلية أولى", fidic_type:"interim_payment", linked_activity_id:"A1030", date:"2026-09-25", payment_percent:25, amount:177500 },
    { id:"M3", name:"شهادة الاستلام الابتدائي", fidic_type:"taking_over", linked_activity_id:"A1060", date:"2026-11-30", payment_percent:0, amount:0 }
  ]
};

function loadProjectData(data){
  PROJECT_DATA = data;
  renderActivePage();
}

// ================= Project Register (save / list / load / delete projects) =================
// Storage is tried in order: localStorage -> sessionStorage -> in-memory fallback.
// This makes the register work even inside sandboxed test-preview iframes that block
// localStorage — inside a real installed Android app (or a normal browser tab) localStorage
// works normally and persists across app restarts.
const REGISTER_KEY = "p6suite_project_register_v1";
let _memoryRegisterFallback = null; // used only if both storages are blocked
function storageGetRegisterRaw(){
  try{ const v = window.localStorage.getItem(REGISTER_KEY); if(v!=null) return v; }catch(e){}
  try{ const v = window.sessionStorage.getItem(REGISTER_KEY); if(v!=null) return v; }catch(e){}
  return _memoryRegisterFallback;
}
function storageSetRegisterRaw(str){
  try{ window.localStorage.setItem(REGISTER_KEY, str); return "local"; }catch(e){}
  try{ window.sessionStorage.setItem(REGISTER_KEY, str); return "session"; }catch(e){}
  _memoryRegisterFallback = str; return "memory";
}
function loadRegister(){
  try{
    const raw = storageGetRegisterRaw();
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}
function saveRegister(list){
  try{ return storageSetRegisterRaw(JSON.stringify(list)); }
  catch(e){ return false; }
}
function saveCurrentProjectToRegister(){
  if(!PROJECT_DATA || !(PROJECT_DATA.activities||[]).length){
    return { ok:false, msg: LANG==="ar"?"مفيش بيانات مشروع (أو أنشطة) لحفظها.":"No project data (or activities) to save." };
  }
  let id = (PROJECT_DATA.project?.id || "").trim();
  if(!id){ id = "PRJ-" + Date.now().toString().slice(-6); PROJECT_DATA.project.id = id; }
  const list = loadRegister();
  const entry = {
    regId: id,

function validateData(data){
  const errors = [];
  if(!data || typeof data !== "object") return ["الملف مش JSON صالح."];
  if(!data.project) errors.push("حقل project غير موجود.");
  if(!Array.isArray(data.activities) || data.activities.length===0) errors.push("حقل activities فاضي أو غير موجود.");
  const ids = new Set();
  (data.activities||[]).forEach(a=>{
    if(!a.id){ errors.push("نشاط بدون id."); return; }
    if(ids.has(a.id)) errors.push("id مكرر: "+a.id);
    ids.add(a.id);
    if(typeof a.duration_days !== "number" || a.duration_days < 0) errors.push("مدة غير صالحة في "+a.id);
  });
  (data.activities||[]).forEach(a=>{
    (a.predecessors||[]).forEach(p=>{
      if(!ids.has(p.activity_id)) errors.push("في "+a.id+": predecessor غير موجود ("+p.activity_id+")");
      if(!["FS","SS","FF","SF"].includes(p.type)) errors.push("في "+a.id+": نوع علاقة غير معروف ("+p.type+")");
    });
  });
  return errors;
}

function pad(n){ return String(n).padStart(2,"0"); }
function todayXer(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function xerDate(dateStr, timeStr){ if(!dateStr) return ""; return `${dateStr} ${timeStr||"08:00"}`; }
function addDays(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + Math.round(days||0));
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
// Calendar-aware helpers: offWeekdays = array of JS getDay() values (0=Sun..6=Sat) that are non-working.
// holidays = array of 'YYYY-MM-DD' extra non-working dates.
function isWorkingDay(dateStr, offWeekdays, holidays){
  const d = new Date(dateStr+"T00:00:00");
  if((offWeekdays||[]).includes(d.getDay())) return false;
  if((holidays||[]).includes(dateStr)) return false;
  return true;
}
function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
// Converts a working-day offset (0 = project start) into a real calendar date, skipping off-days/holidays.
function workingOffsetToDate(startDateStr, offset, offWeekdays, holidays){
  let d = new Date(startDateStr+"T00:00:00");
  // move start to the first working day on/after start
  while(!isWorkingDay(toDateStr(d), offWeekdays, holidays)) d.setDate(d.getDate()+1);
  let remaining = Math.round(offset||0);
  while(remaining > 0){
    d.setDate(d.getDate()+1);
    if(isWorkingDay(toDateStr(d), offWeekdays, holidays)) remaining--;
  }
  return toDateStr(d);
}
function buildCalendarData(offDays){
  const parts = [];
  for(let d=1; d<=7; d++){
    if(offDays.includes(d)) parts.push(`(0||${d}()())`);
    else parts.push(`(0||${d}()((0||0(s|08:00|f|17:00)())))`);
  }
  return `(0||CalendarData()((0||DaysOfWeek()(${parts.join("")}))(0||VIEW(ShowTotal|Y)())))`;
}

function downloadFile(content, filename, mime){
  try{
    const b64 = btoa(unescape(encodeURIComponent(content)));
    const a = document.createElement("a");
    a.href = `data:${mime};charset=utf-8;base64,${b64}`;
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    return true;
  }catch(e){
    // Fallback for very old/limited WebViews: open content in a new view the user can save manually.
    try{
      const w = window.open("", "_blank");
      w.document.write(`<pre style="white-space:pre-wrap;font-family:monospace;direction:ltr;">${content.replace(/</g,"&lt;")}</pre>`);
      return true;
    }catch(e2){ return false; }
  }

  const ok = downloadFile(xer, (filenameBase || data.project?.id || "schedule") + ".xer", "text/plain");
  if(!ok) throw new Error(LANG==="ar"?"تعذّر تنزيل الملف على هذا الجهاز.":"Could not download the file on this device.");
}

// ================= XER import (parse an existing .xer back into our schema) =================
function parseXERTables(text){
  const lines = text.replace(/\r\n/g,"\n").split("\n");
  const tables = {};
  let i=0;
  while(i<lines.length){
    if(lines[i].startsWith("%T\t")){
      const tname = lines[i].split("\t")[1]?.trim();
      const fields = (lines[i+1]||"").split("\t").slice(1);
      const rows = [];
      let j=i+2;
      while(j<lines.length && lines[j].startsWith("%R")){
        const vals = lines[j].split("\t").slice(1);
        const obj = {}; fields.forEach((f,k)=>obj[f]=vals[k]!==undefined?vals[k]:"");
        rows.push(obj); j++;
      }
      tables[tname]=rows; i=j;
    } else i++;
  }
  return tables;
}
function parseCalendarOffDays(clndrData){
  if(!clndrData) return [5];
  const off=[];
  for(let d=1; d<=7; d++){
    const re = new RegExp("\\(0\\|\\|"+d+"\\(\\)\\(\\)\\)");
    if(re.test(clndrData)) off.push(d-1); // convert P6 1-7(Sun..Sat) -> JS 0-6
  }
  return off;
}
function xerToProjectData(text){
  const tables = parseXERTables(text);
  const projRow = (tables.PROJECT||[])[0];
  if(!projRow) throw new Error(LANG==="ar"?"مفيش جدول PROJECT في الملف — تأكد إنه ملف XER صحيح.":"No PROJECT table found — make sure this is a valid XER file.");
  const wbsRows = tables.PROJWBS||[], taskRows = tables.TASK||[], predRows = tables.TASKPRED||[], calRows = tables.CALENDAR||[];
  const rsrcRows = tables.RSRC||[], taskRsrcRows = tables.TASKRSRC||[];
  const dateOnly = s => s ? s.split(" ")[0] : null;

  const wbsIdToCode = new Map(); const wbsList = [];
  wbsRows.forEach(w=>{
    if(w.proj_node_flag==="Y") wbsIdToCode.set(w.wbs_id, null);
    else { wbsIdToCode.set(w.wbs_id, w.wbs_short_name||w.wbs_id); wbsList.push({id:w.wbs_short_name||w.wbs_id, name:w.wbs_name||"", parent_id:null}); }
  });
  const taskIdToCode = new Map(); taskRows.forEach(tk=>taskIdToCode.set(tk.task_id, tk.task_code));

  const activities = taskRows.map(tk=>{
    const pct = tk.phys_complete_pct!==undefined && tk.phys_complete_pct!=="" ? Number(tk.phys_complete_pct) : undefined;
    return {
      id: tk.task_code, name: tk.task_name||"",
      wbs_id: wbsIdToCode.get(tk.wbs_id) || null,
      duration_days: Number(tk.target_drtn_hr_cnt||0)/8,
      start_date: dateOnly(tk.target_start_date), finish_date: dateOnly(tk.target_end_date),
      predecessors: [], resources: [],
      percent_complete: Number.isFinite(pct) ? pct : undefined
    };
  });
  const actById = new Map(activities.map(a=>[a.id,a]));
  predRows.forEach(pr=>{
    const fromCode=taskIdToCode.get(pr.task_id), toCode=taskIdToCode.get(pr.pred_task_id);
    if(fromCode && toCode && actById.has(fromCode)){
      actById.get(fromCode).predecessors.push({ activity_id: toCode, type:(pr.pred_type||"PR_FS").replace("PR_",""), lag_days: Number(pr.lag_hr_cnt||0)/8 });
    }
  });

  // Resources / budget / actual cost: read back from TASKRSRC (+ RSRC for names). Rows tagged
  // rsrc_short_name="__COST__" (written by our own exporter when an activity has a budget/actual
  // cost but no named resources) contribute to budget/actual_cost only, not to the resources list.
  if(taskRsrcRows.length){
    const rsrcIdToName = new Map(), rsrcIdIsCostOnly = new Map();
    rsrcRows.forEach(r=>{
      rsrcIdToName.set(r.rsrc_id, r.rsrc_name||r.rsrc_short_name||r.rsrc_id);
      rsrcIdIsCostOnly.set(r.rsrc_id, r.rsrc_short_name==="__COST__");
    });
    taskRsrcRows.forEach(tr=>{
      const code = taskIdToCode.get(tr.task_id); if(!code || !actById.has(code)) return;
      const a = actById.get(code);
      const targetCost = Number(tr.target_cost||0);
      const actCost = Number(tr.act_reg_cost||0) + Number(tr.act_ot_cost||0);
      if(targetCost) a.budget = (a.budget||0) + targetCost;
      if(actCost) a.actual_cost = (a.actual_cost||0) + actCost;
      if(!rsrcIdIsCostOnly.get(tr.rsrc_id)){
        const qty = Number(tr.target_qty||0);
        if(qty>0 || rsrcIdToName.has(tr.rsrc_id)){
          a.resources.push({ name: rsrcIdToName.get(tr.rsrc_id)||tr.rsrc_id, unit:"عامل", qty: qty || 1 });
        }
      }
    });
  }

  const projectName = (wbsRows.find(w=>w.proj_node_flag==="Y")||{}).wbs_name || projRow.proj_short_name || "Project";
  const off_weekdays = calRows[0] ? parseCalendarOffDays(calRows[0].clndr_data) : [5];
  return {
    project: { id: projRow.proj_short_name||"PRJ01", name: projectName, start_date: dateOnly(projRow.plan_start_date)||todayXer(), calendar:"custom", off_weekdays, holidays: [] },
    wbs: wbsList, activities
  };
}


// ================= CPM engine (day-based, approximate — no calendar-off-day awareness) =================
function computeCPM(activities){
  const map = new Map(activities.map(a=>[a.id,a]));
  const succMap = new Map(); activities.forEach(a=>succMap.set(a.id,[]));
  activities.forEach(a=>(a.predecessors||[]).forEach(p=>{ if(succMap.has(p.activity_id)) succMap.get(p.activity_id).push({id:a.id,type:p.type||"FS",lag:p.lag_days||0}); }));
  const indeg = new Map(activities.map(a=>[a.id,(a.predecessors||[]).filter(p=>map.has(p.activity_id)).length]));
  const q = activities.filter(a=>indeg.get(a.id)===0).map(a=>a.id);
  const order = [];
  while(q.length){ const id=q.shift(); order.push(id); (succMap.get(id)||[]).forEach(s=>{ indeg.set(s.id,indeg.get(s.id)-1); if(indeg.get(s.id)===0) q.push(s.id); }); }
  activities.forEach(a=>{ if(!order.includes(a.id)) order.push(a.id); });
  const ES={},EF={};
  order.forEach(id=>{
    const a=map.get(id); let es=0;
    (a.predecessors||[]).forEach(p=>{
      if(!map.has(p.activity_id)) return;
      const pES=ES[p.activity_id]||0, pEF=EF[p.activity_id]||0, lag=p.lag_days||0;
      let c;
      if(p.type==="SS") c=pES+lag;
      else if(p.type==="FF") c=pEF+lag-(a.duration_days||0);
      else if(p.type==="SF") c=pES+lag-(a.duration_days||0);
      else c=pEF+lag;
      es=Math.max(es,c);
    });
    ES[id]=es; EF[id]=es+(a.duration_days||0);
  });
  const projDur = Math.max(0,...order.map(id=>EF[id]));
  const LF={},LS={};
  order.slice().reverse().forEach(id=>{
    const a=map.get(id); const succs=succMap.get(id)||[];
    let lf = projDur;
    if(succs.length){
      lf = Math.min(...succs.map(s=>{
        const sLS = LS[s.id]!==undefined?LS[s.id]:ES[s.id];
        const sLF = LF[s.id]!==undefined?LF[s.id]:EF[s.id];
        if(s.type==="FF") return sLF-s.lag;
        if(s.type==="SS") return sLS-s.lag+(a.duration_days||0);
        if(s.type==="SF") return sLS-s.lag;
        return sLS-s.lag;
      }));
    }
    LF[id]=lf; LS[id]=lf-(a.duration_days||0);
  });
  const result={};
  order.forEach(id=>{ const tf=(LS[id]||0)-(ES[id]||0); result[id]={ES:ES[id],EF:EF[id],LS:LS[id],LF:LF[id],totalFloat:tf,critical:tf<=0}; });
  Object.defineProperty(result, "_projectDuration", { value: projDur, enumerable:false });
  return result;
}

// ================= Print / Copy / Save-PDF toolbar (shared across every page) =================
async function copyTextGeneric(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  }
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function tableToText(tbl){
  return [...tbl.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>td.textContent.trim()).join(" | ")).join("\n");
}
function extractPageText(container){
  const lines = [];
  const h1 = container.querySelector(".reportHead");
  if(h1) lines.push(h1.textContent.replace(/\s+/g," ").trim());
  container.querySelectorAll(":scope > .card, :scope .reportSection").forEach(block=>{
    if(block.classList.contains("no-print") || block.classList.contains("pageToolbar")) return;
    const h = block.querySelector("h2,h3");
    if(h) lines.push("\n## " + h.textContent.trim());
    const desc = block.querySelector(".desc");
    if(desc) lines.push(desc.textContent.trim());
    block.querySelectorAll(":scope > label, :scope > .fieldGrid label").forEach(lab=>{
      const el = lab.nextElementSibling;
      if(el && (el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT")){
        const val = el.value || "";
        if(val) lines.push(lab.textContent.trim()+": "+val);
      }
    });
    block.querySelectorAll("table").forEach(tbl=>lines.push(tableToText(tbl)));
    block.querySelectorAll(".listRow").forEach(row=>lines.push("- "+row.textContent.replace("×","").trim()));
    block.querySelectorAll(".chip").forEach(c=>lines.push(c.textContent.replace("×","").trim()));
    block.querySelectorAll(".wbsroot,.wbsnode").forEach(n=>lines.push(n.textContent.replace(/\s+/g," ").trim()));
    block.querySelectorAll(".netbox").forEach(n=>lines.push(n.textContent.replace(/\s+/g," ").trim()));
    block.querySelectorAll(".gbar-row").forEach(n=>{ const l=n.querySelector(".gbar-label"); if(l) lines.push(l.textContent.trim()); });
    block.querySelectorAll(".kpi-card").forEach(k=>lines.push(k.textContent.replace(/\s+/g," ").trim()));
  });
  return lines.filter(Boolean).join("\n");
}
async function exportContainerToPdf(container, filenameBase){
  if(!window.html2canvas || !window.jspdf){ throw new Error(LANG==="ar"?"مكتبة PDF لم تُحمّل — تأكد من الاتصال بالإنترنت.":"PDF library failed to load — check your internet connection."); }
  const toolbars = container.querySelectorAll(".pageToolbar, .no-print");
  const prevDisplay = [];
  toolbars.forEach(el=>{ prevDisplay.push(el.style.display); el.style.display="none"; });
  let canvas;
  try{
    canvas = await html2canvas(container, {scale:2, useCORS:true, backgroundColor:"#ffffff"});
  } finally {
    toolbars.forEach((el,i)=>{ el.style.display = prevDisplay[i] || ""; });
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:"pt", format:"a4" });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = canvas.height * imgWidth / canvas.width;
  let heightLeft = imgHeight, position = 0;
  const imgData = canvas.toDataURL("image/png");
  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }
  pdf.save(filenameBase + ".pdf");
}
function makeToolbar(){
  return `<div class="card no-print pageToolbar">
    <div class="row-btns">
      <button class="secondary tbPrint" type="button">🖨️ ${LANG==="ar"?"طباعة":"Print"}</button>
      <button class="secondary tbCopy" type="button">📋 ${LANG==="ar"?"نسخ كنص":"Copy as text"}</button>
      <button class="tbPdf" type="button">⬇ ${LANG==="ar"?"حفظ PDF":"Save PDF"}</button>
    </div>
    <div class="tbStatus status"></div>
  </div>`;
}
function wireToolbar(container, filenameBase){
  const bar = container.querySelector(".pageToolbar");
  if(!bar) return;
  const statusEl = bar.querySelector(".tbStatus");
  const setStatus=(type,msg)=>{ statusEl.className="status show "+type; statusEl.textContent=msg; };
  bar.querySelector(".tbPrint").onclick = () => {
    if(typeof window.print === "function"){ try{ window.print(); return; }catch(e){} }
    setStatus("err", LANG==="ar"?"الطباعة غير مدعومة هنا.":"Printing isn't supported here.");
  };
  bar.querySelector(".tbCopy").onclick = async () => {
    const text = extractPageText(container);
    const ok = await copyTextGeneric(text);
    setStatus(ok?"ok":"err", ok ? (LANG==="ar"?"تم النسخ ✓":"Copied ✓") : (LANG==="ar"?"فشل النسخ.":"Copy failed."));
  };
  bar.querySelector(".tbPdf").onclick = async () => {
    setStatus("info", LANG==="ar"?"جارٍ إنشاء PDF...":"Generating PDF...");
    try{ await exportContainerToPdf(container, filenameBase); setStatus("ok", LANG==="ar"?"تم الحفظ ✓":"Saved ✓"); }
    catch(err){ setStatus("err", (LANG==="ar"?"فشل: ":"Failed: ")+err.message); }
  };
}
function prependToolbar(container, filenameBase){
  container.insertAdjacentHTML("afterbegin", makeToolbar());
  wireToolbar(container, filenameBase);
}

// ================= Risk / ESG / Advanced EVM / Productivity / What-If helpers =================
const FIDIC_TYPES = {
  ar: { advance_payment:"دفعة مقدمة", interim_payment:"دفعة مرحلية", taking_over:"شهادة الاستلام الابتدائي", dlp:"فترة الصيانة (DLP)", claim:"مطالبة (Claim)", final_payment:"الدفعة النهائية" },
  en: { advance_payment:"Advance Payment", interim_payment:"Interim Payment", taking_over:"Taking-Over Certificate", dlp:"Defects Liability Period", claim:"Claim", final_payment:"Final Payment" }
};
function riskLevel(score, maxScore){
  if(!(maxScore>0)) return "low";
  const ratio = score/maxScore;
  return ratio>=0.66 ? "high" : ratio>=0.33 ? "med" : "low";
}
function computeRiskRegister(acts){
  const list = acts.map(a=>{
    const prob = Number(a.probability)||0, imp = Number(a.impact)||0;
    return { id:a.id, name:a.name||"", probability:prob, impact:imp, score: prob*imp, reserve: Number(a.risk_reserve)||0 };
  }).filter(r=>r.probability>0 || r.impact>0 || r.reserve>0)
    .sort((x,y)=>y.score-x.score);
  const maxScore = list.length ? Math.max(...list.map(r=>r.score)) : 0;
  list.forEach(r=>{ r.level = riskLevel(r.score, maxScore); });
  return list;
}
function computeCarbonList(acts){
  return acts.map(a=>({ id:a.id, name:a.name||"", carbon:Number(a.carbon_kg)||0 })).filter(c=>c.carbon>0).sort((x,y)=>y.carbon-x.carbon);
}
function computeProductivityList(acts){
  return acts.map(a=>{
    const planned = Number(a.planned_output)||0, actual = Number(a.actual_output)||0;
    const rate = planned>0 ? (actual/planned)*100 : null;
    return { id:a.id, name:a.name||"", planned, actual, unit:a.output_unit||"", rate };
  }).filter(pr=>pr.planned>0 || pr.actual>0);
}
function computeAdvancedEVM(totalBudget, totalEV, totalAC, totalReserve, CPI){
  const BAC = totalBudget;
  const BACwithReserve = totalBudget + totalReserve;
  let EAC = null, TCPI = null;
  if(CPI!=null && CPI>0){ EAC = totalAC + (BAC - totalEV)/CPI; }
  const remaining = BAC - totalAC;
  if(remaining !== 0){ TCPI = (BAC - totalEV) / (BAC - totalAC); }
  return { BAC, BACwithReserve, EAC, TCPI };
}
function computeWhatIf(totalDur, acts, cpm){
  const steps = [1,2,3,5,7,10].filter(n=>n<totalDur||totalDur===0);
  return steps.map(n=>{
    const newDur = Math.max(0, totalDur-n);
    const newlyCritical = acts.filter(a=>{ const f=cpm[a.id]?.totalFloat; return f!=null && f>0 && f<=n; }).map(a=>a.id);
    return { reduce:n, newDur, newlyCritical };
  });
}

  res_qty: ["resource allocation","resource qty","resource quantity","allocation","تخصيص المورد","كمية المورد"],

};
// Aliases used only when scanning a separate "Resources" sheet (kept apart from COL_ALIASES
// so they don't get matched against columns on the main activities sheet).
const RESOURCE_ALIASES = {
  id: COL_ALIASES.id,
  name: COL_ALIASES.name,
  resource_name: ["resource","resource name","اسم المورد","المورد","مصدر","اسم المصدر","نوع المورد"],
  unit: ["unit","uom","الوحدة","وحدة","وحدة القياس"],
  qty: ["qty","quantity","qty/hr","qty per hour","العدد","الكمية","كمية","عدد العمالة","العدد المطلوب"]
};
// Normalizes header text for comparison: lowercase, strips parentheses content, collapses whitespace/punctuation.
function normalizeHeader(h){
  return String(h||"")
    .replace(/[\u064B-\u0652]/g,"")           // strip Arabic diacritics
    .replace(/\([^)]*\)/g,"")                  // strip "(...)"" content
    .replace(/[^\p{L}\p{N}]+/gu," ")           // punctuation -> space
    .trim().toLowerCase().replace(/\s+/g," ");
}
// Detects which spreadsheet column matches each of `keys`, using two global passes so a single
// column is never claimed twice: (1) exact match after normalization, tried for every key first
// so specific headers (e.g. "WBS Code") aren't stolen by a generic alias (e.g. "code" for id);
// (2) fallback whole-word match for any keys still unresolved, only against columns not yet claimed.
function detectAllCols(headers, keys, aliasMap){
  aliasMap = aliasMap || COL_ALIASES;
  const normHeaders = headers.map(normalizeHeader);
  const result = {}; keys.forEach(k=>result[k]=-1);
  const claimed = new Array(headers.length).fill(false);
  // Pass 1: exact match
  keys.forEach(key=>{
    const aliases = aliasMap[key].map(normalizeHeader);
    for(let i=0;i<normHeaders.length;i++){
      if(claimed[i]) continue;
      if(aliases.includes(normHeaders[i])){ result[key]=i; claimed[i]=true; break; }
    }
  });
  // Pass 2: fallback whole-word match (header split into words; an alias must equal one full word,
  // or the header must equal a full word within a multi-word alias)
  keys.forEach(key=>{
    if(result[key]>-1) return;
    const aliases = aliasMap[key].map(normalizeHeader);
    for(let i=0;i<normHeaders.length;i++){
      if(claimed[i] || !normHeaders[i]) continue;
      const headerWords = normHeaders[i].split(" ");
      const matched = aliases.some(a=>{
        if(!a) return false;
        const aliasWords = a.split(" ");
        return headerWords.includes(a) || aliasWords.includes(normHeaders[i]);
      });
      if(matched){ result[key]=i; claimed[i]=true; break; }
    }
  });
  return result;
}
// Convenience single-key wrapper (used where only one column is needed at a time).
function detectCol(headers, key){ return detectAllCols(headers,[key])[key]; }

// Converts Western or Arabic-Indic digits (with units/commas/text around them) to a number. Returns NaN if nothing numeric found.
function toNumber(v){
  if(v==null || v==="") return NaN;
  if(typeof v === "number") return v;
  if(v instanceof Date) return NaN;
  let s = String(v).trim();
  s = s.replace(/[\u0660-\u0669]/g, d=>String(d.charCodeAt(0)-0x0660));   // Arabic-Indic ٠-٩
  s = s.replace(/[\u06F0-\u06F9]/g, d=>String(d.charCodeAt(0)-0x06F0));   // Extended Arabic-Indic ۰-۹
  s = s.replace(/,/g,"");                                                 // thousands separators
  const m = s.match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : NaN;
}
function excelDateToStr(v){
  if(v==null || v==="") return null;
  if(typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); if(!d) return null; return `${d.y}-${pad(d.m)}-${pad(d.d)}`; }
  const s = String(v).trim();
  const m = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  const m2 = s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m2) return `${m2[3]}-${pad(+m2[2])}-${pad(+m2[1])}`;
  return null;
}
function parsePredCell(cell){
  if(!cell) return [];
  return String(cell).split(/[;,]/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const parts = s.split(":");
    return { activity_id: parts[0]?.trim(), type: (parts[1]||"FS").trim().toUpperCase(), lag_days: parts[2]?Number(parts[2]):0 };
  }).filter(p=>p.activity_id);
}
// Best-effort mapping of a free-text milestone label (from an imported "FIDIC Milestone" column)
// to one of our internal FIDIC types, by keyword match; falls back to "claim" if nothing matches.
function guessFidicType(label){
  const s = String(label||"").toLowerCase();
  if(/advance/.test(s) || /مقدم/.test(s)) return "advance_payment";
  if(/interim/.test(s) || /مرحل/.test(s)) return "interim_payment";
  if(/taking.?over/.test(s) || /استلام/.test(s) || /handover|هاندأوفر|تسليم/.test(s)) return "taking_over";
  if(/defect|dlp|maintenance/.test(s) || /صيانة/.test(s)) return "dlp";
  if(/final/.test(s) || /نهائ/.test(s)) return "final_payment";
  return "claim";
}

// Scans every other sheet in the workbook for budget/actual-cost/% columns and merges them into
// `activities` (mutated in place) by matching activity ID, then name, then WBS as a last resort.
function mergeBudgetFromOtherSheets(wb, mainSheetName, activities){
  const idIndex = new Map(), nameIndex = new Map();
  activities.forEach((a,i)=>{
    idIndex.set(String(a.id).trim().toLowerCase(), i);
    if(a.name) nameIndex.set(String(a.name).trim().toLowerCase(), i);
  });
  let usedSheets = [], totalMatched = 0, totalRows = 0;
  const wbsBudgetSum = {};

  wb.SheetNames.forEach(sheetName=>{
    if(sheetName===mainSheetName) return;
    let rows;
    try{ rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true}); }catch(e){ return; }
    if(!rows || rows.length<2) return;
    const headers = rows[0];
    const bCol = detectAllCols(headers, ["id","name","wbs","budget","actual_cost","percent"]);
    if(bCol.budget===-1 && bCol.actual_cost===-1 && bCol.percent===-1) return; // not a budget-ish sheet

    if(bCol.id>-1 || bCol.name>-1){
      let sheetMatched=0, sheetRows=0;
      for(let i=1;i<rows.length;i++){
        const r = rows[i]; if(!r) continue;
        let idx = -1;
        if(bCol.id>-1 && r[bCol.id]!=null && r[bCol.id]!=="") idx = idIndex.get(String(r[bCol.id]).trim().toLowerCase());
        if((idx===undefined||idx===-1) && bCol.name>-1 && r[bCol.name]!=null && r[bCol.name]!=="") idx = nameIndex.get(String(r[bCol.name]).trim().toLowerCase());
        if(idx===undefined || idx===-1) continue;
        sheetRows++;
        const a = activities[idx]; let gotAny=false;
        if(bCol.budget>-1){ const v=toNumber(r[bCol.budget]); if(Number.isFinite(v)){ a.budget=v; gotAny=true; } }
        if(bCol.actual_cost>-1){ const v=toNumber(r[bCol.actual_cost]); if(Number.isFinite(v)){ a.actual_cost=v; gotAny=true; } }
        if(bCol.percent>-1){ const v=toNumber(r[bCol.percent]); if(Number.isFinite(v)){ a.percent_complete=v; gotAny=true; } }
        if(gotAny) sheetMatched++;
      }
      if(sheetMatched>0){ usedSheets.push(sheetName); totalMatched+=sheetMatched; totalRows+=sheetRows; }
    }else if(bCol.wbs>-1){
      // No per-activity ID/name in this sheet — likely budget grouped by WBS/phase.
      // Sum per WBS code here, then split evenly across that WBS's activities below.
      let gotWbsData = false;
      for(let i=1;i<rows.length;i++){
        const r = rows[i]; if(!r || r[bCol.wbs]==null || r[bCol.wbs]==="") continue;
        const key = String(r[bCol.wbs]).trim().toLowerCase();
        if(!wbsBudgetSum[key]) wbsBudgetSum[key] = {budget:0, actual_cost:0};
        if(bCol.budget>-1){ const v=toNumber(r[bCol.budget]); if(Number.isFinite(v)){ wbsBudgetSum[key].budget+=v; gotWbsData=true; } }
        if(bCol.actual_cost>-1){ const v=toNumber(r[bCol.actual_cost]); if(Number.isFinite(v)){ wbsBudgetSum[key].actual_cost+=v; gotWbsData=true; } }
      }
      if(gotWbsData && !usedSheets.includes(sheetName)) usedSheets.push(sheetName);
    }
  });

  if(Object.keys(wbsBudgetSum).length){
    const countByWbs = {};
    activities.forEach(a=>{ if(a.wbs_id){ const k=String(a.wbs_id).trim().toLowerCase(); countByWbs[k]=(countByWbs[k]||0)+1; } });
    activities.forEach(a=>{
      if(a.budget!==undefined || !a.wbs_id) return;
      const k = String(a.wbs_id).trim().toLowerCase();
      const bucket = wbsBudgetSum[k];
      if(bucket && countByWbs[k]){
        if(bucket.budget){ a.budget = bucket.budget/countByWbs[k]; totalMatched++; totalRows++; }
        if(bucket.actual_cost) a.actual_cost = bucket.actual_cost/countByWbs[k];
      }
    });
  }

  return usedSheets.length ? {sheets:usedSheets, matched:totalMatched, total:totalRows} : null;
}

// Scans every other sheet in the workbook for a resource-name column (plus optional unit/qty),
// matches each row to an activity by ID then name, and pushes {name,unit,qty} into that
// activity's `resources` array (an activity can have several resource rows, so this appends
// rather than overwrites — unlike the budget merge above, which sets a single value).
function mergeResourcesFromOtherSheets(wb, mainSheetName, activities){
  const idIndex = new Map(), nameIndex = new Map();
  activities.forEach((a,i)=>{
    idIndex.set(String(a.id).trim().toLowerCase(), i);
    if(a.name) nameIndex.set(String(a.name).trim().toLowerCase(), i);
  });
  let usedSheets = [], totalMatched = 0, totalRows = 0;

  wb.SheetNames.forEach(sheetName=>{
    if(sheetName===mainSheetName) return;
    let rows;
    try{ rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true}); }catch(e){ return; }
    if(!rows || rows.length<2) return;
    const headers = rows[0];
    const rCol = detectAllCols(headers, ["id","name","resource_name","unit","qty"], RESOURCE_ALIASES);
    if(rCol.resource_name===-1) return; // not a resources-ish sheet
    if(rCol.id===-1 && rCol.name===-1) return; // can't tell which activity each row belongs to

    let sheetMatched=0, sheetRows=0;
    for(let i=1;i<rows.length;i++){
      const r = rows[i]; if(!r) continue;
      const resName = rCol.resource_name>-1 ? String(r[rCol.resource_name]||"").trim() : "";
      if(!resName) continue;
      let idx = -1;
      if(rCol.id>-1 && r[rCol.id]!=null && r[rCol.id]!=="") idx = idIndex.get(String(r[rCol.id]).trim().toLowerCase());
      if((idx===undefined||idx===-1) && rCol.name>-1 && r[rCol.name]!=null && r[rCol.name]!=="") idx = nameIndex.get(String(r[rCol.name]).trim().toLowerCase());
      if(idx===undefined || idx===-1) continue;
      sheetRows++;
      const a = activities[idx];
      const qty = rCol.qty>-1 ? toNumber(r[rCol.qty]) : NaN;
      const unit = rCol.unit>-1 ? String(r[rCol.unit]||"").trim() : "";
      if(!a.resources) a.resources = [];
      a.resources.push({ name: resName, unit: unit||"عامل", qty: Number.isFinite(qty) ? qty : 1 });
      sheetMatched++;
    }
    if(sheetMatched>0){ usedSheets.push(sheetName); totalMatched+=sheetMatched; totalRows+=sheetRows; }
  });

  return usedSheets.length ? {sheets:usedSheets, matched:totalMatched, total:totalRows} : null;
}

      <h2><span class="step-badge">2</span> ${LANG==="ar"?"معاينة":"Preview"}</h2>

      <div class="row-btns" style="margin-top:10px;"><button class="secondary" id="xlsUseBtn">${LANG==="ar"?"استخدم كبيانات المشروع":"Use as project data"}</button></div>

    </div>`;
  prependToolbar(container, "excel_to_xer");
  const $=(id)=>container.querySelector("#"+id);
  const setStatus=(el,type,msg)=>{ el.className="status show "+type; el.textContent=msg; };
  let parsedData = null;

  // Picks the "activities" sheet by CONTENT (which sheet actually has id/name/duration columns),
  // not by position. Relying on wb.SheetNames[0] breaks when a workbook's sheet order differs
  // between devices/apps (e.g. a file re-saved or re-shared from a mobile Office/Drive app can
  // reorder sheets) — if the resources sheet ends up first, the old code would treat it as the
  // main sheet and never scan it for resources at all.
  function pickMainSheet(wb){
    let best = null, bestScore = -1;
    wb.SheetNames.forEach((name, idx)=>{
      let rows;
      try{ rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true}); }catch(e){ return; }
      if(!rows || !rows.length) return;
      const col = detectAllCols(rows[0], ["id","name","duration"]);
      const score = (col.id>-1?1:0) + (col.name>-1?1:0) + (col.duration>-1?1:0);
      // Require id+duration at minimum to even be considered "activities-like"; prefer the
      // sheet with the most matches, and break ties by earlier sheet position.
      if(col.id>-1 && col.duration>-1 && score>bestScore){ bestScore = score; best = {name, rows}; }
    });
    // Fallback: nothing scored — behave like before (first sheet) so we still surface the
    // existing "need at least ID, Name, Duration" error message instead of a silent no-op.
    if(!best){
      const name = wb.SheetNames[0];
      best = {name, rows: XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true})};
    }
    return best;
  }

  $("parseBtn").onclick = () => {
    const file = $("xlsFile").files[0], se=$("xlsStatus");
    if(!file){ setStatus(se,"err",LANG==="ar"?"محتاج ترفع ملف الأول.":"Upload a file first."); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const wb = XLSX.read(e.target.result, {type:"array"});
        const main = pickMainSheet(wb);
        processRows(main.rows, se, wb, main.name);
      }catch(err){ setStatus(se,"err",(LANG==="ar"?"خطأ: ":"Error: ")+err.message); }
    };
    reader.readAsArrayBuffer(file);
  };

  $("parsePastedBtn").onclick = () => {
    const text = $("csvPasteBox").value, se=$("xlsStatus");
    if(!text.trim()){ setStatus(se,"err",LANG==="ar"?"الصق بيانات CSV الأول.":"Paste CSV data first."); return; }
    try{ const rows = parseCSVText(text); processRows(rows, se); }
    catch(err){ setStatus(se,"err",(LANG==="ar"?"خطأ: ":"Error: ")+err.message); }
  };

  function parseCSVText(text){
    const rows = []; let row=[], field="", inQ=false;
    const s = text.replace(/\r\n/g,"\n");
    for(let i=0;i<s.length;i++){
      const c = s[i];
      if(inQ){ if(c==='"'){ if(s[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
      else{
        if(c==='"') inQ=true;
        else if(c===','){ row.push(field); field=""; }
        else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
        else field+=c;
      }
    }
    if(field.length||row.length){ row.push(field); rows.push(row); }
    return rows.filter(r=>!(r.length===1 && r[0].trim()===""));
  }

  function processRows(rows, se, wb, mainSheetName){
    if(!rows.length){ setStatus(se,"err",LANG==="ar"?"الملف فاضي.":"File is empty."); return; }
    const headers = rows[0];
    const col = detectAllCols(headers, Object.keys(COL_ALIASES));
    if(col.id===-1 || col.name===-1 || col.duration===-1){
      setStatus(se,"err",LANG==="ar"?"محتاج أعمدة: كود، اسم، مدة على الأقل. راجع أسماء الأعمدة.":"Need at least ID, Name, Duration columns. Check header names.");
      return;
    }
    const activities = [];
    const milestones = [];
    let zeroDurCount = 0, totalWithId = 0;
    for(let i=1;i<rows.length;i++){
      const r = rows[i]; if(!r || r[col.id]==null || r[col.id]==="") continue;
      totalWithId++;
      const durRaw = col.duration>-1 ? r[col.duration] : null;
      const dur = toNumber(durRaw);
      if(!(dur>0)) zeroDurCount++;
      const actId = String(r[col.id]).trim();
      const resources = [];
      if(col.res_name>-1 && r[col.res_name]!=null && String(r[col.res_name]).trim()!==""){
        const qv = col.res_qty>-1 ? toNumber(r[col.res_qty]) : NaN;
        resources.push({ name: String(r[col.res_name]).trim(), unit:"", qty: Number.isFinite(qv) ? qv : 1 });
      }
      if(col.milestone>-1 && r[col.milestone]!=null && String(r[col.milestone]).trim()!==""){
        const label = String(r[col.milestone]).trim();
        milestones.push({ id:"MS-"+actId, name:label, fidic_type: guessFidicType(label), linked_activity_id: actId, date: null, payment_percent:0, amount:0 });
      }
      activities.push({
        id: actId,
        name: col.name>-1 ? String(r[col.name]||"").trim() : "",
        wbs_id: col.wbs>-1 && r[col.wbs] ? String(r[col.wbs]).trim() : null,
        duration_days: Number.isFinite(dur) ? dur : 0,
        start_date: col.start>-1 ? excelDateToStr(r[col.start]) : null,
        finish_date: col.finish>-1 ? excelDateToStr(r[col.finish]) : null,
        predecessors: col.predecessors>-1 ? parsePredCell(r[col.predecessors]) : [],
        resources,
        budget: col.budget>-1 ? (Number.isFinite(toNumber(r[col.budget])) ? toNumber(r[col.budget]) : undefined) : undefined,
        percent_complete: col.percent>-1 ? (Number.isFinite(toNumber(r[col.percent])) ? toNumber(r[col.percent]) : undefined) : undefined,
        actual_cost: col.actual_cost>-1 ? (Number.isFinite(toNumber(r[col.actual_cost])) ? toNumber(r[col.actual_cost]) : undefined) : undefined,
        carbon_kg: col.carbon>-1 ? (Number.isFinite(toNumber(r[col.carbon])) ? toNumber(r[col.carbon]) : undefined) : undefined,
        probability: col.probability>-1 ? (Number.isFinite(toNumber(r[col.probability])) ? toNumber(r[col.probability]) : undefined) : undefined,
        impact: col.impact>-1 ? (Number.isFinite(toNumber(r[col.impact])) ? toNumber(r[col.impact]) : undefined) : undefined,
        risk_reserve: col.risk_reserve>-1 ? (Number.isFinite(toNumber(r[col.risk_reserve])) ? toNumber(r[col.risk_reserve]) : undefined) : undefined,
        planned_output: col.planned_output>-1 ? (Number.isFinite(toNumber(r[col.planned_output])) ? toNumber(r[col.planned_output]) : undefined) : undefined,
        actual_output: col.actual_output>-1 ? (Number.isFinite(toNumber(r[col.actual_output])) ? toNumber(r[col.actual_output]) : undefined) : undefined
      });
    }

    // If the workbook has other sheets (e.g. a separate "Budget" tab), try to pull budget/actual-cost/% data
    // from them and merge it into the matching activities by ID, then by name, then by WBS as a last resort.
    let budgetMergeInfo = null, resourceMergeInfo = null;
    if(wb && wb.SheetNames && wb.SheetNames.length>1){
      budgetMergeInfo = mergeBudgetFromOtherSheets(wb, mainSheetName, activities);
      resourceMergeInfo = mergeResourcesFromOtherSheets(wb, mainSheetName, activities);
    }

    const wbsIds = [...new Set(activities.map(a=>a.wbs_id).filter(Boolean))];
    const wbs = wbsIds.map(id=>({id, name:id, parent_id:null}));
    parsedData = {
      project: { id: $("xlsProjId").value.trim()||"PRJ01", name: $("xlsProjId").value.trim()||"Project", start_date: $("xlsStart").value.trim()||todayXer(), calendar:"6-day" },
      wbs, activities, milestones
    };
    const errors = validateData(parsedData);
    $("xlsPreviewCard").style.display = "block";
    const hasBudgetCol = activities.some(a=>typeof a.budget==="number");
    let rowsHtml = activities.slice(0,30).map(a=>`<tr><td class="mono">${a.id}</td><td>${a.name}</td><td class="mono" style="text-align:center">${a.duration_days}</td><td class="mono">${(a.predecessors||[]).map(p=>p.activity_id).join(", ")||"-"}</td>${hasBudgetCol?`<td class="mono" style="text-align:center">${typeof a.budget==="number"?a.budget.toLocaleString():"-"}</td>`:""}</tr>`).join("");
    $("xlsPreview").innerHTML = `<table><thead><tr><th>${LANG==="ar"?"كود":"ID"}</th><th>${LANG==="ar"?"الاسم":"Name"}</th><th>${LANG==="ar"?"مدة":"Dur"}</th><th>${LANG==="ar"?"سابق":"Pred"}</th>${hasBudgetCol?`<th>${LANG==="ar"?"ميزانية":"Budget"}</th>`:""}</tr></thead><tbody>${rowsHtml}</tbody></table>`;

    let budgetMsg = "";
    if(budgetMergeInfo){
      budgetMsg = "\n" + (LANG==="ar"
        ? `💰 تم دمج بيانات الميزانية من ورقة "${budgetMergeInfo.sheets.join("، ")}" (${budgetMergeInfo.matched} من ${budgetMergeInfo.total} صف اتطابقوا مع أنشطة).`
        : `💰 Merged budget data from sheet "${budgetMergeInfo.sheets.join(", ")}" (matched ${budgetMergeInfo.matched} of ${budgetMergeInfo.total} rows to activities).`);
    }else if(wb && wb.SheetNames.length>1 && !hasBudgetCol){
      budgetMsg = "\n" + (LANG==="ar"
        ? `ℹ️ في الملف ${wb.SheetNames.length-1} ورقة تانية، بس مقدرتش ألاقي فيها عمود ميزانية/تكلفة اسمه واضح، أو كود/اسم الأنشطة فيها مش مطابق لأكواد ورقة الأنشطة. راجع أسماء الأعمدة والأكواد وحاول تاني.`
        : `ℹ️ Found ${wb.SheetNames.length-1} other sheet(s), but couldn't find a clearly-named budget/cost column, or the activity IDs/names there don't match the activities sheet. Check the column headers and IDs, then try again.`);
    }

    let resMsg = "";
    if(resourceMergeInfo){
      const totalResRows = activities.reduce((s,a)=>s+(a.resources?a.resources.length:0),0);
      resMsg = "\n" + (LANG==="ar"
        ? `👷 تم دمج الموارد من ورقة "${resourceMergeInfo.sheets.join("، ")}" (${resourceMergeInfo.matched} صف موارد اتطابقوا مع أنشطة، إجمالي ${totalResRows} مورد على ${activities.filter(a=>a.resources&&a.resources.length).length} نشاط).`
        : `👷 Merged resources from sheet "${resourceMergeInfo.sheets.join(", ")}" (matched ${resourceMergeInfo.matched} resource rows, ${totalResRows} resources across ${activities.filter(a=>a.resources&&a.resources.length).length} activities).`);
    }else if(wb && wb.SheetNames.length>1){
      resMsg = "\n" + (LANG==="ar"
        ? `ℹ️ مقدرتش ألاقي ورقة موارد واضحة (محتاجة عمود "اسم المورد" + عمود "كود النشاط" أو "اسم النشاط" يطابقوا ورقة الأنشطة).`
        : `ℹ️ Couldn't find a clear resources sheet (needs a "resource name" column plus an "activity ID" or "activity name" column matching the activities sheet).`);
    }

    // Duration / critical path preview, computed the same way the "Net" (critical path) page does —
    // based only on duration_days + predecessors, independent of resources/budget.
    let cpmMsg = "";
    try{
      const cpm = computeCPM(activities);
      const projDur = cpm._projectDuration || 0;
      const criticalCount = activities.filter(a=>cpm[a.id]?.critical).length;
      cpmMsg = "\n" + (LANG==="ar"
        ? `⏱️ إجمالي مدة المشروع (المسار الحرج): ${projDur} يوم — عدد الأنشطة الحرجة: ${criticalCount} من ${activities.length}.`
        : `⏱️ Total project duration (critical path): ${projDur} days — critical activities: ${criticalCount} of ${activities.length}.`);
    }catch(e){}

    const extraMsg = budgetMsg + resMsg + cpmMsg;
    // Report what risk/ESG/productivity/resource/milestone data was picked up directly from the main sheet's own columns.
    const mainResCount = activities.filter(a=>a.resources&&a.resources.length).length;
    const mainRiskCount = activities.filter(a=>a.probability!=null || a.impact!=null).length;
    const mainCarbonCount = activities.filter(a=>a.carbon_kg!=null).length;
    const mainProdCount = activities.filter(a=>a.planned_output!=null || a.actual_output!=null).length;
    let mainColsMsg = "";
    const bits = [];
    if(mainResCount) bits.push((LANG==="ar"?`👷 موارد: ${mainResCount} نشاط`:`👷 Resources: ${mainResCount} activities`));
    if(mainRiskCount) bits.push((LANG==="ar"?`⚠️ مخاطر: ${mainRiskCount} نشاط`:`⚠️ Risk: ${mainRiskCount} activities`));
    if(mainCarbonCount) bits.push((LANG==="ar"?`🌍 كربون: ${mainCarbonCount} نشاط`:`🌍 Carbon: ${mainCarbonCount} activities`));
    if(mainProdCount) bits.push((LANG==="ar"?`📈 إنتاجية: ${mainProdCount} نشاط`:`📈 Productivity: ${mainProdCount} activities`));
    if(milestones.length) bits.push((LANG==="ar"?`📜 معالم FIDIC: ${milestones.length}`:`📜 FIDIC milestones: ${milestones.length}`));
    if(bits.length) mainColsMsg = "\n" + (LANG==="ar"?"تم التقاط من نفس ورقة الأنشطة — ":"Picked up from the activities sheet itself — ") + bits.join(" · ");
    const fullExtraMsg = extraMsg + mainColsMsg;
    if(errors.length) setStatus(se,"err",(LANG==="ar"?"تم التحليل مع "+errors.length+" ملاحظة:\n• ":"Parsed with "+errors.length+" issues:\n• ")+errors.join("\n• ")+fullExtraMsg);
    else if(totalWithId>0 && zeroDurCount===totalWithId) setStatus(se,"err",(LANG==="ar"?`لقيت عمود المدة، بس قيمه كلها اتقرت صفر/فاضية في كل الـ${totalWithId} صف. راجع خلية المدة فعليًا (لازم تكون رقم زي 5، مش نص أو تاريخ أو فاضية).`:`Found the duration column, but every one of the ${totalWithId} rows came out zero/empty. Check the actual cell values (must be a plain number like 5 — not text, a date, or blank).`)+fullExtraMsg);
    else if(zeroDurCount>0) setStatus(se,"err",(LANG==="ar"?`تم التحليل، بس ${zeroDurCount} من ${totalWithId} نشاط مدتهم صفر — راجعهم في الجدول تحت قبل ما تكمل.`:`Parsed, but ${zeroDurCount} of ${totalWithId} activities have zero duration — review them in the table below before continuing.`)+fullExtraMsg);
    else setStatus(se,"ok",(LANG==="ar"?"تم تحليل ":"Parsed ")+activities.length+(LANG==="ar"?" نشاط بنجاح ✓":" activities ✓")+fullExtraMsg);
  }

  $("xlsUseBtn").onclick = () => { if(parsedData) loadProjectData(parsedData); };
  $("xlsExportBtn").onclick = () => {
    const se=$("xlsExportStatus");
    if(!parsedData){ setStatus(se,"err",LANG==="ar"?"حلّل الملف الأول.":"Parse the file first."); return; }
    try{ downloadXER(parsedData, $("xlsXerVersion").value); setStatus(se,"ok",LANG==="ar"?"تم التنزيل ✓":"Downloaded ✓"); }
    catch(err){ setStatus(se,"err","Error: "+err.message); }
  };
}

function renderGanttPage(container){
  if(!PROJECT_DATA){ emptyState(container); return; }
  renderGanttContent(container);
  prependToolbar(container, "gantt_chart");

function renderGanttContent(container){
  const acts = PROJECT_DATA.activities || [];
  const cpm = computeCPM(acts);
  const maxDay = Math.max(1,...acts.map(a=>cpm[a.id]?.EF||0));
  const pxPerDay = Math.max(6, Math.min(24, Math.floor(600/maxDay)));
  const card = document.createElement("div"); card.className="card";
  card.innerHTML = `<h2>📊 ${LANG==="ar"?"مخطط جانت":"Gantt Chart"}</h2><p class="desc">${LANG==="ar"?"الأحمر = المسار الحرج (فلوت صفر). محسوب بالأيام التقويمية تقريبيًا.":"Red = critical path (zero float). Calculated in approximate calendar days."}</p>`;
  const wrap = document.createElement("div"); wrap.className="gbar-wrap";
  acts.forEach(a=>{
    const c = cpm[a.id]; if(!c) return;
    const row = document.createElement("div"); row.className="gbar-row";
    const label = document.createElement("div"); label.className="gbar-label"; label.textContent = a.id+" · "+(a.name||"");
    const track = document.createElement("div"); track.className="gbar-track"; track.style.minWidth=(maxDay*pxPerDay)+"px";
    const bar = document.createElement("div"); bar.className="gbar"+(c.critical?" critical":"");
    bar.style.left=(c.ES*pxPerDay)+"px"; bar.style.width=Math.max(4,(a.duration_days||0)*pxPerDay)+"px";
    bar.title = a.id+": ES="+c.ES+" EF="+c.EF+" Float="+c.totalFloat;
    track.appendChild(bar); row.appendChild(label); row.appendChild(track); wrap.appendChild(row);
  });
  card.appendChild(wrap);
  container.appendChild(card);
}

function renderNetPage(container){

function renderNetContent(container){
  const acts = PROJECT_DATA.activities || [];
  const cpm = computeCPM(acts);
  const map = new Map(acts.map(a=>[a.id,a]));
  const level = {};
  const order = acts.map(a=>a.id);
  order.forEach(id=>{
    const a = map.get(id);
    let lv = 0;
    (a.predecessors||[]).forEach(p=>{ if(level[p.activity_id]!==undefined) lv = Math.max(lv, level[p.activity_id]+1); });
    level[id] = lv;
  });
  const maxLevel = Math.max(0,...Object.values(level));
  const projDur = cpm._projectDuration || 0;
  const criticalActs = acts.filter(a=>cpm[a.id]?.critical);

  const sumCard = document.createElement("div"); sumCard.className="card";
  sumCard.innerHTML = `
    <h2>⏱️ ${LANG==="ar"?"زمن المسار الحرج":"Critical Path Duration"}</h2>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${projDur}</div><div class="kpi-lbl">${LANG==="ar"?"إجمالي مدة المشروع (يوم)":"Total project duration (days)"}</div></div>
      <div class="kpi-card"><div class="kpi-val">${criticalActs.length}</div><div class="kpi-lbl">${LANG==="ar"?"عدد الأنشطة الحرجة":"Critical activities"}</div></div>
    </div>
    <p class="hint" style="margin-top:10px;">${LANG==="ar"?"زمن المسار الحرج = أطول مسار من بداية المشروع لنهايته عبر الأنشطة اللي فلوتها = صفر (محسوب بالأيام، من غير احتساب الإجازات).":"Critical path duration = the longest path from project start to finish through activities with zero float (in days, not accounting for weekends/holidays)."}</p>
    ${criticalActs.length ? `<p class="desc" style="margin:10px 0 0;"><b>${LANG==="ar"?"الأنشطة الحرجة:":"Critical activities:"}</b> ${criticalActs.map(a=>a.id).join(" ← ")}</p>` : ""}`;
  container.appendChild(sumCard);

  const card = document.createElement("div"); card.className="card";
  card.innerHTML = `<h2>🔀 ${LANG==="ar"?"مخطط المسار الحرج (CPM)":"CPM Network Diagram"}</h2><p class="desc">${LANG==="ar"?"الأحمر = على المسار الحرج. الترتيب من اليمين لليسار حسب تسلسل الاعتمادية.":"Red = on the critical path. Ordered by dependency level."}</p>`;
  const wrap = document.createElement("div"); wrap.className="netlevels";
  for(let lv=0; lv<=maxLevel; lv++){
    const col = document.createElement("div"); col.className="netlevel";
    acts.filter(a=>level[a.id]===lv).forEach(a=>{
      const c = cpm[a.id];
      const box = document.createElement("div"); box.className="netbox"+(c.critical?" critical":"");
      box.innerHTML = `<b>${a.id}</b><br>${(a.name||"").slice(0,18)}<br><span class="mono" style="font-size:9px;">ES ${c.ES} · EF ${c.EF}</span><br><span class="mono" style="font-size:9px;">${LANG==="ar"?"فلوت":"Float"} ${c.totalFloat}</span>`;
      col.appendChild(box);
    });
    wrap.appendChild(col);
  }
  card.appendChild(wrap);
  container.appendChild(card);
}

function wireRiskContentEvents(container, idPrefix){
  idPrefix = idPrefix || "riskp_";
  const p = PROJECT_DATA;
  const $=(id)=>container.querySelector("#"+id);

      if((p.milestones||[]).some(x=>x.id===id)){ se.className="status show err"; se.textContent = LANG==="ar"?"الكود ده مستخدم قبل كده.":"This ID is already used."; return; }
      p.milestones = p.milestones || [];
      p.milestones.push({
        id, name, fidic_type,
        linked_activity_id: $(idPrefix+"msAct").value || null,
        date: $(idPrefix+"msDate").value.trim() || null,

      });

function renderDashboardContent(container, idPrefix){
  idPrefix = idPrefix || "";
  const acts = PROJECT_DATA.activities || [];
  const cpm = computeCPM(acts);
  const startDate = PROJECT_DATA.project?.start_date || todayXer();
  const maxDay = Math.max(1,...acts.map(a=>cpm[a.id]?.EF||0));

  // --- EVM S-Curve ---
  const hasBudget = acts.some(a=>typeof a.budget==="number");
  let pv=[], ev=[], ac=[];
  if(hasBudget){
    for(let d=0; d<=maxDay; d++){
      let pvSum=0, evSum=0, acSum=0;
      acts.forEach(a=>{
        const c=cpm[a.id]; const budget=a.budget||0; const dur=Math.max(1,a.duration_days||0);
        const elapsed = Math.max(0, Math.min(dur, d-c.ES));
        pvSum += budget * (elapsed/dur);
        const pct = (a.percent_complete||0)/100;
        evSum += budget*pct*(d>=c.ES?1:0);
        acSum += (a.actual_cost||0)*(d>=c.ES?1:0);
      });
      pv.push(pvSum); ev.push(evSum); ac.push(acSum);
    }
  }

  // --- KPI ---
  const totalBudget = acts.reduce((s,a)=>s+(a.budget||0),0);
  const totalEV = acts.reduce((s,a)=>s+(a.budget||0)*((a.percent_complete||0)/100),0);
  const totalAC = acts.reduce((s,a)=>s+(a.actual_cost||0),0);
  const totalPV = pv.length? pv[pv.length-1] : 0;
  const CPI = totalAC>0 ? (totalEV/totalAC) : null;
  const SPI = totalPV>0 ? (totalEV/totalPV) : null;
  const totalReserve = acts.reduce((s,a)=>s+(Number(a.risk_reserve)||0),0);
  const totalCarbon = acts.reduce((s,a)=>s+(Number(a.carbon_kg)||0),0);
  const { EAC, TCPI } = computeAdvancedEVM(totalBudget, totalEV, totalAC, totalReserve, CPI);

  // --- Float histogram ---
  const floatBuckets = {};
  acts.forEach(a=>{ const f=cpm[a.id].totalFloat; const b = f<=0?"0":f<=5?"1-5":f<=10?"6-10":f<=20?"11-20":"20+"; floatBuckets[b]=(floatBuckets[b]||0)+1; });
  const floatOrder = ["0","1-5","6-10","11-20","20+"];

  // --- Resource histogram ---
  const resDaily = {}; // resName -> array per day
  acts.forEach(a=>{
    const c = cpm[a.id];
    (a.resources||[]).forEach(r=>{
      if(!resDaily[r.name]) resDaily[r.name] = new Array(maxDay+1).fill(0);
      for(let d=c.ES; d<c.EF; d++){ if(d>=0 && d<=maxDay) resDaily[r.name][d]+=r.qty||0; }
    });
  });

  container.innerHTML = `
    <div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi-card"><div class="kpi-val ${CPI!=null?(CPI>=1?'kpi-good':'kpi-bad'):''}">${CPI!=null?CPI.toFixed(2):"—"}</div><div class="kpi-lbl">CPI</div></div>
      <div class="kpi-card"><div class="kpi-val ${SPI!=null?(SPI>=1?'kpi-good':'kpi-bad'):''}">${SPI!=null?SPI.toFixed(2):"—"}</div><div class="kpi-lbl">SPI</div></div>
      <div class="kpi-card"><div class="kpi-val">${totalBudget.toLocaleString()}</div><div class="kpi-lbl">${LANG==="ar"?"إجمالي الميزانية":"Total Budget"}</div></div>
      <div class="kpi-card"><div class="kpi-val">${totalAC.toLocaleString()}</div><div class="kpi-lbl">${LANG==="ar"?"التكلفة الفعلية":"Actual Cost"}</div></div>
      <div class="kpi-card"><div class="kpi-val">${EAC!=null?EAC.toLocaleString(undefined,{maximumFractionDigits:0}):"—"}</div><div class="kpi-lbl">EAC</div></div>
      <div class="kpi-card"><div class="kpi-val ${TCPI!=null?(TCPI<=1?'kpi-good':'kpi-bad'):''}">${TCPI!=null?TCPI.toFixed(2):"—"}</div><div class="kpi-lbl">TCPI</div></div>
      <div class="kpi-card"><div class="kpi-val">${totalReserve.toLocaleString()}</div><div class="kpi-lbl">${LANG==="ar"?"احتياطي المخاطر":"Risk Reserve"}</div></div>
      <div class="kpi-card"><div class="kpi-val">${totalCarbon.toLocaleString()}</div><div class="kpi-lbl">${LANG==="ar"?"كربون (كجم CO₂e)":"Carbon (kg CO₂e)"}</div></div>
    </div>
    <div class="chartbox"><h3>📈 EVM S-Curve (PV / EV / AC)</h3>${hasBudget?`<canvas id="${idPrefix}evmChart" height="200"></canvas>`:`<p class="desc">${LANG==="ar"?"أضف budget/percent_complete/actual_cost لكل نشاط في الـ JSON عشان يظهر المنحنى.":"Add budget/percent_complete/actual_cost to activities in the JSON to render this chart."}</p>`}</div>
    <div class="chartbox"><h3>📊 ${LANG==="ar"?"توزيع الفلوت (Total Float)":"Total Float Histogram"}</h3><canvas id="${idPrefix}floatChart" height="200"></canvas></div>
    <div class="chartbox"><h3>👷 ${LANG==="ar"?"توزيع الموارد اليومي":"Daily Resource Histogram"}</h3>${Object.keys(resDaily).length?`<canvas id="${idPrefix}resChart" height="220"></canvas>`:`<p class="desc">${LANG==="ar"?"مفيش بيانات موارد في الأنشطة.":"No resource data in activities."}</p>`}</div>
  `;

  if(hasBudget){
    const ctx = container.querySelector("#"+idPrefix+"evmChart");
    const labels = pv.map((_,i)=>i);
    CHART_INSTANCES.push(new Chart(ctx, { type:"line", data:{ labels, datasets:[
      {label:"PV", data:pv, borderColor:"#2C6E9E", backgroundColor:"#2C6E9E", fill:false, tension:0.35, pointRadius:0, borderWidth:2.5},
      {label:"EV", data:ev, borderColor:"#4CAF6D", backgroundColor:"#4CAF6D", fill:false, tension:0.35, pointRadius:0, borderWidth:2.5},
      {label:"AC", data:ac, borderColor:"#D9534F", backgroundColor:"#D9534F", fill:false, tension:0.35, pointRadius:0, borderWidth:2.5}
    ]}, options:{responsive:true, interaction:{mode:"index",intersect:false}, plugins:{legend:{position:"bottom"}, tooltip:{enabled:true}}, scales:{x:{title:{display:true,text:LANG==="ar"?"يوم":"Day"}}, y:{ticks:{callback:v=>Number(v).toLocaleString()}}}} }));
  }
  const fctx = container.querySelector("#"+idPrefix+"floatChart");
  CHART_INSTANCES.push(new Chart(fctx, { type:"bar", data:{ labels: floatOrder, datasets:[{label:LANG==="ar"?"عدد الأنشطة":"# Activities", data: floatOrder.map(b=>floatBuckets[b]||0), backgroundColor:floatOrder.map(b=>b==="0"?"#D9534F":"#2C6E9E"), borderRadius:6}] }, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}} }));

  if(Object.keys(resDaily).length){
    const rctx = container.querySelector("#"+idPrefix+"resChart");
    const labels = Array.from({length:maxDay+1},(_,i)=>i);
    const colors = ["#2C6E9E","#E8A33D","#4CAF6D","#D9534F","#8e6fc9","#3aa3a0"];
    const datasets = Object.keys(resDaily).map((name,i)=>({ label:name, data:resDaily[name], backgroundColor:colors[i%colors.length] }));
    CHART_INSTANCES.push(new Chart(rctx, { type:"bar", data:{ labels, datasets }, options:{ responsive:true, plugins:{legend:{position:"bottom"}}, scales:{x:{stacked:true,title:{display:true,text:LANG==="ar"?"يوم":"Day"}}, y:{stacked:true}} } }));
  }
}

// ================= PAGE: Reports / Print =================
function buildReportSummary(){
  const p = PROJECT_DATA;
  const acts = p.activities || [];
  const cpm = computeCPM(acts);
  const wbsList = p.wbs || [];
  const totalDur = Math.max(0,...acts.map(a=>cpm[a.id]?.EF||0));
  const critical = acts.filter(a=>cpm[a.id]?.critical);
  const totalBudget = acts.reduce((s,a)=>s+(a.budget||0),0);
  const totalAC = acts.reduce((s,a)=>s+(a.actual_cost||0),0);
  const totalEV = acts.reduce((s,a)=>s+(a.budget||0)*((a.percent_complete||0)/100),0);
  const CPI = totalAC>0 ? (totalEV/totalAC) : null;
  const totalReserve = acts.reduce((s,a)=>s+(Number(a.risk_reserve)||0),0);
  const totalCarbon = acts.reduce((s,a)=>s+(Number(a.carbon_kg)||0),0);
  const { EAC, TCPI } = computeAdvancedEVM(totalBudget, totalEV, totalAC, totalReserve, CPI);
  return { p, acts, cpm, wbsList, totalDur, critical, totalBudget, totalAC, totalEV, CPI, totalReserve, totalCarbon, EAC, TCPI };
}

    else{ se.className="status show err"; se.textContent = LANG==="ar"?"فشل النسخ — استخدم زرار تنزيل HTML بدلًا من كده.":"Copy failed — use the Download HTML button instead."; }
  };
}

    const res = saveCurrentProjectToRegister();
    setStatus(res.ok?"ok":"err", res.msg);

  $("regNewBtn").onclick = () => { createNewProject(); };

  container.querySelectorAll(".delRegBtn").forEach(btn=>{
