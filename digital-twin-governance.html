<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة التوأم الرقمي وحوكمة العقود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1628; --navy-2:#12233d; --navy-3:#1b3252; --gold:#C9A84C; --gold-2:#e2c675;
  --bg:#eef1f5; --card:#ffffff; --ink:#0f1b2d; --muted:#5d6b80; --line:#d9dfe8;
  --good:#2E9E6B; --warn:#E0A100; --bad:#D64545; --info:#2d6cdf;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--navy);color:#dfe6f1;padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--navy-3)}
.brand .mark{width:38px;height:38px;border:2px solid var(--gold);border-radius:6px;display:grid;place-items:center;color:var(--gold);font-weight:700}
.brand b{display:block;font-size:15px;color:#fff;line-height:1.3}
.brand small{color:#93a3bb;font-size:11.5px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{background:none;border:0;color:#c3cddd;text-align:start;padding:9px 12px;border-radius:6px;cursor:pointer;border-inline-start:3px solid transparent}
nav button:hover{background:var(--navy-2)}
nav button.on{background:var(--navy-2);color:#fff;border-inline-start-color:var(--gold)}
.side-box{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--navy-3);padding-top:12px}
.side-box label{font-size:12px;color:#93a3bb}
.side-box select,.side-box input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);color:#fff;border-radius:6px;padding:7px 9px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:600}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:#efc4c4}
.btn.ok{color:#fff;background:var(--good);border-color:var(--good)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
aside .btn{background:var(--navy-2);border-color:var(--navy-3);color:#fff}
aside .btn:hover{border-color:var(--gold)}
main{padding:22px 26px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:22px;font-weight:700}
.top p{margin:2px 0 0;color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--muted)}
.chip.good{background:var(--good)}.chip.warn{background:var(--warn);color:#2b2000}.chip.bad{background:var(--bad)}.chip.info{background:var(--info)}.chip.navy{background:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{margin:0 0 10px;font-size:15.5px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head h2{margin:0}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:2fr 1fr}
.kpi{border-inline-start:4px solid var(--navy);padding:12px 14px}
.kpi small{color:var(--muted);display:block}
.kpi strong{font-size:26px;font-weight:700;display:block;line-height:1.2;margin:2px 0}
.kpi.lead strong{font-size:38px}
.kpi.good{border-inline-start-color:var(--good)}.kpi.warn{border-inline-start-color:var(--warn)}.kpi.bad{border-inline-start-color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:#f6f8fb;white-space:nowrap}
tr.sel td{background:#fbf5e3}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;background:var(--c)}
.twin{display:grid;grid-template-columns:1fr 340px;gap:14px}
#viewerHost{position:relative;height:560px;background:#0e1c33;border-radius:var(--radius);overflow:hidden;touch-action:none;cursor:grab}
#viewerHost canvas{display:block;width:100%;height:100%}
.v-hint{position:absolute;inset-inline-start:12px;bottom:10px;color:#9db0cc;font-size:12px;pointer-events:none}
.v-tools{position:absolute;inset-inline-end:10px;top:10px;display:flex;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 11px;cursor:pointer;font-size:12.5px}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
dt{color:var(--muted)}dd{margin:0;font-weight:500;word-break:break-word}
.notice{background:#fbf5e3;border:1px solid #ecd9a0;border-radius:6px;padding:9px 12px;font-size:13px;color:#5b4610}
.notice.bad{background:#fbeaea;border-color:#efc4c4;color:#7a2020}
.notice.good{background:#e6f5ee;border-color:#b8e0cd;color:#155b3b}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
.steps span.done{background:var(--good);border-color:var(--good);color:#fff}
.steps span.next{border-color:var(--gold);color:#7a5c10;background:#fbf5e3}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);direction:ltr;unicode-bidi:plaintext}
.modal-bg{position:fixed;inset:0;background:rgba(10,22,40,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:10px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 12px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-grid .full{grid-column:1/-1}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.f input[readonly]{background:#f2f4f8}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;border:1px solid var(--gold);z-index:99;display:none;max-width:90vw}
[dir=rtl] #toast{transform:translateX(50%)}
.view{display:none}.view.on{display:block}
.report h2{border-bottom:2px solid var(--gold);padding-bottom:4px;margin-top:22px}
.menu-btn{display:none}
@media(max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
  nav{flex-direction:row;flex-wrap:wrap}
  .side-box{margin-top:0}
  .twin,.g-2{grid-template-columns:1fr}
  #viewerHost{height:420px}
  main{padding:16px}
}
@media print{
  aside,.no-print,.modal-bg,#toast{display:none!important}
  .app{display:block}
  body{background:#fff}
  main{padding:0}
  .card{break-inside:avoid;border-color:#bbb}
  .view{display:none!important}.view.on{display:block!important}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="no-print">
    <div class="brand">
      <div class="mark">DT</div>
      <div><b data-i="app_title"></b><small data-i="app_tag"></small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-box">
      <label for="userName" data-i="user"></label>
      <input id="userName" autocomplete="off">
      <label for="roleSel" data-i="role"></label>
      <select id="roleSel"></select>
      <button class="btn" data-act="lang" id="langBtn"></button>
      <button class="btn" data-act="print" data-i="print"></button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div><h1 id="viewTitle"></h1><p id="viewSub"></p></div>
      <div id="topRight"></div>
    </div>
    <section class="view" id="v-dashboard"></section>
    <section class="view" id="v-twin">
      <div class="twin">
        <div>
          <div id="viewerHost">
            <div class="v-tools no-print"><button class="btn sm" data-act="resetCam" data-i="reset_view"></button></div>
            <div class="v-hint" data-i="v_hint"></div>
          </div>
          <div class="legend" style="margin-top:10px" id="twinLegend"></div>
        </div>
        <div id="twinPanel"></div>
      </div>
    </section>
    <section class="view" id="v-elements"></section>
    <section class="view" id="v-claims"></section>
    <section class="view" id="v-cos"></section>
    <section class="view" id="v-evm"></section>
    <section class="view" id="v-projects"></section>
    <section class="view" id="v-audit"></section>
    <section class="view" id="v-reports"></section>
  </main>
</div>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true">
  <div class="modal"><h3 id="modalTitle"></h3><form id="modalForm"><div class="f-grid" id="modalFields"></div>
    <div class="foot"><button type="button" class="btn" data-act="closeModal" data-i="cancel"></button><button type="submit" class="btn pri" id="modalOk"></button></div></form></div>
</div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">

/* ============ audit (hash chain) ============ */
function cyrb(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,'0')}
async function sha(str){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  return 'f'+cyrb(str)+cyrb(str.split('').reverse().join(''));
}
const rec=e=>JSON.stringify({seq:e.seq,ts:e.ts,user:e.user,role:e.role,action:e.action,entity:e.entity,entityId:e.entityId,diff:e.diff});
function diffObj(a,b){const d={};const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  keys.forEach(k=>{if(JSON.stringify((a||{})[k])!==JSON.stringify((b||{})[k]))d[k]=[(a||{})[k]??null,(b||{})[k]??null]});return d}
let auditQ=Promise.resolve();
function log(action,entity,entityId,oldO,newO){
  const diff=diffObj(oldO,newO);
  const u=state.settings.user,r=state.settings.role;
  auditQ=auditQ.then(async()=>{
    const prev=state.audit.length?state.audit[state.audit.length-1].hash:'GENESIS';
    const e={seq:state.audit.length+1,ts:new Date().toISOString(),user:u,role:r,action,entity,entityId,diff,prev};
    e.hash=await sha(prev+rec(e));
    state.audit.push(e);save();
    if(cur==='audit')render();
  });
  return auditQ;
}
async function verifyChain(){
  let prev='GENESIS';
  for(let i=0;i<state.audit.length;i++){const e=state.audit[i];
    const h=await sha(prev+rec(e));
    if(e.prev!==prev||e.hash!==h)return{ok:false,n:e.seq};
    prev=e.hash}
  return{ok:true,n:state.audit.length};
}

const activeProject=()=>state.projects.find(p=>p.id===state.settings.activeProject)||state.projects[0];

function evmCalc(){
  const s=state.evm.slice().sort((a,b)=>a.date.localeCompare(b.date));const l=s[s.length-1];if(!l)return null;
  const bac=(activeProject()?Number(activeProject().value):0)+approvedCOs();
  const cpi=l.ac>0?l.ev/l.ac:1,spi=l.pv>0?l.ev/l.pv:1;
  const eac=cpi>0?bac/cpi:bac;
  const risk=(cpi<.85||spi<.85)?'high':(cpi<.95||spi<.95)?'medium':'low';
  return{s,l,bac,cpi,spi,cv:l.ev-l.ac,sv:l.ev-l.pv,eac,etc:eac-l.ac,vac:bac-eac,tcpi:(bac-l.ev)/Math.max(bac-l.ac,1),risk};
}
function claimInfo(c){
  const T=todayStr();const deadline=addDays(c.awarenessDate,28);
  const detailedDue=addDays(c.awarenessDate,c.edition==='1999'?42:84);
  let st,text,left=diffDays(T,deadline);
  if(c.noticeDate){const d=diffDays(c.noticeDate,deadline);
    if(d>=0){st='ON_TIME';text=t('d_done',{n:d})}else{st='EXPOSED';text=t('d_late',{n:-d})}}
  else if(left<0){st='EXPOSED';text=t('d_over',{n:-left})}
  else{st=left<=7?'URGENT':'OPEN';text=t('d_left',{n:left})}
  return{deadline,detailedDue,st,text,left};
}

function sCurve(s,bac){
  const W=640,H=250,pl=54,pr=14,pt=14,pb=30;
  const max=Math.max(...s.map(x=>Math.max(x.pv,x.ev,x.ac)),1)*1.1;
  const X=i=>pl+(s.length<2?0:i*(W-pl-pr)/(s.length-1)),Y=v=>pt+(H-pt-pb)*(1-v/max);
  const line=(k,c,dash)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" ${dash?'stroke-dasharray="6 4"':''} points="${s.map((x,i)=>X(i)+','+Y(x[k])).join(' ')}"/>`+s.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[k])}" r="3" fill="${c}"/>`).join('');
  let grid='';for(let i=0;i<=4;i++){const v=max*i/4;grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3e8ef"/><text x="${pl-6}" y="${Y(v)+4}" font-size="11" fill="#5d6b80" text-anchor="end">${(v/1e6).toFixed(1)}M</text>`}
  const xl=s.map((x,i)=>`<text x="${X(i)}" y="${H-8}" font-size="10.5" fill="#5d6b80" text-anchor="middle" direction="ltr">${x.date.slice(2,7)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${t('scurve')}">${grid}${xl}${line('pv','#C9A84C',true)}${line('ev','#2E9E6B')}${line('ac','#D64545')}</svg>
  <div class="legend"><span style="--c:#C9A84C">${t('pv')}</span><span style="--c:#2E9E6B">${t('ev')}</span><span style="--c:#D64545">${t('ac')}</span></div>`;
}

/* ============ modal forms ============ */
let modalSubmit=null;
function openForm(title,fields,okLabel,onSubmit){
  $('#modalTitle').textContent=title;$('#modalOk').textContent=okLabel;
  $('#modalFields').innerHTML=fields.map(f=>{
    if(f.type==='hidden')return`<input type="hidden" name="${f.k}" value="${esc(f.v)}">`;
    const cls='f'+(f.full?' full':'');const id='f_'+f.k;
    let inp;
    if(f.type==='select')inp=`<select id="${id}" name="${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.v??'')?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea id="${id}" name="${f.k}" rows="3">${esc(f.v)}</textarea>`;
    else inp=`<input id="${id}" name="${f.k}" type="${f.type||'text'}" value="${esc(f.v)}" ${f.req?'required':''} ${f.ro?'readonly':''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.step!=null?`step="${f.step}"`:''}>`;
    return`<div class="${cls}"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;
  }).join('');
  modalSubmit=(data)=>onSubmit(data);
  $('#modalBg').classList.add('on');
  const first=$('#modalFields input:not([type=hidden]):not([readonly]),#modalFields select');if(first)first.focus();
  fields._types=Object.fromEntries(fields.map(f=>[f.k,f.type]));
  openForm.types=fields._types;
}
function closeModal(){$('#modalBg').classList.remove('on');modalSubmit=null}
$('#modalForm').addEventListener('submit',ev=>{
  ev.preventDefault();if(!modalSubmit)return;
  const data={};new FormData(ev.target).forEach((v,k)=>{data[k]=openForm.types[k]==='number'?(v===''?0:Number(v)):(typeof v==='string'?v.trim():v)});
  const r=modalSubmit(data);if(r!==false)closeModal();
});
$('#modalBg').addEventListener('mousedown',e=>{if(e.target.id==='modalBg')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

  openForm(t('add_claim'),claimFields(c),t('add'),d=>{

    const n={id:nextId('CL-',state.claims,3),...d};state.claims.push(n);save();log('CREATE','FIDIC_CLAIM',n.id,null,n);toast(t('claim_added'));render();});},
editClaim(id){if(!need('edit'))return;const c=state.claims.find(x=>x.id===id);if(!c)return;
  openForm(t('edit')+' · '+c.id,claimFields(c),t('save'),d=>{
    if(!claimDatesOk(d)){toast(t('bad_dates'));return false}
    const old={...c};Object.assign(c,d);save();log('UPDATE','FIDIC_CLAIM',id,old,c);toast(t('claim_saved'));render();});},
delClaim(id){if(!need('admin'))return;if(!confirm(t('yes_del')))return;const i=state.claims.findIndex(x=>x.id===id);if(i<0)return;const old=state.claims.splice(i,1)[0];save();log('DELETE','FIDIC_CLAIM',id,old,null);toast(t('claim_deleted'));render();},
addCO(){if(!need('edit'))return;
  const f=[{k:'title',l:t('co_title'),v:'',req:1,full:1},{k:'elementGuid',l:t('claim_el'),type:'select',opts:[['','—'],...state.elements.map(e=>[e.guid,e.name+' ('+e.guid+')'])],v:'',full:1},{k:'value',l:t('co_value'),type:'number',v:0,min:0,step:.01,req:1,full:1},{k:'desc',l:t('co_desc'),type:'textarea',v:'',full:1}];
  openForm(t('add_co'),f,t('add'),d=>{const n={id:nextId('CO-',state.cos),title:d.title,value:d.value,elementGuid:d.elementGuid,desc:d.desc,status:'PENDING',steps:STEPS(d.value),approvals:[],created:todayStr()};
    state.cos.push(n);save();log('CREATE','CHANGE_ORDER',n.id,null,n);toast(t('co_added'));render();});},
approveCO(id){const c=state.cos.find(x=>x.id===id);if(!c||c.status!=='PENDING')return;
  const step=c.steps[c.approvals.length];if(state.settings.role!==STEP_ROLE[step]){toast(t('no_perm_step'));return}
  const old=JSON.parse(JSON.stringify(c));c.approvals.push({step,by:state.settings.user,ts:todayStr()});
  if(c.approvals.length>=c.steps.length)c.status='APPROVED';
  save();log('APPROVE','CHANGE_ORDER',id,old,c);toast(t('co_appr'));render();},
rejectCO(id){const c=state.cos.find(x=>x.id===id);if(!c||c.status!=='PENDING'||state.settings.role==='SITE_ENGINEER')return;
  const old=JSON.parse(JSON.stringify(c));c.status='REJECTED';save();log('REJECT','CHANGE_ORDER',id,old,c);toast(t('co_rej'));render();},
delCO(id){if(!need('admin'))return;if(!confirm(t('yes_del')))return;const i=state.cos.findIndex(x=>x.id===id);if(i<0)return;const old=state.cos.splice(i,1)[0];save();log('DELETE','CHANGE_ORDER',id,old,null);toast(t('co_deleted'));render();},
addEvm(){if(!need('evm'))return;
  const f=[{k:'date',l:t('m_date'),type:'date',v:todayStr(),req:1,full:1},{k:'pv',l:t('pv'),type:'number',v:0,min:0,step:.01,req:1},{k:'ev',l:t('ev'),type:'number',v:0,min:0,step:.01,req:1},{k:'ac',l:t('ac'),type:'number',v:0,min:0,step:.01,req:1}];
  openForm(t('add_evm'),f,t('add'),d=>{const old=state.evm.find(x=>x.date===d.date);if(old){Object.assign(old,d)}else state.evm.push(d);save();log(old?'UPDATE':'CREATE','EVM_METRIC',d.date,old||null,d);toast(t('evm_added'));render();});},
delEvm(date){if(!need('admin'))return;if(!confirm(t('yes_del')))return;const i=state.evm.findIndex(x=>x.date===date);if(i<0)return;const old=state.evm.splice(i,1)[0];save();log('DELETE','EVM_METRIC',date,old,null);toast(t('evm_deleted'));render();},
addProject(){if(!need('admin'))return;projectForm({name:'',location:'',contract:'FIDIC',value:0,status:'PLANNING'},null)},
editProject(id){if(!need('admin'))return;const p=state.projects.find(x=>x.id===id);if(p)projectForm(p,p)},
activeProject(id){state.settings.activeProject=id;save();render()},
delProject(id){if(!need('admin'))return;if(id===state.settings.activeProject){toast(t('p_last'));return}
  if(!confirm(t('yes_del')))return;const i=state.projects.findIndex(x=>x.id===id);const old=state.projects.splice(i,1)[0];save();log('DELETE','PROJECT',id,old,null);toast(t('p_deleted'));render();},
async verifyAudit(){const r=await verifyChain();$('#verifyOut').innerHTML=`<div class="notice ${r.ok?'good':'bad'}" style="margin-bottom:10px">${r.ok?t('verify_ok',{n:r.n}):t('verify_bad',{n:r.n})}</div>`},
exportJSON(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='digital-twin-'+todayStr()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
importJSON(){if(!need('admin'))return;$('#fileIn').click()},
resetData(){if(!need('admin'))return;if(!confirm(t('yes_del')))return;const s=state.settings;state=seedState();state.settings={...state.settings,lang:s.lang,role:s.role,user:s.user};save();log('RESET','SYSTEM','-',null,{});sync3D();toast(t('reset_ok'));render();},
resetCam(){cameraReset()},
fcat(v){V.fCat=v;sync3D();rTwinPanel()},
fst(v){V.fSt=v;sync3D();rTwinPanel()},
selEl(g){V.sel=g;sync3D();rTwinPanel()}
};
function claimDatesOk(d){return d.awarenessDate>=d.eventDate&&(!d.noticeDate||d.noticeDate>=d.awarenessDate)}
function projectForm(p,ex){
  const f=[{k:'name',l:t('p_name'),v:p.name,req:1,full:1},{k:'location',l:t('p_loc'),v:p.location},{k:'contract',l:t('p_contract'),v:p.contract},{k:'value',l:t('p_value'),type:'number',v:p.value,min:0,step:1},{k:'status',l:t('p_status'),type:'select',opts:['ACTIVE','PLANNING','CLOSED'].map(s=>[s,t('ps_'+s)]),v:p.status}];
  openForm(ex?t('edit'):t('add_project'),f,t('save'),d=>{
    if(ex){const old={...ex};Object.assign(ex,d);save();log('UPDATE','PROJECT',ex.id,old,ex)}
    else{const n={id:nextId('P-',state.projects),...d};state.projects.push(n);save();log('CREATE','PROJECT',n.id,null,n)}
    toast(t('p_saved'));render();});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=ACT[b.dataset.act];if(fn)fn(b.dataset.id,b)});
$('#roleSel').addEventListener('change',e=>{state.settings.role=e.target.value;save();render()});
$('#userName').addEventListener('change',e=>{state.settings.user=e.target.value.trim()||state.settings.user;save();render()});
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.elements||!s.settings||!s.projects)throw 0;state=s;state.settings.lang=lang;save();sync3D();toast(t('imported'));render()}catch(x){toast(t('bad_file'))}};
  r.readAsText(f);e.target.value='';
});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=JSON.parse(e.newValue);sync3D();render()}catch(x){}}});

/* ============ 3D twin ============ */
const V={active:false,ready:false,fCat:'ALL',fSt:'ALL',sel:null,meshes:new Map(),dirty:true,yaw:.75,pitch:.42,dist:30,target:null};
function cameraReset(){V.yaw=.75;V.pitch=.42;V.dist=30;V.target.set(0,5,0);camUpdate()}
function camUpdate(){if(!V.cam)return;const c=Math.cos(V.pitch);V.cam.position.set(V.target.x+V.dist*c*Math.sin(V.yaw),V.target.y+V.dist*Math.sin(V.pitch),V.target.z+V.dist*c*Math.cos(V.yaw));V.cam.lookAt(V.target);V.dirty=true}
function init3D(){
  const host=$('#viewerHost');
  if(!window.THREE){host.insertAdjacentHTML('afterbegin',`<div class="empty" style="color:#9db0cc">${t('no3d')}</div>`);return false}
  V.target=new THREE.Vector3(0,5,0);
  V.scene=new THREE.Scene();V.scene.background=new THREE.Color(0x0e1c33);
  V.cam=new THREE.PerspectiveCamera(50,1,.1,500);
  V.renderer=new THREE.WebGLRenderer({antialias:true});V.renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  host.insertBefore(V.renderer.domElement,host.firstChild);
  V.scene.add(new THREE.AmbientLight(0xffffff,.65));
  const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(15,30,20);V.scene.add(dl);
  const grid=new THREE.GridHelper(60,30,0xC9A84C,0x22385a);grid.position.y=-.8;grid.material.opacity=.5;grid.material.transparent=true;V.scene.add(grid);
  V.ray=new THREE.Raycaster();V.ndc=new THREE.Vector2();
  const el=V.renderer.domElement,ptrs=new Map();let moved=0,pinch=0;
  el.addEventListener('pointerdown',ev=>{el.setPointerCapture(ev.pointerId);ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});moved=0;if(ptrs.size===2){const a=[...ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}host.style.cursor='grabbing'});
  el.addEventListener('pointermove',ev=>{const p=ptrs.get(ev.pointerId);if(!p)return;
    if(ptrs.size===1){const dx=ev.clientX-p.x,dy=ev.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);V.yaw-=dx*.008;V.pitch=Math.max(.05,Math.min(1.5,V.pitch+dy*.006));p.x=ev.clientX;p.y=ev.clientY;camUpdate()}
    else if(ptrs.size===2){p.x=ev.clientX;p.y=ev.clientY;const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)V.dist=Math.max(8,Math.min(80,V.dist*pinch/d));pinch=d;moved=99;camUpdate()}});
  const up=ev=>{if(ptrs.has(ev.pointerId)){ptrs.delete(ev.pointerId);host.style.cursor='grab';if(moved<6&&ptrs.size===0&&ev.type==='pointerup')pick(ev)}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',ev=>{ev.preventDefault();V.dist=Math.max(8,Math.min(80,V.dist*(1+ev.deltaY*.0012)));camUpdate()},{passive:false});
  new ResizeObserver(()=>{const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;V.renderer.setSize(w,h,false);V.cam.aspect=w/h;V.cam.updateProjectionMatrix();V.dirty=true}).observe(host);
  camUpdate();
  (function loop(){requestAnimationFrame(loop);if(V.active&&V.dirty){V.renderer.render(V.scene,V.cam);V.dirty=false}})();
  V.ready=true;sync3D();return true;
}
function elVisible(e){return(V.fCat==='ALL'||e.category===V.fCat)&&(V.fSt==='ALL'||e.status===V.fSt)}
function sync3D(){
  if(!V.ready)return;
  const seen=new Set();
  state.elements.forEach(e=>{
    seen.add(e.guid);
    let m=V.meshes.get(e.guid);
    if(!m){
      const geo=new THREE.BoxGeometry(1,1,1);
      m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0x888888,transparent:true}));
      const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x0a1628}));
      m.add(edges);m.userData.edges=edges;V.scene.add(m);V.meshes.set(e.guid,m);
    }
    m.userData.guid=e.guid;
    m.position.set(e.x,e.y,e.z);m.scale.set(e.w,e.h,e.d);
    m.material.color.set(STATUS_HEX[e.status]||'#888888');
    const vis=elVisible(e),sel=V.sel===e.guid;
    m.material.opacity=!vis?.06:(e.category==='Architectural'?.45:(e.level==='Foundation'?.9:(e.category==='Structural'&&e.h<.5?.55:1)));
    m.material.emissive.set(sel?0x554411:0x000000);
    m.userData.edges.material.color.set(sel?0xC9A84C:0x0a1628);
    m.userData.pick=vis;m.material.depthWrite=vis&&m.material.opacity>.9;
  });
  [...V.meshes.keys()].forEach(g=>{if(!seen.has(g)){const m=V.meshes.get(g);V.scene.remove(m);m.geometry.dispose();m.material.dispose();V.meshes.delete(g)}});
  V.dirty=true;
}
function pick(ev){
  const r=V.renderer.domElement.getBoundingClientRect();
  V.ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  V.ray.setFromCamera(V.ndc,V.cam);
  const list=[...V.meshes.values()].filter(m=>m.userData.pick);
  const hit=V.ray.intersectObjects(list,false)[0];
  V.sel=hit?hit.object.userData.guid:null;sync3D();rTwinPanel();
}
function enter3D(){
  V.active=true;
  if(!V.ready&&!V.failed){if(!init3D())V.failed=true}
  else{sync3D();V.dirty=true}
  if(V.ready){const h=$('#viewerHost');const w=h.clientWidth,hh=h.clientHeight;if(w&&hh){V.renderer.setSize(w,hh,false);V.cam.aspect=w/hh;V.cam.updateProjectionMatrix()}V.dirty=true}
}
function rTwin(){rTwinPanel();if(cur==='twin')enter3D()}
function rTwinPanel(){
  const cats=['ALL','Structural','Architectural','MEP'],sts=['ALL','GOOD','WARNING','CRITICAL'];
  const e=state.elements.find(x=>x.guid===V.sel);
  let det=`<div class="empty">${t('sel_hint')}</div>`;
  if(e){
    const cl=state.claims.filter(c=>c.elementGuid===e.guid),co=state.cos.filter(c=>c.elementGuid===e.guid);
    const v=e.act-e.est;
    det=`<dl><dt>${t('name')}</dt><dd>${esc(e.name)}</dd><dt>${t('guid')}</dt><dd class="hash">${esc(e.guid)}</dd><dt>${t('category')}</dt><dd>${t('cat_'+e.category)} · ${esc(e.level)}</dd>
    <dt>${t('status')}</dt><dd><span class="chip ${badgeCls[e.status]}">${t(e.status)}</span></dd><dt>${t('health')}</dt><dd>${e.health}%</dd>
    <dt>${t('est')}</dt><dd>${money(e.est)}</dd><dt>${t('act')}</dt><dd>${money(e.act)}</dd><dt>${t('variance')}</dt><dd style="color:${v>0?'var(--bad)':'var(--good)'}">${money(v)}</dd>
    <dt>${t('notes')}</dt><dd>${esc(e.notes)||'—'}</dd><dt>${t('version')}</dt><dd>${e.version}${e.updatedBy?` · ${esc(e.updatedBy)}`:''}</dd>
    <dt>${t('linked_claims')}</dt><dd>${cl.map(c=>`${esc(c.id)} <span class="chip ${csCls[claimInfo(c).st]}">${t('cs_'+claimInfo(c).st)}</span>`).join('<br>')||'—'}</dd>
    <dt>${t('linked_cos')}</dt><dd>${co.map(c=>`${esc(c.id)} · ${money(c.value)} · ${t('s_'+c.status)}`).join('<br>')||'—'}</dd></dl>
    <div style="margin-top:12px"><button class="btn pri" data-act="editEl" data-id="${esc(e.guid)}">${t('edit_data')}</button></div>`;
  }
  $('#twinPanel').innerHTML=`<div class="card"><div class="chips">${cats.map(c=>`<button class="${V.fCat===c?'on':''}" data-act="fcat" data-id="${c}">${c==='ALL'?t('all'):t('cat_'+c)}</button>`).join('')}</div>
  <div class="chips">${sts.map(c=>`<button class="${V.fSt===c?'on':''}" data-act="fst" data-id="${c}">${c==='ALL'?t('all'):t(c)}</button>`).join('')}</div></div>
  <div class="card" style="margin-top:14px">${det}</div>`;
}

/* ============ boot ============ */
(function boot(){
  state=loadState();
  const fresh=!state;
  if(fresh){state=seedState();save()}
  lang=state.settings.lang||'ar';
  applyLang();render();
  if(fresh||!state.audit.length)log('INIT','SYSTEM','-',null,{project:activeProject()?activeProject().id:''});
})();
</script>
