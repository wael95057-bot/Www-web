<style id="appcss">

:root[data-theme="dark"]{--bg:#0D1520;--sf:#152130;--sf2:#1B2A3B;--ink:#E4ECF4;--mu:#93A5B9;--ln:#2A3B50;--ac:#3DBFCB;--acs:#123A44;--onac:#04222A;--am:#EDB24A;--ams:#3A2E12;--rd:#F07563;--rds:#3D1D1A;--gn:#4CC38A;--gns:#12362A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--ff)}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.35}

p{margin:0 0 8px}
.mu{color:var(--mu)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

.dd{position:relative}

.menu[hidden]{display:none}

.card.fm{border-style:dashed}
.g2,.g3{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:13.5px;font-weight:500;margin-bottom:3px}

textarea{min-height:64px;resize:vertical}

.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

.tw{overflow-x:auto}

.ruler.big{height:64px;margin:10px 14px 4px}
.rl-trk{position:absolute;top:22px;left:0;right:0;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--rd) 0 50%,var(--am) 50% 66.66%,var(--gn) 66.66% 100%);opacity:.85}
.big .rl-trk{top:30px;height:12px;border-radius:6px}
.rl-t{position:absolute;top:32px;transform:translateX(-50%);font-size:11px;color:var(--mu)}
.big .rl-t{top:46px;font-size:12px}
.mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:11.5px;font-weight:700;line-height:1.1;color:var(--ink)}
.mk em{display:block;font-style:normal}
.mk i{display:block;font-style:normal;font-size:12px}
.mk.a{color:var(--ac)}.mk.b{color:var(--rd)}
.big .mk{font-size:14px}
.rl-lg{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--mu);direction:inherit}
.svgw{overflow-x:auto}
svg{max-width:100%;height:auto}
.s-t{fill:var(--ink);font:12.5px var(--ff)}
.s-m{fill:var(--mu);font:11px var(--ff)}
.s-ln{stroke:var(--ink);fill:none;stroke-width:1.4}
.s-gr{stroke:var(--ln);fill:none;stroke-width:1}
.s-ac{fill:var(--ac);stroke:none}
.s-acl{stroke:var(--ac);fill:none;stroke-width:2}
.s-rd{stroke:var(--rd);fill:none;stroke-width:1.4;stroke-dasharray:5 3}
.s-rdf{fill:var(--rd)}
.s-hot{fill:var(--rd);font-weight:700}
.fc-s{fill:var(--acs);stroke:var(--ac);stroke-width:1.5}
.fc-p{fill:var(--sf2);stroke:var(--ink);stroke-width:1.3}
.fc-d{fill:var(--ams);stroke:var(--am);stroke-width:1.5}
.qd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.qd>div{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-height:88px}
.qd h5{margin:0 0 5px;font-size:13.5px}
.qd .q1{background:var(--rds)}.qd .q2{background:var(--gns)}.qd .q3{background:var(--sf2)}.qd .q4{background:var(--acs)}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swot>div{border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.swot ul{margin:4px 0;padding-inline-start:18px}
.swot .s{background:var(--gns)}.swot .w{background:var(--rds)}.swot .o{background:var(--acs)}.swot .t{background:var(--ams)}
.chain{display:flex;flex-direction:column;gap:6px}
.chain>div{border:1px solid var(--ln);border-radius:9px;padding:7px 12px;background:var(--sf2)}
.chain>div.root{background:var(--rds);border-color:var(--rd);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
.printhead{display:none;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.printhead .ph-t{font-size:18px;font-weight:700}
.saved .printhead{display:block}
.saved main{padding:20px}
.rep-head{border:2px solid var(--ac);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--sf)}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:20px}
.sign>div{border-top:1px solid var(--ink);padding-top:6px;font-size:13px}
.pb{break-before:page}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (max-width:860px){
.app{display:block}
.rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-inline-end:0;border-bottom:1px solid var(--ln);align-items:center}
.brand,.maker{display:none}
.rail nav{flex-direction:row}
.nv{width:auto;white-space:nowrap;padding:6px 9px}
.nv small{display:none}
.g2,.g3,.qd,.swot,.sign{grid-template-columns:1fr}
.topbar{padding:8px 12px;position:static}.tp-l .chip{display:none}
.tp-mid{order:3;max-width:none;flex-basis:100%}
main{padding:14px 12px}
.ed thead,.stack thead{display:none}
.ed tr,.stack tr{display:block;border:1px solid var(--ln);border-radius:9px;margin-bottom:8px;padding:4px}
.ed td,.stack td{display:block;border:0}
.stack td{border:0;padding:3px 6px}
.ed td::before,.stack td::before{content:attr(data-l);display:block;font-size:12px;color:var(--mu)}
.ed td:last-child::before{content:none}
}
@media print{
:root:root:root{--bg:#fff;--sf:#fff;--sf2:#f3f4f6;--ink:#111;--mu:#555;--ln:#bbb;--ac:#0E7C86;--acs:#e3f3f4;--am:#8a5600;--ams:#fbf0d6;--rd:#b93a2c;--rds:#fbe5e2;--gn:#1b7f52;--gns:#dff3e8}
.rail,.topbar,.fm,.pager,.noprint,.toast,.banner,.foot{display:none!important}
.app{display:block}
body{background:#fff}
main{padding:0;max-width:none}
.card{break-inside:avoid;box-shadow:none}
.printhead{display:block}
.tw{overflow:visible}
}
</style>

function calcSample(m,fb){const shift=P().measure.shift!==false;const r={mode:m.mode,ok:false,warn:[],err:[]};

if(!st||st.n<2){r.err.push(L('أدخل أو ارفع قياسات (٢ على الأقل)','Enter or upload at least 2 measurements'));return r;}

if(usl==null&&lsl==null){r.err.push(L('حدد USL أو LSL على الأقل','Set at least one of USL / LSL'));return r;}
if(usl!=null&&lsl!=null&&usl<=lsl){r.err.push(L('يجب أن يكون USL أكبر من LSL','USL must be greater than LSL'));return r;}
const s=st.sd;let p;
if(s>0)p=(usl!=null?normUpper((usl-st.mean)/s):0)+(lsl!=null?normCdf((lsl-st.mean)/s):0);else p=((usl!=null&&st.mean>usl)||(lsl!=null&&st.mean<lsl))?1:0;

const cpu=usl!=null&&s>0?(usl-st.mean)/(3*s):null,cpl=lsl!=null&&s>0?(st.mean-lsl)/(3*s):null;
r.cp=(usl!=null&&lsl!=null&&s>0)?(usl-lsl)/(6*s):null;const cs=[cpu,cpl].filter(x=>x!=null);r.cpk=cs.length?Math.min.apply(null,cs):null;
r.units=st.n;r.defects=obs;r.opps=1;r.dpo=Math.min(1,p);r.dpu=r.dpo;r.observed=obs;
if(st.n<30)r.warn.push(L('عدد القياسات أقل من 30 — النتائج تقريبية','Fewer than 30 measurements — results are approximate'));
const out=s>0?arr.filter(x=>Math.abs(x-st.mean)>3*s).length:0;if(out)r.warn.push(L(`يوجد ${out} قيمة شاذة محتملة (أبعد من 3σ) — راجع صحة البيانات`,`${out} possible outlier(s) beyond 3σ — check the data`));
}else{const u=num(m.units),d=num(m.defects),o=num(m.opps)||1;
if(!u||u<=0){r.err.push(L('أدخل عدد الوحدات','Enter the number of units'));return r;}
if(d==null||d<0){r.err.push(L('أدخل عدد العيوب','Enter the number of defects'));return r;}
if(d>u*o){r.err.push(L('عدد العيوب أكبر من إجمالي الفرص — راجع المدخلات','Defects exceed total opportunities — check the inputs'));return r;}
r.units=u;r.defects=d;r.opps=o;r.dpo=d/(u*o);r.dpu=d/u;
if(u<30)r.warn.push(L('عدد الوحدات أقل من 30 — النتائج تقريبية','Fewer than 30 units — results are approximate'));}
r.dpmo=r.dpo*1e6;r.yield=(1-r.dpo)*100;const sg=sigmaFromDpo(r.dpo,shift);r.sigma=sg.s;r.capped=sg.c;r.z=r.dpo<=0?null:-invNorm(r.dpo);r.ok=true;return r;}

function h53(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).toUpperCase().padStart(14,'0').slice(0,10);}

function parseCSV(text){const first=text.split(/\r?\n/,1)[0]||'';const dl=[',',';','\t'].map(d=>[d,first.split(d).length-1]).sort((a,b)=>b[1]-a[1])[0][0];const rows=[];let row=[],cur='',q=false;

+fc(L('PESTEL — اختر الأوزان','PESTEL — set your weights'),`<p class="mu">${L('الوزن = أهمية العامل لمشروعك · الشدة = قوة تأثيره · الاتجاه = تهديد أو فرصة.','Weight = importance to your project · Intensity = strength of effect · Direction = threat or opportunity.')}</p>`+tbl('analyze.pestel',[{h:L('الفئة','Category'),k:'c',opts:catOpts()},{h:L('العامل','Factor'),k:'t'},{h:L('الوزن','Weight'),k:'w',rng:1},{h:L('الشدة','Intensity'),k:'r',rng:1},{h:L('الاتجاه','Direction'),k:'d',n:1,opts:[[-1,L('تهديد','Threat')],[1,L('فرصة','Opportunity')]]}],'pestel'))

+'<div data-out="porter"></div>'
+fc('SWOT',`<div class="rowbtns"><button class="btn sm pri" data-act="gen" data-v="swot">${L('توليد SWOT تلقائياً من البيانات','Auto-generate SWOT from the data')}</button></div><div class="g2">${F(L('نقاط القوة','Strengths'),'analyze.swot.s',{rows:4})}${F(L('نقاط الضعف','Weaknesses'),'analyze.swot.w',{rows:4})}${F(L('الفرص','Opportunities'),'analyze.swot.o',{rows:4})}${F(L('التهديدات','Threats'),'analyze.swot.t',{rows:4})}</div>`)
+'<div data-out="swot"></div>'
+fc('Fishbone',`<div class="rowbtns"><button class="btn sm pri" data-act="gen" data-v="fish">${L('اقتراح أسباب حسب القطاع','Suggest causes for the sector')}</button></div>`+tbl('analyze.fish',[{h:L('الفئة','Category'),k:'c',opts:fishOpts()},{h:L('السبب','Cause'),k:'t'},{h:L('درجة التأثير','Impact'),k:'s',rng:1}],'fish'))
+'<div data-out="fish"></div>'
+fc(L('٥ لماذا','5 Whys'),`<p class="mu">${L('ابدأ من المشكلة واسأل «لماذا» حتى تصل إلى السبب الجذري.','Start from the problem and keep asking “why” until you reach the root cause.')}</p>${[0,1,2,3,4].map(i=>F(L('لماذا '+(i+1)+'؟','Why '+(i+1)+'?'),'analyze.whys.'+i)).join('')}${F(L('صياغة السبب الجذري (اختياري — وإلا يُؤخذ آخر جواب)','Root cause wording (optional — otherwise the last answer is used)'),'analyze.rootText')}`)
+'<div data-out="whys"></div><div data-out="root"></div>'
+fc('FMEA — '+L('تحليل نمط العطل وآثاره','Failure Mode & Effects Analysis'),`<p class="mu">${L('قيّم كل بند من ١ إلى ١٠: الشدة (S) × الاحتمال (O) × صعوبة الاكتشاف (D) = رقم أولوية المخاطر RPN.','Rate each item 1–10: Severity (S) × Occurrence (O) × Detection difficulty (D) = Risk Priority Number.')}</p><button class="btn sm pri" data-act="gen" data-v="fmea">${L('توليد البنود من الأسباب الجذرية','Generate items from root causes')}</button>`+tbl('analyze.fmea',[{h:L('نمط العطل','Failure mode'),k:'f'},{h:L('الأثر','Effect'),k:'e'},{h:L('السبب','Cause'),k:'c'},{h:'S',k:'s',rng:10},{h:'O',k:'o',rng:10},{h:'D',k:'d',rng:10},{h:L('الإجراء الوقائي','Preventive action'),k:'a'}],'fmea'))
+'<div data-out="fmea"></div>'
+fc(L('مستوى السيجما — تعديل يدوي','Sigma level — manual override'),`${CHK(L('تفعيل التعديل اليدوي على مستوى السيجما','Enable manual override of the sigma level'),'analyze.ovOn')}<div class="g2">${F(L('مستوى السيجما المعدَّل (0–6)','Adjusted sigma level (0–6)'),'analyze.ovSigma',{num:1})}${F(L('سبب التعديل','Reason for override'),'analyze.ovNote')}</div>`)
+'<div data-out="sigmarep"></div>'+pager('analyze');};
PG.improve=()=>head('improve')
+fc(L('الربط من التحليل','Link from Analyze'),`<p class="mu">${L('يولّد التطبيق إجراءات الخطة من الأسباب الجذرية ومقاييس الفحص من CTQs دون إعادة إدخال.','Plan actions come from the root causes and check metrics from the CTQs — no re-entry.')}</p><button class="btn sm pri" data-act="gen" data-v="pdca">${L('توليد خطة PDCA من الأسباب الجذرية والـ CTQs','Generate PDCA from root causes and CTQs')}</button>`)
+fc('Plan — '+L('التخطيط','Plan'),tbl('improve.plan',[{h:L('الإجراء','Action'),k:'a'},{h:L('السبب الجذري','Root cause'),k:'rc'},{h:L('المسؤول','Owner'),k:'o'},{h:L('الموعد','Due'),k:'d',type:'date'},{h:L('النتيجة المتوقعة','Expected result'),k:'x'}],'plan'))
+fc('Do — '+L('التنفيذ','Do'),tbl('improve.do',[{h:L('النشاط / التجربة','Activity / pilot'),k:'a'},{h:L('النطاق التجريبي','Pilot scope'),k:'w'},{h:L('المسؤول','Owner'),k:'o'},{h:L('الحالة','Status'),k:'s',opts:Object.entries(stL())},{h:L('ملاحظات','Notes'),k:'n'}],'do'))

+fc('Act — '+L('الاعتماد','Act'),tbl('improve.act',[{h:L('القرار','Decision'),k:'dec',opts:Object.entries(decL())},{h:L('الإجراء','Action'),k:'a'},{h:L('المسؤول','Owner'),k:'o'}],'act'))
+'<div data-out="pdca"></div>'
+fc(L('محاكي «ماذا لو»','“What-if” simulator'),`<label class="f"><span>${L('نسبة خفض العيوب المتوقعة','Expected defect reduction')}: <output id="simv">${P().improve.sim}</output>%</span><div class="rg"><input type="range" min="0" max="95" step="5" data-t="n" data-b="improve.sim" value="${P().improve.sim}"></div></label><div data-out="sim"></div>`)+pager('improve');
PG.control=()=>head('control')
+fc(L('مؤشرات الأداء (KPIs)','KPIs'),`<button class="btn sm pri" data-act="gen" data-v="kpi">${L('توليد المؤشرات من CTQs','Generate KPIs from CTQs')}</button>`+tbl('control.kpis',[{h:L('المؤشر','KPI'),k:'n'},{h:L('التعريف / المعادلة','Definition / formula'),k:'f'},{h:L('المستهدف','Target'),k:'t'},{h:L('التكرار','Frequency'),k:'fr'},{h:L('المسؤول','Owner'),k:'o'}],'kpi'))

PG.report=()=>printHead(pageTitle('report'))+`<div class="phead"><div class="ph-badge">Σ</div><div><h1>${pageTitle('report')}</h1></div></div><section class="card fm"><div class="rowbtns"><button class="btn pri" data-act="print">${L('طباعة التقرير','Print report')}</button><button class="btn" data-act="sv" data-v="html">${L('حفظ كصفحة HTML','Save as HTML')}</button><button class="btn" data-act="sv" data-v="xlsall">${L('تصدير Excel','Export Excel')}</button><button class="btn" data-act="sv" data-v="json">${L('حفظ المشروع (JSON)','Save project (JSON)')}</button></div>${CHK(L('تضمين الملاحق التفصيلية (كل المخرجات)','Include detailed appendices (all deliverables)'),'__appx')}</section>${signForm()}<div data-out="report"></div>`+pager('report');
function signForm(){const rows=P().signoff.rows;return fc(L('التوقيع الرقمي والاعتماد','Digital sign-off'),`<p class="mu">${L('اكتب اسم المعتمِد واضغط «توقيع». يُسجَّل الوقت وبصمة رقمية لمحتوى المشروع؛ وإن تغيّر المشروع لاحقًا يظهر تنبيه أن التوقيع لم يعد مطابقًا.','Type the approver name and press “Sign”. The time and a fingerprint of the project content are recorded; if the project changes later, a warning shows that the signature no longer matches.')}</p><div class="tw"><table class="ed"><thead><tr><th>${L('الصفة','Role')}</th><th>${L('الاسم','Name')}</th><th>${L('ملاحظة','Note')}</th><th></th></tr></thead><tbody>${rows.map((r,i)=>{const st=signState(r);return `<tr><td data-l="${L('الصفة','Role')}"><input type="text" data-b="signoff.rows.${i}.role" value="${esc(r.role)}"></td><td data-l="${L('الاسم','Name')}"><input type="text" data-b="signoff.rows.${i}.name" value="${esc(r.name)}"></td><td data-l="${L('ملاحظة','Note')}"><input type="text" data-b="signoff.rows.${i}.note" value="${esc(r.note)}"></td><td style="white-space:nowrap">${st==='pending'?`<button class="btn sm pri" data-act="sign" data-i="${i}">${L('توقيع','Sign')}</button>`:`<span class="chip ${st==='signed'?'ok':'warn'}">${st==='signed'?'✓':'!'}</span> <button class="btn sm" data-act="sign" data-i="${i}">${L('إعادة التوقيع','Re-sign')}</button> <button class="btn sm" data-act="unsign" data-i="${i}">${L('سحب','Revoke')}</button>`}<button class="ib" data-act="del" data-p="signoff.rows" data-i="${i}" aria-label="delete">×</button></td></tr>`;}).join('')}</tbody></table></div><button class="btn sm" data-act="add" data-p="signoff.rows" data-t="sg">＋ ${L('إضافة معتمِد','Add approver')}</button>`);}

function renderRail(){const nav=(k,l,t,pc)=>`<button class="nv${DB.page===k?' on':''}" data-act="nav" data-v="${k}"><span class="lt" style="--p:${pc||0}"><b>${l}</b></span>${t}${pc!=null?`<small>${pc}%</small>`:''}</button>`;
$('#rail').innerHTML=`<div class="brand"><div class="sig">σ</div><div><b>${L('سيجما DMAIC','Six Sigma DMAIC')}</b><small>${esc(P().name)}</small></div></div><nav>${nav('registry','☰',L('سجل المشاريع','Project registry'))}${PHK.map(k=>nav(k,PH[k][2],L(PH[k][0],PH[k][1]),pctDone(k))).join('')}${nav('report','Σ',L('التقرير الشامل','Final report'),qScore())}</nav><div class="maker"><small>${L('إعداد وتطوير','Developed by')}</small><b>${L('المهندس وائل عويس','Eng. Wael Oweis')}</b></div>`;}

if(window.XLSX){try{const wb=XLSX.utils.book_new();sh.forEach(([n,a])=>{const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=(a[0]||[]).map((_,c)=>({wch:Math.min(60,Math.max(12,...a.map(r=>String(r[c]==null?'':r[c]).length)))}));XLSX.utils.book_append_sheet(wb,ws,n.replace(/[\\\/?*\[\]:]/g,'').slice(0,31));});if(lang==='ar')wb.Workbook={Views:[{RTL:true}]};saveFile(nm+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}));return;}catch(e){console.error(e);}}
const csv=sh.map(([n,a])=>n+'\n'+a.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n')).join('\n\n');saveFile(nm+'.csv','\ufeff'+csv,'text/csv');}

loadDB();initDL();
if(!ORDER.includes(DB.page))DB.page='registry';
renderAll();
})();
