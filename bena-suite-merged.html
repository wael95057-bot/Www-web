<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BENA | موسوعة بناء والتحول الرقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEBE1; --blueprint:#12324A; --blueprint-2:#1E4B6D;
  --line:#D8D3C4; --orange:#D65A2C; --ink:#1B2A33; --card:#FFFFFF;
  --green:#1E8E5A; --red:#B23A2C;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Tajawal',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
[dir="ltr"] body, .ltr{ font-family:'Tajawal',sans-serif; }
.app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); position:relative; }

/* App bar */
.appbar{
  background:var(--blueprint); color:#fff;
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:20;
}
.appbar .brand{ display:flex; align-items:center; gap:8px; }
.appbar .brand .mark{ width:26px;height:26px;border:2px solid var(--orange); border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; }
.appbar h1{ font-family:'Cairo',sans-serif; font-size:15px; font-weight:700; margin:0; }
.langbtn{
  background:transparent; border:1px solid #ffffff55; color:#fff; border-radius:14px;
  padding:6px 12px; font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;
}

/* Views */
main{ flex:1; padding:18px 16px 96px; }
.view{ display:none; animation:fade .18s ease; }
.view.active{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

/* Cards */
.card{ background:var(--card); border:1px solid var(--line); border-top:3px solid var(--orange); border-radius:6px; padding:18px; margin-bottom:14px; }
.eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; color:var(--orange); text-transform:uppercase; margin-bottom:6px; }
h2.title{ font-family:'Cairo',sans-serif; font-weight:800; font-size:19px; color:var(--blueprint); margin:0 0 4px; }
p.desc{ font-size:13.5px; color:var(--blueprint-2); margin:0 0 14px; line-height:1.6; }
label{ display:block; font-size:12.5px; font-weight:600; color:var(--blueprint-2); margin:12px 0 5px; }
input[type=text], input[type=number], input[type=date]{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  font-family:'IBM Plex Mono',monospace; font-size:14px; background:#FBFAF6; color:var(--ink);
}
textarea, select{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:5px;
  font-family:'Tajawal',sans-serif; font-size:13.5px; background:#FBFAF6; color:var(--ink);
}
textarea{ min-height:70px; resize:vertical; }
input:focus, textarea:focus, select:focus{ outline:2px solid var(--orange); outline-offset:1px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

button.btn{ border:none; border-radius:6px; padding:11px 16px; font-family:'Cairo',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; }
.btn-primary{ background:var(--orange); color:#fff; }
.btn-outline{ background:transparent; border:1.5px solid var(--blueprint); color:var(--blueprint); }
.btn-ghost{ background:var(--paper); color:var(--blueprint-2); border:1px solid var(--line); }
.btn-danger{ background:transparent; color:#B23A2C; border:1px solid #B23A2C55; }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.btn-row button{ flex:1; min-width:90px; }

/* Home / profile */
.profile-line{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
.profile-line:first-child{ border-top:none; }
.profile-line b{ color:var(--blueprint); font-family:'Cairo',sans-serif; font-weight:700; }
a.site{ color:var(--orange); text-decoration:none; font-family:'IBM Plex Mono',monospace; font-size:13px; }

/* Project list */
.proj-item{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.proj-item.active{ border-color:var(--orange); background:#FFF6F1; }
.proj-info b{ font-family:'Cairo',sans-serif; font-size:14px; color:var(--blueprint); display:block; }
.proj-info span{ font-size:11.5px; color:var(--blueprint-2); font-family:'IBM Plex Mono',monospace; }
.proj-actions{ display:flex; gap:6px; }
.icon-btn{ background:transparent; border:1px solid var(--line); border-radius:5px; padding:6px 9px; font-size:12px; cursor:pointer; color:var(--blueprint-2); }
.empty{ text-align:center; padding:30px 10px; color:var(--blueprint-2); font-size:13.5px; }

/* Notes / DT pager */
.pager-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.pager-dots{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--blueprint-2); }
.active-proj-tag{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:var(--blueprint); color:#fff; padding:4px 10px; border-radius:12px; display:inline-block; margin-bottom:12px; }
.warn{ background:#FFF3CD; border:1px solid #FFE29A; padding:10px 12px; border-radius:6px; font-size:12.5px; color:#8a6d00; margin-bottom:12px; }
.out-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.out-row:first-child{ border-top:none; }
.out-row .lbl{ font-size:13px; color:var(--blueprint-2); }
.out-row .val{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--orange); font-size:14px; direction:ltr; }
.nav-arrows{ display:flex; justify-content:space-between; margin-top:16px; }
.nav-arrows button{ background:var(--blueprint); color:#fff; border:none; border-radius:6px; padding:10px 18px; font-family:'Cairo',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
.nav-arrows button:disabled{ opacity:.35; }

/* DT-9 extras */
.output-box{ background:#FBFAF6; border-right:3px solid var(--orange); border-radius:6px; padding:12px; margin-top:12px; font-size:13px; line-height:1.85; white-space:pre-wrap; }
.checklist label{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px; font-weight:normal; color:var(--ink); }
.checklist input{ width:auto; }
.kpi-cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.kpi-card{ background:#fff; border:1px solid var(--line); border-right:3px solid var(--orange); border-radius:6px; padding:10px; }
.kpi-card .lbl{ font-size:11px; color:var(--blueprint-2); }
.kpi-card .val{ font-size:17px; font-weight:800; color:var(--blueprint); font-family:'IBM Plex Mono',monospace; }
.kpi-card .delta{ font-size:11px; }
.delta.good{ color:var(--green); } .delta.bad{ color:var(--red); }
table.dtt{ width:100%; border-collapse:collapse; margin-top:8px; font-size:11.5px; }
table.dtt th, table.dtt td{ border:1px solid var(--line); padding:5px; text-align:center; }
table.dtt th{ background:var(--blueprint); color:#fff; font-size:10.5px; }
table.dtt input, table.dtt select{ padding:4px; font-size:11.5px; }

/* Bottom tabs */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:#fff; border-top:1px solid var(--line);
  max-width:480px; margin:0 auto;
  display:flex;
}
.tabbar button, .tabbar label{
  flex:1; background:none; border:none; padding:9px 2px 7px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--blueprint-2); font-family:'Cairo',sans-serif; font-size:10px; font-weight:600;
}
.tabbar button .dot, .tabbar label .dot{ width:6px; height:6px; border-radius:50%; background:transparent; }
.tabbar button.active, .tabbar label.active{ color:var(--orange); }
.tabbar button.active .dot, .tabbar label.active .dot{ background:var(--orange); }

/* No-JS / CSS-only fallback navigation (radio-driven tabs) */
.jsnav{ position:absolute; opacity:0; pointer-events:none; width:0; height:0; }
#nav-home:checked ~ main #view-home,
#nav-projects:checked ~ main #view-projects,
#nav-dtsteps:checked ~ main #view-dtsteps,
#nav-notes:checked ~ main #view-notes,
#nav-report:checked ~ main #view-report{ display:block; }
#nav-home:checked ~ .tabbar label[for="nav-home"],
#nav-projects:checked ~ .tabbar label[for="nav-projects"],
#nav-dtsteps:checked ~ .tabbar label[for="nav-dtsteps"],
#nav-notes:checked ~ .tabbar label[for="nav-notes"],
#nav-report:checked ~ .tabbar label[for="nav-report"]{ color:var(--orange); }
#nav-home:checked ~ .tabbar label[for="nav-home"] .dot,
#nav-projects:checked ~ .tabbar label[for="nav-projects"] .dot,
#nav-dtsteps:checked ~ .tabbar label[for="nav-dtsteps"] .dot,
#nav-notes:checked ~ .tabbar label[for="nav-notes"] .dot,
#nav-report:checked ~ .tabbar label[for="nav-report"] .dot{ background:var(--orange); }
.nojs-warn{ display:none; }
.no-js .nojs-warn{ display:block; }

/* Print scoping */
.print-only{ display:none; }
@media print{
  .tabbar, .appbar, .no-print{ display:none !important; }
  main{ padding:0; }
  .view{ display:none !important; }
  .view.printing{ display:block !important; }
  body{ background:#fff; }
  .print-only{ display:block; }
  .card{ border:1px solid #999; box-shadow:none; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- CSS-only fallback tab switches (work even if JavaScript is disabled) -->
  <input class="jsnav" type="radio" name="navtab" id="nav-home" checked>
  <input class="jsnav" type="radio" name="navtab" id="nav-projects">
  <input class="jsnav" type="radio" name="navtab" id="nav-dtsteps">
  <input class="jsnav" type="radio" name="navtab" id="nav-notes">
  <input class="jsnav" type="radio" name="navtab" id="nav-report">

  <div class="appbar">
    <div class="brand">
      <div class="mark">B</div>
      <h1 id="appTitle">BENA</h1>
    </div>
    <button class="langbtn no-print" onclick="setLang(state.lang==='ar'?'en':'ar')" id="langBtn">EN</button>
  </div>

  <main>

    <!-- HOME / ABOUT -->
    <section class="view active" id="view-home">
      <div class="card">
        <div class="eyebrow" data-t="eyebrowProfile"></div>
        <h2 class="title" data-t="appNameFull"></h2>
        <p class="desc" data-t="appTagline"></p>
        <div class="profile-line"><b data-t="lblProgram"></b><span data-t="valProgram"></span></div>
        <div class="profile-line"><b data-t="lblConsultant"></b><span data-t="valConsultant"></span></div>
        <div class="profile-line"><b data-t="lblCreds"></b><span data-t="valCreds"></span></div>
        <div class="profile-line"><b data-t="lblScope"></b><span data-t="valScope"></span></div>
        <div class="profile-line"><b data-t="lblSite"></b><a class="site" href="https://www.bena-blackbox.com" target="_blank">bena-blackbox.com</a></div>
      </div>
      <div class="card">
        <div class="eyebrow" data-t="eyebrowHow"></div>
        <h2 class="title" data-t="howTitle" style="font-size:16px;"></h2>
        <p class="desc" data-t="howDesc" style="margin-bottom:0;"></p>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="view" id="view-projects">
      <noscript><div class="warn">⚠️ لتفعيل تسجيل المشروعات وحفظها، يجب تشغيل JavaScript في إعدادات WebView الخاصة بالتطبيق. / To register and save projects, JavaScript must be enabled in the app's WebView settings.</div></noscript>
      <div class="card">
        <div class="eyebrow" data-t="eyebrowNewProj"></div>
        <h2 class="title" data-t="newProjTitle" style="font-size:17px;"></h2>
        <label data-t="fldProjName"></label>
        <input type="text" id="pName">
        <div class="row2">
          <div><label data-t="fldClient"></label><input type="text" id="pClient"></div>
          <div><label data-t="fldLocation"></label><input type="text" id="pLocation"></div>
        </div>
        <label data-t="fldDate"></label>
        <input type="date" id="pDate">
        <div class="btn-row">
          <button class="btn btn-primary" onclick="createProject()" data-t="btnCreate"></button>
        </div>
      </div>

      <div class="eyebrow" style="margin:18px 0 8px;" data-t="eyebrowRegistry"></div>
      <div id="projList"></div>
    </section>

    <!-- DIGITAL TRANSFORMATION 9-STEPS PAGER -->
    <section class="view" id="view-dtsteps">
      <noscript><div class="warn">⚠️ لعرض خطوات التحول الرقمي، يجب تشغيل JavaScript. / JavaScript must be enabled to view the transformation steps.</div></noscript>
      <div id="dtActiveProjTagWrap"></div>
      <div id="dtNoProjWarn" class="warn no-print" style="display:none;" data-t="warnNoProject"></div>

      <div class="pager-head no-print">
        <span class="pager-dots" id="dtPagerDots"></span>
      </div>

      <div id="dtStepCard"></div>

      <div class="nav-arrows no-print">
        <button id="dtPrevBtn" onclick="changeDT(-1)">‹</button>
        <button id="dtNextBtn" onclick="changeDT(1)">›</button>
      </div>
    </section>

    <!-- NOTES PAGER (10 INITIATIVES) -->
    <section class="view" id="view-notes">
      <noscript><div class="warn">⚠️ لعرض النوت الحسابية وحساب النتائج، يجب تشغيل JavaScript في إعدادات WebView الخاصة بالتطبيق. / To display calculation notes and compute results, JavaScript must be enabled in the app's WebView settings.</div></noscript>
      <div id="activeProjTagWrap"></div>
      <div id="noProjWarn" class="warn no-print" style="display:none;" data-t="warnNoProject"></div>

      <div class="pager-head no-print">
        <span class="pager-dots" id="pagerDots"></span>
      </div>

      <div id="noteCard"></div>

      <div class="nav-arrows no-print">
        <button id="prevBtn" onclick="changeNote(-1)">‹</button>
        <button id="nextBtn" onclick="changeNote(1)">›</button>
      </div>
    </section>

    <!-- FINAL REPORT -->
    <section class="view" id="view-report">
      <noscript><div class="warn">⚠️ لعرض التقرير النهائي، يجب تشغيل JavaScript في إعدادات WebView الخاصة بالتطبيق. / To display the final report, JavaScript must be enabled in the app's WebView settings.</div></noscript>
      <div class="card no-print">
        <div class="eyebrow" data-t="reportEyebrow"></div>
        <h2 class="title" data-t="reportTitle" style="font-size:17px;"></h2>
        <p class="desc" data-t="reportDesc"></p>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="printReport()" data-t="btnPrint"></button>
          <button class="btn btn-ghost" onclick="copyReport()" data-t="btnCopy"></button>
        </div>
        <div class="eyebrow" id="reportMsg" style="margin-top:10px;color:var(--blueprint-2);"></div>
      </div>
      <div id="reportWarn" class="warn no-print" style="display:none;" data-t="noProjForReport"></div>
      <div id="reportBody"></div>
    </section>

  </main>

  <div class="tabbar no-print">
    <label for="nav-home" data-view="home" onclick="showView('home')"><span class="dot"></span><span data-t="tabHome"></span></label>
    <label for="nav-projects" data-view="projects" onclick="showView('projects')"><span class="dot"></span><span data-t="tabProjects"></span></label>
    <label for="nav-dtsteps" data-view="dtsteps" onclick="showView('dtsteps')"><span class="dot"></span><span data-t="tabDT"></span></label>
    <label for="nav-notes" data-view="notes" onclick="showView('notes')"><span class="dot"></span><span data-t="tabNotes"></span></label>
    <label for="nav-report" data-view="report" onclick="showView('report')"><span class="dot"></span><span data-t="tabReport"></span></label>
  </div>

</div>

/* ============ SAFE STORAGE (falls back to memory if DOM Storage is disabled) ============ */
const memoryStore = {};
const Store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in memoryStore) ? memoryStore[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memoryStore[k]=v; } },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){ delete memoryStore[k]; } }
};

/* ============ STATE ============ */
const state = {
  lang: Store.get('bena_lang') || 'ar',
  projects: JSON.parse(Store.get('bena_projects') || '[]'),
  activeId: Store.get('bena_active') || null,
  noteIndex: 0,
  dtIndex: 0
};

function saveProjects(){ Store.set('bena_projects', JSON.stringify(state.projects)); }

function getActiveProject(){ return state.projects.find(p=>p.id===state.activeId) || null; }

/* ============ LANG ============ */
function setLang(lang){
  state.lang = lang;
  Store.set('bena_lang', lang);
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang==='ar' ? 'rtl':'ltr');
  document.getElementById('langBtn').textContent = lang==='ar' ? 'EN' : 'AR';
  applyTranslations();
  renderProjects();
  renderDT();
  renderNote();
  renderReport();
}
function applyTranslations(){
  const dict = T[state.lang];
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key = el.getAttribute('data-t');
    if(dict[key]) el.textContent = dict[key];
  });
}

/* ============ VIEWS / TABS ============ */
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tabbar button, .tabbar label').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  const radio = document.getElementById('nav-'+name);
  if(radio) radio.checked = true;
  if(name==='notes'){ renderNote(); }
  if(name==='projects'){ renderProjects(); }
  if(name==='dtsteps'){ renderDT(); }
  if(name==='report'){ renderReport(); }
}

/* ============ PROJECTS ============ */
function createProject(){
  const name = document.getElementById('pName').value.trim();
  if(!name){ document.getElementById('pName').focus(); return; }
  const p = {
    id: 'p_' + Date.now(),
    name,
    client: document.getElementById('pClient').value.trim(),
    location: document.getElementById('pLocation').value.trim(),
    date: document.getElementById('pDate').value || new Date().toISOString().slice(0,10),
    data: {}, dt: {}
  };
  state.projects.unshift(p);
  state.activeId = p.id;
  Store.set('bena_active', p.id);
  saveProjects();
  document.getElementById('pName').value='';
  document.getElementById('pClient').value='';
  document.getElementById('pLocation').value='';
  document.getElementById('pDate').value='';
  renderProjects();
  renderNote();
  renderDT();
}
function activateProject(id){
  state.activeId = id;
  Store.set('bena_active', id);
  renderProjects();
  renderNote();
  renderDT();
}
function deleteProject(id){
  const dict = T[state.lang];
  if(!confirm(dict.confirmDelete)) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  if(state.activeId===id){ state.activeId=null; Store.remove('bena_active'); }
  saveProjects();
  renderProjects();
  renderNote();
  renderDT();
}
function renderProjects(){
  const dict = T[state.lang];
  const wrap = document.getElementById('projList');
  if(state.projects.length===0){
    wrap.innerHTML = '<div class="empty">'+dict.emptyProjects+'</div>';
    return;
  }
  wrap.innerHTML = state.projects.map(p=>{
    const isActive = p.id===state.activeId;
    return '<div class="proj-item '+(isActive?'active':'')+'">'
      + '<div class="proj-info"><b>'+escapeHtml(p.name)+'</b><span>'+escapeHtml(p.client||'')+(p.location?' · '+escapeHtml(p.location):'')+' · '+p.date+'</span></div>'
      + '<div class="proj-actions">'
      + (isActive ? '<span class="icon-btn" style="color:var(--orange);border-color:var(--orange);">'+dict.tagActive+'</span>' : '<button class="icon-btn" onclick="activateProject(\''+p.id+'\')">'+dict.btnActivate+'</button>')
      + '<button class="icon-btn" onclick="deleteProject(\''+p.id+'\')">'+dict.btnDelete+'</button>'
      + '</div></div>';
  }).join('');
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ NOTES (10 INITIATIVES) ============ */
function changeNote(delta){
  state.noteIndex = Math.min(INITIATIVES.length-1, Math.max(0, state.noteIndex+delta));
  renderNote();
}
function getInputValues(init){
  const proj = getActiveProject();
  const saved = proj && proj.data[init.code] ? proj.data[init.code] : {};
  const v = {};
  init.fields.forEach(f=>{ v[f.id] = (saved[f.id] !== undefined) ? saved[f.id] : f.def; });
  return v;
}
function renderNote(){
  const dict = T[state.lang];
  const init = INITIATIVES[state.noteIndex];
  const proj = getActiveProject();

  document.getElementById('pagerDots').textContent = dict.pageOf+' '+(state.noteIndex+1)+' '+dict.ofWord+' '+INITIATIVES.length;
  document.getElementById('prevBtn').disabled = state.noteIndex===0;
  document.getElementById('nextBtn').disabled = state.noteIndex===INITIATIVES.length-1;
  document.getElementById('prevBtn').textContent = state.lang==='ar' ? '›' : '‹';
  document.getElementById('nextBtn').textContent = state.lang==='ar' ? '‹' : '›';

  document.getElementById('activeProjTagWrap').innerHTML = proj
    ? '<div class="active-proj-tag">'+dict.activeProjPrefix+escapeHtml(proj.name)+'</div>'
    : '';
  document.getElementById('noProjWarn').style.display = proj ? 'none' : 'block';

  const v = getInputValues(init);
  const outputs = init.compute(v);

  const fieldsHtml = init.fields.map(f=>{
    return '<label>'+(state.lang==='ar'?f.ar:f.en)+(f.unit?' ('+dict[f.unit]+')':'')+'</label>'
      +'<input type="number" step="any" data-field="'+f.id+'" value="'+v[f.id]+'" oninput="onFieldInput()">';
  }).join('');

  const outputsHtml = outputs.map(o=>{
    return '<div class="out-row"><span class="lbl">'+(state.lang==='ar'?o.ar:o.en)+'</span><span class="val">'+o.val+(o.unit?' '+dict[o.unit]:'')+'</span></div>';
  }).join('');

  document.getElementById('noteCard').innerHTML =
    '<div class="card" id="printableNote">'
    + '<div class="eyebrow">'+String(state.noteIndex+1).padStart(2,'0')+' / '+INITIATIVES.length+'</div>'
    + '<h2 class="title">'+(state.lang==='ar'?init.nameAr:init.nameEn)+'</h2>'
    + '<p class="desc print-only">'+dict.printedFor+(proj?' — '+escapeHtml(proj.name):'')+'</p>'
    + '<div class="eyebrow" style="margin-top:10px;">'+dict.secInputs+'</div>'
    + fieldsHtml
    + '<div class="eyebrow" style="margin-top:16px;">'+dict.secOutputs+'</div>'
    + outputsHtml
    + '<div class="btn-row no-print">'
    +   '<button class="btn btn-primary" onclick="saveNote()">'+dict.btnSave+'</button>'
    +   '<button class="btn btn-outline" onclick="printNote()">'+dict.btnPrint+'</button>'
    +   '<button class="btn btn-ghost" onclick="copyNote()">'+dict.btnCopy+'</button>'
    + '</div>'
    + '<div class="eyebrow" id="noteMsg" style="margin-top:10px;color:var(--blueprint-2);"></div>'
    + '</div>';
}
function onFieldInput(){
  const init = INITIATIVES[state.noteIndex];
  const v = {};
  document.querySelectorAll('#noteCard input[data-field]').forEach(inp=>{
    v[inp.dataset.field] = parseFloat(inp.value) || 0;
  });
  const outputs = init.compute(v);
  const dict = T[state.lang];
  const rows = document.querySelectorAll('#noteCard .out-row .val');
  outputs.forEach((o,i)=>{ if(rows[i]) rows[i].textContent = o.val+(o.unit?' '+dict[o.unit]:''); });
}
function collectCurrentValues(){
  const v = {};
  document.querySelectorAll('#noteCard input[data-field]').forEach(inp=>{
    v[inp.dataset.field] = parseFloat(inp.value) || 0;
  });
  return v;
}
function saveNote(){
  const dict = T[state.lang];
  const proj = getActiveProject();
  const msg = document.getElementById('noteMsg');
  if(!proj){ msg.textContent = dict.warnNoProject; return; }
  const init = INITIATIVES[state.noteIndex];
  proj.data[init.code] = collectCurrentValues();
  saveProjects();
  msg.textContent = dict.savedMsg;
  setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000);
}
function printNote(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('printing'));
  document.getElementById('view-notes').classList.add('printing');
  window.print();
}
function copyNote(){
  const dict = T[state.lang];
  const init = INITIATIVES[state.noteIndex];
  const proj = getActiveProject();
  const v = collectCurrentValues();
  const outputs = init.compute(v);
  let text = (state.lang==='ar'?init.nameAr:init.nameEn) + '\n';
  if(proj) text += (dict.activeProjPrefix)+proj.name+'\n';
  text += '\n'+dict.secInputs+':\n';
  init.fields.forEach(f=>{ text += '- '+(state.lang==='ar'?f.ar:f.en)+': '+v[f.id]+'\n'; });
  text += '\n'+dict.secOutputs+':\n';
  outputs.forEach(o=>{ text += '- '+(state.lang==='ar'?o.ar:o.en)+': '+o.val+(o.unit?' '+dict[o.unit]:'')+'\n'; });
  text += '\n'+dict.printedFor;
  navigator.clipboard.writeText(text).then(()=>{
    const msg = document.getElementById('noteMsg');
    if(msg){ msg.textContent = dict.copiedMsg; setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000); }
  });
}

  state.dtIndex = Math.min(8, Math.max(0, state.dtIndex+delta));
  renderDT();
}
function dtEsc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function renderDT(){
  const dict = T[state.lang];
  const proj = getActiveProject();
  const idx = state.dtIndex;

  document.getElementById('dtPagerDots').textContent = dict.dtStepOfWord+' '+(idx+1)+' '+dict.ofWord+' 9';
  document.getElementById('dtPrevBtn').disabled = idx===0;
  document.getElementById('dtNextBtn').disabled = idx===8;
  document.getElementById('dtPrevBtn').textContent = state.lang==='ar' ? '›' : '‹';
  document.getElementById('dtNextBtn').textContent = state.lang==='ar' ? '‹' : '›';
  document.getElementById('dtActiveProjTagWrap').innerHTML = proj
    ? '<div class="active-proj-tag">'+dict.activeProjPrefix+escapeHtml(proj.name)+'</div>' : '';
  document.getElementById('dtNoProjWarn').style.display = proj ? 'none' : 'block';

  document.getElementById('dtStepCard').innerHTML = buildDTCard(idx);
  fillDTValues(idx);
}

function buildDTCard(idx){
  const title = state.lang==='ar' ? DT_TITLES[idx].ar : DT_TITLES[idx].en;
  const head = '<div class="eyebrow">'+String(idx+1).padStart(2,'0')+' / 9</div><h2 class="title">'+title+'</h2>';
  let body = '';
  switch(idx){
    case 0: body = dtStep1Body(); break;
    case 1: body = dtStep2Body(); break;
    case 2: body = dtStep3Body(); break;
    case 3: body = dtStep4Body(); break;
    case 4: body = dtStep5Body(); break;
    case 5: body = dtStep6Body(); break;
    case 6: body = dtStep7Body(); break;
    case 7: body = dtStep8Body(); break;
    case 8: body = dtStep9Body(); break;
  }
  return '<div class="card" id="printableDT">'+head+body+'<div class="eyebrow" id="dtMsg" style="margin-top:10px;color:var(--blueprint-2);"></div></div>';
}

function dtKpiCard(label, before, after, higherBetter){
  const delta = after-before;
  const good = higherBetter ? delta>=0 : delta<=0;
  const deltaTxt = higherBetter ? ((delta>=0?'+':'')+delta.toFixed(1)+'%') : (L('من ','from ')+before);
  return '<div class="kpi-card"><div class="lbl">'+label+'</div><div class="val">'+after+(higherBetter?'%':'')+'</div>'
    + '<div class="delta '+(good?'good':'bad')+'">'+deltaTxt+'</div></div>';
}

function fillDTValues(idx){

    if(document.getElementById('dt1_org')) document.getElementById('dt1_org').value = d.s1.org||'';

    document.getElementById('dt2_proc').value = d.s2.proc||'';
    document.getElementById('dt2_tools').value = d.s2.tools||'';
    document.getElementById('dt2_ready').value = d.s2.ready!=null?d.s2.ready:50;
    document.getElementById('dt2_manual').value = d.s2.manual!=null?d.s2.manual:50;
    if(d.s2.proc!==undefined) dtGen2();
  }
  if(idx===2 && d.s3){
    document.getElementById('dt3_sector').value = d.s3.sector||'';
    document.getElementById('dt3_res').value = d.s3.res||'';
    if(d.s3.sector!==undefined) dtGen3();
  }
  if(idx===3){
    const rows = (d.s4 && d.s4.rows && d.s4.rows.length) ? d.s4.rows : [
      {cat:L('الإدارة العليا','Top Mgmt'), prog:L('القيادة الرقمية','Digital Leadership'), hrs:10, status:L('مخطط','Planned')},
      {cat:L('مدراء المشاريع','PMs'), prog:'Agile', hrs:25, status:L('مخطط','Planned')},
      {cat:L('التنفيذيون','Staff'), prog:L('الأدوات الرقمية','Digital Tools'), hrs:40, status:L('مخطط','Planned')}
    ];
    rows.forEach(r=>dt4AddRow(r.cat,r.prog,r.hrs,r.status));
  }
  if(idx===4 && d.s5){
    document.getElementById('dt5_proc').value = d.s5.proc||'';
    document.getElementById('dt5_sprint').value = d.s5.sprint||2;
    document.getElementById('dt5_budget').value = d.s5.budget||5000;
    document.getElementById('dt5_sponsors').value = d.s5.sponsors||'';
    if(d.s5.proc!==undefined) dtGen5();
  }
  if(idx===5 && d.s6){
    document.getElementById('dt6_asis').value = d.s6.asis||'';
    document.getElementById('dt6_tobe').value = d.s6.tobe||'';
    if(d.s6.wastes){
      document.querySelectorAll('#dtStepCard .checklist input').forEach(c=>{ c.checked = d.s6.wastes.indexOf(c.value)>-1; });
    }
    if(d.s6.asis!==undefined) dtGen6();
  }
  if(idx===6 && d.s7){
    document.getElementById('dt7_data').value = d.s7.data;
    document.getElementById('dt7_users').value = d.s7.users;
    document.getElementById('dt7_cloud').value = d.s7.cloud;
    document.getElementById('dt7_sec').checked = d.s7.sec;
    if(d.s7.data!==undefined) dtGen7();
  }
  if(idx===7 && d.s8){
    Object.keys(d.s8).forEach(k=>{
      const parts = k.split('_'); const el = document.getElementById('dt8_'+parts[0]+'_'+parts[1]);
      if(el) el.value = d.s8[k];
    });
    if(d.s8.activity_b!==undefined) dtGen8();
  }
  if(idx===8 && d.s9){
    document.getElementById('dt9_fb').value = d.s9.fb||'';
    document.getElementById('dt9_exp').value = d.s9.exp||'';
    if(d.s9.fb!==undefined) dtGen9();
  }
}

/* ============ FINAL REPORT ============ */
function renderReport(){
  const dict = T[state.lang];
  const proj = getActiveProject();
  document.getElementById('reportWarn').style.display = proj ? 'none' : 'block';

  if(!proj){
    document.getElementById('reportBody').innerHTML = '';
    return;
  }

  const projInfoHtml =
      '<div class="eyebrow">'+dict.reportEyebrow+'</div>'
    + '<h2 class="title">'+dict.reportTitle+'</h2>'
    + '<div class="profile-line"><b>'+dict.fldProjName+'</b><span>'+escapeHtml(proj.name)+'</span></div>'
    + '<div class="profile-line"><b>'+dict.fldClient+'</b><span>'+escapeHtml(proj.client||'—')+'</span></div>'
    + '<div class="profile-line"><b>'+dict.fldLocation+'</b><span>'+escapeHtml(proj.location||'—')+'</span></div>'
    + '<div class="profile-line"><b>'+dict.fldDate+'</b><span>'+proj.date+'</span></div>';

  // --- 9-step section ---
  const dt = proj.dt || {};
  const dtSections = DT_TITLES.map((t, i)=>{
    const key = 's'+(i+1);
    const has = dt[key] !== undefined;
    let rowsHtml = '<p class="desc" style="margin:0;">'+dict.dtNotDone+'</p>';
    if(has){
      const s = dt[key];
      const lines = Object.keys(s).map(k=>{
        let v = s[k];
        if(Array.isArray(v)) v = v.join('، ');
        if(k==='rows' && Array.isArray(v)===false && Array.isArray(s.rows)){ return ''; }
        return '<div class="out-row"><span class="lbl">'+escapeHtml(k)+'</span><span class="val" style="color:var(--blueprint-2);">'+escapeHtml(String(v))+'</span></div>';
      }).filter(Boolean).join('');
      rowsHtml = lines || rowsHtml;
    }
    return '<div class="card"><div class="eyebrow">'+String(i+1).padStart(2,'0')+' / 9</div>'
      + '<h2 class="title" style="font-size:15px;">'+(state.lang==='ar'?t.ar:t.en)+'</h2>'
      + rowsHtml + '</div>';
  }).join('');

  // --- 10 initiatives section ---
  const initSections = INITIATIVES.map((init, idx)=>{
    const saved = proj.data[init.code] || {};
    const v = {};
    init.fields.forEach(f=>{ v[f.id] = (saved[f.id] !== undefined) ? saved[f.id] : f.def; });
    const outputs = init.compute(v);

    const fieldsHtml = init.fields.map(f=>{
      return '<div class="out-row"><span class="lbl">'+(state.lang==='ar'?f.ar:f.en)+'</span><span class="val" style="color:var(--blueprint-2);">'+v[f.id]+(f.unit?' '+dict[f.unit]:'')+'</span></div>';
    }).join('');
    const outputsHtml = outputs.map(o=>{
      return '<div class="out-row"><span class="lbl">'+(state.lang==='ar'?o.ar:o.en)+'</span><span class="val">'+o.val+(o.unit?' '+dict[o.unit]:'')+'</span></div>';
    }).join('');

    return '<div class="card">'
      + '<div class="eyebrow">'+String(idx+1).padStart(2,'0')+' / '+INITIATIVES.length+'</div>'
      + '<h2 class="title" style="font-size:16px;">'+(state.lang==='ar'?init.nameAr:init.nameEn)+'</h2>'
      + '<div class="eyebrow" style="margin-top:8px;">'+dict.secInputs+'</div>'
      + fieldsHtml
      + '<div class="eyebrow" style="margin-top:12px;">'+dict.secOutputs+'</div>'
      + outputsHtml
      + '</div>';
  }).join('');

  document.getElementById('reportBody').innerHTML =
    '<div class="card">'+projInfoHtml+'</div>'
    + '<div class="eyebrow" style="margin:16px 0 8px;font-size:13px;">'+dict.dtReportHeading+'</div>'
    + dtSections
    + '<div class="eyebrow" style="margin:16px 0 8px;font-size:13px;">'+dict.initReportHeading+'</div>'
    + initSections
    + '<p class="desc print-only" style="text-align:center;">'+dict.reportFieldNote+'<br>'+dict.printedFor+'</p>';
}
function printReport(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('printing'));
  document.getElementById('view-report').classList.add('printing');
  window.print();
}
function copyReport(){
  const dict = T[state.lang];
  const proj = getActiveProject();
  if(!proj) return;
  let text = dict.reportTitle+'\n';
  text += dict.fldProjName+': '+proj.name+'\n';
  text += dict.fldClient+': '+(proj.client||'—')+'\n';
  text += dict.fldLocation+': '+(proj.location||'—')+'\n';
  text += dict.fldDate+': '+proj.date+'\n';

  text += '\n'+dict.dtReportHeading+'\n';
  const dt = proj.dt || {};
  DT_TITLES.forEach((t,i)=>{
    const key='s'+(i+1); const s = dt[key];
    text += '\n'+String(i+1).padStart(2,'0')+'. '+(state.lang==='ar'?t.ar:t.en)+'\n';
    if(!s){ text += '  '+dict.dtNotDone+'\n'; return; }
    Object.keys(s).forEach(k=>{
      let v = s[k]; if(Array.isArray(v)) v = v.join('، ');
      text += '  - '+k+': '+v+'\n';
    });
  });

  text += '\n'+dict.initReportHeading+'\n';
  INITIATIVES.forEach((init, idx)=>{
    const saved = proj.data[init.code] || {};
    const v = {};
    init.fields.forEach(f=>{ v[f.id] = (saved[f.id] !== undefined) ? saved[f.id] : f.def; });
    const outputs = init.compute(v);
    text += '\n'+String(idx+1).padStart(2,'0')+'. '+(state.lang==='ar'?init.nameAr:init.nameEn)+'\n';
    text += ' '+dict.secInputs+':\n';
    init.fields.forEach(f=>{ text += '  - '+(state.lang==='ar'?f.ar:f.en)+': '+v[f.id]+'\n'; });
    text += ' '+dict.secOutputs+':\n';
    outputs.forEach(o=>{ text += '  - '+(state.lang==='ar'?o.ar:o.en)+': '+o.val+(o.unit?' '+dict[o.unit]:'')+'\n'; });
  });
  text += '\n'+dict.printedFor;
  navigator.clipboard.writeText(text).then(()=>{
    const msg = document.getElementById('reportMsg');
    if(msg){ msg.textContent = dict.copiedMsg; setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000); }
  });
}
