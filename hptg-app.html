<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPTG Framework - High-Performance Team Governance Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', 'Inter', sans-serif; margin:0; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; color: black !important; font-size: 12pt; }
      .card-box { border: 1px solid #ddd !important; box-shadow: none !important; }
    }
    .print-only { display: none; }
    .heat-Expert{ background:#064e3b; color:#6ee7b7; }
    .heat-Proficient{ background:#1e3a8a; color:#93c5fd; }
    .heat-Developing{ background:#78350f; color:#fcd34d; }
    .heat-Basic{ background:#450a0a; color:#fca5a5; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const translations = {
      ar: {
        appTitle: "منصة حوكمة الفرق عالية الأداء (HPTG)",
        subtitle: "High-Performance Team Governance Framework",
        author: "م. وائل علي عويس محمود",
        authorTitle: "كبير مديري المشاريع ومهندس مدني - مبادرة الصندوق الأسود الرقمي",
        portfolio: "سجل المشاريع",
        profiling: "1. التقييم والتحليل",
        structuring: "2. الهيكلة والحوكمة",
        monitoring: "3. المتابعة الرقمية",
        optimization: "4. التحسين والتطوير",
        finalReport: "التقرير النهائي الشامل",
        printPdf: "طباعة",
        exportPdf: "حفظ PDF",
        switchLang: "English",
        newProject: "إضافة مشروع جديد",
        projectName: "اسم المشروع",
        clientName: "المالك / الجهة",
        status: "الحالة",
        progress: "نسبة الإنجاز",
        actions: "الإجراءات",
        discProfile: "تحليل نمط الشخصية (DISC)",
        skillsMatrix: "مصفوفة المهارات (Skills Matrix)",
        raciMatrix: "مصفوفة المسؤوليات (RACI Matrix)",
        kpis: "مؤشرات الأداء الرئيسية (KPIs)",
        lessonsLearned: "سجل الدروس المستفادة",
        idp: "خطط التطوير الفردية (IDP)",
        save: "حفظ",
        delete: "حذف",
        add: "إضافة",
        responsible: "R - المسؤول",
        accountable: "A - المحاسب",
        consulted: "C - المستشار",
        informed: "I - المُبلغ",
        allRightsReserved: "جميع الحقوق محفوظة © إطار عمل HPTG - مبادرة الصندوق الأسود الرقمي"
      },
      en: {
        appTitle: "HPTG Platform - Team Governance",
        subtitle: "High-Performance Team Governance Framework",
        author: "Eng. Wael Ali Ewis Mahmoud",
        authorTitle: "Senior Project Manager & Civil Engineer | Digital Black Box Initiative",
        portfolio: "Projects Portfolio",
        profiling: "1. Profiling Phase",
        structuring: "2. Structuring Phase",
        monitoring: "3. Digital Monitoring",
        optimization: "4. Optimization Phase",
        finalReport: "Final Closure Report",
        printPdf: "Print",
        exportPdf: "Save PDF",
        switchLang: "عربي",
        newProject: "Add New Project",
        projectName: "Project Name",
        clientName: "Client / Owner",
        status: "Status",
        progress: "Progress",
        actions: "Actions",
        discProfile: "DISC Behavioral Assessment",
        skillsMatrix: "Skills Matrix",
        raciMatrix: "RACI Responsibility Matrix",
        kpis: "Key Performance Indicators (KPIs)",
        lessonsLearned: "Lessons Learned Register",
        idp: "Individual Development Plans (IDP)",
        save: "Save",
        delete: "Delete",
        add: "Add",
        responsible: "R - Responsible",
        accountable: "A - Accountable",
        consulted: "C - Consulted",
        informed: "I - Informed",
        allRightsReserved: "All Rights Reserved © HPTG Framework - Digital Black Box Initiative"
      }
    };

    const DISC_TYPES = ["D - Dominance", "I - Influence", "S - Steadiness", "C - Conscientiousness"];
    const SKILL_KEYS = ["bim", "p6", "qhse", "contract", "site"];
    const SKILL_LABELS = { bim:"BIM / Revit", p6:"Primavera P6", qhse:"QHSE Standards", contract:"Contract Mgmt", site:"Site Supervision" };
    const SKILL_LEVELS = ["Expert","Proficient","Developing","Basic"];

    const STORAGE_KEY = 'hptg_data_v1';
    const COMPANIES_KEY = 'hptg_companies_v1';
    const SESSION_KEY = 'hptg_session_v1';

    function hashPw(str){
      let h = 0;
      for(let i=0;i<str.length;i++){ h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; }
      return 'h'+h;
    }

    function defaultProjects(){
      return [{
        id: 1,
        name: "مشروع إنشاء مركز البيانات السحابي الرئيسي (Data Center Tier IV)",
        client: "وزارة الاتصالات وتكنولوجيا المعلومات",
        status: "قيد التنفيذ (In Progress)",
        progress: 68,
        team: [
          { id: 1, name: "م. أحمد مصطفى", disc: "D - Dominance", skills: { bim:"Proficient", p6:"Developing", qhse:"Basic", contract:"Expert", site:"Proficient" } },
          { id: 2, name: "م. سارة محمود", disc: "C - Conscientiousness", skills: { bim:"Proficient", p6:"Expert", qhse:"Proficient", contract:"Developing", site:"Basic" } }
        ],
        raci: [
          { id: 1, task: "اعتماد المخططات التنفيذية", r: "م. أحمد مصطفى", a: "م. وائل محمود", c: "استشاري المالك", i: "مدير المشروع" },
          { id: 2, task: "متابعة التحديث الأسبوعي P6", r: "م. سارة محمود", a: "م. سارة محمود", c: "مهندس الموقع", i: "المالك" }
        ],
        kpis: { schedulePerf: 94, teamEfficiency: 87, reworkReduction: 72, skillGapClosure: 65 },
        lessons: [
          { id: 1, text: "وجوب مراجعة التنسيق الكهروميكانيكي (MEP) مع الأسقف المرفوعة قبل صب الخرسانة وتفادي الاعتماد على المخططات الأولية." }
        ],
        idp: [
          { id: 1, member: "م. أحمد مصطفى", focus: "Primavera P6 (من Developing إلى Proficient)", plan: "دورة معتمدة 40 ساعة + تطبيق عملي على جدول المشروع الحالي خلال 3 أشهر" }
        ]
      }];
    }

    function HptgApp() {
      const [lang, setLang] = useState('ar');
      const [activeTab, setActiveTab] = useState('portfolio');
      const [selectedProject, setSelectedProject] = useState(0);
      const [projects, setProjects] = useState(defaultProjects());

      const t = translations[lang];

      // ---------- الحفظ الدائم ----------
      useEffect(() => {
        try{
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if(saved && Array.isArray(saved) && saved.length) setProjects(saved);
        }catch(e){}
      }, []);
      useEffect(() => {
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); }catch(e){}
      }, [projects]);

      const toggleLanguage = () => {
        const nextLang = lang === 'ar' ? 'en' : 'ar';
        setLang(nextLang);
        document.documentElement.dir = nextLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = nextLang;
      };

      const handlePrint = () => window.print();
      const handleExportPdf = () => {
        const el = document.getElementById('hptg-main-content');
        html2canvas(el, { scale: 2, backgroundColor: '#0f172a', useCORS: true }).then(canvas => {
          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p','mm','a4');
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const imgWidth = pageWidth;
          const imgHeight = canvas.height * imgWidth / canvas.width;
          let heightLeft = imgHeight, position = 0;
          pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
          heightLeft -= pageHeight;
          while(heightLeft > 0){
            position = heightLeft - imgHeight;
            pdf.addPage();
            pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
            heightLeft -= pageHeight;
          }
          pdf.save('HPTG_' + activeTab + '.pdf');
        });
      };

      const currentProj = projects[selectedProject] || projects[0];

      function updateProject(updater){
        setProjects(prev => prev.map((p,idx) => idx === selectedProject ? updater({...p}) : p));
      }

      // ---------- إدارة المشاريع ----------
      function addProject(name, client){
        if(!name) return;
        const newProj = {
          id: Date.now(), name, client: client || '-', status: "تحت التخطيط (Planning)", progress: 0,
          team: [], raci: [], kpis: { schedulePerf:0, teamEfficiency:0, reworkReduction:0, skillGapClosure:0 }, lessons: [], idp: []
        };
        setProjects(prev => [...prev, newProj]);
        setSelectedProject(projects.length);
      }
      function deleteProject(idx){
        if(projects.length <= 1){ alert('يجب أن يتبقى مشروع واحد على الأقل.'); return; }
        setProjects(prev => prev.filter((_,i) => i !== idx));
        setSelectedProject(0);
      }

      // ---------- إدارة الفريق (DISC + Skills) ----------
      function addTeamMember(name, disc){
        if(!name) return;
        updateProject(p => ({...p, team: [...p.team, { id: Date.now(), name, disc, skills: { bim:"Basic", p6:"Basic", qhse:"Basic", contract:"Basic", site:"Basic" } }]}));
      }
      function deleteTeamMember(id){
        updateProject(p => ({...p, team: p.team.filter(m => m.id !== id)}));
      }
      function updateSkill(memberId, skillKey, level){
        updateProject(p => ({...p, team: p.team.map(m => m.id === memberId ? {...m, skills: {...m.skills, [skillKey]: level}} : m)}));
      }

      // ---------- إدارة RACI ----------
      function addRaciRow(task, r, a, c, i){
        if(!task) return;
        updateProject(p => ({...p, raci: [...p.raci, { id: Date.now(), task, r, a, c, i }]}));
      }
      function deleteRaciRow(id){
        updateProject(p => ({...p, raci: p.raci.filter(row => row.id !== id)}));
      }

      // ---------- إدارة KPIs ----------
      function updateKpi(key, value){
        updateProject(p => ({...p, kpis: {...p.kpis, [key]: parseFloat(value) || 0}}));
      }
      function updateProgress(value){
        updateProject(p => ({...p, progress: parseFloat(value) || 0}));
      }

      // ---------- إدارة الدروس المستفادة ----------
      function addLesson(text){
        if(!text) return;
        updateProject(p => ({...p, lessons: [...p.lessons, { id: Date.now(), text }]}));
      }
      function deleteLesson(id){
        updateProject(p => ({...p, lessons: p.lessons.filter(l => l.id !== id)}));
      }

      // ---------- إدارة IDP ----------
      function addIdp(member, focus, plan){
        if(!member || !focus) return;
        updateProject(p => ({...p, idp: [...p.idp, { id: Date.now(), member, focus, plan }]}));
      }
      function deleteIdp(id){
        updateProject(p => ({...p, idp: p.idp.filter(x => x.id !== id)}));
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">

          <header className="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-lg no-print">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <span className="bg-blue-600 text-white font-black text-xs px-2 py-1 rounded">HPTG</span>
                  <h1 className="text-lg sm:text-xl font-bold text-white">{t.appTitle}</h1>
                </div>
                <p className="text-xs text-blue-400 font-semibold mt-1">
                  إطار عمل: <span className="text-slate-200">{t.author}</span> ({t.authorTitle})
                </p>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={toggleLanguage} className="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg border border-slate-600 transition">
                  🌐 {t.switchLang}
                </button>
                <button onClick={handlePrint} className="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-2 rounded-lg font-bold shadow flex items-center gap-1 transition">
                  🖨️ {t.printPdf}
                </button>
                <button onClick={handleExportPdf} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-lg font-bold shadow flex items-center gap-1 transition">
                  📄 {t.exportPdf}
                </button>
              </div>
            </div>
          </header>

          <div className="print-only p-4 border-b border-black text-slate-900 mb-6">
            <h1 className="text-2xl font-bold">{t.appTitle}</h1>
            <p className="text-sm font-semibold">إعداد وتطوير: {t.author} - {t.authorTitle}</p>
            <p className="text-xs text-slate-600">HPTG Governance & Black Box Initiative | Document Reference ID: HPTG-2026-X1</p>
          </div>

          <nav className="bg-slate-800/80 backdrop-blur border-b border-slate-700 no-print">
            <div className="max-w-7xl mx-auto flex overflow-x-auto text-xs font-semibold">
              {[
                { id: 'portfolio', label: t.portfolio },
                { id: 'profiling', label: t.profiling },
                { id: 'structuring', label: t.structuring },
                { id: 'monitoring', label: t.monitoring },
                { id: 'optimization', label: t.optimization },
                { id: 'report', label: t.finalReport }
              ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  className={`px-5 py-3 whitespace-nowrap border-b-2 transition ${activeTab === tab.id ? 'border-blue-500 text-blue-400 bg-slate-700/50 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-700/30'}`}>
                  {tab.label}
                </button>
              ))}
            </div>
          </nav>

          <main id="hptg-main-content" className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

            {/* TAB 1: PORTFOLIO */}
            {activeTab === 'portfolio' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center no-print flex-wrap gap-3">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">📁 {t.portfolio}</h2>
                  <NewProjectForm onAdd={addProject} t={t} />
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {projects.map((p, idx) => (
                    <div key={p.id} onClick={() => setSelectedProject(idx)}
                      className={`p-5 rounded-xl border cursor-pointer transition card-box ${selectedProject === idx ? 'bg-slate-800 border-blue-500 ring-2 ring-blue-500/20' : 'bg-slate-800/50 border-slate-700 hover:border-slate-600'}`}>
                      <div className="flex justify-between items-start">
                        <span className="text-xs font-bold text-blue-400 bg-blue-950 px-2 py-1 rounded">#{idx+1}</span>
                        <button onClick={(e) => { e.stopPropagation(); deleteProject(idx); }} className="text-rose-400 hover:text-rose-300 text-xs no-print">🗑️</button>
                      </div>
                      <h3 className="font-bold text-base text-white mt-2">{p.name}</h3>
                      <p className="text-xs text-slate-400 mt-1">{t.clientName}: <span className="text-slate-200">{p.client}</span></p>
                      <div className="mt-4 space-y-1">
                        <div className="flex justify-between text-xs text-slate-400">
                          <span>{t.progress}</span><span className="font-bold text-emerald-400">{p.progress}%</span>
                        </div>
                        <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                          <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${p.progress}%` }}></div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: PROFILING */}
            {activeTab === 'profiling' && (
              <div className="space-y-6">
                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4 card-box">
                  <h2 className="text-lg font-bold text-blue-400 border-b border-slate-700 pb-3">Phase 1: Profiling — {currentProj.name}</h2>

                  <div className="space-y-3 no-print">
                    <AddTeamMemberForm onAdd={addTeamMember} t={t} />
                  </div>

                  <div className="space-y-3">
                    <h3 className="text-sm font-bold text-slate-200">{t.discProfile}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {currentProj.team.map((m) => (
                        <div key={m.id} className="bg-slate-900/60 p-4 rounded-lg border border-slate-700 flex justify-between items-center">
                          <div>
                            <p className="font-bold text-white text-sm">{m.name}</p>
                            <p className="text-xs text-blue-400 mt-1">النمط السلوكي: {m.disc}</p>
                          </div>
                          <button onClick={() => deleteTeamMember(m.id)} className="text-rose-400 hover:text-rose-300 text-xs no-print">🗑️</button>
                        </div>
                      ))}
                      {currentProj.team.length === 0 && <p className="text-xs text-slate-500">لا يوجد أعضاء فريق بعد — أضف أول عضو من الفورم فوق.</p>}
                    </div>
                  </div>

                  <div className="space-y-3 pt-4 border-t border-slate-700">
                    <h3 className="text-sm font-bold text-slate-200">{t.skillsMatrix} Heatmap</h3>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs text-right text-slate-300">
                        <thead className="bg-slate-900 text-slate-400">
                          <tr>
                            <th className="p-3">عضو الفريق</th>
                            {SKILL_KEYS.map(k => <th key={k} className="p-3">{SKILL_LABELS[k]}</th>)}
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-700">
                          {currentProj.team.map((m) => (
                            <tr key={m.id}>
                              <td className="p-3 font-bold text-white">{m.name}</td>
                              {SKILL_KEYS.map(k => (
                                <td key={k} className="p-2">
                                  <select value={m.skills[k]} onChange={(e) => updateSkill(m.id, k, e.target.value)}
                                    className={`text-xs px-2 py-1 rounded font-semibold border-0 heat-${m.skills[k]} no-print-select`}>
                                    {SKILL_LEVELS.map(lv => <option key={lv} value={lv}>{lv}</option>)}
                                  </select>
                                  <span className={`print-only px-2 py-1 rounded font-semibold heat-${m.skills[k]}`}>{m.skills[k]}</span>
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: STRUCTURING */}
            {activeTab === 'structuring' && (
              <div className="space-y-6">
                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4 card-box">
                  <h2 className="text-lg font-bold text-blue-400 border-b border-slate-700 pb-3">Phase 2: Structuring — {t.raciMatrix}</h2>
                  <div className="no-print">
                    <AddRaciForm onAdd={addRaciRow} t={t} teamNames={currentProj.team.map(m=>m.name)} />
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-right text-slate-200">
                      <thead className="bg-slate-900 text-slate-400">
                        <tr>
                          <th className="p-3">النشاط / المهمة الهندسية</th>
                          <th className="p-3">{t.responsible}</th>
                          <th className="p-3">{t.accountable}</th>
                          <th className="p-3">{t.consulted}</th>
                          <th className="p-3">{t.informed}</th>
                          <th className="p-3 no-print">{t.actions}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-700">
                        {currentProj.raci.map((r) => (
                          <tr key={r.id}>
                            <td className="p-3 font-bold text-white">{r.task}</td>
                            <td className="p-3"><span className="bg-blue-900 text-blue-200 px-2 py-1 rounded">{r.r}</span></td>
                            <td className="p-3"><span className="bg-amber-900 text-amber-200 px-2 py-1 rounded">{r.a}</span></td>
                            <td className="p-3"><span className="bg-slate-700 text-slate-200 px-2 py-1 rounded">{r.c}</span></td>
                            <td className="p-3"><span className="bg-slate-700 text-slate-200 px-2 py-1 rounded">{r.i}</span></td>
                            <td className="p-3 no-print"><button onClick={() => deleteRaciRow(r.id)} className="text-rose-400 text-xs">🗑️</button></td>
                          </tr>
                        ))}
                        {currentProj.raci.length === 0 && <tr><td colSpan="6" className="p-3 text-center text-slate-500">لا توجد أنشطة بعد</td></tr>}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: MONITORING */}
            {activeTab === 'monitoring' && (
              <div className="space-y-6">
                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4 card-box">
                  <h2 className="text-lg font-bold text-blue-400 border-b border-slate-700 pb-3">Phase 3: Digital Monitoring — {t.kpis}</h2>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {[
                      {key:'schedulePerf', label:'Schedule Performance (P6)', color:'text-blue-400'},
                      {key:'teamEfficiency', label:'Team Efficiency', color:'text-emerald-400'},
                      {key:'reworkReduction', label:'Rework Reduction', color:'text-amber-400'},
                      {key:'skillGapClosure', label:'Skill Gap Closure', color:'text-purple-400'}
                    ].map(kpi => (
                      <div key={kpi.key} className="bg-slate-900 p-4 rounded-xl text-center border border-slate-700">
                        <input type="number" min="0" max="100" value={currentProj.kpis[kpi.key]}
                          onChange={(e) => updateKpi(kpi.key, e.target.value)}
                          className={`w-full bg-transparent text-2xl font-black text-center outline-none no-print-input ${kpi.color}`} />
                        <span className={`print-only text-2xl font-black ${kpi.color}`}>{currentProj.kpis[kpi.key]}%</span>
                        <p className="text-xs text-slate-400 mt-1">{kpi.label}</p>
                      </div>
                    ))}
                  </div>
                  <div className="pt-3 border-t border-slate-700">
                    <label className="text-xs text-slate-400 block mb-1">نسبة الإنجاز الإجمالية للمشروع (%)</label>
                    <input type="number" min="0" max="100" value={currentProj.progress} onChange={(e) => updateProgress(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white w-32 no-print-input" />
                    <span className="print-only text-sm font-bold text-white">{currentProj.progress}%</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: OPTIMIZATION */}
            {activeTab === 'optimization' && (
              <div className="space-y-6">
                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4 card-box">
                  <h2 className="text-lg font-bold text-blue-400 border-b border-slate-700 pb-3">Phase 4: Optimization — {t.idp} & {t.lessonsLearned}</h2>

                  <div className="space-y-3">
                    <h3 className="text-sm font-bold text-slate-200">{t.idp}</h3>
                    <div className="no-print"><AddIdpForm onAdd={addIdp} t={t} teamNames={currentProj.team.map(m=>m.name)} /></div>
                    <div className="space-y-2">
                      {currentProj.idp.map(x => (
                        <div key={x.id} className="bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs flex justify-between items-start gap-2">
                          <div>
                            <p className="font-bold text-white">{x.member} — <span className="text-blue-400">{x.focus}</span></p>
                            <p className="text-slate-400 mt-1">{x.plan}</p>
                          </div>
                          <button onClick={() => deleteIdp(x.id)} className="text-rose-400 no-print">🗑️</button>
                        </div>
                      ))}
                      {currentProj.idp.length === 0 && <p className="text-xs text-slate-500">لا توجد خطط تطوير بعد</p>}
                    </div>
                  </div>

                  <div className="space-y-3 pt-4 border-t border-slate-700">
                    <h3 className="text-sm font-bold text-slate-200">{t.lessonsLearned}</h3>
                    <div className="no-print"><AddLessonForm onAdd={addLesson} /></div>
                    <div className="space-y-2">
                      {currentProj.lessons.map(l => (
                        <div key={l.id} className="bg-slate-900 p-4 rounded-lg border-r-4 border-amber-500 text-xs text-slate-300 leading-relaxed flex justify-between items-start gap-2">
                          <span>{l.text}</span>
                          <button onClick={() => deleteLesson(l.id)} className="text-rose-400 no-print shrink-0">🗑️</button>
                        </div>
                      ))}
                      {currentProj.lessons.length === 0 && <p className="text-xs text-slate-500">لا توجد دروس مسجلة بعد</p>}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: FINAL REPORT */}
            {activeTab === 'report' && (
              <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 space-y-6 card-box text-slate-200">
                <div className="text-center border-b border-slate-700 pb-6">
                  <h1 className="text-2xl font-extrabold text-white">{t.finalReport}</h1>
                  <p className="text-sm text-blue-400 font-semibold mt-1">{currentProj.name}</p>
                  <p className="text-xs text-slate-400 mt-1">{t.clientName}: {currentProj.client}</p>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                  <div className="bg-slate-900 p-4 rounded-lg border border-slate-700"><p className="text-slate-400">Schedule Perf.</p><p className="text-xl font-bold text-blue-400 mt-1">{currentProj.kpis.schedulePerf}%</p></div>
                  <div className="bg-slate-900 p-4 rounded-lg border border-slate-700"><p className="text-slate-400">Team Efficiency</p><p className="text-xl font-bold text-emerald-400 mt-1">{currentProj.kpis.teamEfficiency}%</p></div>
                  <div className="bg-slate-900 p-4 rounded-lg border border-slate-700"><p className="text-slate-400">Rework Reduction</p><p className="text-xl font-bold text-amber-400 mt-1">{currentProj.kpis.reworkReduction}%</p></div>
                  <div className="bg-slate-900 p-4 rounded-lg border border-slate-700"><p className="text-slate-400">Skill Gap Closure</p><p className="text-xl font-bold text-purple-400 mt-1">{currentProj.kpis.skillGapClosure}%</p></div>
                </div>

                <div className="space-y-2">
                  <h3 className="font-bold text-sm text-white border-b border-slate-700 pb-1">{t.discProfile} & {t.skillsMatrix}</h3>
                  <table className="w-full text-xs text-right border border-slate-700">
                    <thead className="bg-slate-900 text-slate-400"><tr><th className="p-2 border border-slate-700">Member</th><th className="p-2 border border-slate-700">DISC</th>
                      {SKILL_KEYS.map(k=><th key={k} className="p-2 border border-slate-700">{SKILL_LABELS[k]}</th>)}</tr></thead>
                    <tbody>
                      {currentProj.team.map(m => (
                        <tr key={m.id}><td className="p-2 border border-slate-700 font-bold">{m.name}</td><td className="p-2 border border-slate-700">{m.disc}</td>
                          {SKILL_KEYS.map(k=><td key={k} className="p-2 border border-slate-700">{m.skills[k]}</td>)}</tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="space-y-2">
                  <h3 className="font-bold text-sm text-white border-b border-slate-700 pb-1">{t.raciMatrix}</h3>
                  <table className="w-full text-xs text-right border border-slate-700">
                    <thead className="bg-slate-900 text-slate-400"><tr><th className="p-2 border border-slate-700">Task</th><th className="p-2 border border-slate-700">R</th><th className="p-2 border border-slate-700">A</th><th className="p-2 border border-slate-700">C</th><th className="p-2 border border-slate-700">I</th></tr></thead>
                    <tbody>
                      {currentProj.raci.map(r => (
                        <tr key={r.id}><td className="p-2 border border-slate-700 font-bold">{r.task}</td><td className="p-2 border border-slate-700">{r.r}</td><td className="p-2 border border-slate-700">{r.a}</td><td className="p-2 border border-slate-700">{r.c}</td><td className="p-2 border border-slate-700">{r.i}</td></tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="space-y-2">
                  <h3 className="font-bold text-sm text-white border-b border-slate-700 pb-1">{t.lessonsLearned}</h3>
                  {currentProj.lessons.map(l => <p key={l.id} className="text-xs text-slate-300 leading-relaxed">• {l.text}</p>)}
                  {currentProj.lessons.length === 0 && <p className="text-xs text-slate-500">—</p>}
                </div>

                <div className="pt-8 border-t border-slate-700 flex justify-between items-end text-xs">
                  <div>
                    <p className="font-bold text-white">اعتماد استشاري الإدارة والحوكمة:</p>
                    <p className="text-blue-400 font-bold mt-1">{t.author}</p>
                    <p className="text-slate-400">{t.authorTitle}</p>
                  </div>
                  <div className="text-left">
                    <p className="text-slate-500">{new Date().toLocaleDateString('ar-EG')}</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          <footer className="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-400 no-print">
            <p>{t.allRightsReserved}</p>
            <p className="mt-1 text-slate-500">تطوير وتصميم: {t.author}</p>
          </footer>

        </div>
      );
    }

    // ---------- فورمات الإضافة (مكونات مساعدة) ----------
    function NewProjectForm({ onAdd, t }){
      const [name, setName] = useState('');
      const [client, setClient] = useState('');
      return (
        <div className="flex flex-wrap gap-2">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder={t.projectName} className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
          <input value={client} onChange={e=>setClient(e.target.value)} placeholder={t.clientName} className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
          <button onClick={() => { onAdd(name, client); setName(''); setClient(''); }} className="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-bold">+ {t.newProject}</button>
        </div>
      );
    }

    function AddTeamMemberForm({ onAdd, t }){
      const [name, setName] = useState('');
      const [disc, setDisc] = useState(DISC_TYPES[0]);
      return (
        <div className="flex flex-wrap gap-2 bg-slate-900/50 p-3 rounded-lg border border-slate-700">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="اسم عضو الفريق" className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white flex-1 min-w-[140px]" />
          <select value={disc} onChange={e=>setDisc(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
            {DISC_TYPES.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <button onClick={() => { onAdd(name, disc); setName(''); }} className="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-bold">+ إضافة عضو</button>
        </div>
      );
    }

    function AddRaciForm({ onAdd, t, teamNames }){
      const [task, setTask] = useState('');
      const [r, setR] = useState('');
      const [a, setA] = useState('');
      const [c, setC] = useState('');
      const [i, setI] = useState('');
      return (
        <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700 space-y-2">
          <input value={task} onChange={e=>setTask(e.target.value)} placeholder="النشاط / المهمة" className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
            <input value={r} onChange={e=>setR(e.target.value)} placeholder="R المسؤول" className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
            <input value={a} onChange={e=>setA(e.target.value)} placeholder="A المحاسب" className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
            <input value={c} onChange={e=>setC(e.target.value)} placeholder="C المستشار" className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
            <input value={i} onChange={e=>setI(e.target.value)} placeholder="I المُبلغ" className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
          </div>
          <button onClick={() => { onAdd(task,r,a,c,i); setTask('');setR('');setA('');setC('');setI(''); }} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-bold">+ إضافة نشاط RACI</button>
        </div>
      );
    }

    function AddLessonForm({ onAdd }){
      const [text, setText] = useState('');
      return (
        <div className="flex gap-2">
          <input value={text} onChange={e=>setText(e.target.value)} placeholder="اكتب الدرس المستفاد..." className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
          <button onClick={() => { onAdd(text); setText(''); }} className="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-bold">+ إضافة</button>
        </div>
      );
    }

    function AddIdpForm({ onAdd, t, teamNames }){
      const [member, setMember] = useState('');
      const [focus, setFocus] = useState('');
      const [plan, setPlan] = useState('');
      return (
        <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700 space-y-2">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
            <input value={member} onChange={e=>setMember(e.target.value)} placeholder="اسم عضو الفريق" list="idp-members" className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
            <datalist id="idp-members">{teamNames.map(n=><option key={n} value={n} />)}</datalist>
            <input value={focus} onChange={e=>setFocus(e.target.value)} placeholder="مجال التطوير المستهدف" className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
          </div>
          <textarea value={plan} onChange={e=>setPlan(e.target.value)} placeholder="خطة التطوير التفصيلية" rows="2" className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"></textarea>
          <button onClick={() => { onAdd(member,focus,plan); setMember('');setFocus('');setPlan(''); }} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-bold">+ إضافة خطة تطوير</button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HptgApp />);
  </script>
</body>
</html>
