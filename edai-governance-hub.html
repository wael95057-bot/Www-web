<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDAI Governance Hub</title>

<style>
  :root {
    --primary: #0284c7;
    --dark: #0f172a;
    --border: #cbd5e1;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    margin: 0;
    background: #eef2f6;
    color: var(--dark);
    padding-bottom: 40px;
  }
  header {
    background: var(--dark);
    color: white;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  header .title-block h1 { font-size: 17px; margin: 0; }
  header .title-block p { font-size: 11px; margin: 2px 0 0; color: #94a3b8; }
  header .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header button, header select {
    background: var(--primary);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
  }
  header button.secondary-btn { background: #475569; }
  .layout { display: flex; min-height: calc(100vh - 60px); }
  aside {
    width: 260px;
    background: white;
    border-left: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    max-height: calc(100vh - 60px);
  }
  aside .group-title {
    font-size: 12px;
    font-weight: bold;
    color: #64748b;
    margin: 14px 4px 6px;
    text-transform: uppercase;
  }
  aside button.matrix-btn {
    display: block;
    width: 100%;
    text-align: right;
    background: none;
    border: none;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #334155;
    margin-bottom: 2px;
  }
  aside button.matrix-btn:hover { background: #f1f5f9; }
  aside button.matrix-btn.active { background: var(--primary); color: white; }
  main { flex: 1; padding: 20px; overflow-x: auto; }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .card-header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .card h2 { margin: 0; font-size: 18px; color: var(--primary); }
  table.data-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  table.data-table th, table.data-table td {
    border: 1px solid var(--border); padding: 8px; text-align: right; vertical-align: top;
  }
  table.data-table th { background: var(--bg); font-size: 12px; }
  table.data-table td.actions { white-space: nowrap; width: 1%; }
  table.data-table td.actions button { margin-inline-start: 4px; }
  .btn-small {
    background: #64748b; color: white; border: none; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .btn-small.danger { background: #dc2626; }
  .btn-small.edit { background: var(--primary); }
  .btn-small.print-btn { background: #16a34a; }
  form.row-form {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 14px;
    padding: 14px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  form.row-form label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
  form.row-form input, form.row-form select, form.row-form textarea {
    width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 5px; font-family: inherit; font-size: 13px;
  }
  form.row-form textarea { min-height: 60px; resize: vertical; }
  form.row-form .form-actions { grid-column: 1 / -1; margin-top: 6px; }
  button.primary {
    background: var(--primary); color: white; border: none; padding: 8px 18px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button.secondary {
    background: #94a3b8; color: white; border: none; padding: 8px 18px;
    border-radius: 6px; cursor: pointer; font-size: 13px; margin-inline-start: 6px;
  }
  .msg { padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 13px; }
  .msg.success { background: #dcfce7; color: #166534; }
  .msg.error { background: #fee2e2; color: #991b1b; }
  .msg.info { background: #dbeafe; color: #1e40af; }
  .tabs-auth { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs-auth button { flex: 1; padding: 10px; border: 1px solid var(--border); background: white; cursor: pointer; border-radius: 6px; }
  .tabs-auth button.active { background: var(--primary); color: white; }
  #auth-login, #auth-register { display: none; }
  #auth-login.active, #auth-register.active { display: block; }
  .search-box { margin-bottom: 10px; }
  .search-box input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 5px; }
  .empty-note { color: #94a3b8; text-align: center; padding: 20px; }
  footer.app-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--dark); color: #94a3b8; text-align: center;
    font-size: 11px; padding: 8px; z-index: 100;
  }
  footer.app-footer b { color: #38bdf8; }
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    aside { width: 100%; max-height: 260px; }
  }  .ai-panel { max-width: 900px; }
  .ai-panel textarea.ai-key-input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 5px; font-family: monospace; }
  .ai-report-box {
    margin-top: 16px; padding: 18px; background: #faf5ff; border: 1px solid #d8b4fe;
    border-radius: 8px; font-size: 14px; line-height: 1.9;
  }
  .ai-report-box h2, .ai-report-box h3, .ai-report-box h4 { color: #7c3aed; margin: 14px 0 6px; }
  .ai-loading { display: flex; align-items: center; gap: 8px; color: #7c3aed; font-size: 13px; }
  .spinner {
    width: 16px; height: 16px; border: 3px solid #e9d5ff; border-top-color: #7c3aed;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="auth-screen" style="max-width:480px; margin:60px auto; padding:0 16px;">
  <div class="card">
    <h2 id="auth-title">🧠 EDAI Governance Hub</h2>
    <p id="auth-subtitle" style="font-size:13px;color:#64748b;"></p>
    <div class="tabs-auth">
      <button id="tab-login-btn" class="active" onclick="switchAuthTab('login')" data-i18n="tab_login"></button>
      <button id="tab-register-btn" onclick="switchAuthTab('register')" data-i18n="tab_register"></button>
    </div>

    <div id="auth-login" class="active">
      <label style="display:block;font-size:13px;font-weight:bold;margin:8px 0 4px;" data-i18n="email_label"></label>
      <input type="email" id="login-email" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:5px;">
      <label style="display:block;font-size:13px;font-weight:bold;margin:8px 0 4px;" data-i18n="password_label"></label>
      <input type="password" id="login-password" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:5px;">
      <button class="primary" style="margin-top:12px;" onclick="handleLogin()" data-i18n="login_btn"></button>
      <div id="login-msg"></div>
    </div>

    <div id="auth-register">
      <label style="display:block;font-size:13px;font-weight:bold;margin:8px 0 4px;" data-i18n="company_name_label"></label>
      <input type="text" id="register-company-name" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:5px;">
      <label style="display:block;font-size:13px;font-weight:bold;margin:8px 0 4px;" data-i18n="email_label"></label>
      <input type="email" id="register-email" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:5px;">
      <label style="display:block;font-size:13px;font-weight:bold;margin:8px 0 4px;" data-i18n="password_label"></label>
      <input type="password" id="register-password" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:5px;">
      <label style="display:block;font-size:13px;font-weight:bold;margin:8px 0 4px;" data-i18n="confirm_password_label"></label>
      <input type="password" id="register-confirm" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:5px;">
      <button class="primary" style="margin-top:12px;" onclick="handleRegister()" data-i18n="register_btn"></button>
      <div id="register-msg"></div>
    </div>
  </div>
</div>

<div id="main-screen" style="display:none;">
  <header>
    <div class="title-block">
      <h1>🧠 EDAI Governance Hub</h1>
      <p id="founder-line"></p>
    </div>
    <div class="actions">
      <button class="secondary-btn" onclick="toggleLang()" id="lang-toggle-btn">English 🌐</button>
      <button class="secondary-btn" onclick="openMasterReport()" id="master-report-btn"></button>
      <button class="secondary-btn" onclick="openAIPage()" id="ai-page-btn" style="background:#7c3aed;"></button>
      <span id="company-name-display" style="font-size:12px;"></span>
      <button onclick="handleLogout()" id="logout-btn"></button>
    </div>
  </header>
  <div class="layout">
    <aside id="matrix-nav"></aside>
    <main>
      <div class="card">
        <div class="card-header-row">
          <h2 id="current-matrix-title"></h2>
          <button class="btn-small print-btn" id="print-current-btn" style="display:none;" onclick="printCurrentMatrix()"></button>
        </div>
        <div id="msg-area"></div>
        <div class="search-box" id="search-box" style="display:none;">
          <input type="text" id="search-input" oninput="renderCurrentTable()">
        </div>
        <div id="table-container"></div>
        <div id="form-container"></div>
      </div>
    </main>
  </div>
  <footer class="app-footer" id="app-footer"></footer>
</div>

  document.getElementById('auth-login').classList.toggle('active', tab === 'login');

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

async function handleRegister() {
  const companyName = document.getElementById('register-company-name').value.trim();
  const email = document.getElementById('register-email').value.trim();
  const password = document.getElementById('register-password').value;
  const confirm = document.getElementById('register-confirm').value;

  if (!companyName || !email || !password) {
    showMsg('register-msg', currentLang === 'ar' ? 'من فضلك املأ كل الحقول' : 'Please fill all fields', 'error'); return;
  }
  if (password !== confirm) {
    showMsg('register-msg', currentLang === 'ar' ? 'كلمة السر وتأكيدها غير متطابقين' : 'Passwords do not match', 'error'); return;
  }

  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { showMsg('register-msg', 'Error: ' + error.message, 'error'); return; }

  if (!data.session) {
    showMsg('register-msg', currentLang === 'ar'
      ? 'تم إنشاء الحساب. لو مطلوب تأكيد بريد، افتحه ثم سجّل الدخول.'
      : 'Account created. If email confirmation is required, confirm it then sign in.', 'info');
    return;
  }

  const { error: insertErr } = await sb.from('companies').insert({
    id: data.user.id, company_name: companyName
  });
  if (insertErr) {
    showMsg('register-msg', 'Error saving company: ' + insertErr.message, 'error');
    return;
  }

  showMsg('register-msg', currentLang === 'ar' ? 'تم إنشاء الحساب بنجاح! جاري الدخول...' : 'Account created! Logging in...', 'success');
  await afterLogin(data.user, companyName);
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showMsg('login-msg', 'Error: ' + error.message, 'error'); return; }

  const { data: companyRow, error: companyErr } = await sb.from('companies')
    .select('company_name').eq('id', data.user.id).single();

  if (companyErr) {
    showMsg('login-msg', currentLang === 'ar' ? 'تم الدخول لكن مفيش بيانات شركة مرتبطة بالحساب ده' : 'Logged in but no company data linked to this account', 'error');
    return;
  }

  await afterLogin(data.user, companyRow.company_name);
}

async function afterLogin(user, companyName) {
  currentUser = user;
  currentCompanyName = companyName;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('company-name-display').textContent = '🏢 ' + companyName;
  applyLanguage();
  renderNav();
}

async function handleLogout() {
  await sb.auth.signOut();
  currentUser = null;
  currentMatrixKey = null;
  currentRows = [];
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'block';
}

async function checkExistingSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    const { data: companyRow, error } = await sb.from('companies')
      .select('company_name').eq('id', data.session.user.id).single();
    if (!error) {
      await afterLogin(data.session.user, companyRow.company_name);
    }
  } else {
    applyLanguage();
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

<script>
// ============================================================
// القائمة الجانبية
// ============================================================
function renderNav() {
  const nav = document.getElementById('matrix-nav');
  let html = '';
  MATRIX_DATA.groups.forEach(group => {
    html += `<div class="group-title">${escapeHtml(groupName(group))}</div>`;
    const groupMatrices = MATRIX_DATA.matrices.filter(m => m.group === group.key);
    groupMatrices.forEach(m => {
      const active = currentMatrixKey === m.key ? 'active' : '';
      html += `<button class="matrix-btn ${active}" id="nav-${m.key}" onclick="openMatrix('${m.key}')">${escapeHtml(matrixName(m))}</button>`;
    });
  });
  nav.innerHTML = html;
}

function getMatrixDef(key) {
  return MATRIX_DATA.matrices.find(m => m.key === key);
}

async function openMatrix(key) {
  currentMatrixKey = key;
  currentView = 'matrix';
  editingRowId = null;
  document.querySelectorAll('.matrix-btn').forEach(b => b.classList.remove('active'));
  const navBtn = document.getElementById('nav-' + key);
  if (navBtn) navBtn.classList.add('active');

  const def = getMatrixDef(key);
  document.getElementById('current-matrix-title').textContent = matrixName(def);
  document.getElementById('search-box').style.display = 'block';
  document.getElementById('search-input').value = '';
  document.getElementById('search-input').placeholder = t('search_placeholder');
  document.getElementById('print-current-btn').style.display = 'inline-block';
  document.getElementById('print-current-btn').textContent = t('print_btn');
  document.getElementById('msg-area').innerHTML = '';

  await loadRows(key);
  renderCurrentTable();
  renderForm(null);
}

async function fetchRowsForMatrix(key) {
  const { data, error } = await sb.from('matrix_rows')
    .select('*')
    .eq('company_id', currentUser.id)
    .eq('matrix_key', key)
    .order('created_at', { ascending: false });
  if (error) { console.error(error); return []; }
  return data || [];
}

async function loadRows(key) {
  currentRows = await fetchRowsForMatrix(key);
}

// ============================================================
// عرض الجدول
// ============================================================
function renderCurrentTable() {
  const def = getMatrixDef(currentMatrixKey);
  const container = document.getElementById('table-container');
  if (!def) { container.innerHTML = ''; return; }

  const searchTerm = (document.getElementById('search-input').value || '').toLowerCase();
  const filteredRows = currentRows.filter(r => {
    if (!searchTerm) return true;
    return Object.values(r.row_data || {}).some(v => String(v).toLowerCase().includes(searchTerm));
  });

  if (filteredRows.length === 0) {
    container.innerHTML = `<p class="empty-note">${t('empty_note')}</p>`;
    return;
  }

  let html = '<table class="data-table"><thead><tr>';
  def.columns.forEach(col => html += `<th>${escapeHtml(colLabel(col))}</th>`);
  html += `<th>${t('actions_col')}</th></tr></thead><tbody>`;

  filteredRows.forEach(row => {
    html += '<tr>';
    def.columns.forEach(col => {
      html += `<td>${escapeHtml(row.row_data[col.key] || '')}</td>`;
    });
    html += `<td class="actions">
      <button class="btn-small edit" onclick="startEditRow('${row.id}')">${t('edit_action')}</button>
      <button class="btn-small danger" onclick="deleteRow('${row.id}')">${t('delete_action')}</button>
    </td>`;
    html += '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ============================================================
// نموذج الإضافة / التعديل
// ============================================================
function renderForm(existingRow) {
  const def = getMatrixDef(currentMatrixKey);
  const container = document.getElementById('form-container');
  if (!def) { container.innerHTML = ''; return; }

  const data = existingRow ? existingRow.row_data : {};
  editingRowId = existingRow ? existingRow.id : null;

  let html = `<h3 style="font-size:14px;margin-top:20px;">${editingRowId ? t('edit_row_title') : t('add_row_title')}</h3>`;
  html += '<form class="row-form" onsubmit="return false;">';

  def.columns.forEach(col => {
    const val = data[col.key] || '';
    html += `<div><label>${escapeHtml(colLabel(col))}</label>`;
    if (col.type === 'textarea') {
      html += `<textarea id="field-${col.key}">${escapeHtml(val)}</textarea>`;
    } else if (col.type === 'select') {
      html += `<select id="field-${col.key}">`;
      html += `<option value="">${t('select_option')}</option>`;
      col.options.forEach(opt => {
        const optVal = opt.ar; // القيمة المخزنة دايماً بالعربي كمرجع ثابت (key)، والعرض بيتغير باللغة
        html += `<option value="${escapeHtml(optVal)}" ${val === optVal ? 'selected' : ''}>${escapeHtml(optLabel(opt))}</option>`;
      });
      html += `</select>`;
    } else if (col.type === 'number') {
      html += `<input type="number" id="field-${col.key}" value="${escapeHtml(val)}">`;
    } else {
      html += `<input type="text" id="field-${col.key}" value="${escapeHtml(val)}">`;
    }
    html += '</div>';
  });

  html += `<div class="form-actions">
    <button class="primary" onclick="saveRow()">${editingRowId ? t('save_btn') : t('add_btn')}</button>
    ${editingRowId ? `<button class="secondary" onclick="cancelEdit()">${t('cancel_btn')}</button>` : ''}
  </div>`;
  html += '</form>';
  container.innerHTML = html;
}

function startEditRow(rowId) {
  const row = currentRows.find(r => r.id === rowId);
  if (!row) return;
  renderForm(row);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function cancelEdit() {
  renderForm(null);
}

async function saveRow() {
  const def = getMatrixDef(currentMatrixKey);
  const rowData = {};
  def.columns.forEach(col => {
    const el = document.getElementById('field-' + col.key);
    rowData[col.key] = el ? el.value : '';
  });

  if (editingRowId) {
    const { error } = await sb.from('matrix_rows')
      .update({ row_data: rowData, updated_at: new Date().toISOString() })
      .eq('id', editingRowId);
    if (error) { showMsg('msg-area', 'Error: ' + error.message, 'error'); return; }
    showMsg('msg-area', t('row_updated'), 'success');
  } else {
    const { error } = await sb.from('matrix_rows').insert({
      company_id: currentUser.id,
      matrix_key: currentMatrixKey,
      row_data: rowData
    });
    if (error) { showMsg('msg-area', 'Error: ' + error.message, 'error'); return; }
    showMsg('msg-area', t('row_added'), 'success');
  }

  await loadRows(currentMatrixKey);
  renderCurrentTable();
  renderForm(null);
}

async function deleteRow(rowId) {
  if (!confirm(t('delete_confirm'))) return;
  const { error } = await sb.from('matrix_rows').delete().eq('id', rowId);
  if (error) { showMsg('msg-area', 'Error: ' + error.message, 'error'); return; }
  showMsg('msg-area', t('row_deleted'), 'success');
  await loadRows(currentMatrixKey);
  renderCurrentTable();
}
</script>
<script>
// ============================================================
// بناء تقرير قابل للطباعة (لمصفوفة واحدة أو لكل الـ 33)
// ============================================================
function buildReportSectionHtml(def, rows) {
  let headersHtml = '';
  def.columns.forEach(col => headersHtml += `<th>${escapeHtml(colLabel(col))}</th>`);

  let rowsHtml = '';
  if (rows.length === 0) {
    rowsHtml = `<tr><td colspan="${def.columns.length}" style="text-align:center;color:#94a3b8;padding:12px;">${t('report_no_data')}</td></tr>`;
  } else {
    rows.forEach(row => {
      rowsHtml += '<tr>';
      def.columns.forEach(col => {
        rowsHtml += `<td>${escapeHtml(row.row_data[col.key] || '')}</td>`;
      });
      rowsHtml += '</tr>';
    });
  }

  return `
    <div class="report-section">
      <h2>${escapeHtml(matrixName(def))}</h2>
      <table>
        <thead><tr>${headersHtml}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

function buildReportShell(bodyHtml, reportTitle) {
  const dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  const founderName = currentLang === 'ar' ? FOUNDER_NAME_AR : FOUNDER_NAME_EN;
  const now = new Date().toLocaleString(currentLang === 'ar' ? 'ar-EG' : 'en-US');

  return `
    <!DOCTYPE html>
    <html lang="${currentLang}" dir="${dir}">
    <head>
      <meta charset="UTF-8">
      <title>${escapeHtml(reportTitle)}</title>
      <style>
        @page { size: A4 ${dir === 'rtl' ? 'portrait' : 'portrait'}; margin: 12mm; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; color: #0f172a; font-size: 10pt; margin: 0; }
        .report-header {
          display: flex; justify-content: space-between; align-items: center;
          border-bottom: 3px solid #0284c7; padding-bottom: 10px; margin-bottom: 16px;
        }
        .report-header h1 { font-size: 16pt; color: #0f172a; margin: 0 0 4px; }
        .report-header .meta { font-size: 9pt; color: #64748b; }
        .report-section { margin-bottom: 22px; page-break-inside: avoid; }
        .report-section h2 { font-size: 12pt; color: #0284c7; background: #f1f5f9; padding: 6px 10px; border-radius: 4px; border-right: 4px solid #0284c7; }
        table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 8.5pt; }
        th, td { border: 1px solid #cbd5e1; padding: 5px; text-align: ${dir === 'rtl' ? 'right' : 'left'}; }
        th { background: #e2e8f0; }
        .report-footer {
          margin-top: 24px; padding-top: 8px; border-top: 1px solid #e2e8f0;
          text-align: center; font-size: 8pt; color: #94a3b8;
        }
        .print-bar {
          position: fixed; top: 10px; ${dir === 'rtl' ? 'left' : 'right'}: 10px;
          background: #0284c7; color: white; padding: 10px 20px; border: none;
          border-radius: 6px; cursor: pointer; font-size: 13px; z-index: 999;
        }
        @media print { .print-bar { display: none; } }
      </style>
    </head>
    <body>
      <button class="print-bar" onclick="window.print()">🖨️ ${t('print_btn')}</button>
      <div class="report-header">
        <div>
          <h1>${escapeHtml(reportTitle)}</h1>
          <div class="meta">${t('report_prepared_for')}: ${escapeHtml(currentCompanyName)}</div>
        </div>
        <div class="meta">${t('report_generated_on')}: ${now}</div>
      </div>
      ${bodyHtml}
      <div class="report-footer">
        EDAI Governance Hub — ${founderName} | ${t('all_rights')}
      </div>
    </body>
    </html>
  `;
}

// طباعة المصفوفة الحالية بس
function printCurrentMatrix() {
  if (!currentMatrixKey) return;
  const def = getMatrixDef(currentMatrixKey);
  const bodyHtml = buildReportSectionHtml(def, currentRows);
  const fullHtml = buildReportShell(bodyHtml, matrixName(def));
  const win = window.open('', '_blank');
  win.document.write(fullHtml);
  win.document.close();
}

// التقرير الشامل: يجمع كل الـ 33 مصفوفة في تقرير واحد
async function openMasterReport() {
  if (!currentUser) return;
  const btn = document.getElementById('master-report-btn');
  const originalText = btn.textContent;
  btn.textContent = '⏳...';
  btn.disabled = true;

  try {
    let bodyHtml = '';
    for (const group of MATRIX_DATA.groups) {
      const groupMatrices = MATRIX_DATA.matrices.filter(m => m.group === group.key);
      bodyHtml += `<h1 style="font-size:14pt;color:#0f172a;margin-top:26px;border-bottom:2px solid #0f172a;padding-bottom:6px;">${escapeHtml(groupName(group))}</h1>`;
      for (const def of groupMatrices) {
        const rows = await fetchRowsForMatrix(def.key);
        bodyHtml += buildReportSectionHtml(def, rows);
      }
    }
    const fullHtml = buildReportShell(bodyHtml, t('report_title'));
    const win = window.open('', '_blank');
    win.document.write(fullHtml);
    win.document.close();
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}
</script>
<script>
// ============================================================
// صفحة التحليل الذكي بالذكاء الاصطناعي (Gemini API)
// ============================================================
const GEMINI_MODEL = "gemini-2.5-flash"; // لو ظهر خطأ 404 جرّب "gemini-2.0-flash" بدلها
let lastAIReportText = "";

function getSavedAIKey() {
  return localStorage.getItem('edai_gemini_key') || '';
}

function openAIPage() {
  currentView = 'ai';
  currentMatrixKey = null;
  editingRowId = null;
  document.querySelectorAll('.matrix-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('current-matrix-title').textContent = t('ai_page_title');
  document.getElementById('search-box').style.display = 'none';
  document.getElementById('print-current-btn').style.display = 'none';
  document.getElementById('msg-area').innerHTML = '';
  document.getElementById('form-container').innerHTML = '';

  const savedKey = getSavedAIKey();
  let html = `<div class="ai-panel">
    <p style="color:#64748b;font-size:14px;">${t('ai_page_desc')}</p>`;

  if (!savedKey) {
    html += `
      <label style="display:block;font-size:13px;font-weight:bold;margin:10px 0 4px;">${t('ai_key_label')}</label>
      <textarea id="ai-key-input" class="ai-key-input" rows="2" placeholder="AIza..."></textarea>
      <button class="primary" style="margin-top:8px;" onclick="saveAIKey()">${t('ai_key_save')}</button>
    `;
  } else {
    html += `
      <div class="msg info" style="font-size:12px;">
        🔑 ${currentLang === 'ar' ? 'المفتاح محفوظ في متصفحك.' : 'Key is saved in your browser.'}
        <a href="#" onclick="clearAIKey();return false;" style="color:#0284c7;">${currentLang === 'ar' ? 'تغيير المفتاح' : 'Change key'}</a>
      </div>
      <button class="primary" onclick="generateAIReport()">${t('ai_generate_btn')}</button>
    `;
  }

  html += `<div id="ai-status"></div><div id="ai-result"></div></div>`;
  document.getElementById('table-container').innerHTML = html;
}

function saveAIKey() {
  const key = document.getElementById('ai-key-input').value.trim();
  if (!key) return;
  localStorage.setItem('edai_gemini_key', key);
  openAIPage();
}

function clearAIKey() {
  localStorage.removeItem('edai_gemini_key');
  openAIPage();
}

// ============================================================
// تجميع بيانات الـ 33 مصفوفة في نص واحد مختصر لإرساله للـ AI
// ============================================================
async function buildDataSummaryText() {
  let text = '';
  let totalRows = 0;

  for (const group of MATRIX_DATA.groups) {
    const groupMatrices = MATRIX_DATA.matrices.filter(m => m.group === group.key);
    let groupText = `\n## ${groupName(group)}\n`;
    let groupHasData = false;

    for (const def of groupMatrices) {
      const rows = await fetchRowsForMatrix(def.key);
      if (rows.length === 0) continue;
      groupHasData = true;
      totalRows += rows.length;
      groupText += `\n### ${matrixName(def)}\n`;
      rows.forEach((row, idx) => {
        const parts = def.columns.map(col => `${colLabel(col)}: ${row.row_data[col.key] || '-'}`);
        groupText += `${idx + 1}. ${parts.join(' | ')}\n`;
      });
    }
    if (groupHasData) text += groupText;
  }

  return { text, totalRows };
}

// ============================================================
// تحويل نص Markdown بسيط إلى HTML (آمن، بعد تهريب الأحرف)
// ============================================================
function renderMarkdownLite(text) {
  let html = escapeHtml(text);
  html = html.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.*)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  html = html.replace(/^[-*] (.*)$/gm, '• $1');
  html = html.replace(/\n/g, '<br>');
  return html;
}

// ============================================================
// بناء الطلب واستدعاء Gemini API
// ============================================================
function buildAIPrompt(dataSummary) {
  if (currentLang === 'ar') {
    return `أنت مستشار حوكمة مشروعات هندسية خبير (PMO Advisor) بخبرة 16 سنة في التشييد والبنية التحتية.
هحطلك تحت كل البيانات المسجلة فعلياً في منصة حوكمة مشروعات (33 مصفوفة: استراتيجية، حوكمة، موارد بشرية، مالية، جودة ومخاطر، تقنية).

اقرأ البيانات دي كويس، واكتب تقرير إداري مقسم لأربعة أقسام بالضبط بالعناوين دي:

## 📊 الإدارة الوصفية
وصف واقعي ودقيق لموقف المشروع/الشركة الحالي بناءً على البيانات الموجودة فعلياً بس (متخترعش أرقام مش موجودة).

## 🔍 تحليل البيانات
تحليل كمي ونوعي: أنماط متكررة، تركّز المخاطر في فئة معينة، فجوات في البيانات (مصفوفات فاضية أو ناقصة)، أرقام لافتة.

## 🔮 الإدارة التنبؤية
بناءً على الأنماط الحالية، توقعات منطقية لاتجاه الأداء والمخاطر خلال الفترة الجاية لو استمر الوضع كما هو.

## ⚡ الإدارة الاستباقية
توصيات عملية ومحددة (مش عامة) لازم تُتخذ دلوقتي لمنع مشاكل متوقعة، مرتبة حسب الأولوية.

مهم جداً: لو مفيش بيانات كافية في قسم معين، قول كده بوضوح بدل ما تختلق معلومات. اكتب بالعربية الفصحى المهنية.

--- البيانات المسجلة ---
${dataSummary}`;
  } else {
    return `You are a senior project governance consultant (PMO Advisor) with 16 years of experience in construction and infrastructure.
Below is the data actually recorded in a project governance platform (33 matrices: strategy, governance, HR, finance, quality & risk, technology).

Read the data carefully and write a management report divided into exactly these four sections with these exact headings:

## 📊 Descriptive Management
A factual, accurate description of the current project/company status based only on the data actually present (do not invent numbers not present).

## 🔍 Data Analysis
Quantitative and qualitative analysis: recurring patterns, risk concentration in specific categories, data gaps (empty or incomplete matrices), notable figures.

## 🔮 Predictive Management
Based on current patterns, reasonable forecasts for performance and risk trends over the coming period if the current situation continues.

## ⚡ Proactive Management
Specific, actionable (not generic) recommendations that should be taken now to prevent anticipated problems, ordered by priority.

Important: if there isn't enough data for a section, say so clearly instead of fabricating information. Write in professional English.

--- Recorded Data ---
${dataSummary}`;
  }
}

async function generateAIReport() {
  const apiKey = getSavedAIKey();
  if (!apiKey) {
    showMsg('ai-status', t('ai_key_missing'), 'error');
    return;
  }

  document.getElementById('ai-status').innerHTML = `<div class="ai-loading"><div class="spinner"></div> ${t('ai_generating')}</div>`;
  document.getElementById('ai-result').innerHTML = '';

  try {
    const { text: dataSummary, totalRows } = await buildDataSummaryText();

    if (totalRows === 0) {
      document.getElementById('ai-status').innerHTML = `<div class="msg info">${t('ai_no_data_at_all')}</div>`;
      return;
    }

    const prompt = buildAIPrompt(dataSummary);
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      const errMsg = (data.error && data.error.message) ? data.error.message : response.statusText;
      document.getElementById('ai-status').innerHTML = `<div class="msg error">${t('ai_error')}: ${escapeHtml(errMsg)}</div>`;
      return;
    }

    const resultText = data.candidates && data.candidates[0] && data.candidates[0].content
      ? data.candidates[0].content.parts.map(p => p.text).join('\n')
      : '';

    if (!resultText) {
      document.getElementById('ai-status').innerHTML = `<div class="msg error">${t('ai_error')}: empty response</div>`;
      return;
    }

    lastAIReportText = resultText;
    document.getElementById('ai-status').innerHTML = '';
    document.getElementById('ai-result').innerHTML = `
      <div class="ai-report-box">${renderMarkdownLite(resultText)}</div>
      <button class="btn-small print-btn" style="margin-top:12px;" onclick="printAIReport()">${t('print_btn')}</button>
    `;
  } catch (err) {
    document.getElementById('ai-status').innerHTML = `<div class="msg error">${t('ai_error')}: ${escapeHtml(err.message)}</div>`;
  }
}

function printAIReport() {
  if (!lastAIReportText) return;
  const bodyHtml = `<div class="report-section">${renderMarkdownLite(lastAIReportText)}</div>`;
  const fullHtml = buildReportShell(bodyHtml, t('ai_report_title'));
  const win = window.open('', '_blank');
  win.document.write(fullHtml);
  win.document.close();
}

// بدء التطبيق
checkExistingSession();
</script>
