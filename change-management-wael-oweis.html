<meta charset="utf-8">

<title>منظومة إدارة التغيير المؤسسي | Eng. Wael Oweis</title>

<style id="css">
:root{--ink:#1b2b3a;--ink-2:#273d52;--paper:#f2f5f6;--card:#fff;--line:#c7d0d6;--soft:#e6ebee;--muted:#5b6b78;--teal:#0e7c7b;--teal-d:#0a5f5e;--amber:#b9770e;--red:#b23a3a;--green:#2f7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.65;font-size:16px}
button,input,select,textarea{font-family:inherit}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#e8eef2;display:flex;flex-direction:column;padding:22px 0 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 20px 18px;border-bottom:1px solid #ffffff24}
.brand h1{font-size:1.05rem;margin:12px 0 8px;line-height:1.45;font-weight:600}
.byline{font-size:.82rem;color:#a9b8c4}
.byline b{display:block;color:#fff;font-size:1.05rem;font-weight:600;margin-top:1px}
.nav{padding:12px 0;flex:1}
.nav button{display:block;width:100%;text-align:start;background:none;border:0;color:#cfdae2;padding:10px 20px;font-size:.98rem;cursor:pointer;border-inline-start:3px solid transparent}
.nav button:hover{background:#ffffff12}
.nav button.on{background:#ffffff16;color:#fff;font-weight:600;border-inline-start-color:#3ec1bf}
.sidefoot{padding:12px 20px 0;border-top:1px solid #ffffff24;display:grid;gap:8px}
.sidefoot p{font-size:.76rem;color:#a9b8c4;margin:4px 0 0;line-height:1.5}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);padding:7px 14px;border-radius:3px;cursor:pointer;font-size:.95rem}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:2px 10px;font-size:.84rem}
.btn.ghost{background:transparent;color:#e8eef2;border-color:#ffffff55}
.btn.ghost:hover{background:#ffffff18}
:focus-visible{outline:2px solid #2aa7a5;outline-offset:2px}
.main{padding:0 28px 48px;min-width:0}
.tb,.pb{display:grid;grid-template-columns:2fr 1.4fr 1fr 1.2fr;border:1.5px solid var(--ink);background:#fff;margin:22px 0 26px}
.tb>div,.pb>div{padding:7px 12px;border-inline-start:1px solid var(--ink)}
.tb>div:first-child{border-inline-start:0}
.tb small,.pb small{display:block;color:var(--muted);font-size:.76rem;line-height:1.4}
.tb b,.pb b{font-weight:600}
.tb select{border:0;background:transparent;font-weight:600;font-size:1rem;width:100%;color:var(--ink);padding:0}
.pb{display:none}
.pb>.ttl{grid-column:1/-1;border:0;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:#fff;padding:9px 14px}
.pb>.ttl b{font-size:1.05rem}
.pb>div:nth-child(2){border-inline-start:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:1.7rem;margin:0;line-height:1.3}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.lead{color:var(--muted);max-width:72ch;margin:6px 0 20px}
.pf{margin-top:36px;padding-top:10px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);text-align:center}
.panel{background:#fff;border:1px solid var(--line);padding:18px 20px;margin-bottom:18px;border-radius:3px}
.panel h2{font-size:1.1rem;margin:0 0 12px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:3px}
.stat b{display:block;font-size:1.55rem;line-height:1.3}
.stat span{color:var(--muted);font-size:.85rem}
.hint{color:var(--muted);font-size:.85rem}
.addrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:16px;border-radius:3px}
.fld span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px}
.fld.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font-size:.95rem;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
textarea{resize:vertical;line-height:1.55}
input[type=range]{width:100%;accent-color:var(--teal)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal);vertical-align:middle}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);margin-bottom:18px;border-radius:3px}
table{border-collapse:collapse;width:100%}
th{background:var(--ink);color:#fff;text-align:start;padding:8px 10px;font-weight:500;font-size:.88rem;white-space:nowrap}
td{padding:4px 6px;border-top:1px solid var(--soft);vertical-align:middle}
td input,td select{border-color:transparent;background:transparent;min-width:90px}
td input[type=text]{min-width:150px}
td input:hover,td select:hover,td input:focus,td select:focus{border-color:var(--line);background:#fff}
td.nw{white-space:nowrap}
tr.cur td{background:#e5f2f1}
tr.empty td{padding:22px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:1px 10px;border-radius:10px;font-size:.8rem;font-weight:600;color:#fff;white-space:nowrap}
.q{margin-bottom:16px}
.q label{display:flex;justify-content:space-between;gap:12px}
.q output{font-weight:700;min-width:2.6ch;text-align:end}
.result{border:1.5px solid var(--ink);background:#fff;padding:16px 20px;margin-bottom:18px}
.big{font-size:3rem;font-weight:700;line-height:1.1}
.bar{height:10px;background:var(--soft);border-radius:2px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%}
.verdict{margin:8px 0 0;font-weight:500}
.mini{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:4px 12px;align-items:center;margin-bottom:8px;font-size:.9rem}
.mini .bar{grid-column:1/-1;margin:0}
.krow{display:grid;grid-template-columns:34px minmax(0,2fr) minmax(0,2fr);gap:14px;padding:12px 0;border-top:1px solid var(--soft);align-items:start}
.krow:first-of-type{border-top:0}
.kn{width:32px;height:32px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:600}
.krow.done .kn{background:var(--teal);border-color:var(--teal);color:#fff}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.heat{width:auto;margin:6px 0}
.heat th{background:transparent;color:var(--muted);text-align:center;padding:4px 8px;font-weight:600}
.hc{width:58px;height:46px;text-align:center;font-weight:700;border:2px solid #fff!important;padding:0}
.hc.low{background:#cfe8d6}.hc.mod{background:#f4e2a8}.hc.high{background:#f0b98a}.hc.crit{background:#e39088}
.rec{background:#fff;border:1px solid var(--line);padding:12px 16px;margin-bottom:10px;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;border-radius:3px}
.rec .ref{font-weight:600;color:var(--teal-d)}
.rec p{white-space:pre-wrap;margin:6px 0 0}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:14px}
.st{white-space:pre-wrap}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.tplgrid .panel{margin:0}
ul.recs{margin:0;padding-inline-start:20px}
ul.recs li{margin-bottom:6px}
svg text{font-family:inherit}
.toast{position:fixed;inset-inline-start:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto}
 .nav{display:flex;flex-wrap:wrap;padding:8px 12px}
 .nav button{width:auto;border-inline-start:0;border-bottom:3px solid transparent;padding:8px 12px}
 .nav button.on{border-bottom-color:#3ec1bf}
 .main{padding:0 14px 36px}
 .tb,.pb{grid-template-columns:1fr 1fr}
 .cols,.cols.even,.filters{grid-template-columns:1fr}
 .krow{grid-template-columns:34px minmax(0,1fr)}
 .krow>div:last-child{grid-column:1/-1}
 .rec{grid-template-columns:1fr}
}
@page{size:A4;margin:13mm}
@media print{
 body{background:#fff;font-size:12px}
 .side,.tb,.no-print,.toast{display:none!important}
 .app{display:block}.main{padding:0}
 .pb{display:grid!important;margin-top:0}
 .panel,.stat,.rec,.result,tr,.krow{break-inside:avoid}
 .tw{overflow:visible}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

function rdScore(p){var q=p.rd;return Math.round(((q.q1+q.q2+(11-q.q3)+q.q4+q.q5)/50)*1000)/10;}
function rdBand(s){return s>=75?'high':(s>=50?'mid':'low');}
function rdColor(b){return b==='high'?'#2f7d4f':(b==='mid'?'#b9770e':'#a12d2d');}
function kDone(p){return p.kotter.filter(function(k){return k.done;}).length;}
function rBand(s){return s>=15?'crit':(s>=10?'high':(s>=5?'mod':'low'));}
function openRisks(p){return p.risks.filter(function(r){return r.status!=='closed';});}
function archCount(p){return S.archive.filter(function(a){return a.pid===p.id;}).length;}
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function badge(txt,color){return '<span class="badge" style="background:'+color+'">'+esc(txt)+'</span>';}

var dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise(function(res,rej){try{var r=indexedDB.open('wo_change_files',1);r.onupgradeneeded=function(){r.result.createObjectStore('files');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});return dbp;}
function fput(id,blob){return db().then(function(d){return new Promise(function(res,rej){var tx=d.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});});}
function fget(id){return db().then(function(d){return new Promise(function(res,rej){var q=d.transaction('files').objectStore('files').get(id);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});});}
function fdel(id){return db().then(function(d){return new Promise(function(res){var tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=res;tx.onerror=res;});}).catch(function(){});}

function recs(p){
 var r=[],b=rdBand(rdScore(p));
 if(b==='low')r.push(t('rec_low'));else if(b==='mid')r.push(t('rec_mid'));
 var bar=AD.filter(function(k){return p.ad[k]<50;})[0];
 if(bar)r.push(t('ad_'+bar)+': '+t('ad_rec_'+bar));
 var nx=p.kotter.map(function(k){return k.done;}).indexOf(false);
 if(nx>=0)r.push(t('rec_kotter',{step:t('ks'+(nx+1))}));
 if(!p.champions.length)r.push(t('rec_champ0'));
 var hc=openRisks(p).filter(function(x){var b2=rBand(x.p*x.i);return b2==='high'||b2==='crit';}).length;
 if(hc)r.push(t('rec_risk',{n:hc}));
 if(!p.wins.length)r.push(t('rec_wins0'));
 var ct=ctStats(p),pl=plState(p);
 if(!p.comms.length)r.push(t('rec_comms0'));
 if(ct.pct!==null&&ct.pct<60)r.push(t('rec_train',{p:Math.round(ct.pct)}));

  if(fmt==='csv'){
   var csv=[T.cols.map(function(c){return csvCell(t(c));}).join(',')].concat(rows.map(function(r){return r.map(csvCell).join(',');})).join('\r\n');
   download(base+'.csv',new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));toast(t('toast_file'));return;
  }
  body=tTable(T.cols,rows);
 }else body=k==='survey'?bSurvey():(k==='minutes'?bMinutes():bKickoff());
 download(base+'.doc',new Blob(['\ufeff'+tplDoc(title,body)],{type:'application/msword'}));toast(t('toast_file'));
}
function pTpl(){
 var cards=TPLS.map(function(T){
  return '<div class="panel"><h2>'+esc(t('tp_'+T.k))+'</h2><p class="hint" style="margin:0 0 12px">'+esc(t('tp_'+T.k+'_d'))+'</p><div class="actions no-print"><button class="btn primary" data-tpl="'+T.k+'" data-fmt="doc">'+esc(t('tp_word'))+'</button>'+(T.cols?'<button class="btn" data-tpl="'+T.k+'" data-fmt="csv">'+esc(t('tp_csv'))+'</button>':'')+'</div></div>';
 }).join('');
 return lead()+'<label class="chk no-print" style="margin-bottom:16px"><input type="checkbox" data-fill'+(mem.fill?' checked':'')+'> '+esc(t('tp_fill'))+'</label><div class="tplgrid">'+cards+'</div>';
}
var PAGES={registry:pRegistry,readiness:pReadiness,adkar:pAdkar,kotter:pKotter,champions:pChampions,risks:pRisks,raci:pRaci,comms:pComms,pulse:pPulse,roi:pRoi,tpl:pTpl,archive:pArchive,report:pReport};

/* ---------------------------------------------------------
   الهيكل والعرض | Shell & render
--------------------------------------------------------- */
var LOGO='<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" fill="none" stroke="#3ec1bf" stroke-width="2"/><path d="M9 17a8 8 0 0 1 14-5.3M25 17a8 8 0 0 1-14 5.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M24.5 7v5.5H19M9.5 27v-5.5H15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function pbHTML(){
 var p=P();
 return '<div class="ttl"><b>'+esc(t('app_title'))+'</b><span>'+esc(t('byline'))+': <b>'+esc(t('owner'))+'</b></span></div>'+
  '<div><small>'+esc(t('tb_project'))+'</small><b>'+esc(p.name)+'</b></div><div><small>'+esc(t('tb_sup'))+'</small><b>'+esc(t('owner'))+'</b></div><div><small>'+esc(t('tb_date'))+'</small><b>'+today()+'</b></div><div><small>'+esc(t('tb_page'))+'</small><b>'+esc(t('nav_'+page))+'</b></div>';
}
function projOpts(){return S.projects.map(function(p){return '<option value="'+p.id+'"'+(p.id===S.active?' selected':'')+'>'+esc(p.name||'-')+'</option>';}).join('');}
function syncTb(){var s=$('[data-proj]');if(s)s.innerHTML=projOpts();var pb=$('.pb');if(pb)pb.innerHTML=pbHTML();}
function shell(){
 return '<div class="app"><aside class="side no-print"><div class="brand">'+LOGO+'<h1>'+esc(t('app_title'))+'</h1><div class="byline">'+esc(t('byline'))+'<b>'+esc(t('owner'))+'</b></div></div>'+
  '<nav class="nav" aria-label="'+esc(t('nav_label'))+'">'+NAV.map(function(k){return '<button data-nav="'+k+'" class="'+(k===page?'on':'')+'"'+(k===page?' aria-current="page"':'')+'>'+esc(t('nav_'+k))+'</button>';}).join('')+'</nav>'+
  '<div class="sidefoot"><button class="btn ghost" data-act="lang">'+esc(t('lang_btn'))+'</button><button class="btn ghost" data-act="export">'+esc(t('export'))+'</button><button class="btn ghost" data-act="import">'+esc(t('import'))+'</button><p>'+esc(t('note_backup'))+'</p><input type="file" id="imp" accept="application/json,.json" hidden></div></aside>'+
  '<main class="main"><header class="tb no-print"><div><small>'+esc(t('tb_project'))+'</small><select data-proj aria-label="'+esc(t('tb_project'))+'">'+projOpts()+'</select></div><div><small>'+esc(t('tb_sup'))+'</small><b>'+esc(t('owner'))+'</b></div><div><small>'+esc(t('tb_date'))+'</small><b>'+today()+'</b></div><div><small>'+esc(t('tb_page'))+'</small><b>'+esc(t('nav_'+page))+'</b></div></header>'+
  '<section id="sheet"><div class="pb">'+pbHTML()+'</div><div class="pagehead"><h1>'+esc(t('nav_'+page))+'</h1><div class="actions no-print"><button class="btn" data-act="print">'+esc(t('print'))+'</button><button class="btn primary" data-act="savehtml">'+esc(t('save_page'))+'</button></div></div>'+
  '<div id="content"></div><footer class="pf">'+esc(t('footer'))+'</footer></section></main></div><div class="toast" id="toast" role="status"></div>';
}
function renderContent(){$('#content').innerHTML=PAGES[page]();}
function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 document.title=t('app_title')+' | '+I.en.owner;
 $('#root').innerHTML=shell();renderContent();
}
function go(k){page=k;render();window.scrollTo(0,0);}
function toast(m){var e=$('#toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('show');},2600);}

/* ---------------------------------------------------------
   الطباعة والحفظ | Print & save (per page)
--------------------------------------------------------- */
function staticDoc(){
 var src=$('#sheet'),sheet=src.cloneNode(true);
 sheet.querySelector('.pb').innerHTML=pbHTML();
 var a=src.querySelectorAll('input,select,textarea'),b=sheet.querySelectorAll('input,select,textarea');
 for(var i=0;i<a.length;i++){
  var s=a[i],d=b[i],r;
  if(s.type==='checkbox'){r=document.createElement('span');r.textContent=s.checked?'\u2611':'\u2610';}
  else if(s.tagName==='TEXTAREA'){r=document.createElement('div');r.className='st';r.textContent=s.value;}
  else if(s.tagName==='SELECT'){r=document.createElement('span');r.textContent=s.options[s.selectedIndex]?s.options[s.selectedIndex].text:'';}
  else{r=document.createElement('span');r.textContent=s.value;}
  d.parentNode.replaceChild(r,d);
 }
 sheet.querySelectorAll('.no-print').forEach(function(n){n.remove();});
 var css=document.getElementById('css').textContent;
 return '<!DOCTYPE html><html lang="'+S.lang+'" dir="'+(S.lang==='ar'?'rtl':'ltr')+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(t('nav_'+page)+' - '+P().name)+'</title>'+
  '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>'+css+'</style><style>.pb{display:grid!important;margin-top:0}body{background:#fff}.wrap{max-width:1000px;margin:0 auto;padding:24px}</style></head><body><div class="wrap">'+sheet.outerHTML+'</div></body></html>';
}
function doPrint(){
 var html=staticDoc(),old=$('#pf');if(old)old.remove();
 var f=document.createElement('iframe');f.id='pf';f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;width:0;height:0;border:0;inset-inline-end:0;bottom:0';
 document.body.appendChild(f);
 var d=f.contentWindow.document;d.open();d.write(html);d.close();
 setTimeout(function(){try{f.contentWindow.focus();f.contentWindow.print();}catch(e){window.print();}},600);
}
function download(name,blob){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);}
function slug(s){return String(s||'project').trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'')||'project';}
function saveHtml(){download(page+'_'+slug(P().name)+'_'+today()+'.html',new Blob([staticDoc()],{type:'text/html;charset=utf-8'}));toast(t('toast_file'));}
function exportData(){download('change-management-data_'+today()+'.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));toast(t('toast_file'));}
function importData(file){
 if(!file)return;
 var r=new FileReader();
 r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.projects)||!o.projects.length)throw 0;o.archive=o.archive||[];o.seq=o.seq||0;o.lang=o.lang||S.lang;o.projects.forEach(fixP);S=o;if(!S.projects.some(function(p){return p.id===S.active;}))S.active=S.projects[0].id;save();render();toast(t('toast_imp_ok'));}catch(e){toast(t('toast_imp_bad'));}};
 r.readAsText(file);
}

/* ---------------------------------------------------------
   الأحداث | Events
--------------------------------------------------------- */
function cellUpdate(el,commit){
 var d=el.closest('[data-l]');if(!d)return false;
 var cfg=LISTS[d.dataset.l];if(!cfg)return true;
 var f=cfg.fields.filter(function(x){return x.k===d.dataset.f;})[0],row=cfg.arr()[+d.dataset.i];
 if(!row||!f)return true;
 var v=d.value;if(f.num||f.type==='number')v=Number(v)||0;
 row[f.k]=v;save();
 if(cfg.sync)syncTb();
 if(commit){
  if(cfg.rerender&&d.tagName==='SELECT')renderContent();
  else if(cfg.after)cfg.after();
 }
 return true;
}
document.addEventListener('input',function(e){
 var el=e.target;
 if(el.matches('[data-q]')){P().rd[el.dataset.q]=+el.value;$('#o_'+el.dataset.q).textContent=el.value;save();$('#rd-result').innerHTML=rdResult(P());return;}
 if(el.matches('[data-a]')){P().ad[el.dataset.a]=+el.value;$('#oa_'+el.dataset.a).textContent=el.value+'%';save();$('#ad-chart').innerHTML=adChart(P());$('#ad-res').innerHTML=adResult(P());return;}
 if(el.matches('[data-roi]')){var k=el.dataset.roi;P().roi[k]=k==='cur'?el.value:(Number(el.value)||0);save();$('#roi-res').innerHTML=roiRes(P());return;}
 if(el.matches('[data-simmode]')){P().simMode=el.value;save();$('#sim-res').innerHTML=simRes(P());return;}
 if(el.matches('[data-kn]')){P().kotter[+el.dataset.kn].note=el.value;save();return;}
 if(el.matches('[data-summary]')){P().summary=el.value;save();return;}
 if(el.matches('[data-af]')){mem.af[el.dataset.af]=el.value;$('#arch-list').innerHTML=archList();return;}
 cellUpdate(el,true);
});
document.addEventListener('change',function(e){
 var el=e.target;
 if(el.matches('[data-proj]')){S.active=el.value;save();render();return;}
 if(el.matches('[data-fill]')){mem.fill=el.checked;return;}
 if(el.matches('[data-k]')){var k=P().kotter[+el.dataset.k];k.done=el.checked;k.date=el.checked?today():'';save();renderContent();return;}
 if(el.id==='imp'){importData(el.files[0]);el.value='';return;}
});
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.nav){go(b.dataset.nav);return;}
 if(b.dataset.openp){S.active=b.dataset.openp;save();render();return;}
 if(b.dataset.del){
  if(!confirm(t('confirm_del')))return;
  var key=b.dataset.del,i=+b.dataset.i;
  if(key==='projects'){
   if(S.projects.length<2){toast(t('toast_last'));return;}
   var gone=S.projects[i];S.projects.splice(i,1);
   S.archive=S.archive.filter(function(a){if(a.pid===gone.id){if(a.file)fdel(a.id);return false;}return true;});
   if(S.active===gone.id)S.active=S.projects[0].id;
   save();render();return;
  }
  LISTS[key].arr().splice(i,1);save();renderContent();
  return;
 }
 if(b.dataset.delarch){
  if(!confirm(t('confirm_del')))return;
  var id=b.dataset.delarch,rec=S.archive.filter(function(a){return a.id===id;})[0];
  if(rec&&rec.file)fdel(id);
  S.archive=S.archive.filter(function(a){return a.id!==id;});save();renderContent();return;
 }
 if(b.dataset.tpl){tplDownload(b.dataset.tpl,b.dataset.fmt);return;}
 if(b.dataset.dl){
  var rid=b.dataset.dl,r=S.archive.filter(function(a){return a.id===rid;})[0];
  fget(rid).then(function(blob){if(!blob)throw 0;download(r.file.name,blob);}).catch(function(){toast(t('a_nofile2'));});
  return;
 }
 var act=b.dataset.act;
 if(act==='print')doPrint();
 else if(act==='savehtml')saveHtml();
 else if(act==='export')exportData();
 else if(act==='import')$('#imp').click();
 else if(act==='lang'){S.lang=S.lang==='ar'?'en':'ar';save();render();}
 else if(act==='raci-seed'){var pp=P();STD.forEach(function(s,i){pp.raci.push({act:t('sa'+(i+1)),r1:s[0],r2:s[1],r3:s[2],r4:s[3]});});save();renderContent();}
 else if(act==='gen'){P().summary=genSummary(P());save();renderContent();toast(t('toast_sum'));}
});
document.addEventListener('submit',function(e){
 var f=e.target;
 if(f.id==='archForm'){e.preventDefault();addRecord(f);return;}
 if(f.dataset.add){
  e.preventDefault();
  var cfg=LISTS[f.dataset.add],row={};
  cfg.fields.forEach(function(fl){var v=f.elements[fl.k].value;if(fl.num||fl.type==='number')v=Number(v)||0;row[fl.k]=(typeof v==='string')?v.trim():v;});
  if(cfg.key==='projects'){var np=newProject(row);S.projects.push(np);S.active=np.id;}
  else cfg.arr().push(row);
  save();render();toast(t('toast_added'));
 }
});
function addRecord(form){
 var fd=new FormData(form),file=form.elements.file.files[0];
 if(file&&file.size>25*1048576){toast(t('a_big'));return;}
 var rec={id:uid(),pid:P().id,n:++S.seq,type:fd.get('type'),title:String(fd.get('title')).trim(),date:fd.get('date')||today(),author:String(fd.get('author')||'').trim(),notes:String(fd.get('notes')||'').trim(),file:null};
 var done=function(){S.archive.push(rec);save();renderContent();toast(t('toast_added'));};
 if(file){fput(rec.id,file).then(function(){rec.file={name:file.name,size:file.size};done();}).catch(function(){toast(t('a_nofile'));done();});}
 else done();
}

S=load();
render();
})();
</script>
</body>
</html>
