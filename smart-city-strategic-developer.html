<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المطور الاستراتيجي للمدن الذكية · Smart City Strategic Developer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#12262c;--paper:#edf0ef;--panel:#fbfcfb;--line:#cdd7d5;--mute:#5b6f75;--teal:#0d6e6e;--tealD:#0a4f52;--ochre:#c98a2b;--brick:#b23b2a;--moss:#3f7d4e;--sea:#1f5d80;--side:#0f2a30;--sideT:#cfdedb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.6 'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:var(--sideT);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{display:block;font-size:14px;line-height:1.35;color:#fff}
.brand small{display:block;font-size:11.5px;color:#93b0ac;line-height:1.35;margin-top:2px}
.nav{padding:8px 0;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--sideT);text-decoration:none;cursor:pointer;border-inline-start:3px solid transparent;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:rgba(255,255,255,.09);border-inline-start-color:var(--ochre);color:#fff;font-weight:600}
.nav a.sep{margin-top:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.owner{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#93b0ac;line-height:1.5}
.owner b{color:#fff;font-weight:600;display:block}
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:18px;font-weight:600}
.sp{flex:1}
.menu{display:none}
main{padding:20px 24px 60px}
.lede{color:var(--mute);margin:0 0 16px;max-width:90ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.panel>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel h3{margin:0;font-size:14px;font-weight:600;flex:1}
.pb{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--panel);border-top:1px solid var(--line);border-inline-start:1px solid var(--line);margin-bottom:16px}
.kpi{padding:12px 14px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi small{display:block;color:var(--mute);font-size:12px}
.kpi b{display:block;font-size:22px;font-weight:600;line-height:1.35}
.kpi span{font-size:12px;color:var(--mute)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}
.split.rev{grid-template-columns:minmax(280px,1fr) minmax(0,1.7fr)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:#324a51;margin-bottom:4px}
.fld .val{color:var(--teal)}
input[type=range]{width:100%;accent-color:var(--teal)}
.in{width:100%;padding:7px 9px;border:1px solid #b9c7c4;border-radius:5px;background:#fff}
.in:focus,.btn:focus-visible,.nav a:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
textarea.in{min-height:70px;resize:vertical}
.btn{padding:6px 12px;border:1px solid #b3c2bf;background:#fff;border-radius:5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#eef4f3}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--tealD)}
.btn.dng{color:var(--brick);border-color:#dcb1a9}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:0 9px;border-radius:10px;font-size:12px;line-height:20px;background:#e3eae8;color:#2c4148;white-space:nowrap}
.chip.ok{background:#dcefe2;color:#1f5a33}.chip.warn{background:#f6e6c8;color:#7a4c0a}.chip.bad{background:#f5d9d3;color:#8a2717}.chip.info{background:#d9e8f0;color:#174a68}.chip.mute{background:#e6ebea;color:#5b6f75}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;font-weight:600;font-size:12px;color:var(--mute);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid #e3e9e7;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:end}
.tbl .in{padding:4px 6px;min-width:70px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}
.bar{height:6px;background:#dfe7e5;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.bar i.ok{background:var(--moss)}.bar i.warn{background:var(--ochre)}.bar i.bad{background:var(--brick)}.bar i.info{background:var(--teal)}
.note{border-inline-start:3px solid var(--ochre);background:#f6efe2;padding:8px 12px;font-size:12.5px;margin:0 0 14px;border-radius:4px}
.note.info{border-color:var(--sea);background:#e7f0f5}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mute)}
.mapwrap svg{width:100%;height:auto;display:block;direction:ltr;border-radius:4px;background:#e9f0ef}
.sec{stroke:#fbfcfb;stroke-width:3;cursor:pointer}
.sec:hover{filter:brightness(.94)}
.sec.sel{stroke:var(--ochre);stroke-width:4}
.sl{font-size:14px;font-weight:700;fill:#12262c;pointer-events:none;text-anchor:middle}
.sv{font-size:12px;fill:#12262c;pointer-events:none;text-anchor:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-inline-end:5px;vertical-align:-2px}
.tabs{display:inline-flex;border:1px solid #b3c2bf;border-radius:5px;overflow:hidden}
.tabs button{border:0;background:#fff;padding:4px 12px;cursor:pointer;border-inline-start:1px solid #b3c2bf}
.tabs button:first-child{border-inline-start:0}
.tabs button.on{background:var(--teal);color:#fff}
.chart svg{width:100%;height:auto;display:block;direction:ltr}
.chart .ax{fill:#5b6f75;font-size:11px}.chart .gl{stroke:#dfe6e4;stroke-width:1}.chart .ref{stroke:var(--brick);stroke-width:1.2;stroke-dasharray:4 4}
.chart .lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.chart .lg i{display:inline-block;width:14px;height:3px;margin-inline-end:5px;vertical-align:3px;border-radius:2px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.muted{color:var(--mute)}
.small{font-size:12px}
.ov{position:fixed;inset:0;background:rgba(10,25,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:8px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.dlg.wide{max-width:1000px}
.dlg h3{margin:0 0 12px;font-size:16px}
.err{color:var(--brick);font-size:12.5px;margin:6px 0}
.arch{pointer-events:none;user-select:text}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.print-only{display:none}
.arch .print-only{display:block}
.phead{border-bottom:2px solid #12262c;margin-bottom:12px;padding-bottom:6px;font-size:12px;line-height:1.6}
.phead b{font-size:15px}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;inset-block:0;inset-inline-start:0;width:264px;z-index:40;transform:translateX(100%);transition:transform .2s}
 [dir=ltr] aside{transform:translateX(-100%)}
 .nav-open aside{transform:none}
 .menu{display:inline-block}
 .split,.split.rev,.fgrid{grid-template-columns:1fr}
 .g2{grid-template-columns:1fr}
 main,.topbar{padding-inline:14px}
}
@media print{
 aside,.topbar,.no-print,.toast{display:none!important}
 .app{display:block}
 body{background:#fff;font-size:12px}
 .print-only{display:block}
 main{padding:0}
 .panel,.kpis{break-inside:avoid}
 @page{size:A4;margin:12mm}
 body.pm .app{display:none}
 body.pm .ov{position:static;background:none;padding:0;display:block}
 body.pm .dlg{max-width:none;max-height:none;overflow:visible;padding:0}
}
</style>
</head>
<body>
<div class="app" id="app">
 <aside>
  <div class="brand">
   <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="6" fill="#c98a2b"/><path d="M7 26V14h5v12M14 26V8h6v18M22 26V17h5v9" fill="none" stroke="#0f2a30" stroke-width="2" stroke-linejoin="round"/></svg>
   <div><b id="bn"></b><small id="bs"></small></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="owner" id="owner"></div>
 </aside>
 <div>
  <div class="topbar no-print">
   <button class="btn menu" data-act="menu" aria-label="menu">&#9776;</button>
   <h1 id="title"></h1><span class="chip info" id="pchip"></span><span class="sp"></span>
   <button class="btn" data-act="lang" id="langb"></button>
   <button class="btn" data-act="print" id="printb"></button>
   <button class="btn pri" data-act="snap" id="snapb"></button>
  </div>
  <main id="main"></main>
 </div>
</div>
<div id="ov"></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0};
const fmt=(n,d=0)=>N(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pad=n=>String(n).padStart(2,'0');
const isoLocal=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isoU=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const today=()=>isoLocal(new Date());
const toU=s=>{const a=String(s).split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>isoU(toU(s)+n*864e5);
const daysBetween=(a,b)=>Math.round((toU(b)-toU(a))/864e5);
const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(a,k)=>a.reduce((x,o)=>x+N(o[k]),0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seeded=seed=>{let s=seed;return()=>(s=(s*1664525+1013904223)%4294967296)/4294967296};

/* ================= SHA-256 (sync, for the tamper-evident ledger) ================= */
function sha256(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  var mp=Math.pow,mw=mp(2,32),result='',words=[],abl=ascii.length*8,i,j;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,comp={};
  for(var c=2;pc<64;c++){
    if(!comp[c]){
      for(i=0;i<313;i+=c)comp[i]=c;
      hash[pc]=(mp(c,.5)*mw)|0;
      k[pc++]=(mp(c,1/3)*mw)|0;
    }
  }
  hash=hash.slice(0,8);var H0=hash.slice(0);
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((abl/mw)|0);
  words[words.length]=abl;
  hash=H0.slice(0);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),old=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
  return result;
}
function hashText(s){const b=new TextEncoder().encode(s);let a='';for(let i=0;i<b.length;i++)a+=String.fromCharCode(b[i]);return sha256(a)}

/* ================= state ================= */
const KEY='scsd.v1';
let S=null;
function loadState(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.projects&&o.projects.length)return o}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!save.w){save.w=1;toast(L('تعذّر الحفظ المحلي (المساحة ممتلئة). صدّر نسخة JSON.','Local save failed (storage full). Export a JSON copy.'))}}}
const P=()=>S.projects.find(p=>p.id===S.currentId)||S.projects[0];
const L=(a,e)=>(S&&S.lang==='en')?e:a;
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}

/* ================= money ================= */
function money(n,short){
  const f=P().fx,r=f.rates[f.cur]||1,v=N(n)*r,a=Math.abs(v);let s;
  if(short&&a>=1e6)s=fmt(v/1e6,2)+'M';else if(short&&a>=1e3)s=fmt(v/1e3,0)+'K';else s=fmt(v);
  return '<span class="num">'+s+' '+esc(f.cur)+'</span>';
}
const nn=s=>'<span class="num">'+esc(s)+'</span>';
const pct=(v,d=0)=>'<span class="num">'+fmt(v,d)+'%</span>';

/* ================= ui helpers ================= */
const chip=(c,t)=>'<span class="chip '+c+'">'+esc(t)+'</span>';
const panel=(title,body,right)=>'<section class="panel"><header><h3>'+title+'</h3>'+(right||'')+'</header><div class="pb">'+body+'</div></section>';
const kpi=(l,v,s)=>'<div class="kpi"><small>'+l+'</small><b>'+v+'</b><span>'+(s||'&nbsp;')+'</span></div>';
const lvl=p=>p>=90?'bad':p>=75?'warn':'ok';
const bar=(p,c)=>'<div class="bar"><i class="'+(c||lvl(p))+'" style="width:'+clamp(p,0,100)+'%"></i></div>';
const tw=h=>'<div class="tw">'+h+'</div>';
function slider(path,label,min,max,step,unit,val){
  return '<label class="fld"><span>'+label+' <b class="val">'+fmt(val,step<1?1:0)+unit+'</b></span><input type="range" data-bind="'+path+'" data-unit="'+esc(unit)+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></label>';
}
function numIn(path,label,val,w){return '<label class="fld"><span>'+label+'</span><input class="in" inputmode="decimal" data-num="1" data-bind="'+path+'" value="'+esc(val)+'"'+(w?' style="max-width:'+w+'"':'')+'></label>'}
function selIn(path,label,opts,val,num){return '<label class="fld"><span>'+label+'</span><select class="in" data-bind="'+path+'"'+(num?' data-num="1"':'')+'>'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'}

/* ================= charts ================= */
function lineChart(o){
  const w=o.w||640,h=o.h||250,m={l:48,r:14,t:12,b:26},iw=w-m.l-m.r,ih=h-m.t-m.b,labels=o.labels,series=o.series;
  let all=[].concat.apply([],series.map(s=>s.data));if(o.ref!=null)all.push(o.ref);
  let lo=o.yMin!=null?o.yMin:Math.min(0,Math.min.apply(null,all)),hi=o.yMax!=null?o.yMax:(Math.max.apply(null,all)*1.08||1);if(hi<=lo)hi=lo+1;
  const X=i=>m.l+(labels.length<2?iw/2:i*iw/(labels.length-1)),Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  let g='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+='<line x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(m.l-6)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+fmt(v,hi-lo<10?1:0)+'</text>'}
  const st=Math.max(1,Math.ceil(labels.length/12));
  labels.forEach((lb,i)=>{if(i%st===0)g+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle" class="ax">'+esc(lb)+'</text>'});
  if(o.ref!=null)g+='<line x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+Y(o.ref)+'" y2="'+Y(o.ref)+'" class="ref"/>';
  series.forEach(s=>{g+='<polyline points="'+s.data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="6 4"':'')+'/>'});
  return '<div class="chart"><svg viewBox="0 0 '+w+' '+h+'" role="img">'+g+'</svg><div class="lg">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+(o.ref!=null&&o.refLabel?'<span><i style="background:var(--brick)"></i>'+esc(o.refLabel)+'</span>':'')+'</div></div>';
}
function barChart(o){
  const w=o.w||640,h=o.h||230,m={l:56,r:10,t:12,b:26},iw=w-m.l-m.r,ih=h-m.t-m.b,v=o.values,n=v.length;
  const hi=(Math.max.apply(null,v.concat([1]))*1.1),lo=Math.min(0,Math.min.apply(null,v))*1.1,Y=x=>m.t+ih-(x-lo)/(hi-lo)*ih,bw=iw/n*.62;
  let g='';
  for(let i=0;i<=4;i++){const val=lo+(hi-lo)*i/4,y=Y(val);g+='<line x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(m.l-6)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+(o.fy?o.fy(val):fmt(val))+'</text>'}
  v.forEach((x,i)=>{const cx=m.l+iw/n*(i+.5),y0=Y(0),y1=Y(x);g+='<rect x="'+(cx-bw/2)+'" y="'+Math.min(y0,y1)+'" width="'+bw+'" height="'+Math.abs(y1-y0)+'" fill="'+((o.colors&&o.colors[i])||o.color||'#0d6e6e')+'" rx="2"/><text x="'+cx+'" y="'+(h-8)+'" text-anchor="middle" class="ax">'+esc(o.labels[i])+'</text>'});
  return '<div class="chart"><svg viewBox="0 0 '+w+' '+h+'" role="img">'+g+'</svg></div>';
}

/* ================= modal / toast ================= */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function closeModal(){$('#ov').innerHTML='';document.body.classList.remove('pm')}
function openModal(inner,wide){$('#ov').innerHTML='<div class="ov" data-act="ovbg"><div class="dlg'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+inner+'</div></div>'}
function openForm(title,fields,onOk,note){
  const h=fields.map(f=>{
    const id='f_'+f.k,req=f.req?' required':'',v=f.v==null?'':f.v;let inp;
    if(f.t==='select')inp='<select class="in" name="'+f.k+'" id="'+id+'">'+f.o.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
    else if(f.t==='area')inp='<textarea class="in" name="'+f.k+'" id="'+id+'"'+req+'>'+esc(v)+'</textarea>';
    else inp='<input class="in" name="'+f.k+'" id="'+id+'" type="'+(f.t==='date'?'date':'text')+'"'+(f.t==='number'?' inputmode="decimal"':'')+' value="'+esc(v)+'"'+req+'>';
    return '<label class="fld" style="'+(f.full?'grid-column:1/-1':'')+'"><span>'+f.l+'</span>'+inp+'</label>';
  }).join('');
  openModal('<h3>'+title+'</h3>'+(note?'<p class="note info">'+note+'</p>':'')+'<form id="frm"><div class="fgrid">'+h+'</div><div class="err" id="ferr"></div><div class="acts"><button class="btn pri" type="submit">'+L('حفظ','Save')+'</button><button class="btn" type="button" data-act="close">'+L('إلغاء','Cancel')+'</button></div></form>');
  $('#frm').addEventListener('submit',e=>{
    e.preventDefault();const o={};
    fields.forEach(f=>{let v=e.target.elements[f.k].value;if(f.t==='number')v=N(v);if(f.t==='date'&&!v)v=null;o[f.k]=v});
    const r=onOk(o);if(typeof r==='string'){$('#ferr').textContent=r;return}closeModal();
  });
  const first=$('#frm input,#frm select,#frm textarea');if(first)first.focus();
}

function openClaims(p,cid){return p.claims.filter(k=>(!cid||k.contractId===cid)&&k.status!=='SETTLED'&&k.status!=='WITHDRAWN')}
function claimClock(k){
  const nd=k.edition==='custom'?(N(k.nDays)||28):28,dd=k.edition==='1999'?42:k.edition==='2017'?84:(N(k.dDays)||84);
  const nDue=addDays(k.aware,nd),dDue=addDays(k.aware,dd),t=today();
  const r={nDue,dDue,nd,dd,status:'',rem:0,barred:false,closed:false};
  if(k.status==='SETTLED'||k.status==='WITHDRAWN'){r.status='CLOSED';r.closed=true;return r}
  if(k.notice){
    if(k.notice>nDue){r.status='BARRED_NOTICE';r.barred=true;r.rem=-daysBetween(nDue,k.notice)}
    else if(k.detailed){if(k.detailed>dDue){r.status='BARRED_DETAIL';r.barred=true;r.rem=-daysBetween(dDue,k.detailed)}else r.status='SUBMITTED'}
    else{r.rem=daysBetween(t,dDue);if(r.rem<0){r.status='BARRED_DETAIL';r.barred=true}else r.status=r.rem<=14?'CRITICAL_DETAIL':'NOTICE_OK'}
  }else{r.rem=daysBetween(t,nDue);if(r.rem<0){r.status='BARRED_NOTICE';r.barred=true}else r.status=r.rem<=7?'CRITICAL_NOTICE':'NOTICE_DUE'}
  return r;
}

  let s=0;s+=c.spi<.9?2:c.spi<.95?1:0;s+=c.cpi<.9?2:c.cpi<.95?1:0;

function twinCalc(){
  const p=P(),o=p.sim.twin,secs=o.sector==='ALL'?p.sectors:p.sectors.filter(s=>s.code===o.sector);
  const g=sum(secs,'gfa')||1,pop=sum(secs,'pop')||1;
  const occ=secs.reduce((a,s)=>a+s.occ*s.gfa,0)/g,vc=secs.reduce((a,s)=>a+s.vc*s.pop,0)/pop;
  const U=[['power',L('الكهرباء (MW)','Power (MW)'),sum(secs,'peakP'),sum(secs,'capP'),'#c98a2b'],['cooling',L('التبريد (MW حراري)','Cooling (MWth)'),sum(secs,'peakC'),sum(secs,'capC'),'#1f5d80'],['water',L('المياه (م.م³/يوم)','Water (ML/d)'),sum(secs,'demW'),sum(secs,'capW'),'#3f7d4e']];
  const sc=y=>(1+o.dens/100)*(o.occT/Math.max(occ,1))*Math.pow(1+o.g/100,y);
  const years=[];for(let y=0;y<=o.H;y++)years.push(y);
  const rows=U.map(u=>{const ser=years.map(y=>u[2]*sc(y)/Math.max(u[3],1e-9)*100);const ex=ser.findIndex(v=>v>=100);
    return {key:u[0],name:u[1],peak:u[2],cap:u[3],color:u[4],now:u[2]/Math.max(u[3],1e-9)*100,ser,exceed:ex,endLoad:u[2]*sc(o.H),gap:u[2]*sc(o.H)-u[3]}});
  const vcs=years.map(y=>vc*Math.pow(sc(y),.8)),delay=vcs.map(v=>15*.15*Math.pow(v,4));
  return {secs,occ,vc,years,rows,vcs,delay,vcEx:vcs.findIndex(v=>v>=1)};
}

function alertsList(p){

  cl.filter(x=>/^CRITICAL/.test(x.c.status)).forEach(x=>A.push(['warn',L('مهلة قريبة: ','Deadline near: ')+x.k.code+' · '+L('متبقٍ ','left ')+x.c.rem+L(' يوماً',' days'),'claims']));
  p.contracts.forEach(c=>{if(c.spi<.9||c.cpi<.9)A.push(['warn',c.code+' · SPI '+c.spi.toFixed(2)+' / CPI '+c.cpi.toFixed(2),'contracts'])});
  const pend=p.cos.filter(o=>o.status==='PENDING');if(pend.length)A.push(['info',L(pend.length+' أوامر تغييرية بانتظار الاعتماد',pend.length+' change order(s) awaiting approval'),'changes']);

  const off=p.devices.filter(d=>d.status==='OFFLINE').length;if(off)A.push(['warn',L(off+' حساسات غير متصلة',off+' sensor(s) offline'),'resilience']);

}

PAGES.esg={ico:'esg',t:()=>L('الاستدامة والكربون','Sustainability & carbon'),d:()=>L('مؤشرات الاستدامة لكل قطاع، مسار الحياد الكربوني، وتقدير الاعتمادات الكربونية وأهلية التمويل الأخضر.','Sector sustainability metrics, net-zero pathway, carbon-credit estimate and green-finance screening.'),
 r(){const o=P().sim.esg;
  return this.table()+'<div class="split rev"><div>'+panel(L('الافتراضات','Assumptions'),numIn('sim.esg.target',L('سنة الحياد الكربوني','Net-zero target year'),o.target)+numIn('sim.esg.price',L('سعر الطن $/tCO₂e','Price $/tCO₂e'),o.price)+numIn('sim.esg.elig',L('حصة الاعتمادات القابلة للتوثيق %','Verifiable share of avoided emissions %'),o.elig))+'</div><div id="out">'+this.out()+'</div></div>'},
 u(){$('#out').innerHTML=this.out()},
 table(){const p=P(),g=sum(p.sectors,'gfa');
  const rows=p.sectors.map(s=>'<tr><td><b>'+s.code+'</b> '+esc(nm(s))+'</td><td class="n">'+fmt(s.co2)+' <span class="muted small">/ '+fmt(s.baseCo2)+'</span></td><td class="n">'+fmt((1-s.co2/s.baseCo2)*100,1)+'%</td><td class="n">'+fmt(s.renew)+'%</td><td>'+fmt(s.wRec)+'%'+bar(s.wRec,'info')+'</td><td>'+fmt(s.waste)+'%'+bar(s.waste,'info')+'</td><td class="n"><b>'+fmt(esgScore(s),1)+'</b></td></tr>').join('');
  const w=k=>p.sectors.reduce((a,s)=>a+s[k]*s.gfa,0)/g;
  const tot='<tr><td><b>'+L('الإجمالي / المتوسط الموزون','Total / weighted average')+'</b></td><td class="n"><b>'+fmt(sum(p.sectors,'co2'))+'</b></td><td class="n"><b>'+fmt((1-sum(p.sectors,'co2')/sum(p.sectors,'baseCo2'))*100,1)+'%</b></td><td class="n"><b>'+fmt(w('renew'),1)+'%</b></td><td><b>'+fmt(w('wRec'),1)+'%</b></td><td><b>'+fmt(w('waste'),1)+'%</b></td><td class="n"><b>'+fmt(p.sectors.reduce((a,s)=>a+esgScore(s)*s.gfa,0)/g,1)+'</b></td></tr>';
  return panel(L('مؤشرات القطاعات','Sector metrics'),tw('<table class="tbl"><thead><tr><th>'+L('القطاع','Sector')+'</th><th class="n">'+L('الانبعاثات kt/سنة (خط الأساس)','Emissions kt/yr (baseline)')+'</th><th class="n">'+L('الخفض','Reduction')+'</th><th class="n">'+L('طاقة متجددة','Renewables')+'</th><th>'+L('إعادة استخدام المياه (TSE)','Water reuse (TSE)')+'</th><th>'+L('تحويل النفايات عن المدافن','Landfill diversion')+'</th><th class="n">'+L('المؤشر المركّب','Composite')+'</th></tr></thead><tbody>'+rows+tot+'</tbody></table>')+'<p class="small muted">'+L('المؤشر المركّب: 30% طاقة متجددة (سقف 50%) + 25% إعادة استخدام المياه + 20% تحويل النفايات + 25% خفض الكربون (سقف 40%). مقياس داخلي استرشادي، وليس نتيجة تقييم رسمي وفق ISO 37120/37122.','Composite = 30% renewables (cap 50%) + 25% water reuse + 20% waste diversion + 25% carbon reduction (cap 40%). An internal indicative measure, not an official ISO 37120/37122 assessment.')+'</p>');},
 out(){const p=P(),o=p.sim.esg,now=sum(p.sectors,'co2'),base=sum(p.sectors,'baseCo2'),y0=new Date().getFullYear(),ty=Math.max(o.target,y0+2),yrs=[];
  for(let y=y0;y<=ty;y++)yrs.push(y);
  const path=yrs.map(y=>now*(1-(y-y0)/(ty-y0))),bau=yrs.map(()=>base),cut=now/(ty-y0);
  const ch=lineChart({labels:yrs.map(String),series:[{name:L('المسار المطلوب للحياد','Required net-zero path'),color:'#0d6e6e',data:path},{name:L('سيناريو الاستمرار','Business as usual'),color:'#b23b2a',data:bau,dash:1}],yMin:0});
  const av=base-now,cr=av*1000*o.elig/100,val=cr*o.price,g=sum(p.sectors,'gfa'),w=k=>p.sectors.reduce((a,s)=>a+s[k]*s.gfa,0)/g,red=(1-now/base)*100;
  const crit=[[L('طاقة متجددة ≥ 20%','Renewables ≥ 20%'),w('renew'),20],[L('إعادة استخدام المياه ≥ 50%','Water reuse ≥ 50%'),w('wRec'),50],[L('تحويل النفايات ≥ 50%','Waste diversion ≥ 50%'),w('waste'),50],[L('خفض الكربون ≥ 25%','Carbon reduction ≥ 25%'),red,25]];
  const chk=crit.map(c=>'<div class="kv"><span>'+c[0]+'</span><span>'+fmt(c[1],1)+'% '+chip(c[1]>=c[2]?'ok':'bad',c[1]>=c[2]?L('مستوفى','Met'):L('غير مستوفى','Not met'))+'</span></div>').join('');
  return panel(L('مسار الحياد الكربوني','Net-zero pathway'),ch+'<p class="small muted">'+L('الخفض الخطي المطلوب: ','Required linear cut: ')+fmt(cut,1)+' kt/'+L('سنة','yr')+' ('+fmt(cut/now*100,1)+'% '+L('من المستوى الحالي','of today')+').</p>')+
   panel(L('الاعتمادات الكربونية (تقدير)','Carbon credits (estimate)'),'<div class="kv"><span>'+L('انبعاثات متجنَّبة','Avoided emissions')+'</span><span>'+fmt(av)+' kt/'+L('سنة','yr')+'</span></div><div class="kv"><span>'+L('اعتمادات قابلة للتوثيق','Verifiable credits')+'</span><span>'+fmt(cr)+' tCO₂e</span></div><div class="kv"><span>'+L('القيمة السنوية المقدّرة','Estimated annual value')+'</span><span>'+money(val,1)+'</span></div><p class="small muted">'+L('لا تُعدّ اعتمادات قابلة للتداول إلا بعد التحقق من طرف ثالث وفق معيار معتمد.','Credits are only tradable after third-party verification under a recognised standard.')+'</p>')+
   panel(L('فحص أهلية التمويل الأخضر (داخلي)','Green-finance screening (internal)'),chk+'<p class="small muted">'+L('معايير داخلية للفرز الأولي وليست تصنيفاً رسمياً؛ يلزم مراجعة رأي طرف ثانٍ قبل أي إصدار.','Internal first-pass criteria, not an official taxonomy; a second-party opinion is required before any issuance.')+'</p>')}};

  const dev=p.developers.map(d=>{const cs=p.contracts.filter(c=>c.devId===d.id);return '<tr><td>'+esc(nm(d))+'</td><td>'+esc(d.cr)+'</td><td class="n">'+d.kpi+'</td><td class="n">'+cs.length+'</td></tr>'}).join('')||'<tr><td colspan="4" class="muted">—</td></tr>';
  return kp+panel(L('سجل العقود','Contract register'),tw('<table class="tbl"><thead><tr><th>'+L('العقد','Contract')+'</th><th>'+L('المطور','Developer')+'</th><th>'+L('القطاع','Sector')+'</th><th class="n">'+L('الأصلية','Original')+'</th><th class="n">'+L('المعدّلة','Revised')+'</th><th class="n">SPI</th><th class="n">CPI</th><th>'+L('الإنجاز المعدّل','Revised end')+'</th><th>'+L('مخاطر النزاع','Dispute risk')+'</th><th>'+L('الحالة','Status')+'</th><th class="no-print"></th></tr></thead><tbody>'+rows+'</tbody></table>'),'<div class="no-print acts" style="margin:0"><button class="btn pri sm" data-act="addContract">'+L('عقد جديد','New contract')+'</button></div>')+
   '<p class="small muted">'+L('قاعدة التقييم: SPI أو CPI أقل من 0.90 (نقطتان) أو أقل من 0.95 (نقطة)؛ المطالبات المفتوحة > 5% من العقد (نقطتان) أو > 2% (نقطة)؛ نمو القيمة بالأوامر التغييرية > 10% (نقطتان) أو > 5% (نقطة)؛ مطالبة معرّضة للسقوط (نقطة). 0–1 منخفض، 2–3 متوسط، 4–5 مرتفع، 6+ حرج.','Rules: SPI or CPI below 0.90 (2 pts) or 0.95 (1 pt); open claims > 5% of contract (2) or > 2% (1); change-order growth > 10% (2) or > 5% (1); any time-barred claim (1). 0–1 low, 2–3 medium, 4–5 high, 6+ critical.')+'</p>'+
   panel(L('المطورون والمقاولون','Developers & contractors'),tw('<table class="tbl"><thead><tr><th>'+L('الشركة','Company')+'</th><th>'+L('السجل التجاري','Registration')+'</th><th class="n">'+L('تقييم الأداء','KPI rating')+'</th><th class="n">'+L('العقود','Contracts')+'</th></tr></thead><tbody>'+dev+'</tbody></table>'),'<div class="no-print acts" style="margin:0"><button class="btn sm" data-act="addDev">'+L('إضافة شركة','Add company')+'</button></div>');

   panel(L('صافي الدخل التشغيلي السنوي (تقدير)','Annual net operating income (estimate)'),barChart({labels:lab,values:c.rows.map(r=>r.noi*(P().fx.rates[P().fx.cur]||1)),fy:v=>fmt(v/1e9,1)+'B',color:'#1f5d80'})+'<p class="small muted">'+L('المبالغ بعملة العرض (مليار).','Amounts in display currency (billions).')+'</p>')+

/* ---------- Resilience ---------- */
function pip(x,y,pts){let ins=false;const q=pts.split(' ').map(s=>s.split(',').map(Number));for(let i=0,j=q.length-1;i<q.length;j=i++){if(((q[i][1]>y)!==(q[j][1]>y))&&(x<(q[j][0]-q[i][0])*(y-q[i][1])/(q[j][1]-q[i][1])+q[i][0]))ins=!ins}return ins}
PAGES.resilience={ico:'resilience',t:()=>L('الصمود والطوارئ','Resilience & emergency'),d:()=>L('اختبر سيناريوهات الأزمات وأثر إجراءات التخفيف على الخدمات الأساسية، ثم حدّد نطاق حادث على الخريطة لمعرفة الحساسات والقطاعات المتأثرة.','Test crisis scenarios and the effect of mitigations on essential services, then place an incident on the map to see affected sensors and sectors.'),

  return '<div class="split rev"><div>'+panel(L('المدخلات','Inputs'),ctl)+'</div><div id="out">'+this.out()+'</div></div>'},

  const dist=d=>Math.hypot(d.x-o.x,d.y-o.y)*8,dv=p.devices.map(d=>Object.assign({dist:dist(d)},d)).filter(d=>d.dist<=o.rad).sort((a,b)=>a.dist-b.dist);

   panel(L('توافر الخدمات أثناء السيناريو','Service availability during the scenario'),tw('<table class="tbl"><thead><tr><th>'+L('الخدمة','Service')+'</th><th>'+L('بدون تخفيف','No mitigation')+'</th><th>'+L('مع التخفيف','With mitigation')+'</th></tr></thead><tbody>'+rows+'</tbody></table>')+'<p class="small muted">'+L('درجات التأثر افتراضات هندسية استرشادية لكل سيناريو، تُستبدل بنتائج دراسات المخاطر الخاصة بالمشروع.','Impact levels are indicative engineering assumptions per scenario; replace with results from project-specific risk studies.')+'</p>')+

 r(){const p=P(),sn=S.archive.filter(a=>a.pid===p.id);
  const sr=sn.map(a=>'<tr><td>'+nn(a.ts.slice(0,16).replace('T',' '))+'</td><td>'+esc(a.title)+'</td><td class="no-print"><div class="acts" style="margin:0"><button class="btn sm pri" data-act="viewSnap" data-id="'+a.id+'">'+L('عرض','View')+'</button><button class="btn sm dng" data-act="delSnap" data-id="'+a.id+'">'+L('حذف','Delete')+'</button></div></td></tr>').join('')||'<tr><td colspan="3" class="muted">'+L('لا لقطات بعد. استخدم زر «حفظ في الأرشيف» في أي صفحة.','No snapshots yet. Use “Save to archive” on any page.')+'</td></tr>';
  const ar=p.audit.slice(0,80).map(a=>'<tr><td>'+nn(a.ts.slice(0,16).replace('T',' '))+'</td><td>'+esc(a.table)+'</td><td>'+chip(a.op==='INSERT'?'ok':'info',a.op)+'</td><td>'+esc(a.by)+'</td><td class="small">'+Object.keys(a.diff).slice(0,4).map(k=>'<div><b>'+esc(k)+'</b>: '+esc(a.diff[k].old==null?'∅':a.diff[k].old)+' → '+esc(a.diff[k].new==null?'∅':a.diff[k].new)+'</div>').join('')+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">'+L('لا تغييرات مسجّلة بعد.','No changes recorded yet.')+'</td></tr>';
  return panel(L('لقطات الصفحات','Page snapshots')+' <span class="muted small">— '+esc(p.name)+'</span>',tw('<table class="tbl"><thead><tr><th>'+L('الوقت','Time')+'</th><th>'+L('الصفحة','Page')+'</th><th class="no-print"></th></tr></thead><tbody>'+sr+'</tbody></table>'),'<div class="no-print acts" style="margin:0"><button class="btn sm" data-act="exportAll">'+L('تصدير كل البيانات JSON','Export all data JSON')+'</button></div>')+
   panel(L('سجل التدقيق (آخر 80)','Audit trail (latest 80)'),tw('<table class="tbl"><thead><tr><th>'+L('الوقت','Time')+'</th><th>'+L('الجدول','Table')+'</th><th>'+L('العملية','Operation')+'</th><th>'+L('المستخدم','User')+'</th><th>'+L('الحقول المتغيّرة','Changed fields')+'</th></tr></thead><tbody>'+ar+'</tbody></table>'))}};
ACT.viewSnap=el=>{const a=S.archive.find(x=>x.id===el.dataset.id);document.body.classList.add('pm');
  openModal('<div class="acts no-print" style="margin:0 0 10px"><button class="btn pri sm" data-act="print">'+L('طباعة','Print')+'</button><button class="btn sm" data-act="close">'+L('إغلاق','Close')+'</button></div><div class="arch" dir="'+(a.lang==='ar'?'rtl':'ltr')+'">'+a.html+'</div>',true)};
ACT.delSnap=el=>{S.archive=S.archive.filter(x=>x.id!==el.dataset.id);save();render()};
ACT.exportAll=()=>download('smart-city-all-data-'+today()+'.json',JSON.stringify({projects:S.projects,archive:S.archive.map(a=>({id:a.id,ts:a.ts,pid:a.pid,pname:a.pname,title:a.title}))},null,2));

/* ---------- shell actions ---------- */
ACT.go=el=>{S.page=el.dataset.id;save();render();window.scrollTo(0,0);document.body.classList.remove('nav-open')};
ACT.menu=()=>document.body.classList.toggle('nav-open');
ACT.lang=()=>{S.lang=S.lang==='ar'?'en':'ar';save();applyLang();render()};
ACT.print=()=>{if($('#ov').innerHTML)document.body.classList.add('pm');window.print()};
ACT.close=()=>closeModal();
ACT.ovbg=(el,e)=>{if(e.target===el)closeModal()};
ACT.selSec=el=>{const p=P();p.sel=el.dataset.id;save();$$('.sec').forEach(x=>x.classList.toggle('sel',x.dataset.id===p.sel));const d=$('#secd');if(d)d.innerHTML=PAGES.overview.det()};
ACT.mapMode=el=>{P().mapMode=el.dataset.id;save();render()};
ACT.editSec=el=>{const p=P(),s=p.sectors.find(x=>x.code===el.dataset.id);
  const F=[['occ','الإشغال %','Occupancy %'],['target','المستهدف %','Target %'],['pop','السكان','Population'],['gfa','المساحة المبنية m²','Built area m²'],['peakP','ذروة الكهرباء MW','Power peak MW'],['capP','سعة الكهرباء MW','Power capacity MW'],['peakC','ذروة التبريد MW','Cooling peak MW'],['capC','سعة التبريد MW','Cooling capacity MW'],['demW','طلب المياه ML/d','Water demand ML/d'],['capW','سعة المياه ML/d','Water capacity ML/d'],['vc','نسبة v/c للطرق','Road v/c'],['co2','الانبعاثات kt/سنة','Emissions kt/yr'],['baseCo2','خط الأساس kt/سنة','Baseline kt/yr'],['renew','طاقة متجددة %','Renewables %'],['wRec','إعادة استخدام المياه %','Water reuse %'],['waste','تحويل النفايات %','Waste diversion %'],['utilPerM2','استهلاك كهرباء kWh/m²/شهر','Electricity kWh/m²/month'],['designPerM2','الاستهلاك التصميمي kWh/m²/شهر','Design kWh/m²/month']];
  openForm(s.code+' · '+nm(s),[{k:'phase',l:L('المرحلة','Phase'),t:'select',o:Object.keys(PHASES).map(k=>[k,L(PHASES[k][0],PHASES[k][1])]),v:s.phase,full:1}].concat(F.map(f=>({k:f[0],l:L(f[1],f[2]),t:'number',v:s[f[0]]}))),o=>{
    for(const f of F)if(o[f[0]]<0)return L('لا تقبل القيم السالبة.','Negative values are not allowed.');
    if(o.gfa<=0||o.baseCo2<=0||o.designPerM2<=0||o.capP<=0||o.capC<=0||o.capW<=0)return L('المساحة وخط الأساس والسعات والاستهلاك التصميمي يجب أن تكون موجبة.','Area, baseline, capacities and design consumption must be positive.');
    const b=Object.assign({},s);Object.assign(s,o);audit('sectors','UPDATE',s.code,b,s);save();render()})};
ACT.snap=()=>{const pg=PAGES[S.page],d=document.createElement('div');d.innerHTML=$('#main').innerHTML;$$('.no-print',d).forEach(n=>n.remove());
  S.archive.unshift({id:uid(),ts:new Date().toISOString(),pid:P().id,pname:P().name,page:S.page,title:pg.t(),lang:S.lang,html:d.innerHTML});if(S.archive.length>40)S.archive.length=40;save();toast(L('حُفظت لقطة الصفحة في الأرشيف','Page snapshot saved to archive'));if(S.page==='archive')render()};

/* ================= chrome, events, boot ================= */
const NAV=['overview','twin','cooling','esg','contracts','changes','claims','ledger','finance','resilience','projects','archive'];
function applyLang(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';updateChrome()}
function updateChrome(){
  const p=P();document.title=L('المطور الاستراتيجي للمدن الذكية','Smart City Strategic Developer')+' · '+p.name;
  $('#bn').textContent=L('المطور الاستراتيجي للمدن الذكية','Smart City Strategic Developer');$('#bs').textContent=L('منظومة الحوكمة والتنبؤ','Governance & foresight engine');
  $('#owner').innerHTML='<b>'+esc(p.owner)+'</b>'+L('صاحب التطبيق','Application owner');
  $('#pchip').textContent=p.name;$('#langb').textContent=S.lang==='ar'?'English':'عربي';$('#printb').textContent=L('طباعة / PDF','Print / PDF');$('#snapb').textContent=L('حفظ في الأرشيف','Save to archive');
  $('#nav').innerHTML=NAV.map(k=>'<a href="#" data-act="go" data-id="'+k+'" data-p="'+k+'" class="'+(S.page===k?'on':'')+(k==='contracts'||k==='projects'?' sep':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICO[PAGES[k].ico]+'</svg>'+esc(PAGES[k].t())+'</a>').join('');
}
function printHead(){const p=P();return '<div class="print-only phead"><b>'+esc(p.owner)+'</b> — '+L('المطور الاستراتيجي للمدن الذكية','Smart City Strategic Developer')+'<br>'+esc(p.name)+' · '+esc(p.city)+' · '+esc(PAGES[S.page].t())+' · '+today()+'</div>'}
function render(){if(!PAGES[S.page])S.page='overview';const pg=PAGES[S.page];$('#title').textContent=pg.t();$('#main').innerHTML=printHead()+'<p class="lede">'+pg.d()+'</p>'+pg.r();$$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===S.page))}

document.addEventListener('click',e=>{
  const pk=e.target.closest('svg[data-pick]');
  if(pk){const r=pk.getBoundingClientRect(),o=P().sim.res;o.x=Math.round((e.clientX-r.left)/r.width*640);o.y=Math.round((e.clientY-r.top)/r.height*420);save();PAGES.resilience.u();return}
  const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){if(a.tagName==='A')e.preventDefault();f(a,e)}
});
document.addEventListener('input',e=>{
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  let v;if(el.type==='checkbox')v=el.checked;else if(el.type==='range'||el.dataset.num)v=N(el.value);else v=el.value;
  const root=b[0]==='@'?S:P(),path=b[0]==='@'?b.slice(1):b;setPath(root,path,v);save();
  if(el.type==='range'){const vl=el.closest('label').querySelector('.val');if(vl)vl.textContent=fmt(v,N(el.step)<1?1:0)+(el.dataset.unit||'')}
  if(b==='name'||b==='city'||b==='owner')updateChrome();
  const pg=PAGES[S.page];if(pg.u)pg.u();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('afterprint',()=>{document.body.classList.remove('pm')});

S=loadState();
if(!S){S={v:1,lang:'ar',role:'PROJECT_MANAGER',user:'',page:'overview',currentId:'',projects:[],archive:[]};const p0=newProject(L('المدينة الذكية – المرحلة الأولى','Smart City – Phase 1'),'demo');S.projects.push(p0);S.currentId=p0.id;save()}
applyLang();render();
</script>
