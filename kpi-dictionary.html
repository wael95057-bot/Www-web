<style>

[data-theme="dark"]{

[data-theme="dark"] .metric{background:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:linear-gradient(180deg,var(--primary),#111d4e);color:#fff;padding:18px;flex-shrink:0}
.sidebar h2{font-size:16px;margin:0 0 4px}
.sidebar .sub{font-size:12px;opacity:.8;margin-bottom:18px}
.nav-btn{display:block;width:100%;text-align:inherit;background:rgba(255,255,255,.06);border:none;color:#fff;
  padding:10px 12px;margin-bottom:6px;border-radius:8px;cursor:pointer;font-size:13.5px}
.nav-btn.active{background:var(--primary2)}
.nav-btn:hover{background:rgba(255,255,255,.18)}
.main{flex:1;padding:22px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:20px;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button.btn{background:var(--primary2);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
button.btn.secondary{background:#e2e8f0;color:#1e293b}
button.btn.danger{background:var(--red);color:#fff}
button.btn:hover{opacity:.9}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){
  .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0;z-index:500;width:100%;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto}
  [dir="ltr"] .sidebar{transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .mobile-menu-btn{display:inline-flex !important}
  .sidebar-close-btn{display:block !important}
}
.mobile-menu-btn{display:none}
.sidebar-close-btn{display:none;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 14px;margin-bottom:14px;cursor:pointer;font-size:14px;width:100%;text-align:center}
.metric{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px}
.metric .v{font-size:24px;font-weight:700}
.metric .l{font-size:12px;color:var(--muted)}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:#fff;color:var(--text)}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
th{background:#f8fafc;color:var(--muted);font-weight:600}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
.badge.ideal{background:var(--greenBg);color:var(--green)}
.badge.warning{background:var(--yellowBg);color:var(--yellow)}
.badge.danger{background:var(--redBg);color:var(--red)}
.report{border-radius:10px;padding:16px;margin-top:14px;border:1px solid var(--border)}
.report.ideal{background:var(--greenBg)}
.report.warning{background:var(--yellowBg)}
.report.danger{background:var(--redBg)}
.report h4{margin:10px 0 4px;font-size:13.5px}
.report p{margin:2px 0;font-size:13.5px;line-height:1.6}
.heat-cell{width:26px;height:26px;border-radius:5px;display:inline-block;margin:2px}
.small{font-size:12px;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;padding-top:14px;border-top:1px solid var(--border)}
.kpi-list{max-height:420px;overflow:auto}
.kpi-row{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--border);cursor:pointer}
.kpi-row:hover{background:#f8fafc}
@media print{
  .sidebar,.tools,.no-print{display:none !important}
  .main{padding:0}
  body{background:#fff}

[dir="ltr"] table{text-align:left}
[dir="ltr"] th,[dir="ltr"] td{text-align:left}

.warroom-card{background:#2a0a0a;border:1px solid #7f1d1d;color:#fecaca;border-radius:12px;padding:16px;margin-bottom:14px}

.slider-val{min-width:70px;text-align:center;font-weight:700;background:#f1f5f9;border-radius:6px;padding:2px 6px}
.trend-arrow{font-weight:700}

/* ===================== Global Safety Net ===================== */
/* Ensures the app NEVER shows a silent blank page — any uncaught error becomes a visible, readable message. */
function showFatalError(msg){
  try{
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:99999;padding:24px;font-family:sans-serif;direction:rtl;overflow:auto';
    box.innerHTML = `
      <h2 style="color:#dc2626">⚠️ حدث خطأ غير متوقع / An unexpected error occurred</h2>
      <p>حصل خطأ برمجي منع التطبيق من العمل بشكل طبيعي. الرجاء نسخ الرسالة أدناه وإرسالها للمطور لإصلاحها فوراً.</p>
      <p>A script error prevented the app from working normally. Please copy the message below and send it to the developer so it can be fixed immediately.</p>
      <pre style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:14px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:13px">${(msg||'').toString().replace(/</g,'&lt;')}</pre>
      <p style="color:#64748b;font-size:13px">© Eng. Wael Oweis — KPI Dictionary</p>`;
    document.body.appendChild(box);
  }catch(e){ /* absolute last resort: do nothing rather than throw again */ }
}
window.addEventListener('error', function(e){
  showFatalError((e && e.error && e.error.stack) ? e.error.stack : (e.message||'Unknown error'));
});
window.addEventListener('unhandledrejection', function(e){
  showFatalError('Unhandled promise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
});

/* ===================== State / Storage (safe — never throws) ===================== */
let storageOK = true;
const memStore = {}; // in-memory fallback if localStorage is blocked (private mode, locked-down file:// context, etc.)
const safeStorage = {
  getItem(k){ try{ return localStorage.getItem(k); }catch(e){ storageOK=false; return memStore[k]!==undefined?memStore[k]:null; } },
  setItem(k,v){ try{ localStorage.setItem(k,v); }catch(e){ storageOK=false; memStore[k]=v; } }
};
let DB;
try{
  DB = JSON.parse(safeStorage.getItem('oip_db') || '{"projects":[],"archive":[],"lessons":[],"subcontractors":[],"auditLog":[],"activeProjectId":null}');
}catch(e){
  DB = {projects:[],archive:[],lessons:[],subcontractors:[],auditLog:[],activeProjectId:null};
}
if(!DB.subcontractors) DB.subcontractors = [];
if(!DB.auditLog) DB.auditLog = [];
function logAudit(action, detail){
  DB.auditLog.push({ts:Date.now(), action, detail});
  if(DB.auditLog.length>500) DB.auditLog = DB.auditLog.slice(-500); // keep log lean
}
function saveDB(){ safeStorage.setItem('oip_db', JSON.stringify(DB)); }
function activeProject(){ return DB.projects.find(p=>p.id===DB.activeProjectId); }

/* ---------- Theme ---------- */
let THEME = safeStorage.getItem('oip_theme') || 'light';
function toggleTheme(){
  THEME = (THEME==='dark') ? 'light' : 'dark';
  safeStorage.setItem('oip_theme', THEME);
  applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', THEME);
  const btn = document.getElementById('themeToggleBtn');
  if(btn) btn.textContent = THEME==='dark' ? tr('themeLight') : tr('themeDark');
}

/* ---------- CSV Export ---------- */
function exportProjectCSV(){
  const p = activeProject();
  if(!p || !p.history || p.history.length===0){ alert(tr('csvNoData')); return; }
  const header = ['Date','KPI_ID','KPI_Name_AR','KPI_Name_EN','Category','Value','Status'];
  const rows = p.history.map(h=>{
    const k = KPIS.find(x=>x.id===h.kpiId);

  });
  const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (p.name||'project').replace(/[^\w\u0600-\u06FF-]+/g,'_') + '_kpi_history.csv'; a.click();
}

/* ===================== Calculation Engine ===================== */
function evalKpi(kpi, vals){
  let value;
  if(kpi.mode==='percent') value = (vals.a/vals.b)*100;
  else if(kpi.mode==='ratio') value = vals.a/vals.b;
  else if(kpi.mode==='ratioDiv') value = vals.a/vals.b;
  else if(kpi.mode==='sub') value = vals.a - vals.b;
  else if(kpi.mode==='sub_div') value = (vals.a - vals.b)/vals.c;
  else if(kpi.mode==='direct') value = vals.a;
  else if(kpi.mode==='ratio1000') value = (vals.a/vals.b)*200000;
  else if(kpi.mode==='oee') value = (vals.a/100)*(vals.b/100)*(vals.c/100)*100;
  else if(kpi.mode==='evm'){ const cpi=vals.ev/vals.ac, spi=vals.ev2/vals.pv; value = Math.min(cpi,spi); }
  value = Math.round(value*1000)/1000;
  let status;
  if(kpi.dir==='h'){ status = value>=kpi.ideal?'ideal':(value>=kpi.warn?'warning':'danger'); }
  else { status = value<=kpi.ideal?'ideal':(value<=kpi.warn?'warning':'danger'); }
  return {value, status};
}

function statusLabel(s){ return s==='ideal'?tr('ideal'):(s==='warning'?tr('warning'):tr('danger')); }
function statusColor(s){ return s==='ideal'?'#16a34a':(s==='warning'?'#ca8a04':'#dc2626'); }

/* ===================== PHI (Project Health Index) ===================== */
function computePHI(project){
  if(!project || !project.history || project.history.length===0) return null;
  const latestByKpi = {};
  project.history.forEach(h=>{ latestByKpi[h.kpiId] = h; });
  const entries = Object.values(latestByKpi);
  if(entries.length===0) return null;
  const score = s=> s==='ideal'?100:(s==='warning'?60:20);
  const avg = entries.reduce((sum,e)=>sum+score(e.status),0)/entries.length;
  return {phi:Math.round(avg), count:entries.length,
    ideal:entries.filter(e=>e.status==='ideal').length,
    warning:entries.filter(e=>e.status==='warning').length,
    danger:entries.filter(e=>e.status==='danger').length};
}

function pageEngine(){

    <input type="number" step="any" id="in_${inp.k}"></div>`).join('');
  const hist = (p.history||[]).filter(h=>h.kpiId===kpi.id).slice(-8).reverse();
  const histRows = hist.length? hist.map((h,i)=>{
      const prev = hist[i+1];
      return `<tr><td>${new Date(h.date).toLocaleDateString(LANG==='ar'?'ar-EG':'en-US')}</td><td>${h.value}</td><td><span class="badge ${h.status}">${statusLabel(h.status)}</span></td><td>${trendArrowHtml(kpi,h,prev)}</td></tr>`;
    }).join('')
    : `<tr><td colspan="4" class="small">${tr('noHistory')}</td></tr>`;
  const forecast = forecastNote(kpi,hist);
  return `

    <div id="reportOutput"></div>
  </div>
  <div class="card">
    <h3>${tr('history')}</h3>
    ${forecast?`<div class="anomaly-box">📉 ${forecast}</div>`:''}
    <table><thead><tr><th>${tr('reportDate')}</th><th>${tr('value')}</th><th>${tr('status')}</th><th>${tr('trendDir')}</th></tr></thead>
    <tbody>${histRows}</tbody></table>
  </div>`;
}
function trendArrowHtml(kpi,cur,prev){
  if(!prev) return '<span class="small">—</span>';
  const improved = kpi.dir==='h'? cur.value>prev.value : cur.value<prev.value;
  const same = cur.value===prev.value;
  const cls = same?'':( improved?'color:var(--green)':'color:var(--red)');
  const label = same? tr('trendFlat') : (improved? tr('trendUp') : tr('trendDown'));
  return `<span class="trend-arrow" style="${cls}">${label}</span>`;
}
function forecastNote(kpi,histDesc){
  // histDesc is newest-first (already reversed in caller)
  if(!histDesc || histDesc.length<2) return null;
  const h = histDesc.slice(0,3); // newest 3
  const declining = kpi.dir==='h'? (h[0].value<h[1].value) : (h[0].value>h[1].value);
  const alreadyDanger = h[0].status==='danger';
  if(declining && !alreadyDanger && h[0].status!=='ideal') return tr('willReachDanger');
  return null;
}
function mountEngineEvents(){
  const sel = document.getElementById('kpiSelect');
  if(sel){ sel.value = selectedKpiId; sel.onchange = ()=>{ selectedKpiId = Number(sel.value); render(); currentPage='engine'; }; }
  const btn = document.getElementById('calcBtn');
  if(btn) btn.onclick = runCalc;
}
function lastSavedValue(kpiId){
  const p = activeProject(); if(!p||!p.history) return null;
  const list = p.history.filter(h=>h.kpiId===kpiId);
  return list.length? list[list.length-1] : null;
}
function runCalc(){
  const kpi = KPIS.find(k=>k.id===selectedKpiId);
  const vals = {};
  for(const inp of kpi.inputs){
    const v = parseFloat(document.getElementById('in_'+inp.k).value);
    if(isNaN(v)){ alert(LANG==='ar'?'يرجى تعبئة جميع الحقول بقيم رقمية':'Please fill all fields with numeric values'); return; }
    vals[inp.k]=v;
  }
  const res = evalKpi(kpi, vals);
  const last = lastSavedValue(kpi.id);
  const out = document.getElementById('reportOutput');
  if(last && last.value!==0){
    const diff = Math.abs(res.value-last.value)/Math.abs(last.value);
    if(diff>0.6){
      out.innerHTML = `
      <div class="anomaly-box">
        <b>${tr('anomaly')}</b>
        <p>${tr('anomalyMsg')}</p>
        <p class="small">${tr('whatifBase')}: ${last.value} → ${tr('value')}: ${res.value}</p>
        <button class="btn" id="proceedBtn" style="margin-top:6px">${tr('proceedAnyway')}</button>
        <button class="btn secondary" id="cancelBtn">${tr('cancel')}</button>
      </div>`;
      document.getElementById('proceedBtn').onclick = ()=>showReport(kpi,res);
      document.getElementById('cancelBtn').onclick = ()=>{ out.innerHTML=''; };
      return;
    }
  }
  showReport(kpi,res);
}
function showReport(kpi,res){
  const cat = CATS[kpi.cat];
  const t = TPL[kpi.cat][res.status];
  const lines = LANG==='ar'?t.ar:t.en;
  const role = LANG==='ar'?cat.role_ar:cat.role_en;
  const nextDate = new Date(); nextDate.setDate(nextDate.getDate()+14);
  const out = document.getElementById('reportOutput');
  out.innerHTML = `
  <div class="report ${res.status}">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><b>${tr('value')}:</b> ${res.value}${kpi.mode==='percent'?'%':''}</div>
      <div><span class="badge ${res.status}">${statusLabel(res.status)} ${res.status==='ideal'?'🟢':res.status==='warning'?'🟡':'🔴'}</span></div>
    </div>
    <h4>1️⃣ ${tr('summary')}</h4><p>${lines[0]}</p>
    <h4>2️⃣ ${tr('cause')}</h4><p>${lines[1]}</p>
    <h4>3️⃣ ${tr('action')}</h4><p>${lines[2]}</p>
    <h4>4️⃣ RACI</h4><p><b>${tr('raci')}:</b> ${role} — <b>${tr('nextReview')}:</b> ${nextDate.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US')}</p>
    <button class="btn no-print" style="margin-top:8px" id="saveResultBtn">${tr('save')} 💾</button>
  </div>`;
  document.getElementById('saveResultBtn').onclick = ()=>{
    const p = activeProject();
    p.history = p.history || [];
    p.history.push({kpiId:kpi.id, value:res.value, status:res.status, date:Date.now()});
    logAudit('kpi_save', `${p.name} — ${LANG==='ar'?kpi.ar:kpi.en} = ${res.value} (${res.status})`);
    saveDB(); render(); currentPage='engine';
  };
}

function pageWarRoom(){
  const p = activeProject();
  if(!p) return `<div class="card">${tr('noProject')}</div>`;
  const latestByKpi = {};
  (p.history||[]).forEach(h=>{ latestByKpi[h.kpiId]=h; });
  const dangerList = Object.values(latestByKpi).filter(h=>h.status==='danger');
  if(dangerList.length===0) return `<div class="card"><h2>${tr('warroomTitle')}</h2><p>${tr('warroomEmpty')}</p></div>`;
  const cards = dangerList.map(h=>{
    const kpi = KPIS.find(k=>k.id===h.kpiId);
    const cat = CATS[kpi.cat];
    const t = TPL[kpi.cat].danger;
    const line = (LANG==='ar'?t.ar:t.en)[2];
    const role = LANG==='ar'?cat.role_ar:cat.role_en;
    return `<div class="warroom-card">
      <h3>🔴 ${LANG==='ar'?kpi.ar:kpi.en}</h3>
      <p><b>${tr('value')}:</b> ${h.value}${kpi.mode==='percent'?'%':''}</p>
      <p><b>${tr('warroomAction')}:</b> ${line}</p>
      <p><b>${tr('raci')}:</b> ${role}</p>
    </div>`;
  }).join('');
  return `<h2>${tr('warroomTitle')}</h2>${cards}`;
}

/* ---------- Subcontractor Scoring ---------- */
function pageSubs(){
  const rows = DB.subcontractors.slice().map(s=>({...s, overall: Math.round((s.quality+s.schedule+s.hse)/3)}))
    .sort((a,b)=>b.overall-a.overall);
  const rowsHtml = rows.length? rows.map((s,i)=>`
    <tr><td>${i+1}</td><td><b>${s.name}</b><div class="small">${s.scope||''}</div></td>
    <td>${s.quality}</td><td>${s.schedule}</td><td>${s.hse}</td>
    <td><span class="badge ${s.overall>=85?'ideal':s.overall>=70?'warning':'danger'}">${s.overall}%</span></td>
    <td><button class="btn danger" onclick="deleteSub('${s.id}')">${tr('deleteBtn')}</button></td></tr>`).join('')
    : `<tr><td colspan="7" class="small">${tr('subsEmpty')}</td></tr>`;
  return `
  <div class="card">
    <h3>${tr('subsAdd')}</h3>
    <div class="grid cols-3">
      <div class="field"><label>${tr('subName')}</label><input id="sub_name"></div>
      <div class="field"><label>${tr('subScope')}</label><input id="sub_scope"></div>
      <div></div>
      <div class="field"><label>${tr('subQuality')}</label><input type="number" min="0" max="100" id="sub_quality"></div>
      <div class="field"><label>${tr('subSchedule')}</label><input type="number" min="0" max="100" id="sub_schedule"></div>
      <div class="field"><label>${tr('subHse')}</label><input type="number" min="0" max="100" id="sub_hse"></div>
    </div>
    <button class="btn" id="addSubBtn">${tr('subsAdd')} ➕</button>
  </div>
  <div class="card">
    <h3>${tr('subsTitle')}</h3>
    <table><thead><tr><th>${tr('subRank')}</th><th>${tr('subName')}</th><th>${tr('subQuality')}</th><th>${tr('subSchedule')}</th><th>${tr('subHse')}</th><th>${tr('subOverall')}</th><th></th></tr></thead>
    <tbody>${rowsHtml}</tbody></table>
  </div>`;
}
function mountSubsEvents(){
  const btn = document.getElementById('addSubBtn'); if(!btn) return;
  btn.onclick = ()=>{
    const name = document.getElementById('sub_name').value.trim();
    const quality = parseFloat(document.getElementById('sub_quality').value);
    const schedule = parseFloat(document.getElementById('sub_schedule').value);
    const hse = parseFloat(document.getElementById('sub_hse').value);
    if(!name || isNaN(quality) || isNaN(schedule) || isNaN(hse)){
      alert(LANG==='ar'?'يرجى تعبئة جميع الحقول':'Please fill all fields'); return;
    }
    DB.subcontractors.push({id:'s'+Date.now(), name, scope:document.getElementById('sub_scope').value, quality, schedule, hse});
    logAudit('sub_add', name);
    saveDB(); currentPage='subs'; render();
  };
}
window.deleteSub = function(id){
  if(!confirm(tr('warnConfirm'))) return;
  DB.subcontractors = DB.subcontractors.filter(s=>s.id!==id);
  saveDB(); render();
};

/* ---------- Alert Bell ---------- */
function updateAlertBell(){
  const bell = document.getElementById('alertBell');
  if(!bell) return;
  const p = activeProject();
  if(!p){ bell.style.display='none'; return; }
  const latestByKpi = {};
  (p.history||[]).forEach(h=>{ latestByKpi[h.kpiId]=h; });
  const dangerCount = Object.values(latestByKpi).filter(h=>h.status==='danger').length;
  if(dangerCount>0){
    bell.style.display='inline-block';
    bell.textContent = `🚨 ${dangerCount} ${tr('alertBell')}`;
  } else { bell.style.display='none'; }
}
window.goWarRoom = function(){ currentPage='warroom'; render(); };

/* ---------- Audit Trail ---------- */
function pageAudit(){
  const log = DB.auditLog.slice().reverse();
  const rows = log.length? log.map(l=>`
    <tr><td>${new Date(l.ts).toLocaleString(LANG==='ar'?'ar-EG':'en-US')}</td>
    <td>${tr('act_'+l.action) || l.action}</td><td>${l.detail}</td></tr>`).join('')
    : `<tr><td colspan="3" class="small">${tr('auditEmpty')}</td></tr>`;
  return `
  <div class="card"><p class="small">🔒 ${tr('auditDesc')}</p></div>
  <div class="card"><table><thead><tr><th>${tr('reportDate')}</th><th>${LANG==='ar'?'الحدث':'Event'}</th><th>${LANG==='ar'?'التفاصيل':'Detail'}</th></tr></thead>
  <tbody>${rows}</tbody></table></div>`;
}

/* ---------- Library ---------- */

function pageLibrary(){
  const catOptions = `<option value="">${tr('allKpis')}</option>` + Object.entries(CATS).map(([k,v])=>`<option value="${k}">${LANG==='ar'?v.ar:v.en}</option>`).join('');
  return `
  <div class="card">
    <div class="grid cols-2">
      <input type="text" id="kpiSearch" placeholder="${tr('searchKpi')}">
      <select id="catFilter">${catOptions}</select>
    </div>
    <div class="kpi-list" id="kpiListBox" style="margin-top:12px"></div>
  </div>`;
}
function mountLibraryEvents(){
  const search = document.getElementById('kpiSearch');
  const catF = document.getElementById('catFilter');
  function draw(){
    const q = (search.value||'').toLowerCase();
    const c = catF.value;
    const box = document.getElementById('kpiListBox');
    const filtered = KPIS.filter(k=>{
      const name = (LANG==='ar'?k.ar:k.en).toLowerCase();
      return (!c || k.cat===c) && (!q || name.includes(q));
    });
    box.innerHTML = filtered.map(k=>`
      <div class="kpi-row" onclick="openKpiDetail(${k.id})">
        <div><b>${k.id}.</b> ${LANG==='ar'?k.ar:k.en}<div class="small">${LANG==='ar'?CATS[k.cat].ar:CATS[k.cat].en}</div></div>
        <div class="small">${k.dir==='h'?'▲':'▼'} ${tr('ideal')} ${k.dir==='h'?'≥':'≤'} ${k.ideal}</div>
      </div>`).join('') || `<div class="small">—</div>`;
  }
  search.oninput = draw; catF.onchange = draw; draw();
}
window.openKpiDetail = function(id){
  selectedKpiId = id; currentPage='engine'; render();
};

/* ---------- Heatmap ---------- */
function pageHeatmap(){
  if(DB.projects.length===0) return `<div class="card">${tr('noProject')}</div>`;
  const rows = DB.projects.map(p=>{
    const phi = computePHI(p);
    const cells = KPIS.slice(0,20).map(k=>{
      const entries = (p.history||[]).filter(h=>h.kpiId===k.id);
      const last = entries[entries.length-1];
      const color = last? statusColor(last.status) : '#e2e8f0';
      return `<span class="heat-cell" title="${LANG==='ar'?k.ar:k.en}" style="background:${color}"></span>`;
    }).join('');
    return `<tr><td><b>${p.name}</b><div class="small">${phi?phi.phi+'% PHI':'—'}</div></td><td>${cells}</td></tr>`;
  }).join('');
  return `<div class="card"><table><thead><tr><th>${tr('projects')}</th><th>KPI 1-20</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Registry ---------- */
function pageRegistry(){
  const rows = DB.projects.map(p=>{
    const phi = computePHI(p);
    return `<tr>
      <td><b>${p.name}</b></td><td>${p.sector||'—'}</td><td>${p.client||'—'}</td>
      <td>${phi?phi.phi+'%':'—'}</td>
      <td>
        <button class="btn secondary" onclick="archiveProject('${p.id}')">${tr('archiveBtn')}</button>
        <button class="btn danger" onclick="deleteProject('${p.id}')">${tr('deleteBtn')}</button>
      </td></tr>`;
  }).join('') || `<tr><td colspan="5" class="small">—</td></tr>`;
  return `
  <div class="card">
    <h3>${tr('newProject')}</h3>
    <div class="grid cols-3">
      <div class="field"><label>${tr('projectName')}</label><input id="np_name"></div>
      <div class="field"><label>${tr('sector')}</label><input id="np_sector"></div>
      <div class="field"><label>${tr('client')}</label><input id="np_client"></div>
    </div>
    <button class="btn" id="createProjectBtn">${tr('create')} ➕</button>
  </div>
  <div class="card">
    <h3>${tr('projects')}</h3>
    <table><thead><tr><th>${tr('projectName')}</th><th>${tr('sector')}</th><th>${tr('client')}</th><th>PHI</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}
function mountRegistryEvents(){
  document.getElementById('createProjectBtn').onclick = ()=>{
    const name = document.getElementById('np_name').value.trim();
    if(!name){ alert(LANG==='ar'?'الرجاء إدخال اسم المشروع':'Please enter a project name'); return; }
    const p = {id:'p'+Date.now(), name, sector:document.getElementById('np_sector').value,
      client:document.getElementById('np_client').value, history:[], createdAt:Date.now()};
    DB.projects.push(p); DB.activeProjectId = p.id; logAudit('project_create', p.name); saveDB(); currentPage='registry'; render();
  };
}
window.deleteProject = function(id){
  if(!confirm(tr('warnConfirm'))) return;
  const proj = DB.projects.find(p=>p.id===id);
  DB.projects = DB.projects.filter(p=>p.id!==id);
  if(DB.activeProjectId===id) DB.activeProjectId = DB.projects[0]?DB.projects[0].id:null;
  if(proj) logAudit('project_delete', proj.name);
  saveDB(); render();
};
window.archiveProject = function(id){
  const idx = DB.projects.findIndex(p=>p.id===id); if(idx<0) return;
  const [p] = DB.projects.splice(idx,1); p.archivedAt = Date.now(); DB.archive.push(p);
  if(DB.activeProjectId===id) DB.activeProjectId = DB.projects[0]?DB.projects[0].id:null;
  logAudit('project_archive', p.name);
  saveDB(); render();
};

/* ---------- Archive ---------- */
function pageArchive(){
  const rows = DB.archive.map(p=>{
    const phi = computePHI(p);
    return `<tr><td><b>${p.name}</b></td><td>${p.sector||'—'}</td><td>${phi?phi.phi+'%':'—'}</td>
    <td><button class="btn secondary" onclick="restoreProject('${p.id}')">${tr('restoreBtn')}</button></td></tr>`;
  }).join('') || `<tr><td colspan="4" class="small">${tr('archiveEmpty')}</td></tr>`;
  return `<div class="card"><table><thead><tr><th>${tr('projectName')}</th><th>${tr('sector')}</th><th>PHI</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function mountArchiveEvents(){}
window.restoreProject = function(id){
  const idx = DB.archive.findIndex(p=>p.id===id); if(idx<0) return;
  const [p] = DB.archive.splice(idx,1); DB.projects.push(p); DB.activeProjectId = p.id; saveDB(); render();
};

/* ---------- Lessons ---------- */
function pageLessons(){
  const cats = LANG==='ar'? ['التكاليف','الجودة والهندسة','السلامة والبيئة','العقود والمطالبات','التقنية والذكاء الاصطناعي','الموارد البشرية']
    : ['Cost','Quality/Engineering','HSE','Contracts/Claims','Technology/AI','HR'];
  const options = cats.map(c=>`<option>${c}</option>`).join('');
  const rows = DB.lessons.slice().reverse().map(l=>`<div class="card" style="padding:12px"><b>[${l.cat}]</b> ${l.desc}<div class="small">${new Date(l.date).toLocaleDateString(LANG==='ar'?'ar-EG':'en-US')}</div></div>`).join('') || `<div class="small">—</div>`;
  return `
  <div class="card">
    <div class="field"><label>${tr('lessonCat')}</label><select id="lessonCat">${options}</select></div>
    <div class="field"><label>${tr('lessonDesc')}</label><textarea id="lessonDesc" rows="3"></textarea></div>
    <button class="btn" id="addLessonBtn">${tr('addLesson')} 💾</button>
  </div>
  <div class="card"><h3>${tr('lessonsBank')}</h3>${rows}</div>`;
}
function mountLessonsEvents(){
  document.getElementById('addLessonBtn').onclick = ()=>{
    const desc = document.getElementById('lessonDesc').value.trim();
    if(!desc) return;
    DB.lessons.push({cat:document.getElementById('lessonCat').value, desc, date:Date.now()});
    saveDB(); render(); currentPage='lessons';
  };
}

/* ---------- Comprehensive Report ---------- */
function pageReport(){
  if(DB.projects.length===0) return `<div class="card">${tr('noData')}</div>`;
  const rows = DB.projects.map(p=>{
    const phi = computePHI(p);
    if(!phi) return `<div class="card"><h3>${p.name}</h3><div class="small">${tr('noData')}</div></div>`;
    const bySector = {};
    (p.history||[]).forEach(h=>{
      const k = KPIS.find(x=>x.id===h.kpiId); if(!k) return;
      bySector[k.cat] = bySector[k.cat] || [];
      bySector[k.cat].push(h);
    });
    const secRows = Object.entries(bySector).map(([cat,list])=>{
      const last = list[list.length-1];
      const kpi = KPIS.find(k=>k.id===last.kpiId);
      return `<li><b>${LANG==='ar'?CATS[cat].ar:CATS[cat].en}:</b> ${LANG==='ar'?kpi.ar:kpi.en} = ${last.value} — <span class="badge ${last.status}">${statusLabel(last.status)}</span></li>`;
    }).join('');
    return `<div class="card">
      <h3>${p.name} <span class="small">(${p.sector||'—'})</span></h3>
      <p><b>${tr('phi')}:</b> ${phi.phi}% — 🟢 ${phi.ideal} · 🟡 ${phi.warning} · 🔴 ${phi.danger}</p>
      <ul>${secRows}</ul>
    </div>`;
  }).join('');
  const now = new Date();
  return `
  <div class="card">
    <h2>${tr('reportTitle')}</h2>
    <p class="small">${tr('reportDate')}: ${now.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US')} | ${tr('preparedBy')}: Eng. Wael Oweis</p>
  </div>
  ${rows}`;
}

window.toggleMobileMenu = function(open){
  const sb = document.getElementById('sidebar');
  if(!sb) return;
  sb.classList.toggle('mobile-open', open);
};
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ try{ currentPage = b.dataset.page; render(); toggleMobileMenu(false); }catch(err){ showFatalError(err.stack||err.message); } });
});
document.getElementById('langSelect').addEventListener('change', (e)=>{ try{ LANG = e.target.value; render(); }catch(err){ showFatalError(err.stack||err.message); } });

  render();
}catch(err){ showFatalError(err.stack||err.message); }
</script>
