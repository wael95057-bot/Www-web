  :root{
    --bg:#050b14; --panel:#0c1622; --panel2:#0f1c2c; --line:#16283b;

    --amber:#f5b942; --rose:#fb7185; --emerald:#34d399; --violet:#a78bfa; --blue:#60a5fa;
    --ink:#e7f1f8; --ink-dim:#7d92a6;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--ink);}
  body{font-family:'Tajawal','Segoe UI',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#1c3149;border-radius:4px;}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;}
  .chip{border-radius:999px;font-size:10px;font-weight:700;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;}
  .chip-ok{background:rgba(52,211,153,.12);color:var(--emerald);border:1px solid rgba(52,211,153,.28);}
  .chip-warn{background:rgba(245,185,66,.12);color:var(--amber);border:1px solid rgba(245,185,66,.28);}
  .chip-bad{background:rgba(251,113,133,.12);color:var(--rose);border:1px solid rgba(251,113,133,.28);}
  .chip-info{background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(34,211,238,.28);}
  .btn{border-radius:14px;font-weight:700;font-size:12px;padding:10px 14px;transition:.15s;border:1px solid var(--line);}
  .btn:active{transform:scale(.97);}
  .glow{box-shadow:0 0 0 1px rgba(34,211,238,.15), 0 8px 30px -12px rgba(34,211,238,.25);}
  .tab-active{color:var(--cyan) !important;}
  .fade-in{animation:fadeIn .25s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .spin{animation:spin 1.4s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pulse{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .drawer{transition:transform .28s cubic-bezier(.2,.8,.2,1);}
  input[type=range]{accent-color:var(--cyan);}
  .progress-track{background:#0a1420;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;}
  @media print{
    .no-print{display:none !important;}
    .pdf-capture, .pdf-capture *{ color:#0f172a !important; border-color:#cbd5e1 !important; }
    .pdf-capture{ background:#ffffff !important; }
    .pdf-capture .card{ background:#f8fafc !important; }
  }
  .pdf-capture, .pdf-capture *{ color:#0f172a !important; border-color:#cbd5e1 !important; }
  .pdf-capture{ background:#ffffff !important; }
  .pdf-capture .card{ background:#f8fafc !important; }
</style>

/* =========================================================
   تسجيل الشركات (ID + كلمة سر) — تفعيل مباشر بدون انتظار
   كل شركة بياناتها (سجل المشاريع) محفوظة منفصلة تماماً عن باقي الشركات
   ========================================================= */
const COMPANIES_KEY = 'phoenix_companies_v1';
const SESSION_KEY = 'phoenix_session_v1';

function simpleHash(str){
  // تشفير بسيط لكلمة السر (مش تشفير أمني حقيقي، بس كفاية لمنع تخزينها كنص صريح في هذا السياق)
  let h = 0;
  for(let i=0;i<str.length;i++){ h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; }
  return 'h'+h;
}
function loadCompanies(){
  try{ return JSON.parse(localStorage.getItem(COMPANIES_KEY) || '{}'); }catch(e){ return {}; }
}
function saveCompanies(obj){
  try{ localStorage.setItem(COMPANIES_KEY, JSON.stringify(obj)); }catch(e){}
}
function companyDataKey(id){ return 'phoenix_data_' + id; }

function loadCompanyData(companyId){
  let data = null;
  try{ data = JSON.parse(localStorage.getItem(companyDataKey(companyId)) || 'null'); }catch(e){}
  if(data && Array.isArray(data.projects)){
    state.projects = data.projects;
  } else {
    // أول مرة للشركة دي: نبدأ بمشاريع تجريبية افتراضية
    state.projects = PROJECTS[state.lang].map(p=>({...p}));
    saveCompanyData();
  }
}
function saveCompanyData(){
  if(!state.auth.companyId) return;
  try{ localStorage.setItem(companyDataKey(state.auth.companyId), JSON.stringify({ projects: state.projects })); }catch(e){}
}

function attemptLogin(){
  const idEl = document.getElementById('loginCompanyId');
  const pwEl = document.getElementById('loginPassword');
  const companyId = (idEl.value||'').trim();
  const password = (pwEl.value||'').trim();
  if(!companyId || !password){
    state.loginError = isAr() ? 'من فضلك اكتب معرّف الشركة وكلمة السر' : 'Please enter both Company ID and password';
    render(); return;
  }
  const companies = loadCompanies();
  const hashed = simpleHash(password);
  if(companies[companyId]){
    if(companies[companyId] !== hashed){
      state.loginError = isAr() ? 'كلمة السر غير صحيحة لمعرّف الشركة ده' : 'Incorrect password for this Company ID';
      render(); return;
    }
  } else {
    // تفعيل مباشر: أول دخول لمعرّف الشركة ده يسجّله تلقائياً بكلمة السر دي
    companies[companyId] = hashed;
    saveCompanies(companies);
  }
  state.auth.loggedIn = true;
  state.auth.companyId = companyId;
  state.loginError = '';
  try{ localStorage.setItem(SESSION_KEY, companyId); }catch(e){}
  loadCompanyData(companyId);
  render();
}
function logoutCompany(){
  state.auth.loggedIn = false;
  state.auth.companyId = null;
  state.projects = [];
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  render();
}
function tryResumeSession(){
  let saved = null;
  try{ saved = localStorage.getItem(SESSION_KEY); }catch(e){}
  if(saved){
    state.auth.loggedIn = true;
    state.auth.companyId = saved;
    loadCompanyData(saved);
  }
}

function downloadCurrentPagePdf(){
  if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){
    alert(isAr() ? '⚠️ مكتبة PDF غير متاحة (تحقق من الاتصال بالإنترنت)' : '⚠️ PDF library unavailable (check internet connection)');
    return;
  }
  const el = document.getElementById('main-content-area');
  if(!el) return;
  el.classList.add('pdf-capture');
  html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(canvas=>{
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save('PHOENIX_' + (state.tab||'page') + '_' + new Date().toISOString().slice(0,10) + '.pdf');
  }).catch(()=>{
    alert(isAr() ? '⚠️ فشل تصدير PDF، جرب زر الطباعة واختر "حفظ كـ PDF"' : '⚠️ PDF export failed — try Print and choose "Save as PDF"');
  }).finally(()=>{
    el.classList.remove('pdf-capture');
  });
}

const VOICE_KB = [
  { match:['pue','عنقاء','net-pue'], ar:(s)=>`مؤشر Net-PUE الحالي هو ${s.netPUE} — أفضل من المستهدف 1.0.`, en:(s)=>`Current Net-PUE is ${s.netPUE} — better than the 1.0 target.` },
  { match:['ضغط','pressure','بار','bar'], ar:(s)=>`ضغط المائع في الطبقة الثالثة مستقر عند ${s.flow} بار خلال آخر ساعة.`, en:(s)=>`Layer-3 fluid pressure has been stable at ${s.flow} bar over the last hour.` },
  { match:['حرارة','temp','درجة'], ar:(s)=>`حرارة صالات IT الحالية ${s.serverTemp}°C، ضمن المعيار 20°C ± 1.`, en:(s)=>`Current IT hall temperature is ${s.serverTemp}°C, within the 20°C ± 1 standard.` },
  { match:['رطوبة','humidity'], ar:(s)=>`مستوى الرطوبة النسبية الحالي ${s.humidity}%.`, en:(s)=>`Current relative humidity is ${s.humidity}%.` },
];
function runVoiceQuery(){
  const q = (document.getElementById('voiceInput')||{}).value || '';
  if(!q.trim()) return;
  const lower = q.toLowerCase();
  let hit = VOICE_KB.find(k => k.match.some(m => lower.includes(m)));
  const answer = hit ? (isAr()? hit.ar(state) : hit.en(state))
    : two('لم أجد بيانات مباشرة لهذا الاستفسار — جارٍ تسجيله لمراجعة الفريق الهندسي.', "No direct telemetry for that query — logging it for the engineering team's review.");
  state.voiceLog.unshift({q, a:answer});
  state.voiceLog = state.voiceLog.slice(0,4);
  render();
  setTimeout(()=>{ const inp=document.getElementById('voiceInput'); if(inp) inp.value=''; },0);
}
function askSuggested(q){ const inp=document.getElementById('voiceInput'); if(inp){ inp.value=q; runVoiceQuery(); } }

function updateROI(){
  const priceEl = document.getElementById('roiPrice');
  const capexEl = document.getElementById('roiCapex');
  const mwhEl = document.getElementById('roiMwh');
  if(!priceEl || !capexEl || !mwhEl) return;
  const price = parseFloat(priceEl.value)||0;
  const capex = parseFloat(capexEl.value)||0;
  const mwh = parseFloat(mwhEl.value)||0;
  state.roi = {price, capex, mwh};
  const annualSaving = price*mwh*1000;
  const payback = annualSaving>0 ? (capex/annualSaving) : 0;

  const priceVal = document.getElementById('roiPriceVal'); if(priceVal) priceVal.textContent = price.toFixed(2);
  const capexVal = document.getElementById('roiCapexVal'); if(capexVal) capexVal.textContent = '$'+capex.toLocaleString();
  const mwhVal = document.getElementById('roiMwhVal'); if(mwhVal) mwhVal.textContent = mwh.toLocaleString();
  const out = document.getElementById('roiAnnualOut'); if(out) out.textContent = '$'+Math.round(annualSaving).toLocaleString();
  const pay = document.getElementById('roiPaybackOut'); if(pay) pay.textContent = payback.toFixed(1)+' '+t().esgCalcYears;
  const bar = document.getElementById('roiBar'); if(bar) bar.style.width = Math.min(100, (annualSaving/(capex||1))*100)+'%';
}

function filterKB(){
  const el = document.getElementById('kbSearchInput');
  state.kbSearch = el ? el.value : '';

  listEl.innerHTML = kbListHTML();
  lucide.createIcons();
}
function kbListHTML(){
  const c = t();
  const q = state.kbSearch.trim().toLowerCase();
  const filtered = state.kbIncidents.filter(inc=>{
    if(!q) return true;
    const hay = (inc.id+' '+inc.titleAr+' '+inc.titleEn+' '+inc.tag+' '+inc.causeAr+' '+inc.causeEn).toLowerCase();
    return hay.includes(q);
  });
  if(filtered.length===0) return `<div class="text-[11px] text-slate-500 px-1 py-4 text-center">${c.kbNoResults}</div>`;
  return filtered.map(inc=>`
    <div class="card p-3 text-xs space-y-1.5">
      <div class="flex items-center justify-between">
        <span class="font-bold text-white">${isAr()?inc.titleAr:inc.titleEn}</span>

      <div class="text-slate-400"><span class="text-slate-500">${c.kbCause}:</span> ${isAr()?inc.causeAr:inc.causeEn}</div>
      <div class="text-emerald-300"><span class="text-slate-500">${c.kbFix}:</span> ${isAr()?inc.fixAr:inc.fixEn}</div>
    </div>`).join('');
}

function addProjectFromForm(){
  const name = (document.getElementById('np-name').value||'').trim();
  const loc = (document.getElementById('np-loc').value||'').trim();
  const cap = (document.getElementById('np-cap').value||'').trim();
  const status = document.getElementById('np-status').value;
  const pueVal = parseFloat(document.getElementById('np-pue').value);
  if(!name){ alert(isAr()?'اكتب اسم المشروع الأول':'Please enter a project name'); return; }
  const id = 'p_' + Date.now();
  state.projects.push({ id, name, loc: loc||'-', cap: cap||'-', status: status||'active', pue: isNaN(pueVal)?1.0:pueVal });
  state.selectedProject = id;
  saveCompanyData();
  render();
}
function deleteProject(id){
  if(!confirm(isAr()?'متأكد من حذف المشروع ده نهائياً؟':'Delete this project permanently?')) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  if(state.selectedProject===id) state.selectedProject = state.projects.length ? state.projects[0].id : null;
  saveCompanyData();
  render();
}

        <input id="np-loc" type="text" placeholder="${isAr()?'الموقع':'Location'}" class="bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-xs text-white">
        <input id="np-cap" type="text" placeholder="${isAr()?'السعة':'Capacity'}" class="bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-xs text-white">
        <select id="np-status" class="bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-xs text-white">
          <option value="active">${c.active}</option>
          <option value="completed">${c.completed}</option>
        </select>
        <input id="np-pue" type="number" step="0.01" placeholder="PUE" class="bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-xs text-white">
      </div>
      <button onclick="addProjectFromForm()" class="btn w-full bg-cyan-500/15 hover:bg-cyan-500/25 border-cyan-500/30 text-cyan-300 justify-center">${icon('plus','w-4 h-4')} ${isAr()?'حفظ المشروع':'Save Project'}</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      ${list.length ? list.map(p=>`
        <div class="card p-4 ${state.selectedProject===p.id?'border-cyan-500/50':''}">
          <div onclick="state.selectedProject='${p.id}';render();" class="cursor-pointer">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-white">${p.name}</span>
              ${chip(p.status==='active'?c.active:c.completed, p.status==='active'?'ok':'info')}
            </div>
            <p class="text-xs text-slate-400">${c.location} ${p.loc} | ${c.capacity} ${p.cap}</p>
            <p class="text-[11px] text-cyan-400 mt-2 font-medium">${c.manager} ${isAr()?'م. وائل علي عويس محمود':'Eng. Wael Ali Oweis Mahmoud'}</p>
          </div>
          <button onclick="deleteProject('${p.id}')" class="no-print mt-2 text-[11px] text-rose-400 flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ${isAr()?'حذف المشروع':'Delete Project'}</button>
        </div>`).join('') : `<p class="text-xs text-slate-500 col-span-2 text-center py-4">${isAr()?'لا توجد مشاريع محفوظة بعد — أضف أول مشروع من الفورم فوق.':'No saved projects yet — add your first one above.'}</p>`}
    </div>

    ${list.length ? `<div class="card p-4 space-y-3">
      <div class="text-xs font-bold text-white flex items-center gap-1.5">${icon('bar-chart-3','w-4 h-4 text-cyan-300')} ${c.projCompareTitle}</div>
      <div class="space-y-2.5">
        ${list.map(p=>`
          <div class="space-y-1">
            <div class="flex justify-between text-xs"><span class="text-slate-300">${p.name}</span><span class="mono ${p.pue<1?'text-emerald-400':'text-amber-300'}">${(+p.pue).toFixed(2)}</span></div>
            <div class="progress-track h-2"><div class="progress-fill ${p.pue<1?'bg-emerald-400':'bg-amber-400'}" style="width:${Math.min(100,(p.pue/REGION_AVG_PUE)*100)}%"></div></div>
          </div>`).join('')}
        <div class="space-y-1 pt-1 border-t border-white/5">
          <div class="flex justify-between text-xs"><span class="text-slate-400">${c.projRegionAvg}</span><span class="mono text-rose-300">${REGION_AVG_PUE.toFixed(2)}</span></div>
          <div class="progress-track h-2"><div class="progress-fill bg-rose-400/60" style="width:100%"></div></div>
        </div>
      </div>
    </div>` : ''}
  </div>`;
}

function renderReport(){
  const c = t();
  // كل الأقسام (عدا التقرير نفسه) بنفس ترتيب القائمة الجانبية
  const reportSections = ALL_SECTIONS.filter(s=>s.id!=='report');
  const combined = reportSections.map(s=>{
    const fn = TAB_RENDERERS[s.id];
    if(!fn) return '';
    let html = '';
    try{ html = fn(); }catch(e){ html = ''; }
    // إزالة أي أحداث تفاعلية (onclick) من النسخة المدمجة في التقرير لتفادي أي تفاعل غير مقصود
    html = html.replace(/\sonclick="[^"]*"/g, '');
    return `<div class="pt-2">${html}</div>`;
  }).join('<div class="border-t border-white/10 my-1"></div>');

  return `<div class="space-y-3 fade-in">
    <div class="flex gap-2 no-print">
      <button onclick="window.print()" class="btn bg-cyan-500/10 hover:bg-cyan-500/20 border-cyan-500/30 text-cyan-300 flex-1 flex items-center justify-center gap-2">${icon('printer','w-4 h-4')} ${c.printPage}</button>
      <button onclick="downloadCurrentPagePdf()" class="btn bg-cyan-500/10 hover:bg-cyan-500/20 border-cyan-500/30 text-cyan-300 flex-1 flex items-center justify-center gap-2">${icon('file-down','w-4 h-4')} ${c.exportPdf}</button>
    </div>
    <div class="card p-6 space-y-6">
      <div class="text-center pb-4 border-b border-white/5 space-y-1">
        <h2 class="text-lg font-black text-white">${c.reportTitle}</h2>
        <p class="text-xs text-slate-400">${c.reportSub}</p>
        <p class="text-xs font-bold text-cyan-400 pt-1">${c.reportSupervised}</p>
      </div>
      <div class="space-y-4 text-xs text-slate-300">
        <div><h3 class="font-bold text-white mb-1">${c.execSummary}</h3><p class="leading-relaxed">${c.execText}</p></div>
        <div class="grid grid-cols-2 gap-3 pt-2">
          <div class="bg-black/30 p-3.5 rounded-2xl border border-white/5"><div class="text-slate-400 mb-1">${c.annualSaving}</div><div class="text-base font-bold text-emerald-400 mono">$590,000</div></div>
          <div class="bg-black/30 p-3.5 rounded-2xl border border-white/5"><div class="text-slate-400 mb-1">${c.carbonReduction}</div><div class="text-base font-bold text-cyan-400 mono">-72% CO2e</div></div>
        </div>
      </div>
    </div>

    ${combined}

    <div class="card p-4">
      <div class="pt-2 border-t border-white/5 flex justify-between text-[10px] text-slate-500 mono">
        <span>BENA CONSTRUCTION © 2026</span><span>${c.docId}</span>
      </div>
    </div>
  </div>`;
}

const TAB_RENDERERS = {
  dashboard: renderDashboard, layers: renderLayers, twin: renderTwin, ai: renderAI,
  contracts: renderContracts, qc: renderQC, ar: renderAR, kb: renderKB, supply: renderSupply, hr: renderHR, esg: renderESG,
  security: renderSecurity, projects: renderProjects, report: renderReport
};

/* =========================================================
   SHELL RENDER
   ========================================================= */
function render(){
  const c = t();
  const app = document.getElementById('app');
  if(!state.auth.loggedIn){
    app.innerHTML = renderLogin();
    lucide.createIcons();
    return;
  }
  app.innerHTML = `
    <header class="bg-[#070f1a] border-b border-[var(--line)] sticky top-0 z-40 px-4 py-3">
      <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <button onclick="toggleDrawer()" class="p-2 rounded-xl bg-white/5 border border-white/10 no-print">${icon('menu','w-5 h-5 text-cyan-300')}</button>
          <div class="bg-cyan-500/10 p-2 rounded-xl border border-cyan-500/30 hidden sm:block">${icon('zap','w-5 h-5 text-cyan-400 pulse')}</div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h1 class="text-sm font-black text-white">${c.appName}</h1>
              <span class="text-[9px] bg-cyan-500/15 text-cyan-300 px-2 py-0.5 rounded-full border border-cyan-500/30 font-bold">${c.company}</span>
            </div>
            <p class="text-[11px] text-slate-400">${c.pm}</p>
          </div>
        </div>
        <div class="flex items-center gap-2 no-print">
          <button onclick="cycleRole()" class="btn bg-white/5 border-white/10 text-slate-200 flex items-center gap-1.5 !py-1.5 !px-2.5" title="${c.roleLbl}">
            ${icon('user-cog','w-3.5 h-3.5 text-amber-300')}<span class="text-[11px] font-bold">${state.role==='admin'?c.roleAdmin:state.role==='engineer'?c.roleEngineer:c.roleViewer}</span>
          </button>
          <button onclick="toggleLang()" class="btn bg-white/5 border-white/10 text-slate-200 flex items-center gap-1.5 !py-1.5 !px-2.5">${icon('globe','w-3.5 h-3.5 text-cyan-400')}<span class="hidden xs:inline">${isAr()?'English':'العربية'}</span></button>
          <button onclick="if(confirm(isAr()?'تسجيل خروج من حساب الشركة؟':'Log out of company account?')) logoutCompany();" class="btn bg-white/5 border-white/10 text-slate-200 flex items-center gap-1.5 !py-1.5 !px-2.5" title="${isAr()?'تسجيل خروج':'Logout'}">${icon('log-out','w-3.5 h-3.5 text-rose-300')}</button>
          <button onclick="toggleSim()" class="btn ${state.isSimulating?'bg-amber-500/15 border-amber-500/40 text-amber-300':'bg-white/5 border-white/10 text-slate-300'} flex items-center gap-1.5 !py-1.5 !px-2.5">
            ${icon('refresh-cw','w-3.5 h-3.5 '+(state.isSimulating?'spin':''))}<span class="hidden sm:inline">${c.simulate}</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-3">
      <div class="flex justify-end gap-2 no-print">
        <button onclick="copyPageContent()" class="btn bg-black/20 border-white/10 text-slate-300 flex items-center gap-1 !py-1.5 !px-2.5 text-[11px]">${icon('copy','w-3 h-3 text-cyan-400')} ${state.copied? c.copied : c.copyPage}</button>
        <button onclick="window.print()" class="btn bg-black/20 border-white/10 text-slate-300 flex items-center gap-1 !py-1.5 !px-2.5 text-[11px]">${icon('printer','w-3 h-3 text-cyan-400')} ${c.printPage}</button>
        <button onclick="downloadCurrentPagePdf()" class="btn bg-black/20 border-white/10 text-slate-300 flex items-center gap-1 !py-1.5 !px-2.5 text-[11px]">${icon('file-down','w-3 h-3 text-cyan-400')} PDF</button>
      </div>
      <div id="main-content-area">${(TAB_RENDERERS[state.tab]||renderDashboard)()}</div>
    </main>

    <nav class="bg-[#070f1a] border-t border-[var(--line)] fixed bottom-0 left-0 right-0 z-40 px-2 py-2 no-print">
      <div class="max-w-4xl mx-auto flex justify-around items-center">
        ${NAV_ITEMS.map(n=>`
          <button onclick="setTab('${n.id}')" class="flex flex-col items-center gap-1 px-2 py-1 ${state.tab===n.id?'tab-active':'text-slate-400'}">
            ${icon(n.icon,'w-5 h-5')}<span class="text-[9px] font-bold">${c[n.key]}</span>
          </button>`).join('')}
        <button onclick="toggleDrawer()" class="flex flex-col items-center gap-1 px-2 py-1 text-slate-400">
          ${icon('grid-3x3','w-5 h-5')}<span class="text-[9px] font-bold">${c.navMore}</span>
        </button>
      </div>
    </nav>

    <div class="fixed inset-0 z-50 no-print ${state.drawerOpen?'':'pointer-events-none'}">
      <div onclick="toggleDrawer()" class="absolute inset-0 bg-black/60 transition-opacity ${state.drawerOpen?'opacity-100':'opacity-0'}"></div>
      <div class="drawer absolute bottom-0 left-0 right-0 bg-[#0a1420] border-t border-[var(--line)] rounded-t-3xl p-5 max-w-4xl mx-auto"
           style="transform:translateY(${state.drawerOpen?'0':'100%'})">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-sm font-bold text-white">${c.menu}</h3>
          <button onclick="toggleDrawer()" class="p-1.5 rounded-lg bg-white/5">${icon('x','w-4 h-4 text-slate-300')}</button>
        </div>
        <div class="grid grid-cols-3 gap-3 max-h-[60vh] overflow-y-auto pb-2">
          ${ALL_SECTIONS.map(s=>`
            <button onclick="setTab('${s.id}')" class="card p-3 flex flex-col items-center gap-2 ${state.tab===s.id?'border-cyan-500/50':''}">
              ${icon(s.icon,'w-5 h-5 '+(state.tab===s.id?'text-cyan-400':'text-slate-300'))}
              <span class="text-[10px] text-center text-slate-200 font-medium leading-tight">${c[s.key]}</span>
            </button>`).join('')}
        </div>
      </div>
    </div>
  `;
  lucide.createIcons();
  if(state.tab==='esg') updateROI();
}

/* =========================================================
   SIMULATION LOOP
   ========================================================= */
setInterval(()=>{
  if(state.isSimulating){
    state.serverTemp = +(state.serverTemp + (Math.random()*0.4-0.2)).toFixed(1);
    state.netPUE = +(state.netPUE + (Math.random()*0.02-0.01)).toFixed(2);
    state.humidity = Math.max(30, Math.min(80, Math.round(state.humidity + (Math.random()*6-3))));
    state.flow = +(state.flow + (Math.random()*0.2-0.1)).toFixed(1);
    state.wue = +Math.max(0.18, Math.min(0.45, state.wue + (Math.random()*0.02-0.01))).toFixed(2);
    state.mtbfAssets.forEach(a=>{ a.hours = Math.min(a.mtbf+500, a.hours+2); });
    if(state.tab==='dashboard' || state.tab==='ai') render();
  }
}, 3000);

document.documentElement.lang = state.lang;
document.documentElement.dir = 'rtl';
tryResumeSession();
render();
</script>
</body>
</html>
