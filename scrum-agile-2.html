const STORAGE_KEY = 'scrumAgileData_v1';
const SETTINGS_KEY = 'scrumAgileSettings_v1';

function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function defaultData(){
  return {
    projects: [
      { id: uid('prj'), nameAr: 'مشروع تجريبي', nameEn: 'Sample Project', client: '', sector: 'software', statusAr: 'قيد التنفيذ', statusEn: 'In Progress', progress: 20, createdAt: todayISO() }
    ],
    backlog: [],
    sprints: [],
    tasks: [],
    standups: [],
    retros: [],
    documents: [],
    risks: [],
    ncrs: []
  };
}

function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const d = defaultData();
    return Object.assign(d, parsed);
  } catch(e){ return defaultData(); }
}

function saveData(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch(e){ console.error('save failed', e); }
}

function loadSettings(){
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { supabaseUrl:'', supabaseKey:'', backupId:'scrum-agile-default' }; }
  catch(e){ return { supabaseUrl:'', supabaseKey:'', backupId:'scrum-agile-default' }; }
}
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

const state = {
  lang: 'ar',
  tab: 'dashboard',
  data: loadData(),
  settings: loadSettings(),
  activeProjectId: null,
  activeSprintId: null,
  docType: null,
  toast: null,
  whatifBoost: 0
};
if (state.data.projects.length) state.activeProjectId = state.data.projects[0].id;

function t(){ return T[state.lang]; }

/* ---------------- helpers ---------------- */
function activeProject(){ return state.data.projects.find(p => p.id === state.activeProjectId) || null; }
function activeSprint(){ return state.data.sprints.find(s => s.id === state.activeSprintId && s.projectId === state.activeProjectId) || state.data.sprints.find(s => s.projectId === state.activeProjectId && s.status !== 'closed') || null; }
function projectSprints(){ return state.data.sprints.filter(s => s.projectId === state.activeProjectId); }
function esc(str){ return (str||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2500);
}

/* ---------------- CRUD actions ---------------- */
const actions = {
  setLang(l){ state.lang = l; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; render(); },
  setTab(tab){ state.tab = tab; render(); },
  setActiveProject(id){ state.activeProjectId = id; state.activeSprintId = null; render(); },

  addProject(){
    const nameAr = prompt(state.lang==='ar' ? 'اسم المشروع (عربي):' : 'Project name (Arabic):');
    if (!nameAr) return;
    const nameEn = prompt(state.lang==='ar' ? 'اسم المشروع (إنجليزي):' : 'Project name (English):') || nameAr;
    const p = { id: uid('prj'), nameAr, nameEn, client:'', sector:'software', statusAr:'قيد التنفيذ', statusEn:'In Progress', progress:0, createdAt: todayISO() };
    state.data.projects.push(p);
    state.activeProjectId = p.id;
    saveData(); render();
  },
  deleteProject(id){
    if (!confirm(state.lang==='ar' ? 'حذف المشروع وكل بياناته المرتبطة؟' : 'Delete project and all related data?')) return;
    state.data.projects = state.data.projects.filter(p => p.id !== id);
    state.data.sprints = state.data.sprints.filter(s => s.projectId !== id);
    state.data.backlog = state.data.backlog.filter(b => b.projectId !== id);
    state.data.tasks = state.data.tasks.filter(tk => tk.projectId !== id);
    if (state.activeProjectId === id) state.activeProjectId = state.data.projects[0] ? state.data.projects[0].id : null;
    saveData(); render();
  },
  updateProjectField(id, field, value){
    const p = state.data.projects.find(x=>x.id===id); if(!p) return;
    p[field] = field === 'progress' ? Math.max(0,Math.min(100, Number(value)||0)) : value;
    saveData(); render();
  },

  addBacklogItem(){
    if (!state.activeProjectId) return;
    const title = prompt(state.lang==='ar' ? 'عنوان البند:' : 'Item title:');
    if (!title) return;
    state.data.backlog.push({ id: uid('bl'), projectId: state.activeProjectId, title, points: 3, impact: 3, effort: 3, priority:'medium', createdAt: todayISO() });
    saveData(); render();
  },
  deleteBacklogItem(id){
    state.data.backlog = state.data.backlog.filter(b => b.id !== id);
    saveData(); render();
  },
  updateBacklogField(id, field, value){
    const b = state.data.backlog.find(x=>x.id===id); if(!b) return;
    b[field] = ['points','impact','effort'].includes(field) ? Number(value)||0 : value;
    saveData(); render();
  },
  moveBacklogToSprint(id){
    const sprint = activeSprint();
    if (!sprint) { showToast(t().backlog.noSprint); return; }
    const b = state.data.backlog.find(x=>x.id===id); if(!b) return;
    state.data.tasks.push({ id: uid('tsk'), projectId: state.activeProjectId, sprintId: sprint.id, title: b.title, points: b.points, status:'todo', owner:'', createdAt: todayISO() });
    state.data.backlog = state.data.backlog.filter(x=>x.id!==id);
    saveData(); render();
  },

  addSprint(){
    if (!state.activeProjectId) return;
    const name = prompt(state.lang==='ar' ? 'اسم السباق:' : 'Sprint name:', 'Sprint ' + (projectSprints().length+1));
    if (!name) return;
    const goal = prompt(state.lang==='ar' ? 'هدف السباق:' : 'Sprint goal:') || '';
    const start = todayISO();
    const end = new Date(Date.now() + 14*24*3600*1000).toISOString().slice(0,10);
    const s = { id: uid('spr'), projectId: state.activeProjectId, name, goal, startDate:start, endDate:end, status:'active', createdAt: todayISO() };
    state.data.sprints.push(s);
    state.activeSprintId = s.id;
    saveData(); render();
  },
  setActiveSprint(id){ state.activeSprintId = id; render(); },
  closeSprint(id){
    const s = state.data.sprints.find(x=>x.id===id); if(!s) return;
    s.status = 'closed';
    saveData(); render();
  },
  deleteTask(id){
    state.data.tasks = state.data.tasks.filter(x=>x.id!==id);
    saveData(); render();
  },
  addTask(){
    const sprint = activeSprint();
    if (!sprint) { showToast(t().sprint.noSprint); return; }
    const title = prompt(state.lang==='ar' ? 'عنوان المهمة:' : 'Task title:');
    if (!title) return;
    state.data.tasks.push({ id: uid('tsk'), projectId: state.activeProjectId, sprintId: sprint.id, title, points: 1, status:'todo', owner:'', createdAt: todayISO() });
    saveData(); render();
  },
  moveTask(id, status){
    const tk = state.data.tasks.find(x=>x.id===id); if(!tk) return;
    tk.status = status;
    saveData(); render();
  },

  addStandup(){
    if (!state.activeProjectId) return;
    const member = prompt(state.lang==='ar' ? 'اسم عضو الفريق:' : 'Team member name:');
    if (!member) return;
    const yesterday = prompt(t().events.yesterday) || '';
    const today_ = prompt(t().events.today) || '';
    const blocker = prompt(t().events.blocker) || '';
    state.data.standups.push({ id: uid('su'), projectId: state.activeProjectId, member, yesterday, today: today_, blocker, date: todayISO() });
    saveData(); render();
  },
  deleteStandup(id){ state.data.standups = state.data.standups.filter(x=>x.id!==id); saveData(); render(); },

  addRetro(){
    if (!state.activeProjectId) return;
    const wentWell = prompt(t().events.wentWell) || '';
    const improve = prompt(t().events.improve) || '';
    const actionItems = prompt(t().events.actionItems) || '';
    state.data.retros.push({ id: uid('rt'), projectId: state.activeProjectId, wentWell, improve, actionItems, date: todayISO() });
    saveData(); render();
  },
  deleteRetro(id){ state.data.retros = state.data.retros.filter(x=>x.id!==id); saveData(); render(); },

  addRisk(){
    if (!state.activeProjectId) return;
    const desc = prompt(t().events.riskDesc); if(!desc) return;
    const level = prompt((state.lang==='ar'?'المستوى (عالي/متوسط/منخفض):':'Level (high/medium/low):'), 'medium') || 'medium';
    const mitigation = prompt(t().events.mitigation) || '';
    state.data.risks.push({ id: uid('rk'), projectId: state.activeProjectId, desc, level, mitigation, date: todayISO() });
    saveData(); render();
  },
  deleteRisk(id){ state.data.risks = state.data.risks.filter(x=>x.id!==id); saveData(); render(); },

  addNcr(){
    if (!state.activeProjectId) return;
    const desc = prompt(t().events.ncrDesc); if(!desc) return;
    const corrective = prompt(t().events.corrective) || '';
    state.data.ncrs.push({ id: uid('ncr'), projectId: state.activeProjectId, desc, corrective, status:'open', date: todayISO() });
    saveData(); render();
  },
  toggleNcr(id){
    const n = state.data.ncrs.find(x=>x.id===id); if(!n) return;
    n.status = n.status === 'open' ? 'closed' : 'open';
    saveData(); render();
  },
  deleteNcr(id){ state.data.ncrs = state.data.ncrs.filter(x=>x.id!==id); saveData(); render(); },

  setDocType(type){ state.docType = type; render(); },
  generateDoc(type){
    const proj = activeProject();
    const sprint = activeSprint();
    const doc = { id: uid('doc'), type, date: todayISO(), projectName: proj ? (state.lang==='ar'?proj.nameAr:proj.nameEn) : '', sprintName: sprint ? sprint.name : '' };
    state.data.documents.unshift(doc);
    saveData(); render();
    setTimeout(()=>{ const el = document.getElementById('doc-'+doc.id); if(el) el.scrollIntoView({behavior:'smooth'}); }, 50);
  },
  deleteDoc(id){ state.data.documents = state.data.documents.filter(x=>x.id!==id); saveData(); render(); },

  print(){ window.print(); },

  saveSettings(){
    const url = document.getElementById('sb-url').value.trim();
    const key = document.getElementById('sb-key').value.trim();
    const backupId = document.getElementById('sb-id').value.trim() || 'scrum-agile-default';
    state.settings = { supabaseUrl:url, supabaseKey:key, backupId };
    saveSettings(state.settings);
    showToast(state.lang==='ar' ? 'تم حفظ الإعدادات' : 'Settings saved');
  },
  async backupToCloud(){
    actions.saveSettings();
    const { supabaseUrl, supabaseKey, backupId } = state.settings;
    if (!supabaseUrl || !supabaseKey) { showToast(state.lang==='ar' ? 'أدخل رابط ومفتاح Supabase أولاً' : 'Enter Supabase URL and key first'); return; }
    if (typeof window.supabase === 'undefined') { showToast(state.lang==='ar' ? 'تعذر تحميل مكتبة Supabase' : 'Supabase library failed to load'); return; }
    try {
      const client = window.supabase.createClient(supabaseUrl, supabaseKey);
      const { error } = await client.from('pmo_backups').upsert({ id: backupId, payload: state.data, updated_at: new Date().toISOString() });
      if (error) throw error;
      showToast(state.lang==='ar' ? 'تم رفع النسخة الاحتياطية بنجاح' : 'Backup uploaded successfully');
    } catch(e){
      console.error(e);
      showToast((state.lang==='ar' ? 'فشل الرفع: ' : 'Backup failed: ') + (e.message||e));
    }
  },
  async restoreFromCloud(){
    actions.saveSettings();
    const { supabaseUrl, supabaseKey, backupId } = state.settings;
    if (!supabaseUrl || !supabaseKey) { showToast(state.lang==='ar' ? 'أدخل رابط ومفتاح Supabase أولاً' : 'Enter Supabase URL and key first'); return; }
    if (typeof window.supabase === 'undefined') { showToast(state.lang==='ar' ? 'تعذر تحميل مكتبة Supabase' : 'Supabase library failed to load'); return; }
    if (!confirm(state.lang==='ar' ? 'سيتم استبدال البيانات المحلية الحالية. متابعة؟' : 'This will overwrite local data. Continue?')) return;
    try {
      const client = window.supabase.createClient(supabaseUrl, supabaseKey);
      const { data, error } = await client.from('pmo_backups').select('payload').eq('id', backupId).single();
      if (error) throw error;
      if (data && data.payload) {
        state.data = Object.assign(defaultData(), data.payload);
        state.activeProjectId = state.data.projects[0] ? state.data.projects[0].id : null;
        saveData();
        showToast(state.lang==='ar' ? 'تم الاسترجاع بنجاح' : 'Restored successfully');
        render();
      }
    } catch(e){
      console.error(e);
      showToast((state.lang==='ar' ? 'فشل الاسترجاع: ' : 'Restore failed: ') + (e.message||e));
    }
  },

  exportJSON(){
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scrum-agile-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast(state.lang==='ar' ? 'تم تصدير الملف' : 'File exported');
  },
  triggerImport(){
    const input = document.getElementById('sb-import-file');
    if (input) input.click();
  },
  importJSONFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!confirm(state.lang==='ar' ? 'سيتم استبدال البيانات المحلية الحالية بمحتوى الملف. متابعة؟' : 'This will overwrite current local data with the file contents. Continue?')) return;
        state.data = Object.assign(defaultData(), parsed);
        state.activeProjectId = state.data.projects[0] ? state.data.projects[0].id : null;
        saveData();
        showToast(state.lang==='ar' ? 'تم الاستيراد بنجاح' : 'Imported successfully');
        render();
      } catch(err){
        showToast(state.lang==='ar' ? 'ملف غير صالح' : 'Invalid file');
      }
    };
    reader.readAsText(file);
  },

  setWhatifBoost(val){ state.whatifBoost = Number(val)||0; render(); }
};

/* ---------------- Lightweight search filter (no re-render, keeps focus) ---------------- */
function wireSearch(inputId, itemSelector){
  const input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.querySelectorAll(itemSelector).forEach(el => {
      const txt = (el.dataset.search || '').toLowerCase();
      el.style.display = (!q || txt.includes(q)) ? '' : 'none';
    });
  });
}

function sprintCountdownLabel(T_, sprint){
  if (sprint.status === 'closed') return '';
  const end = new Date(sprint.endDate); const now = new Date(todayISO());

  if (diffDays >= 0) return `• ${T_.sprint.daysLeft}: ${diffDays}`;
  return `• <span class="text-red-400">${T_.sprint.daysOver} ${Math.abs(diffDays)} ${T_.sprint.daysUnit}</span>`;
}

function autoSuggestBanner(T_, sprint){
  if (sprint.status === 'closed') return '';
  const tasks = state.data.tasks.filter(tk => tk.sprintId === sprint.id);
  if (!tasks.length) return '';
  const allDone = tasks.every(tk => tk.status === 'done');
  if (!allDone) return '';
  return `<div class="mt-3 bg-emerald-950 border border-emerald-800 text-emerald-300 text-sm rounded px-3 py-2">${T_.sprint.autoSuggest}</div>`;

function sprintMetrics(sprint){
  if (!sprint) return null;
  const tasks = state.data.tasks.filter(tk=>tk.sprintId===sprint.id);
  const totalPts = tasks.reduce((a,b)=>a+(b.points||0),0);
  const donePts = tasks.filter(tk=>tk.status==='done').reduce((a,b)=>a+(b.points||0),0);
  const remainingPts = totalPts - donePts;
  const start = new Date(sprint.startDate), end = new Date(sprint.endDate), now = new Date(todayISO());
  const totalDays = Math.max(1, Math.round((end-start)/(24*3600*1000)));
  const elapsedDays = Math.max(0, Math.min(totalDays, Math.round((now-start)/(24*3600*1000))));
  const daysLeft = Math.max(0, totalDays - elapsedDays);
  const idealRemaining = Math.max(0, Math.round(totalPts - (totalPts/totalDays)*elapsedDays));
  const avgVelocityPerDay = elapsedDays > 0 ? donePts / elapsedDays : 0;
  return { totalPts, donePts, remainingPts, totalDays, elapsedDays, daysLeft, idealRemaining, avgVelocityPerDay };
}

function whatifResultHTML(T_, m, boost){
  const adjVelocity = m.avgVelocityPerDay * (1 + boost/100);
  const projectedDays = adjVelocity > 0 ? Math.ceil(m.remainingPts / adjVelocity) : (m.remainingPts > 0 ? '∞' : 0);
  const ok = typeof projectedDays === 'number' && projectedDays <= m.daysLeft;
  return `
    <p>${T_.analytics.whatifResult} <b>${projectedDays}</b></p>
    <p>${T_.analytics.whatifDaysLeft} <b>${m.daysLeft}</b></p>
    <p>${T_.analytics.whatifVerdict} <span class="${ok?'text-emerald-400':'text-red-400'}">${ok ? T_.analytics.whatifOk : T_.analytics.whatifShort}</span></p>
  `;
}
function updateWhatifResult(boost){
  state.whatifBoost = boost;
  const sprint = activeSprint();
  const m = sprintMetrics(sprint);
  const box = document.getElementById('whatif-result-box');
  if (box && m) box.innerHTML = whatifResultHTML(t(), m, boost);
  const label = document.getElementById('whatif-boost-value');
  if (label) label.textContent = boost + '%';
}

function renderAnalytics(T_, proj){
  const sprint = activeSprint();
  const m = sprintMetrics(sprint);
  const predictionCard = m ? card(`
    <h3 class="font-bold text-cyan-300 mb-2">${T_.analytics.predictionTitle}</h3>
    <p class="text-sm ${m.remainingPts > m.idealRemaining ? 'text-amber-400' : 'text-emerald-400'}">
      ${m.remainingPts > m.idealRemaining ? T_.analytics.atRisk + ' ' + (m.remainingPts - m.idealRemaining) + ' ' + T_.analytics.pts : T_.analytics.onTrack}
    </p>
  `) : '';
  const whatifCard = m ? card(`
    <h3 class="font-bold text-cyan-300 mb-3">${T_.analytics.whatifTitle}</h3>
    <label class="text-xs text-slate-500">${T_.analytics.boostLabel}: <span id="whatif-boost-value">${state.whatifBoost}%</span></label>

    <div class="text-sm text-slate-300 mt-3" id="whatif-result-box">${whatifResultHTML(T_, m, state.whatifBoost)}</div>
  `) : '';
  return `
  <div class="space-y-6">
    ${card(`<h3 class="font-bold text-cyan-300 mb-4">${T_.analytics.velocity}</h3><canvas id="chart-velocity" height="90"></canvas>`)}
    ${card(`<h3 class="font-bold text-cyan-300 mb-4">${T_.analytics.burndown}</h3><canvas id="chart-burndown" height="90"></canvas>`)}
    ${predictionCard}
    ${whatifCard}
  </div>
  `;
}

  const sprints = projectSprints();

    velocityChartInstance = new Chart(velCtx, {
      type:'bar',
      data:{ labels:velLabels, datasets:[{ label: T_.analytics.velocity, data: velData, backgroundColor:'#22d3ee' }] },
      options:{ plugins:{legend:{labels:{color:'#cbd5e1'}}}, scales:{ x:{ticks:{color:'#94a3b8'}}, y:{ticks:{color:'#94a3b8'}} } }
    });
  }
  // Burndown: for active sprint, remaining points per status snapshot (simplified: today snapshot only, ideal line)
  const sprint = activeSprint();
  const burnCtx = document.getElementById('chart-burndown');
  if (burnCtx && sprint){
    const tasks = state.data.tasks.filter(tk=>tk.sprintId===sprint.id);
    const totalPts = tasks.reduce((a,b)=>a+(b.points||0),0);
    const remainingPts = tasks.filter(tk=>tk.status!=='done').reduce((a,b)=>a+(b.points||0),0);
    const start = new Date(sprint.startDate), end = new Date(sprint.endDate);
    const days = Math.max(1, Math.round((end-start)/(24*3600*1000)));
    const idealLabels = []; const idealData = []; const actualData = [];
    for (let i=0;i<=days;i++){
      idealLabels.push('D'+i);
      idealData.push(Math.max(0, Math.round(totalPts - (totalPts/days)*i)));
      actualData.push(i === days ? remainingPts : (i===0 ? totalPts : null));
    }
    if (burndownChartInstance) burndownChartInstance.destroy();
    burndownChartInstance = new Chart(burnCtx, {
      type:'line',
      data:{ labels: idealLabels, datasets:[
        { label: state.lang==='ar'?'المثالي':'Ideal', data: idealData, borderColor:'#64748b', borderDash:[5,5], fill:false },
        { label: state.lang==='ar'?'الفعلي':'Actual', data: actualData, borderColor:'#22d3ee', fill:false, spanGaps:true }
      ]},
      options:{ plugins:{legend:{labels:{color:'#cbd5e1'}}}, scales:{ x:{ticks:{color:'#94a3b8'}}, y:{ticks:{color:'#94a3b8'}} } }
    });
  }
}

function projectRiskStatus(p){
  const sprints = state.data.sprints.filter(s=>s.projectId===p.id);
  const openRisks = state.data.risks.filter(r=>r.projectId===p.id && r.level==='high').length;
  const openNcrs = state.data.ncrs.filter(n=>n.projectId===p.id && n.status==='open').length;
  let overdueSprint = false;
  sprints.forEach(s => {
    if (s.status !== 'closed' && new Date(s.endDate) < new Date(todayISO())) overdueSprint = true;
  });
  if (openRisks > 0 || overdueSprint || openNcrs >= 2) return 'red';
  if (openNcrs > 0 || p.progress < 40) return 'yellow';
  return 'green';
}

function renderWarRoom(T_){
  const colorMap = { green:'bg-emerald-950 border-emerald-800 text-emerald-300', yellow:'bg-amber-950 border-amber-800 text-amber-300', red:'bg-red-950 border-red-800 text-red-300' };
  const dotMap = { green:'🟢', yellow:'🟡', red:'🔴' };
  const cards = state.data.projects.map(p => {
    const status = projectRiskStatus(p);
    const sprints = state.data.sprints.filter(s=>s.projectId===p.id);
    const openRisks = state.data.risks.filter(r=>r.projectId===p.id && r.level==='high').length;
    const openNcrs = state.data.ncrs.filter(n=>n.projectId===p.id && n.status==='open').length;
    return `
      <div class="rounded-xl border p-4 ${colorMap[status]}">
        <div class="flex justify-between items-center mb-2">
          <h4 class="font-bold">${dotMap[status]} ${esc(state.lang==='ar'?p.nameAr:p.nameEn)}</h4>
          <span class="text-xs">${T_.warroom[status]}</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2 mb-2">
          <div class="bg-current h-2 rounded-full" style="width:${p.progress}%"></div>
        </div>
        <div class="text-xs flex gap-4 flex-wrap opacity-90">
          <span>${T_.warroom.sprints}: ${sprints.length}</span>
          <span>${T_.warroom.openRisks}: ${openRisks}</span>
          <span>${T_.warroom.openNcrs}: ${openNcrs}</span>
        </div>
      </div>
    `;
  }).join('');
  return card(`
    <h2 class="text-xl font-bold text-cyan-300 mb-4">${T_.warroom.title}</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${cards || `<p class="text-slate-500 text-sm">${T_.common.none}</p>`}
    </div>
  `);
}

/* ---------------- Event wiring ---------------- */
function attachHandlers(){
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  const btnLang = $('#btn-lang'); if (btnLang) btnLang.onclick = () => actions.setLang(state.lang==='ar'?'en':'ar');
  const btnPrint = $('#btn-print'); if (btnPrint) btnPrint.onclick = actions.print;

  $$('.tab-btn').forEach(b => b.onclick = () => actions.setTab(b.dataset.tab));

  const projSel = $('#active-project-select'); if (projSel) projSel.onchange = (e) => actions.setActiveProject(e.target.value);

  // Dashboard
  const addProjBtn = $('#btn-add-project'); if (addProjBtn) addProjBtn.onclick = actions.addProject;
  $$('.btn-set-active').forEach(b => b.onclick = () => actions.setActiveProject(b.dataset.id));
  $$('.btn-del-project').forEach(b => b.onclick = () => actions.deleteProject(b.dataset.id));
  $$('.inline-edit').forEach(el => {
    el.onchange = () => actions.updateProjectField(el.dataset.id, el.dataset.field, el.value);
  });
  $$('.inline-edit-range').forEach(el => {
    el.onchange = () => actions.updateProjectField(el.dataset.id, el.dataset.field, el.value);
  });

  // Backlog
  const addBLBtn = $('#btn-add-backlog'); if (addBLBtn) addBLBtn.onclick = actions.addBacklogItem;
  $$('.btn-to-sprint').forEach(b => b.onclick = () => actions.moveBacklogToSprint(b.dataset.id));
  $$('.btn-del-backlog').forEach(b => b.onclick = () => actions.deleteBacklogItem(b.dataset.id));
  wireSearch('backlog-search-input', '.backlog-row');

  // Sprint
  const sprintSel = $('#sprint-select'); if (sprintSel) sprintSel.onchange = (e) => actions.setActiveSprint(e.target.value);
  const addSprintBtn = $('#btn-add-sprint'); if (addSprintBtn) addSprintBtn.onclick = actions.addSprint;
  const addTaskBtn = $('#btn-add-task'); if (addTaskBtn) addTaskBtn.onclick = actions.addTask;
  const closeSprintBtn = $('#btn-close-sprint'); if (closeSprintBtn) closeSprintBtn.onclick = () => actions.closeSprint(closeSprintBtn.dataset.id);
  $$('.btn-del-task').forEach(b => b.onclick = () => actions.deleteTask(b.dataset.id));
  $$('.task-card').forEach(el => { el.addEventListener('dragstart', (ev)=>onDragStart(ev, el.dataset.task)); });
  $$('.kanban-col').forEach(el => {
    el.addEventListener('dragover', onDragOver);
    el.addEventListener('drop', (ev)=>onDrop(ev, el.dataset.col));
  });
  wireSearch('task-search-input', '.task-card');

  // Events
  const addStandupBtn = $('#btn-add-standup'); if (addStandupBtn) addStandupBtn.onclick = actions.addStandup;
  $$('.btn-del-standup').forEach(b => b.onclick = () => actions.deleteStandup(b.dataset.id));
  const addRetroBtn = $('#btn-add-retro'); if (addRetroBtn) addRetroBtn.onclick = actions.addRetro;
  $$('.btn-del-retro').forEach(b => b.onclick = () => actions.deleteRetro(b.dataset.id));
  const addRiskBtn = $('#btn-add-risk'); if (addRiskBtn) addRiskBtn.onclick = actions.addRisk;
  $$('.btn-del-risk').forEach(b => b.onclick = () => actions.deleteRisk(b.dataset.id));
  const addNcrBtn = $('#btn-add-ncr'); if (addNcrBtn) addNcrBtn.onclick = actions.addNcr;
  $$('.btn-toggle-ncr').forEach(b => b.onclick = () => actions.toggleNcr(b.dataset.id));
  $$('.btn-del-ncr').forEach(b => b.onclick = () => actions.deleteNcr(b.dataset.id));

  // Docs
  $$('.btn-gen-doc').forEach(b => b.onclick = () => actions.generateDoc(b.dataset.type));
  $$('.btn-del-doc').forEach(b => b.onclick = () => actions.deleteDoc(b.dataset.id));

  // Backup
  const saveSettingsBtn = $('#btn-save-settings'); if (saveSettingsBtn) saveSettingsBtn.onclick = actions.saveSettings;
  const backupBtn = $('#btn-backup'); if (backupBtn) backupBtn.onclick = actions.backupToCloud;
  const restoreBtn = $('#btn-restore'); if (restoreBtn) restoreBtn.onclick = actions.restoreFromCloud;
  const exportBtn = $('#btn-export-json'); if (exportBtn) exportBtn.onclick = actions.exportJSON;
  const importBtn = $('#btn-import-json'); if (importBtn) importBtn.onclick = actions.triggerImport;
  const importFile = $('#sb-import-file'); if (importFile) importFile.onchange = (e) => actions.importJSONFile(e.target.files[0]);

  // Analytics what-if
  const whatifInput = $('#whatif-boost-input'); if (whatifInput) whatifInput.oninput = (e) => updateWhatifResult(Number(e.target.value)||0);
}

/* ---------------- init ---------------- */
document.documentElement.lang = state.lang;
document.documentElement.dir = 'rtl';
render();
</script>
