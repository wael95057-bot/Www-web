<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>منصة صياغة عقود الفيديك | FIDIC Contract Drafter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16222E;
    --navy:#0E2A44;
    --navy-2:#163A5C;
    --navy-3:#1F4E79;
    --paper:#F6F5F1;
    --paper-2:#FFFFFF;
    --line:#DCD8CC;
    --steel:#748094;
    --amber:#D98E2B;
    --amber-ink:#5C3B0C;
    --success:#3F7A5C;
    --success-bg:#E9F2ED;
    --border:#D8D4C8;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  [dir="ltr"] body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== Header ===== */
  header.topbar{
    position:sticky;top:0;z-index:40;
    background:var(--navy);
    color:#EAF0F5;
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;
    border-bottom:3px solid var(--amber);
  }
  .hamburger{
    display:none;
    background:transparent;border:1px solid rgba(255,255,255,.25);
    border-radius:var(--radius);
    width:38px;height:38px;
    flex:0 0 auto;
    align-items:center;justify-content:center;
    color:#EAF0F5;
  }
  .hamburger span{display:block;width:18px;height:2px;background:#EAF0F5;position:relative;}
  .hamburger span::before,.hamburger span::after{content:"";position:absolute;right:0;left:0;width:18px;height:2px;background:#EAF0F5;}
  .hamburger span::before{top:-6px;}
  .hamburger span::after{top:6px;}

  .brand{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0;}
  .brand .mark{display:flex;align-items:center;gap:8px;}
  .brand .mark .sq{width:10px;height:10px;background:var(--amber);flex:0 0 auto;}
  .brand strong{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand small{font-size:11px;color:#AFC1D1;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;text-transform:uppercase;}

  .langtoggle{
    flex:0 0 auto;
    display:flex;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:999px;overflow:hidden;
  }
  .langtoggle button{
    border:0;background:transparent;color:#CBD8E3;
    padding:7px 12px;font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;
    letter-spacing:.5px;
  }
  .langtoggle button.active{background:var(--amber);color:var(--amber-ink);}

  /* ===== Layout ===== */
  .app{display:flex;align-items:flex-start;min-height:calc(100vh - 62px);}
  .sidebar{
    width:280px;flex:0 0 280px;
    background:var(--navy);
    color:#DCE6EE;
    min-height:calc(100vh - 62px);
    padding:18px 14px 40px;
    position:sticky;top:62px;
    border-inline-end:3px solid var(--border);
  }
  .sidebar .sheet-label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:#7E93A6;margin:4px 6px 10px;
  }
  .steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .steplist li{}
  .steplist button{
    width:100%;text-align:inherit;
    display:flex;align-items:center;gap:10px;
    background:transparent;border:0;border-inline-start:3px solid transparent;
    color:#C4D2DE;padding:11px 10px;border-radius:2px;font-size:13.5px;
  }
  .steplist button .num{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    width:24px;height:24px;border:1px solid #3C5D78;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#9FB4C6;
  }
  .steplist button.active{background:var(--navy-2);border-inline-start-color:var(--amber);color:#fff;}
  .steplist button.active .num{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);}
  .steplist button:not(.active):hover{background:rgba(255,255,255,.05);}

  .backdrop{display:none;position:fixed;inset:0;background:rgba(10,18,28,.5);z-index:30;}

  main{flex:1;min-width:0;padding:22px 26px 60px;max-width:920px;margin:0 auto;}

  /* ===== Title block (signature element) ===== */
  .titleblock{
    background:var(--paper-2);border:1px solid var(--border);
    margin-bottom:20px;overflow:hidden;
    display:grid;grid-template-columns:1.3fr 1.3fr .9fr .7fr;
  }
  .titleblock .cell{
    border-inline-start:1px solid var(--border);
    padding:9px 12px;min-width:0;overflow:hidden;
  }
  .titleblock .cell:first-child{border-inline-start:0;}
  .titleblock .cell .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:3px;}
  .titleblock .cell .v{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .titleblock .cell.sheet{background:var(--navy);border-inline-start-color:var(--navy);}
  .titleblock .cell.sheet .k{color:#8FA6BA;}
  .titleblock .cell.sheet .v{color:#fff;font-family:'IBM Plex Mono',monospace;}

  /* ===== Content card ===== */
  .card{background:var(--paper-2);border:1px solid var(--border);padding:22px 20px;margin-bottom:18px;}
  .card + .card{margin-top:0;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--amber-ink);background:#FBF0DC;display:inline-block;padding:3px 8px;margin-bottom:10px;}
  h1.stitle{font-size:20px;margin:0 0 4px;font-weight:700;}
  p.ssub{color:var(--steel);font-size:13.5px;margin:0 0 18px;line-height:1.6;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  @media (max-width:640px){.grid2{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--navy);}
  .field .hint{font-size:11.5px;color:var(--steel);}
  .field input[type=text],.field input[type=date],.field select,.field textarea{
    border:1px solid var(--border);background:var(--paper);
    padding:10px 11px;font-size:14px;font-family:inherit;color:var(--ink);
    border-radius:2px;width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy-3);outline-offset:0;border-color:var(--navy-3);}
  .field textarea{resize:vertical;min-height:110px;line-height:1.7;}

  .doc-preview{
    background:#FCFBF8;border:1px dashed var(--border);
    padding:18px;white-space:pre-wrap;line-height:2;font-size:13.5px;
    max-height:60vh;overflow:auto;font-family:'IBM Plex Mono',monospace;
  }
  [dir="rtl"] .doc-preview{font-family:'IBM Plex Sans Arabic',monospace;}

  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .btn{
    border:1px solid var(--navy);background:var(--navy);color:#fff;
    padding:10px 18px;font-size:13.5px;font-weight:600;border-radius:2px;
  }
  .btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);}
  .btn.ghost{background:transparent;color:var(--navy);}
  .btn:active{transform:translateY(1px);}

  .notice{background:var(--success-bg);border-inline-start:3px solid var(--success);color:#204436;padding:11px 14px;font-size:13px;margin-top:14px;line-height:1.6;}
  .info{background:#EAF1F7;border-inline-start:3px solid var(--navy-3);color:#122E44;padding:11px 14px;font-size:13px;margin-top:6px;line-height:1.6;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px;}
  .chip{
    border:1px solid var(--navy-3);color:var(--navy-3);background:#fff;
    padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
  }
  .chip:hover{background:#EAF1F7;}

  ul.bullets{margin:0;padding-inline-start:20px;font-size:13.5px;line-height:1.9;color:var(--ink);}
  ul.bullets li{margin-bottom:6px;}
  ul.bullets b{color:var(--navy);}

  .signoff{
    display:flex;justify-content:flex-end;align-items:center;gap:8px;
    margin:14px 2px 0;padding-top:12px;border-top:1px dashed var(--border);
    font-size:12px;color:var(--steel);
  }
  .signoff strong{font-family:'IBM Plex Mono',monospace;color:var(--navy);font-size:12.5px;letter-spacing:.3px;}
  .signoff .stampbox{border:1px solid var(--navy-3);color:var(--navy-3);padding:3px 8px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;}

  .templaterow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:4px 0 16px;}
  .templaterow .field{flex:1;min-width:200px;margin-bottom:0;}

  .clausetable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  .clausetable tr{border-bottom:1px solid var(--border);}
  .clausetable td{padding:9px 8px;vertical-align:top;}
  .clausetable td.cnum{
    width:34px;font-family:'IBM Plex Mono',monospace;font-weight:700;color:#fff;
    background:var(--navy);text-align:center;border-radius:2px;
  }
  .clausetable td.ctitle{font-weight:600;color:var(--navy);width:38%;}
  .clausetable td.cdesc{color:var(--ink);}

  /* ===== 6 Key clauses to customize (Screen 5) ===== */
  .keyclause-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 20px;}
  @media (max-width:760px){.keyclause-grid{grid-template-columns:1fr;}}
  .keyclause-card{
    background:#FCFBF8;border:1px solid var(--border);border-inline-start:3px solid var(--amber);
    padding:14px 14px 14px;display:flex;flex-direction:column;
  }
  .kc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .kc-num{
    width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:var(--navy);color:#fff;
    font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .kc-ref{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--steel);}
  .keyclause-card h3{font-size:14px;margin:0 0 8px;color:var(--navy);font-weight:700;line-height:1.4;}
  .kc-gap{font-size:12px;color:var(--amber-ink);background:#FBF0DC;padding:7px 9px;margin-bottom:9px;line-height:1.6;}
  .kc-gap b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;color:var(--amber-ink);}
  .kc-custom-label{font-size:11.5px;font-weight:700;color:var(--navy-3);margin-bottom:4px;}
  .keyclause-card ul{margin:0 0 12px;padding-inline-start:18px;font-size:12.5px;line-height:1.75;color:var(--ink);flex:1;}
  .keyclause-card ul li{margin-bottom:4px;}
  .kc-add{width:100%;font-size:12.5px;padding:9px 12px;margin-top:auto;}

  /* ===== Final output — Screen 8 master document ===== */
  .masterdoc{background:#fff;border:1px solid var(--border);overflow:hidden;margin-bottom:2px;}
  .mdoc-head{background:var(--navy);color:#EAF0F5;padding:20px 22px 16px;border-bottom:3px solid var(--amber);}
  .mdoc-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#AFC1D1;}
  .mdoc-head h2{margin:8px 0 4px;font-size:18px;font-weight:700;color:#fff;line-height:1.4;}
  .mdoc-sub{font-size:12.5px;color:#CBD8E3;}
  .msum{padding:16px 22px;border-bottom:1px solid var(--border);background:#FCFBF8;}
  .msum-title{font-weight:700;color:var(--navy);font-size:13px;margin-bottom:10px;}
  .msum-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;}
  @media (max-width:640px){.msum-grid{grid-template-columns:1fr;}}
  .msum-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px dotted var(--border);padding-bottom:5px;}
  .msum-k{color:var(--steel);white-space:nowrap;}
  .msum-v{font-weight:600;color:var(--ink);text-align:end;}
  .msec{padding:16px 22px;border-bottom:1px solid var(--border);}
  .msec:last-of-type{border-bottom:0;}
  .msec-title{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--navy);padding-inline-start:10px;border-inline-start:3px solid var(--amber);}
  .msec-body{font-size:13px;line-height:1.9;color:var(--ink);white-space:pre-wrap;}
  .mdoc-foot{padding:14px 22px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--steel);background:#FCFBF8;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:3px;
    font-size:13px;border-inline-start:3px solid var(--amber);
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== Print / Export PDF (Final Output only) ===== */
  @media print{
    body *{visibility:hidden;}
    .masterdoc, .masterdoc *{visibility:visible;}
    .masterdoc{position:absolute;inset:0 0 auto 0;width:100%;border:0;}
    .mdoc-head{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

  .footnav{display:flex;justify-content:space-between;margin-top:22px;}

  /* Mobile */
  @media (max-width:900px){
    .sidebar{
      position:fixed;top:0;bottom:0;inset-inline-start:0;
      transform:translateX(-105%);
      transition:transform .22s ease;
      z-index:35;width:82%;max-width:320px;
      padding-top:70px;box-shadow:2px 0 18px rgba(0,0,0,.25);
    }
    [dir="rtl"] .sidebar{transform:translateX(105%);}
    .sidebar.open{transform:translateX(0);}
    .hamburger{display:flex;}
    main{padding:16px 14px 50px;}
    .titleblock{grid-template-columns:1fr 1fr;}
    .titleblock .cell.sheet{grid-column:span 2;display:flex;justify-content:space-between;align-items:center;}
    .brand strong{font-size:13.5px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="menu"><span></span></button>
  <div class="brand">
    <div class="mark"><span class="sq"></span><strong id="brandTitle">منصة صياغة عقود الفيديك</strong></div>
    <small id="brandSub">FIDIC CONTRACT DRAFTER</small>
  </div>
  <div class="langtoggle">
    <button id="btnAr">AR</button>
    <button id="btnEn">EN</button>
  </div>
</header>

<div class="backdrop" id="backdrop"></div>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="sheet-label" id="sidebarLabel">مجموعة المستندات — ٨ شاشات</div>
    <ul class="steplist" id="steplist"></ul>
  </nav>

  <main id="mainContent"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const FIDIC_BOOKS = {
  red:   {ar:{label:"الكتاب الأحمر (Red Book 1999/2017)", desc:"تشييد الأعمال المدنية بتصميم المالك — عقد قياس (Measurement Contract)، حيث يُصمم المشروع من قِبَل المهندس/المالك ويتولى المقاول التنفيذ فقط."},
          en:{label:"Red Book (1999/2017)", desc:"Construction of civil works designed by the Employer — a measurement contract where the Engineer/Employer designs and the Contractor builds."}},
  yellow:{ar:{label:"الكتاب الأصفر (Yellow Book 1999/2017)", desc:"تصميم وتشييد (Plant & Design-Build) — يتولى المقاول تصميم وتوريد وتنفيذ الأعمال طبقاً لمتطلبات المالك."},
          en:{label:"Yellow Book (1999/2017)", desc:"Plant & Design-Build — the Contractor designs, supplies and executes the works to the Employer's Requirements."}},
  silver:{ar:{label:"الكتاب الفضي (Silver Book 2017)", desc:"تسليم مفتاح EPC / تمويل وشمول — يتحمل المقاول القدر الأكبر من المخاطر مقابل سعر ومدة شبه ثابتين، ومناسب لمشاريع التمويل الذاتي."},
          en:{label:"Silver Book (2017)", desc:"EPC / Turnkey — the Contractor bears the greater share of risk for a largely fixed price and time; common in privately-financed projects."}},
  green: {ar:{label:"الكتاب الأخضر (Green Book)", desc:"صيغة مختصرة للمشاريع قصيرة الأجل وصغيرة أو بسيطة القيمة، ببنود مبسطة وإدارة أخف."},
          en:{label:"Green Book", desc:"Short Form of Contract for small-value or short-duration works, with simplified clauses and lighter administration."}},
  pink:  {ar:{label:"الكتاب البنفسجي (Pink Book)", desc:"نسخة منسّقة لمشاريع بنوك التنمية متعددة الأطراف (MDB Harmonised Edition)، متوافقة مع اشتراطات التمويل الدولي."},
          en:{label:"Pink Book", desc:"MDB Harmonised Edition for projects financed by multilateral development banks, aligned with international procurement rules."}}
};

const DEFAULTS = {
  ar:{ name:"مشروع إنشاء مبنى إداري", employer:"شركة الاستثمار العقاري الكبرى", contractor:"شركة المقاولات الهندسية الحديثة",
      engineer:"مكتب الاستشاريون العرب للتصميم والإشراف", date:"2026-08-16", price:"٥٬٠٠٠٬٠٠٠ دولار أمريكي",
      currency:"دولار أمريكي (USD) بالإضافة إلى جنيه مصري (EGP)", duration:"18 شهراً",
      tenderDate:"2026-05-10", letterNo:"LOA-2026-014", approvedValue:"٤٬٩٥٠٬٠٠٠ دولار أمريكي بعد التفاوض",
      tenderNotes:"العطاء مطابق للمواصفات الفنية، وتمت مراجعته وتدقيقه مالياً من لجنة البت.",
      specialConditions:"١. تعديل أسعار المواد المحلية بمعادلة تصحيح سعرية.\n٢. غرامة تأخير قدرها 0.1% من قيمة العقد يومياً، بحد أقصى 10%.\n٣. تُصرف الدفعات المستحقة خلال 28 يوماً من تاريخ اعتماد المستخلص.",
      technicalSpecs:"المواصفات الفنية القياسية للأعمال الإنشائية والمعمارية والتشطيبات وفق الكود المصري لتصميم وتنفيذ المنشآت الخرسانية، بالإضافة إلى مواصفات ASTM/ACI الأمريكية حيثما ينطبق." },
  en:{ name:"Administrative Building Construction Project", employer:"Grand Real-Estate Investment Co.", contractor:"Modern Engineering Contracting Co.",
      engineer:"Arab Consulting Office for Design & Supervision", date:"2026-08-16", price:"USD 5,000,000",
      currency:"US Dollar (USD) plus Egyptian Pound (EGP)", duration:"18 months",
      tenderDate:"2026-05-10", letterNo:"LOA-2026-014", approvedValue:"USD 4,950,000 after negotiation",
      tenderNotes:"The tender complies with the technical specifications and has been technically and financially reviewed by the evaluation committee.",
      specialConditions:"1. Local material price adjustment by a correction formula.\n2. Delay damages of 0.1% of the Contract Price per day, capped at 10%.\n3. Certified payments to be released within 28 days of interim certificate approval.",
      technicalSpecs:"Standard technical specifications for structural, architectural and finishing works, in accordance with the Egyptian Code for Design and Construction of Concrete Structures, supplemented by ASTM/ACI standards where applicable." }
};

const GENERAL_CLAUSES = [
  {ar:{title:"أحكام عامة",desc:"التعريفات، لغة العقد والقانون الحاكم، الإخطارات، وأولوية المستندات."}, en:{title:"General Provisions",desc:"Definitions, governing law and language, notices, and priority of documents."}},
  {ar:{title:"المالك (Employer)",desc:"حق الدخول للموقع، تصاريح المالك، وتعيين موظفي المالك بالموقع."}, en:{title:"The Employer",desc:"Right of access to the site, Employer's permits, and Employer's personnel."}},
  {ar:{title:"المهندس (Engineer)",desc:"واجبات وصلاحيات المهندس، التفويض، والتعليمات الصادرة عنه."}, en:{title:"The Engineer",desc:"Engineer's duties and authority, delegation, and instructions."}},

function stripBracketHeading(txt){
  return (txt||'').replace(/^\[[^\]]*\]\n\n/,'');
}

function renderMasterHTML(){
  const ar = state.lang==='ar';
  const t = T[state.lang].docHeadings;
  const meta = masterMeta().map(m=>`<div class="msum-row"><span class="msum-k">${esc(m.k)}</span><span class="msum-v">${esc(m.v)}</span></div>`).join('');
  const sec = (title,body)=>`<div class="msec"><h3 class="msec-title">${esc(title)}</h3><div class="msec-body">${esc(body)}</div></div>`;
  const generalBody = `${ar?'تُطبَّق الشروط العامة القياسية الخاصة بـ':'The standard General Conditions of'} ${fidicLabel()}.\n${fidicDesc()}`;
  return `
    <div class="masterdoc" id="masterPreview">
      <div class="mdoc-head">
        <span class="mdoc-eyebrow">${ar?'مستند تعاقدي موحّد — إخراج نهائي':'UNIFIED CONTRACT DOCUMENT — FINAL OUTPUT'}</span>
        <h2>${esc(fieldVal('name'))}</h2>
        <div class="mdoc-sub">${esc(fidicLabel())}</div>
      </div>

        <div class="msum-title">${esc(t.secProject)}</div>

      <div class="mdoc-foot">${esc(t.end)} — PM/ Wael Ewis · ${esc(fieldVal('date'))}</div>

}

  return `
    <div class="card">
      <span class="eyebrow">${s.eyebrow}</span>
      <h1 class="stitle">${s.title}</h1>
      <p class="ssub">${s.sub}</p>

      <p style="font-weight:600;font-size:14.5px;margin:0 0 4px;color:var(--navy);">${s.keyTitle}</p>
      <p class="hint" style="font-size:12.5px;color:var(--steel);margin:0 0 12px;">${s.keyHint}</p>
      <div class="keyclause-grid">${keyCards}</div>

      <p style="font-weight:600;font-size:13.5px;margin:0 0 4px;color:var(--navy);">${s.templateLabel}</p>
      <p class="hint" style="font-size:12.5px;color:var(--steel);margin:0 0 10px;">${s.templateHint}</p>
      <div class="templaterow">
        <div class="field">
          <select onchange="state.projectType=this.value;">${projOpts}</select>
        </div>
        <button class="btn" onclick="applyProjectTemplate()">${s.applyBtn}</button>
      </div>

      <div class="hint" style="margin-bottom:6px;font-size:12.5px;color:var(--steel);">${s.libLabel}</div>
      <div class="chips">${chips}</div>
      <div class="field"><label>${s.lconds}</label>
        <textarea id="specialTextarea" oninput="setField('specialConditions',this.value)" rows="8">${esc(fieldVal('specialConditions'))}</textarea>
      </div>
      <div class="info">${s.info}</div>
    </div>`;
}

function renderStep6(){
  const s = T[state.lang].s6;
  const rows = GENERAL_CLAUSES.map((c,i)=>{
    const n = i+1;
    const cl = c[state.lang];
    return `<tr><td class="cnum mono">${n}</td><td class="ctitle">${esc(cl.title)}</td><td class="cdesc">${esc(cl.desc)}</td></tr>`;
  }).join('');
  return `
    <div class="card">
      <span class="eyebrow">${s.eyebrow}</span>
      <h1 class="stitle">${s.title}</h1>
      <p class="ssub">${s.sub}</p>
      <div class="info"><b>${s.selected}:</b> ${fidicLabel()}<br>${fidicDesc()}</div>
      <p style="font-weight:600;font-size:13.5px;margin:18px 0 4px;color:var(--navy);">${s.structTitle}</p>
      <table class="clausetable">${rows}</table>
    </div>`;
}

function renderStep7(){
  const s = T[state.lang].s7;
  return `
    <div class="card">
      <span class="eyebrow">${s.eyebrow}</span>
      <h1 class="stitle">${s.title}</h1>
      <p class="ssub">${s.sub}</p>
      <div class="field"><label>${s.lspecs}</label>
        <textarea oninput="setField('technicalSpecs',this.value)" rows="6">${esc(fieldVal('technicalSpecs'))}</textarea>
      </div>
      <ul class="bullets">
        <li><b>${s.dTitle}:</b> ${s.dDesc}</li>
        <li><b>${s.bTitle}:</b> ${s.bDesc}</li>
      </ul>
    </div>`;
}

function renderStep8(){
  const s = T[state.lang].s8;
  return `
    <div class="card">
      <span class="eyebrow">${s.eyebrow}</span>
      <h1 class="stitle">${s.title}</h1>
      <p class="ssub">${s.sub}</p>
      <p style="font-weight:600;font-size:13.5px;margin:0 0 8px;color:var(--navy);">${s.previewTitle}</p>
      ${renderMasterHTML()}
      <div class="btnrow">
        <button class="btn amber" onclick="copyMaster()">${s.copy}</button>
        <button class="btn" onclick="downloadMaster()">${s.download}</button>
        <button class="btn ghost" onclick="printMaster()">${s.print}</button>
      </div>
      <div class="notice">${s.notice}</div>
    </div>`;
}

const STEP_RENDERERS = [renderStep1,renderStep2,renderStep3,renderStep4,renderStep5,renderStep6,renderStep7,renderStep8];

function appendClause(i){
  const txt = CLAUSE_LIBRARY[i][state.lang];
  const current = fieldVal('specialConditions');
  const sep = current && !current.endsWith('\n') ? '\n' : '';
  setField('specialConditions', current + sep + '• ' + txt);
  render();
}

function appendKeyClause(i){
  const item = KEY_CLAUSES[i][state.lang];
  const current = fieldVal('specialConditions');
  const sep = current && !current.endsWith('\n') ? '\n\n' : '\n';
  setField('specialConditions', current + sep + item.insertText);
  render();
  showToast(state.lang==='ar' ? 'تمت إضافة البند إلى نص الشروط الخاصة' : 'Clause added to the Particular Conditions text');
}

function applyProjectTemplate(){
  const type = state.projectType || Object.keys(PROJECT_TEMPLATES)[0];
  const tpl = PROJECT_TEMPLATES[type];
  const headingAr = `— بنود خاصة بمشروع: ${tpl.ar.label} —`;
  const headingEn = `— Particular conditions for: ${tpl.en.label} —`;
  const block = state.lang==='ar' ? `${headingAr}\n${tpl.ar_text}` : `${headingEn}\n${tpl.en_text}`;
  const current = fieldVal('specialConditions');
  const sep = current && !current.endsWith('\n') ? '\n\n' : '\n';
  setField('specialConditions', current + sep + block);
  render();
}

let toastTimer=null;
function showToast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

function copyMaster(){
  const content = masterText();
  const done = ()=>showToast(T[state.lang].s8.copied);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(content).then(done).catch(()=>fallbackCopy(content,done));
  } else {
    fallbackCopy(content,done);
  }
}
function fallbackCopy(text,cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

function downloadMaster(){
  const content = masterText();
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = state.lang==='ar' ? 'العقد_النهائي.txt' : 'Master_Contract.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function printMaster(){
  window.print();
}

/* ============ SHELL RENDER ============ */
function renderShell(){
  const L = T[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl':'ltr';
  document.getElementById('brandTitle').textContent = L.brand;
  document.getElementById('brandSub').textContent = L.brandSub;
  document.getElementById('sidebarLabel').textContent = L.sidebarLabel;
  document.getElementById('btnAr').classList.toggle('active', state.lang==='ar');
  document.getElementById('btnEn').classList.toggle('active', state.lang==='en');

  const steplist = document.getElementById('steplist');
  steplist.innerHTML = L.steps.map((name,idx)=>{
    const n = idx+1;
    return `<li><button class="${state.step===n?'active':''}" onclick="goStep(${n})">
      <span class="num">${n}</span><span>${name}</span>
    </button></li>`;
  }).join('');
}

function renderTitleblock(){
  const L = T[state.lang];
  return `
    <div class="titleblock">
      <div class="cell"><span class="k">${L.tb.project}</span><span class="v">${esc(fieldVal('name'))}</span></div>
      <div class="cell"><span class="k">${L.tb.fidic}</span><span class="v">${fidicLabel()}</span></div>
      <div class="cell"><span class="k">${L.tb.date}</span><span class="v mono">${esc(fieldVal('date'))}</span></div>
      <div class="cell sheet"><span class="k">${L.tb.sheet}</span><span class="v">${L.sheetOf(state.step)}</span></div>
    </div>`;
}

function renderSignoff(){
  const L = T[state.lang];
  return `<div class="signoff">
      <span>${L.preparedBy}:</span> <strong>PM/ Wael Ewis</strong>
      <span class="stampbox">${L.sheetOf(state.step)}</span>
    </div>`;
}

function render(){
  renderShell();
  const L = T[state.lang];
  const main = document.getElementById('mainContent');
  const nav = `<div class="footnav">
      <button class="btn ghost" ${state.step===1?'disabled style="opacity:.35"':''} onclick="goStep(${state.step-1})">${L.nav.prev}</button>
      <button class="btn" ${state.step===8?'disabled style="opacity:.35"':''} onclick="goStep(${state.step+1})">${L.nav.next}</button>
    </div>`;
  main.innerHTML = renderTitleblock() + STEP_RENDERERS[state.step-1]() + renderSignoff() + nav;
}

function goStep(n){
  if(n<1||n>8) return;
  state.step = n;
  closeSidebar();
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

function setLang(l){
  if(state.lang===l) return;
  state.lang = l;
  state.data.currency = fieldVal('currency');
  render();
}
// expose for inline handlers
window.setField = setField;
window.goStep = goStep;
window.appendClause = appendClause;
window.appendKeyClause = appendKeyClause;
window.downloadMaster = downloadMaster;
window.applyProjectTemplate = applyProjectTemplate;
window.copyMaster = copyMaster;
window.printMaster = printMaster;

/* ============ SIDEBAR (mobile) ============ */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
function openSidebar(){ sidebar.classList.add('open'); backdrop.style.display='block'; }
function closeSidebar(){ sidebar.classList.remove('open'); backdrop.style.display='none'; }
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
});
backdrop.addEventListener('click', closeSidebar);
document.getElementById('btnAr').addEventListener('click', ()=>setLang('ar'));
document.getElementById('btnEn').addEventListener('click', ()=>setLang('en'));

/* ============ INIT ============ */
render();
</script>
</body>
</html>
