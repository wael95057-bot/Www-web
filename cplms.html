<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPLMS | منظومة إدارة وتقييم المقاولين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#e9eef2;
  --ink-dim:#9fb0bd;
  --ink-faint:#6c7f8c;
  --blue-950:#081820;
  --blue-925:#0b222c;
  --blue-900:#0e2a36;
  --blue-850:#123544;
  --blue-800:#17414f;
  --line:#20505f;
  --line-soft:#173c48;
  --cyan:#5fd0e8;
  --cyan-dim:#3a8fa3;
  --amber:#e8a33d;
  --amber-dim:#8a6425;
  --red:#e35b5b;
  --red-dim:#7a3030;
  --green:#5fbf88;
  --green-dim:#2f5f45;
  --font-body:'Tajawal',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:3px;
  --sidebar-w:250px;
}
[dir="ltr"]{ }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--blue-950);
  color:var(--ink);
  min-height:100%;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size:34px 34px;
  background-attachment:fixed;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
::selection{background:var(--cyan-dim); color:#fff;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:var(--blue-925);}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
a{color:var(--cyan);}
h1,h2,h3,h4{font-weight:700; letter-spacing:.2px;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ============ APP SHELL ============ */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:linear-gradient(180deg,var(--blue-925),var(--blue-900));
  border-inline-end:1px solid var(--line-soft);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);
  transition:transform .22s ease;
  z-index:60;
}
.sidebar-overlay{
  display:none; position:fixed; inset:0; background:rgba(4,10,14,.65); z-index:55;
}
.sidebar-overlay.show{display:block;}
.mobile-topbar{display:none;}
.close-sidebar-btn{display:none;}

@media(max-width:880px){
  #app{display:block;}
  .sidebar{
    position:fixed; top:0; bottom:0; width:min(78vw,290px); height:100dvh;
  }
  html[dir="ltr"] .sidebar{ left:0; transform:translateX(-105%); }
  html[dir="ltr"] .sidebar.open{ transform:translateX(0); }
  html[dir="rtl"] .sidebar{ right:0; transform:translateX(105%); }
  html[dir="rtl"] .sidebar.open{ transform:translateX(0); }
  .close-sidebar-btn{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; background:var(--blue-850); border:1px solid var(--line);
    color:var(--ink-dim); font-size:16px; line-height:1; cursor:pointer; margin-inline-start:auto;
  }
  .mobile-topbar{
    display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg,var(--blue-925),var(--blue-900));
    border-bottom:1px solid var(--line-soft);
    padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));
  }
  .mobile-topbar .hamburger{
    width:36px; height:36px; flex-shrink:0; border-radius:var(--radius); background:var(--blue-850);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--cyan);
  }
  .mobile-topbar b{font-size:14px; color:var(--ink);}
  .mobile-topbar span{font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); display:block;}
  main.view{padding:18px 14px 60px; max-width:100%;}
}
.brand{
  padding:22px 18px 16px; border-bottom:1px solid var(--line-soft);
}
.brand .mark{
  display:flex; align-items:center; gap:10px; margin-bottom:10px;
}
.brand .mark svg{flex-shrink:0;}
.brand .mark .txt b{display:block; font-size:15px; letter-spacing:.5px; color:var(--ink);}
.brand .mark .txt span{display:block; font-size:10.5px; color:var(--cyan-dim); font-family:var(--font-mono); letter-spacing:.5px;}
.brand .sub{font-size:11px; color:var(--ink-faint); line-height:1.6;}
.brand .sub b{color:var(--amber); font-weight:500;}

nav.navlist{padding:14px 10px; flex:1;}
.navlist .grp-label{
  font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono);
  padding:12px 10px 6px; letter-spacing:1px;
}
.navlist button.navitem{
  width:100%; text-align:start; background:transparent; border:none;
  color:var(--ink-dim); padding:9px 12px; border-radius:var(--radius);
  font-size:13.5px; display:flex; align-items:center; gap:10px;
  border-inline-start:2px solid transparent; transition:.12s;
}
.navlist button.navitem .dot{width:6px; height:6px; border-radius:50%; background:var(--line); flex-shrink:0;}
.navlist button.navitem:hover{background:var(--blue-850); color:var(--ink);}
.navlist button.navitem.active{
  background:var(--blue-850); color:var(--cyan); border-inline-start-color:var(--cyan);
}
.navlist button.navitem.active .dot{background:var(--cyan);}
.navlist button.navitem .badge{
  margin-inline-start:auto; background:var(--red-dim); color:#ffd9d9;
  font-family:var(--font-mono); font-size:10px; padding:1px 6px; border-radius:8px;
}

.sidebar-foot{padding:14px 16px; border-top:1px solid var(--line-soft); font-size:11px; color:var(--ink-faint);}
.sidebar-foot .lang-toggle{
  display:flex; gap:6px; margin-bottom:10px;
}
.lang-toggle button{
  flex:1; background:var(--blue-850); border:1px solid var(--line-soft); color:var(--ink-dim);
  padding:6px; border-radius:var(--radius); font-size:12px; font-family:var(--font-mono);
}
.lang-toggle button.active{background:var(--cyan-dim); color:#fff; border-color:var(--cyan);}

main.view{flex:1; min-width:0; padding:26px 30px 60px; max-width:1300px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  margin-bottom:22px; flex-wrap:wrap;
}
.topbar h1{font-size:21px; color:var(--ink);}
.topbar .crumbs{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:4px;}
.topbar .actions{display:flex; gap:8px; flex-wrap:wrap;}

.btn{
  background:var(--blue-850); border:1px solid var(--line); color:var(--ink);
  padding:8px 14px; border-radius:var(--radius); font-size:13px; display:inline-flex; align-items:center; gap:6px;
  transition:.12s;
}
.btn:hover{border-color:var(--cyan-dim); color:var(--cyan);}
.btn.primary{background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}
.btn.primary:hover{background:var(--cyan); color:#04222b;}
.btn.danger{background:var(--red-dim); border-color:var(--red); color:#ffe1e1;}
.btn.warn{background:var(--amber-dim); border-color:var(--amber); color:#fff3dd;}
.btn.ghost{background:transparent;}
.btn.sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.grid{display:grid; gap:16px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1050px){.g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;} main.view{padding:18px 14px 50px;}}

.card{
  background:linear-gradient(180deg,var(--blue-900),var(--blue-925));
  border:1px solid var(--line-soft); border-radius:var(--radius); padding:18px;
  position:relative;
}
.card::before{
  content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:2px;
  background:var(--line-soft);
}
.card.accent-cyan::before{background:var(--cyan);}
.card.accent-amber::before{background:var(--amber);}
.card.accent-red::before{background:var(--red);}
.card.accent-green::before{background:var(--green);}
.card h3{font-size:12.5px; color:var(--ink-faint); font-weight:500; letter-spacing:.3px; margin-bottom:4px;}
.card .stat{font-family:var(--font-mono); font-size:30px; color:var(--ink); font-weight:600; line-height:1.1;}
.card .stat small{font-size:13px; color:var(--ink-faint); font-family:var(--font-body);}
.card .foot{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

.section-title{
  font-size:15px; color:var(--ink); margin:26px 0 12px; display:flex; align-items:center; gap:10px;
  padding-bottom:8px; border-bottom:1px solid var(--line-soft);
}
.section-title .tag{font-family:var(--font-mono); font-size:10.5px; color:var(--cyan-dim); border:1px solid var(--line); padding:1px 8px; border-radius:10px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:start; font-size:11px; color:var(--ink-faint); font-weight:500; letter-spacing:.4px;
  padding:8px 10px; border-bottom:1px solid var(--line-soft); font-family:var(--font-mono); white-space:nowrap;
}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line-soft); color:var(--ink-dim); vertical-align:middle;}
tbody tr:hover{background:var(--blue-850);}
.table-wrap{overflow-x:auto; border:1px solid var(--line-soft); border-radius:var(--radius);}
.table-wrap table{min-width:640px;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:10px; font-size:11px; font-family:var(--font-mono); white-space:nowrap;}
.pill.t1{background:rgba(95,191,136,.15); color:var(--green); border:1px solid var(--green-dim);}
.pill.t2{background:rgba(95,208,232,.12); color:var(--cyan); border:1px solid var(--cyan-dim);}
.pill.review{background:rgba(232,163,61,.15); color:var(--amber); border:1px solid var(--amber-dim);}
.pill.black{background:rgba(227,91,91,.16); color:var(--red); border:1px solid var(--red-dim);}
.pill.open{background:rgba(232,163,61,.15); color:var(--amber); border:1px solid var(--amber-dim);}
.pill.closed{background:rgba(95,191,136,.12); color:var(--green); border:1px solid var(--green-dim);}

label{display:block; font-size:12px; color:var(--ink-faint); margin-bottom:5px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; background:var(--blue-850); border:1px solid var(--line); color:var(--ink);
  padding:9px 11px; border-radius:var(--radius); font-size:13.5px;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--cyan-dim);}
textarea{resize:vertical; min-height:70px; font-family:var(--font-mono); font-size:12.5px; line-height:1.7;}
.field{margin-bottom:14px;}
.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}

.modal-bg{
  position:fixed; inset:0; background:rgba(4,10,14,.72); backdrop-filter:blur(2px);
  display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;
}
.modal-bg.show{display:flex;}
.modal{
  background:var(--blue-900); border:1px solid var(--line); border-radius:var(--radius);
  width:100%; max-width:640px; padding:22px; margin-bottom:40px;
}
.modal.wide{max-width:820px;}
.modal h2{font-size:16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
.modal h2 .x{cursor:pointer; color:var(--ink-faint); font-size:20px; line-height:1;}
.modal .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft);}

.empty{
  text-align:center; padding:50px 20px; color:var(--ink-faint); border:1px dashed var(--line); border-radius:var(--radius);
}
.empty b{display:block; color:var(--ink-dim); margin-bottom:6px; font-size:14px;}

.kpi-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.kpi-bar-row .lbl{width:170px; font-size:12px; color:var(--ink-dim); flex-shrink:0;}
.kpi-bar-track{flex:1; height:9px; background:var(--blue-850); border-radius:5px; overflow:hidden; border:1px solid var(--line-soft);}
.kpi-bar-fill{height:100%; background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));}
.kpi-bar-row .val{width:52px; text-align:end; font-family:var(--font-mono); font-size:12.5px; color:var(--ink);}

.doc-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
@media(max-width:900px){.doc-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.doc-grid{grid-template-columns:1fr;}}
.doc-card{
  background:var(--blue-900); border:1px solid var(--line-soft); border-radius:var(--radius); padding:14px;
  cursor:pointer; transition:.12s;
}
.doc-card:hover{border-color:var(--cyan-dim); transform:translateY(-1px);}
.doc-card .code{font-family:var(--font-mono); font-size:10.5px; color:var(--cyan-dim); margin-bottom:6px;}
.doc-card .name{font-size:13.5px; color:var(--ink); margin-bottom:6px; line-height:1.5;}
.doc-card .desc{font-size:11.5px; color:var(--ink-faint); line-height:1.5;}

.doc-preview{
  background:#f4f1ea; color:#1a1a1a; padding:34px 38px; border-radius:2px; font-size:13.5px; line-height:2;
  white-space:pre-wrap; font-family:var(--font-body); max-height:60vh; overflow-y:auto; border:1px solid #d8d2c2;
}
.doc-preview .dh{text-align:center; margin-bottom:18px; border-bottom:2px solid #1a1a1a; padding-bottom:10px;}
.doc-preview .dh b{font-size:16px; display:block;}
.doc-preview .dh span{font-size:11px; color:#555; font-family:var(--font-mono);}

.flag{
  display:inline-flex; align-items:center; gap:6px; background:rgba(95,208,232,.1); border:1px dashed var(--cyan-dim);
  color:var(--cyan); font-size:11px; padding:5px 10px; border-radius:var(--radius); margin-bottom:14px;
}

.hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.divider{height:1px; background:var(--line-soft); margin:18px 0;}

.escalation-track{display:flex; gap:0; margin:16px 0; overflow-x:auto;}
.esc-step{flex:1; min-width:130px; text-align:center; padding:12px 8px; border-bottom:3px solid var(--line); position:relative; font-size:11.5px; color:var(--ink-faint);}
.esc-step.done{border-color:var(--green); color:var(--green);}
.esc-step.current{border-color:var(--amber); color:var(--amber); font-weight:700;}
.esc-step b{display:block; font-size:12.5px; margin-bottom:2px;}

.search-box{position:relative; max-width:320px;}
.search-box input{padding-inline-start:32px;}
.search-box::before{content:'⌕'; position:absolute; inset-inline-start:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint);}

.toast-wrap{position:fixed; bottom:20px; inset-inline-end:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--blue-850); border:1px solid var(--cyan-dim); color:var(--ink); padding:11px 16px; border-radius:var(--radius); font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.4); animation:in .18s ease;}
@keyframes in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.mini-chart{display:flex; align-items:flex-end; gap:5px; height:70px; margin-top:8px;}
.mini-chart .bar{flex:1; background:linear-gradient(180deg,var(--cyan),var(--cyan-dim)); border-radius:2px 2px 0 0; min-height:2px; position:relative;}
.mini-chart .bar span{position:absolute; top:-16px; inset-inline-start:50%; transform:translateX(-50%); font-size:9px; color:var(--ink-faint); font-family:var(--font-mono); white-space:nowrap;}

.new-badge{background:var(--amber); color:#3a2600; font-size:9px; padding:1px 6px; border-radius:8px; font-family:var(--font-mono); margin-inline-start:6px; vertical-align:middle;}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute; inset-inline-start:0; top:0; width:100%; background:#fff; color:#000;}
  body{background:#fff;}
}
#printArea{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="printArea"></div>
<script>
/* ============================================================
   CPLMS — Contractor Performance & Lifecycle Management System
   Eng. Wael Ali Oweis Mahmoud — BENA Strategic Development Co.
   ============================================================ */

/* ---------------- STORAGE ---------------- */
const STORE_KEY = 'cplms_data_v1';
function defaultData(){
  return {
    lang: 'ar',
    settings: {
      companyName: 'شركة بناء للتطوير الاستراتيجي',
      companyNameEn: 'BENA Strategic Development Co.',
      ownerName: 'م. وائل علي عويس محمود',
      ownerNameEn: 'Eng. Wael Ali Oweis Mahmoud',
      weights: { spi:30, cpi:20, quality:25, hse:15, mgmt:10 },
      escalationThreshold: 70,
      criticalThreshold: 60
    },
    vendors: [],
    projects: [],
    evaluations: [],
    escalations: [],
    documents: [],
    compliance: []
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) { const d=defaultData(); save(d); return d; }
    const parsed = JSON.parse(raw);
    return Object.assign(defaultData(), parsed, {
      settings: Object.assign(defaultData().settings, parsed.settings||{})
    });
  }catch(e){ const d=defaultData(); save(d); return d; }
}
function save(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
let DB = load();
let LANG = DB.lang || 'ar';
let VIEW = 'dashboard';
let VIEW_PARAM = null;

function uid(prefix){ return prefix + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function hashOf(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h<<5)-h + str.charCodeAt(i); h|=0; }
  return 'SHA-' + Math.abs(h).toString(16).toUpperCase().padStart(8,'0');
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString(LANG==='ar'?'ar-EG':'en-GB',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString(LANG==='ar'?'ar-EG':'en-GB'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function t(ar,en){ return LANG==='ar' ? ar : en; }

function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------------- KPI / SCORING ---------------- */
function computeOverall(ev){
  const w = DB.settings.weights;
  const totalW = w.spi+w.cpi+w.quality+w.hse+w.mgmt;
  const norm = (v)=> Math.max(0,Math.min(100,Number(v)||0));
  const score = (norm(ev.spi)*w.spi + norm(ev.cpi)*w.cpi + norm(ev.ncrClose)*w.quality + norm(ev.hse)*w.hse + norm(ev.mgmt)*w.mgmt) / (totalW||1);
  return Math.round(score*100)/100;
}
function gradeOf(score){
  if(score>=90) return t('ممتاز','Excellent');
  if(score>=80) return t('جيد جداً','Very Good');
  if(score>=70) return t('جيد','Good');
  if(score>=60) return t('تحت المراقبة','Under Watch');
  return t('متعثر','Poor');
}
function tierBadgeClass(tier){
  return {TIER_1:'t1', TIER_2:'t2', UNDER_REVIEW:'review', BLACK_LISTED:'black'}[tier] || 'review';
}
function tierLabel(tier){
  return {
    TIER_1: t('الفئة الأولى','Tier 1'),
    TIER_2: t('الفئة الثانية','Tier 2'),
    UNDER_REVIEW: t('تحت المراجعة','Under Review'),
    BLACK_LISTED: t('قائمة سوداء','Blacklisted')
  }[tier] || tier;
}
function latestEvalFor(vendorId){
  const list = DB.evaluations.filter(e=>e.vendorId===vendorId).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  return list[0] || null;
}
function vendorTrend(vendorId){
  const list = DB.evaluations.filter(e=>e.vendorId===vendorId).sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt)).slice(-3);
  if(list.length<2) return 0;
  return Math.round((list[list.length-1].overall - list[0].overall)*10)/10;
}
/* Suggested addition: lightweight early-warning heuristic (no external AI call — local trend + threshold logic) */
function riskLevel(vendorId){
  const last = latestEvalFor(vendorId);
  if(!last) return {level:'none', label:t('لا توجد بيانات','No data')};
  const trend = vendorTrend(vendorId);
  if(last.overall < DB.settings.criticalThreshold || trend <= -8) return {level:'high', label:t('مخاطرة عالية','High Risk')};
  if(last.overall < DB.settings.escalationThreshold || trend <= -3) return {level:'medium', label:t('مراقبة','Watch')};
  return {level:'low', label:t('مستقر','Stable')};
}
function vendorName(id){ const v=DB.vendors.find(x=>x.id===id); return v? v.name : t('—','—'); }

function escalationOpenCount(){ return DB.escalations.filter(e=>e.stage!=='resolved').length; }
function complianceAlertCount(){
  const now = new Date();
  return DB.compliance.filter(c=>{
    const d = new Date(c.expiryDate); const days = (d-now)/86400000;
    return days <= 60;
  }).length;
}

function saveVendor(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast(t('الاسم مطلوب','Name is required')); return; }
  const data = {
    name, cr:document.getElementById('f_cr').value.trim(), tax:document.getElementById('f_tax').value.trim(),
    financialCap:document.getElementById('f_fin').value.trim(), tier:document.getElementById('f_tier').value,
    esgScore: document.getElementById('f_esg').value?Number(document.getElementById('f_esg').value):null,
    notes: document.getElementById('f_notes').value.trim()
  };
  if(id){
    const v = DB.vendors.find(x=>x.id===id); Object.assign(v,data);
  } else {
    DB.vendors.push(Object.assign({id:uid('VND'), createdAt:nowISO()}, data));
  }
  save(DB); closeModal(); renderView(); toast(t('تم حفظ بيانات المقاول','Vendor saved'));
}
function deleteVendor(id){
  if(!confirm(t('هل أنت متأكد من حذف هذا المقاول؟','Delete this vendor?')))return;
  DB.vendors = DB.vendors.filter(x=>x.id!==id); save(DB); closeModal(); renderView();
}

function saveEvaluation(){
  const vendorId = document.getElementById('e_vendor').value;
  const projectId = document.getElementById('e_project').value;
  const period = document.getElementById('e_period').value.trim() || new Date().toISOString().slice(0,7);
  const ev = { id:uid('EVL'), vendorId, projectId,period,
    spi:Number(document.getElementById('e_spi').value), cpi:Number(document.getElementById('e_cpi').value),
    ncrClose:Number(document.getElementById('e_ncr').value), hse:Number(document.getElementById('e_hse').value),
    mgmt:Number(document.getElementById('e_mgmt').value), createdAt: nowISO() };
  ev.overall = computeOverall(ev); ev.grade = gradeOf(ev.overall);
  DB.evaluations.push(ev);
  // auto-flag escalation if below threshold
  if(ev.overall < DB.settings.escalationThreshold){
    autoFlagEscalation(vendorId, projectId, ev.overall);
  }
  save(DB); closeModal(); renderView();
  toast(t('تم حفظ التقييم — النتيجة: ','Evaluation saved — score: ') + ev.overall);

function autoFlagEscalation(vendorId, projectId, score){
  let esc_ = DB.escalations.find(e=>e.vendorId===vendorId && e.projectId===projectId && e.stage!=='resolved');
  if(!esc_){
    esc_ = { id:uid('ESC'), vendorId, projectId, stage:'cure', openedAt:nowISO(), notes:t('فتح تلقائي — انخفاض النتيجة عن الحد الأدنى','Auto-opened — score below threshold'), history:[{stage:'cure', date:nowISO(), score}] };
    DB.escalations.push(esc_);
  }
}

/* ================= ESCALATION ENGINE ================= */
const ESC_STAGES = ['watch','cure','recovery','descope','termination','blacklist','resolved'];
function stageLabel(s){
  return {
    watch:t('مراقبة','Watch'), cure:t('إشعار تصحيح (Cure Notice)','Cure Notice'),
    recovery:t('خطة تدارك','Recovery Plan'), descope:t('سحب جزئي','De-scoping'),
    termination:t('إنهاء العقد','Termination'), blacklist:t('قائمة سوداء','Blacklist'), resolved:t('تمت المعالجة','Resolved')
  }[s]||s;
}
function renderEscalation(){
  const list = [...DB.escalations].sort((a,b)=>new Date(b.openedAt)-new Date(a.openedAt));
  return `
  <div class="topbar">
    <div><h1>${t('محرك التصعيد التدريجي','Progressive Escalation Engine')}</h1><div class="crumbs">CPLMS / FIDIC Clause 15 · Cure → De-scope → Termination → Blacklist</div></div>
    <div class="actions"><button class="btn primary" onclick="openEscalationModal()">+ ${t('فتح حالة تصعيد','Open Escalation')}</button></div>
  </div>
  ${list.length===0? `<div class="empty"><b>${t('لا توجد حالات تصعيد','No escalation cases')}</b>${t('يفتح النظام حالة تلقائياً عند انخفاض تقييم مقاول عن الحد الأدنى، أو يمكنك فتحها يدوياً.','Cases open automatically on low scores, or you can open one manually.')}</div>`:
  list.map(e=>{
    const v = DB.vendors.find(x=>x.id===e.vendorId);
    const stepsToShow = ESC_STAGES.filter(s=>s!=='watch');
    const currentIdx = stepsToShow.indexOf(e.stage);
    return `
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-size:15px; color:var(--ink); font-weight:700;">${esc(v?v.name:'—')}</div>
          <div style="font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);">${e.id} · ${t('المشروع','Project')}: ${esc(projectName(e.projectId))} · ${t('فُتحت في','Opened')} ${fmtDate(e.openedAt)}</div>
        </div>
        <span class="pill ${e.stage==='resolved'?'closed':e.stage==='blacklist'||e.stage==='termination'?'black':'open'}">${stageLabel(e.stage)}</span>
      </div>
      <div class="escalation-track">
        ${stepsToShow.map((s,i)=>`<div class="esc-step ${i<currentIdx || e.stage==='resolved' ?'done':i===currentIdx?'current':''}"><b>${i+1}</b>${stageLabel(s)}</div>`).join('')}
      </div>
      <div style="font-size:12.5px; color:var(--ink-dim); margin-bottom:10px;">${esc(e.notes||'')}</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${e.stage!=='resolved' ? `<button class="btn sm warn" onclick="advanceEscalation('${e.id}')">${t('تصعيد للمرحلة التالية','Advance to Next Stage')} →</button>` : ''}
        ${e.stage!=='resolved' ? `<button class="btn sm" onclick="resolveEscalation('${e.id}')">${t('تحديد كمعالج','Mark Resolved')}</button>` : ''}
        <button class="btn sm ghost" onclick="issueEscalationDoc('${e.id}')">${t('إصدار الوثيقة المرتبطة','Issue Related Document')}</button>
      </div>
    </div>`;
  }).join('')}
  `;
}
function openEscalationModal(){
  if(DB.vendors.length===0){ toast(t('سجّل مقاولاً أولاً','Register a vendor first')); return; }
  openModal(`
    <h2>${t('فتح حالة تصعيد يدوياً','Manually Open Escalation')}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="field"><label>${t('المقاول','Vendor')}</label><select id="es_vendor">${DB.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></div>

    <div class="field"><label>${t('سبب فتح الحالة','Reason')}</label><textarea id="es_notes" placeholder="${t('مثال: تأخر توريد المواد وانخفاض العمالة بالموقع','e.g. delayed material supply and understaffing')}"></textarea></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('إلغاء','Cancel')}</button><button class="btn primary" onclick="saveEscalation()">${t('فتح الحالة','Open Case')}</button></div>
  `);
}
function saveEscalation(){
  const vendorId = document.getElementById('es_vendor').value, projectId = document.getElementById('es_project').value, notes = document.getElementById('es_notes').value.trim();
  DB.escalations.push({id:uid('ESC'), vendorId, projectId, stage:'cure', openedAt:nowISO(), notes, history:[{stage:'cure', date:nowISO()}]});
  save(DB); closeModal(); renderView(); toast(t('تم فتح حالة التصعيد','Escalation case opened'));
}
function advanceEscalation(id){
  const e = DB.escalations.find(x=>x.id===id);
  const steps = ESC_STAGES.filter(s=>s!=='watch'&&s!=='resolved');
  const idx = steps.indexOf(e.stage);
  if(idx < steps.length-1){ e.stage = steps[idx+1]; e.history.push({stage:e.stage, date:nowISO()}); }
  if(e.stage==='blacklist'){ const v=DB.vendors.find(x=>x.id===e.vendorId); if(v) v.tier='BLACK_LISTED'; }
  save(DB); renderView(); toast(t('تم التصعيد إلى المرحلة التالية','Advanced to next stage'));
}
function resolveEscalation(id){ const e=DB.escalations.find(x=>x.id===id); e.stage='resolved'; e.history.push({stage:'resolved',date:nowISO()}); save(DB); renderView(); toast(t('تم إغلاق الحالة','Case resolved')); }
function issueEscalationDoc(id){
  const e = DB.escalations.find(x=>x.id===id);
  const map = {cure:'NTC', recovery:'RPC', descope:'DSO', termination:'TN', blacklist:'SBN', resolved:'VPC'};
  const key = map[e.stage] || 'NTC';
  goto('documents'); setTimeout(()=>openDocGenerator(key,{vendorId:e.vendorId, projectId:e.projectId, escId:e.id}),0);
}

function templateByKey(k){ return TEMPLATES.find(x=>x.key===k); }

/* ================= DOCUMENTS VIEW ================= */
function renderDocuments(){
  return `
  <div class="topbar">
    <div><h1>${t('مكتبة الوثائق الرسمية','Official Document Library')}</h1><div class="crumbs">CPLMS / ${TEMPLATES.length} ${t('نموذج معتمد قابل للتوليد التلقائي','certified auto-generated templates')}</div></div>
  </div>
  <div class="flag">${t('كل وثيقة تُصدر تُختم برقم مرجعي وبصمة رقمية (Hash) وتُحفظ تلقائياً في الأرشيف غير القابل للتعديل.','Every issued document is stamped with a reference number and digital hash, and saved automatically to the immutable archive.')}</div>
  <div class="doc-grid">
    ${TEMPLATES.map(tpl=>`
      <div class="doc-card" onclick="openDocGenerator('${tpl.key}')">
        <div class="code">${tpl.key}${tpl.auto?' · '+t('تلقائي','AUTO'):''}</div>
        <div class="name">${t(tpl.nameAr,tpl.nameEn)}</div>
        <div class="desc">${t(tpl.descAr,tpl.descEn)}</div>
      </div>`).join('')}
  </div>
  `;
}
function openDocGenerator(key, presetCtx){
  const tpl = templateByKey(key);
  if(!tpl) return;
  presetCtx = presetCtx || {};
  const vendorOptions = DB.vendors.map(v=>`<option value="${v.id}" ${presetCtx.vendorId===v.id?'selected':''}>${esc(v.name)}</option>`).join('');
  const projectOptions = DB.projects.map(p=>`<option value="${p.id}" ${presetCtx.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  openModal(`
    <h2>${t(tpl.nameAr,tpl.nameEn)}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="form-grid">
      <div class="field"><label>${t('المقاول','Vendor')}</label><select id="d_vendor">${vendorOptions||`<option value="">${t('لا يوجد','None')}</option>`}</select></div>
      <div class="field"><label>${t('المشروع','Project')}</label><select id="d_project"><option value="">—</option>${projectOptions}</select></div>
    </div>
    ${tpl.fields.length? `<div class="divider"></div><div class="form-grid">
      ${tpl.fields.map(f=>`
        <div class="field"><label>${t(f.ar,f.en)}</label>
        ${f.type==='textarea'?`<textarea id="tf_${f.id}">${esc(f.def)}</textarea>`
         : f.type==='select'? `<select id="tf_${f.id}">${(f.options||[]).map(o=>`<option value="${esc(t(o[0],o[1]))}" ${f.def===o[0]?'selected':''}>${esc(t(o[0],o[1]))}</option>`).join('')}</select>`
         : `<input id="tf_${f.id}" type="${f.type==='number'?'number':'text'}" value="${esc(f.def)}">`}
        </div>`).join('')}
    </div>` : `<div class="hint" style="margin-top:10px;">${tpl.auto? t('تُولّد هذه الوثيقة تلقائياً من بيانات آخر تقييم شهري مرتبط.','This document auto-fills from the linked latest monthly evaluation.') : t('لا حقول إضافية مطلوبة — سيتم التوليد من بيانات المشروع والمقاول مباشرة.','No extra fields required — generated directly from vendor/project data.')}</div>`}
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('إلغاء','Cancel')}</button>
      <button class="btn primary" onclick="previewDoc('${key}', '${presetCtx.evalId||''}', '${presetCtx.escId||''}')">${t('معاينة وتوليد','Preview & Generate')}</button>
    </div>
  `, true);
}
function collectFieldValues(tpl){
  const f = {};
  tpl.fields.forEach(fl=>{ const el = document.getElementById('tf_'+fl.id); f[fl.id] = el ? el.value : fl.def; });
  return f;
}
function buildCtx(vendorId, projectId, evalId, escId){
  const v = DB.vendors.find(x=>x.id===vendorId);
  const p = DB.projects.find(x=>x.id===projectId);
  return {
    vendorId: vendorId||'', vendorName: v? v.name : t('غير محدد','Unspecified'),
    projectName: p? p.name : t('غير محدد','Unspecified'),
    contractNo: p? (p.contractNo||'—') : '—',
    ownerName: LANG==='ar'?DB.settings.ownerName:DB.settings.ownerNameEn,
    companyName: LANG==='ar'?DB.settings.companyName:DB.settings.companyNameEn,
    evalData: evalId ? DB.evaluations.find(x=>x.id===evalId) : null,
    escId: escId||null
  };
}
function previewDoc(key, evalId, escId){
  const tpl = templateByKey(key);
  const vendorId = document.getElementById('d_vendor').value;
  const projectId = document.getElementById('d_project').value;
  const f = collectFieldValues(tpl);
  const ctx = buildCtx(vendorId, projectId, evalId, escId);
  const bodyAr = tpl.body('ar', f, Object.assign({}, ctx, {vendorName: (DB.vendors.find(x=>x.id===vendorId)||{}).name || t('غير محدد','Unspecified')}));
  const bodyEn = tpl.body('en', f, ctx);
  const docId = uid('DOC');
  const draft = { id:docId, type:key, vendorId, projectId, title: t(tpl.nameAr,tpl.nameEn), fieldsSnapshot:f, bodyAr, bodyEn };
  window.__draftDoc = draft;
  openModal(`
    <h2>${t('معاينة الوثيقة','Document Preview')}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="doc-preview">
      <div class="dh"><b>${esc(LANG==='ar'?DB.settings.companyName:DB.settings.companyNameEn)}</b><span>${t(tpl.nameAr,tpl.nameEn)} · REF: ${docId}</span></div>
      ${esc(LANG==='ar'?bodyAr:bodyEn)}
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('تعديل','Back to Edit')}</button>
      <button class="btn primary" onclick="commitDoc()">${t('اعتماد وحفظ في الأرشيف','Approve & Save to Archive')}</button>
    </div>
  `, true);
}
function commitDoc(){
  const d = window.__draftDoc;
  if(!d) return;
  const hash = hashOf(d.bodyAr + d.bodyEn + d.id);
  const record = Object.assign({}, d, {hash, createdAt: nowISO()});
  DB.documents.push(record);
  // link back to escalation history if applicable
  if(d.type){
    // no-op placeholder for future linking
  }
  save(DB); closeModal(); toast(t('تم اعتماد الوثيقة وحفظها في الأرشيف','Document approved and archived'));
  viewArchiveDoc(record.id);
}

/* ================= ARCHIVE ================= */
function renderArchive(){
  const list = [...DB.documents].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return `
  <div class="topbar">
    <div><h1>${t('الأرشيف الرقمي غير القابل للتعديل','Immutable Digital Archive')}</h1><div class="crumbs">CPLMS / ${list.length} ${t('وثيقة موثقة','archived documents')}</div></div>
    <div class="actions">
      <div class="search-box"><input id="archSearch" type="text" placeholder="${t('بحث بالاسم أو الرقم المرجعي','Search by name or reference')}" oninput="filterArchive(this.value)"></div>
    </div>
  </div>
  <div id="archiveTableWrap">${archiveTable(list)}</div>
  `;
}
function archiveTable(list){
  if(list.length===0) return `<div class="empty"><b>${t('الأرشيف فارغ','Archive is empty')}</b>${t('ستظهر هنا كل وثيقة يتم اعتمادها من مكتبة الوثائق.','Every approved document from the library will appear here.')}</div>`;
  return `<div class="table-wrap"><table>
  <thead><tr><th>${t('المرجع','Reference')}</th><th>${t('نوع الوثيقة','Type')}</th><th>${t('المقاول','Vendor')}</th><th>${t('التاريخ','Date')}</th><th>${t('البصمة الرقمية','Hash')}</th><th></th></tr></thead>
  <tbody>${list.map(d=>`
    <tr>
      <td style="font-family:var(--font-mono)">${d.id}</td>
      <td>${esc(d.title)}</td>
      <td>${esc(vendorName(d.vendorId))}</td>
      <td>${fmtDate(d.createdAt)}</td>
      <td style="font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);">${d.hash}</td>
      <td style="white-space:nowrap;"><button class="btn sm ghost" onclick="viewArchiveDoc('${d.id}')">${t('عرض/طباعة','View/Print')}</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}
function filterArchive(q){
  q = q.trim().toLowerCase();
  const list = [...DB.documents].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))
    .filter(d=> !q || d.id.toLowerCase().includes(q) || d.title.toLowerCase().includes(q) || vendorName(d.vendorId).toLowerCase().includes(q));
  document.getElementById('archiveTableWrap').innerHTML = archiveTable(list);
}
function viewArchiveDoc(id){
  const d = DB.documents.find(x=>x.id===id);
  if(!d) return;
  openModal(`
    <h2>${esc(d.title)}<span class="x" onclick="closeModal()">×</span></h2>
    <div class="doc-preview" id="docPreviewBox">
      <div class="dh"><b>${esc(LANG==='ar'?DB.settings.companyName:DB.settings.companyNameEn)}</b><span>${esc(d.title)} · REF: ${d.id} · ${fmtDate(d.createdAt)}</span></div>
      ${esc(LANG==='ar'?d.bodyAr:d.bodyEn)}
    </div>
    <div class="hint">${t('البصمة الرقمية للتوثيق','Digital verification hash')}: ${d.hash}</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('إغلاق','Close')}</button>
      <button class="btn primary" onclick="printDoc('${d.id}')">${t('طباعة / حفظ PDF','Print / Save as PDF')}</button>
    </div>
  `, true);
}
function printDoc(id){
  const d = DB.documents.find(x=>x.id===id);
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <div style="padding:40px; font-family:'Tajawal',sans-serif; direction:${LANG==='ar'?'rtl':'ltr'};">
      <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:14px; margin-bottom:20px;">
        <div style="font-size:18px; font-weight:700;">${esc(LANG==='ar'?DB.settings.companyName:DB.settings.companyNameEn)}</div>
        <div style="font-size:11px; color:#444; font-family:monospace; margin-top:4px;">${esc(d.title)} · REF: ${d.id} · ${fmtDate(d.createdAt)}</div>
      </div>
      <div style="white-space:pre-wrap; font-size:13.5px; line-height:2;">${esc(LANG==='ar'?d.bodyAr:d.bodyEn)}</div>
      <div style="margin-top:40px; padding-top:14px; border-top:1px solid #999; font-size:10.5px; color:#555; display:flex; justify-content:space-between;">
        <span>${t('الختم الرقمي','Digital hash')}: ${d.hash}</span>
        <span>${esc(LANG==='ar'?DB.settings.ownerName:DB.settings.ownerNameEn)}</span>
      </div>
    </div>`;
  window.print();
}

/* ================= SETTINGS ================= */
function renderSettings(){
  const w = DB.settings.weights;
  return `
  <div class="topbar"><div><h1>${t('إعدادات المنظومة','System Settings')}</h1><div class="crumbs">CPLMS / ${t('الشركة، الأوزان، النسخ الاحتياطي','Company, weights, backup')}</div></div></div>

  <div class="section-title">${t('بيانات الجهة المالكة للنظام','System Owner Information')}</div>
  <div class="card">
    <div class="form-grid">
      <div class="field"><label>${t('اسم الشركة (عربي)','Company Name (Arabic)')}</label><input id="s_company" type="text" value="${esc(DB.settings.companyName)}"></div>
      <div class="field"><label>${t('اسم الشركة (إنجليزي)','Company Name (English)')}</label><input id="s_companyEn" type="text" value="${esc(DB.settings.companyNameEn)}"></div>
      <div class="field"><label>${t('اسم المسؤول (عربي)','Owner Name (Arabic)')}</label><input id="s_owner" type="text" value="${esc(DB.settings.ownerName)}"></div>
      <div class="field"><label>${t('اسم المسؤول (إنجليزي)','Owner Name (English)')}</label><input id="s_ownerEn" type="text" value="${esc(DB.settings.ownerNameEn)}"></div>
    </div>
    <button class="btn primary sm" onclick="saveCompanySettings()">${t('حفظ بيانات الشركة','Save Company Info')}</button>
  </div>

  <div class="section-title">${t('أوزان مؤشرات الأداء (KPI Weights)','KPI Weight Configuration')}</div>
  <div class="card">
    <div class="form-grid" style="grid-template-columns:repeat(5,1fr);">
      <div class="field"><label>${t('الجدول (SPI)','Schedule (SPI)')}</label><input id="w_spi" type="number" value="${w.spi}"></div>
      <div class="field"><label>${t('التكلفة (CPI)','Cost (CPI)')}</label><input id="w_cpi" type="number" value="${w.cpi}"></div>
      <div class="field"><label>${t('الجودة','Quality')}</label><input id="w_quality" type="number" value="${w.quality}"></div>
      <div class="field"><label>${t('السلامة (HSE)','HSE')}</label><input id="w_hse" type="number" value="${w.hse}"></div>
      <div class="field"><label>${t('الإدارة','Management')}</label><input id="w_mgmt" type="number" value="${w.mgmt}"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>${t('حد فتح التصعيد التلقائي (النتيجة أقل من)','Auto-Escalation Threshold (score below)')}</label><input id="w_thresh" type="number" value="${DB.settings.escalationThreshold}"></div>
      <div class="field"><label>${t('حد المخاطرة العالية (النتيجة أقل من)','High-Risk Threshold (score below)')}</label><input id="w_crit" type="number" value="${DB.settings.criticalThreshold}"></div>
    </div>
    <button class="btn primary sm" onclick="saveWeights()">${t('حفظ الأوزان','Save Weights')}</button>
  </div>

  <div class="section-title">${t('النسخ الاحتياطي واستعادة البيانات','Backup & Restore')} <span class="tag">${t('إضافة مقترحة','ADDED')}</span></div>
  <div class="card">
    <p style="font-size:13px; color:var(--ink-dim); margin-bottom:14px;">${t('البيانات مخزّنة محلياً على هذا المتصفح فقط. صدّر نسخة احتياطية دورياً لحمايتها من الفقدان عند مسح بيانات المتصفح.','Data is stored locally in this browser only. Export a backup regularly to protect it from browser data clearing.')}</p>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" onclick="exportBackup()">⭳ ${t('تصدير نسخة احتياطية (JSON)','Export Backup (JSON)')}</button>
      <label class="btn" style="position:relative; overflow:hidden;">
        ⭱ ${t('استيراد نسخة احتياطية','Import Backup')}
        <input type="file" accept=".json" onchange="importBackup(event)" style="position:absolute; inset:0; opacity:0; cursor:pointer;">
      </label>
      <button class="btn danger" onclick="resetAllData()">${t('حذف كل البيانات','Erase All Data')}</button>
    </div>
  </div>
  `;
}
function saveCompanySettings(){
  DB.settings.companyName = document.getElementById('s_company').value.trim();
  DB.settings.companyNameEn = document.getElementById('s_companyEn').value.trim();
  DB.settings.ownerName = document.getElementById('s_owner').value.trim();
  DB.settings.ownerNameEn = document.getElementById('s_ownerEn').value.trim();
  save(DB); renderShell(); toast(t('تم الحفظ','Saved'));
}
function saveWeights(){
  DB.settings.weights = { spi:Number(document.getElementById('w_spi').value), cpi:Number(document.getElementById('w_cpi').value),
    quality:Number(document.getElementById('w_quality').value), hse:Number(document.getElementById('w_hse').value), mgmt:Number(document.getElementById('w_mgmt').value) };
  DB.settings.escalationThreshold = Number(document.getElementById('w_thresh').value);
  DB.settings.criticalThreshold = Number(document.getElementById('w_crit').value);
  save(DB); renderView(); toast(t('تم حفظ الأوزان','Weights saved'));
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'CPLMS_Backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(t('تم تصدير النسخة الاحتياطية','Backup exported'));
}
function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      DB = Object.assign(defaultData(), parsed);
      LANG = DB.lang || 'ar';
      save(DB); renderShell(); toast(t('تم استيراد البيانات بنجاح','Data imported successfully'));
    }catch(e){ toast(t('ملف غير صالح','Invalid file')); }
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(!confirm(t('سيتم حذف جميع البيانات نهائياً. هل أنت متأكد؟','This will permanently erase all data. Are you sure?')))return;
  DB = defaultData(); save(DB); LANG='ar'; renderShell(); toast(t('تم إعادة التهيئة','Data reset'));
}
</script>
</body>
</html>
