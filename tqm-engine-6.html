<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك وثائق الجودة الشاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF1EC; --surface:#FFFFFF; --sunken:#E5E8E1; --line:#D7DBD1; --line-strong:#BFC5B8;
  --ink-900:#10192B; --ink-700:#2B3A52; --ink-500:#5A6A82; --ink-300:#8E9BAA;
  --blue:#1E3A5F; --blue-strong:#12233F; --blue-soft:#E4EAF1;
  --gold:#9C7A3C; --gold-soft:#EFE4CC;
  --ok:#2F6F4E; --ok-soft:#E1EEE5;
  --warn:#B4772A; --warn-soft:#F5E7D4;
  --danger:#9C3B34; --danger-soft:#F3E1DF;
  --archive:#5A6A82; --archive-soft:#E6E9EE;
  --font-display:'Cairo','Tahoma',sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-mono:'IBM Plex Mono','Consolas',monospace;
  --radius:3px;
  --shadow:0 1px 2px rgba(16,25,43,.06);
  color-scheme: light;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1622; --surface:#161F2E; --sunken:#111926; --line:#28334A; --line-strong:#37456357;
    --line-strong:#3A4A66; --ink-900:#EEF1F6; --ink-700:#C6CEDC; --ink-500:#93A0B7; --ink-300:#606E88;
    --blue:#6E93C2; --blue-strong:#9BB6DD; --blue-soft:#1A2740;
    --gold:#D4B675; --gold-soft:#2E2818;
    --ok:#6FBE93; --ok-soft:#16281F;
    --warn:#E0A85C; --warn-soft:#2E2313;
    --danger:#E0847C; --danger-soft:#2E1917;
    --archive:#93A0B7; --archive-soft:#1B2432;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1622; --surface:#161F2E; --sunken:#111926; --line:#28334A; --line-strong:#3A4A66;
  --ink-900:#EEF1F6; --ink-700:#C6CEDC; --ink-500:#93A0B7; --ink-300:#606E88;
  --blue:#6E93C2; --blue-strong:#9BB6DD; --blue-soft:#1A2740;
  --gold:#D4B675; --gold-soft:#2E2818;
  --ok:#6FBE93; --ok-soft:#16281F;
  --warn:#E0A85C; --warn-soft:#2E2313;
  --danger:#E0847C; --danger-soft:#2E1917;
  --archive:#93A0B7; --archive-soft:#1B2432;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/100% 28px,
    var(--bg);
  color:var(--ink-900);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
[dir="ltr"] body{font-family:var(--font-body);}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:700;color:var(--ink-900);}
button{font-family:inherit;}
::selection{background:var(--gold-soft);}
a{color:var(--blue);}
.mono{font-family:var(--font-mono);}
.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---------- layout ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:16px;}
.brand .mark{
  width:30px;height:30px;border:1.5px solid var(--blue);border-radius:2px;
  display:flex;align-items:center;justify-content:center;color:var(--blue);flex:none;
  font-family:var(--font-mono);font-size:11px;font-weight:600;
}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;color:var(--ink-500);}
.topbar .spacer{flex:1;}
.searchbox{position:relative;width:min(260px,32vw);}
.searchbox input{width:100%;}
.search-results{
  position:absolute;inset-inline-start:0;top:calc(100% + 6px);width:min(340px,80vw);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(16,25,43,.16);z-index:60;max-height:320px;overflow:auto;
}
.search-results .sr-item{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;}
.search-results .sr-item:last-child{border-bottom:none;}
.search-results .sr-item:hover{background:var(--sunken);}
.search-results .sr-item .code{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-500);}
.iconbtn{
  width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-700);flex:none;
}
.iconbtn svg{width:17px;height:17px;flex:none;}
.iconbtn:hover{border-color:var(--line-strong);background:var(--sunken);}
.hamburger{display:none;}

.shell{display:flex;flex:1;min-height:0;}
.sidebar{
  width:250px;flex:none;background:var(--surface);border-inline-end:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;gap:2px;
}
.sidebar .proj-pill{
  margin:2px 4px 12px;padding:10px 10px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--radius);
}
.sidebar .proj-pill .lbl{font-size:10.5px;color:var(--ink-500);}
.sidebar .proj-pill select{width:100%;margin-top:4px;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);
  color:var(--ink-700);cursor:pointer;font-size:13.5px;font-weight:500;border:1px solid transparent;
}
.navitem svg{flex:none;width:17px;height:17px;}
.navitem:hover{background:var(--sunken);}
.navitem.active{background:var(--blue-soft);color:var(--blue-strong);border-color:var(--blue-soft);font-weight:700;}
.nav-badge{
  margin-inline-start:auto;font-size:10.5px;font-family:var(--font-mono);color:var(--ink-500);
  background:var(--sunken);border:1px solid var(--line);border-radius:20px;padding:1px 7px;
}
.sidebar .group-label{font-size:10.5px;color:var(--ink-300);text-transform:uppercase;letter-spacing:.04em;margin:14px 12px 4px;}

.content{flex:1;min-width:0;padding:20px 22px 60px;overflow-x:hidden;}
.content-inner{max-width:1180px;margin:0 auto;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.page-head h2{font-size:21px;}
.page-head p{margin:3px 0 0;color:var(--ink-500);font-size:13px;max-width:60ch;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- controls ---------- */
button.btn{
  padding:9px 16px;border-radius:var(--radius);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-900);font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
button.btn svg{width:15px;height:15px;}
button.btn:hover{background:var(--sunken);}
button.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
button.btn.primary:hover{background:var(--blue-strong);border-color:var(--blue-strong);}
button.btn.ghost{border-color:transparent;background:transparent;}
button.btn.ghost:hover{background:var(--sunken);}
button.btn.danger{color:var(--danger);border-color:var(--danger-soft);}
button.btn.danger:hover{background:var(--danger-soft);}
button.btn.sm{padding:6px 11px;font-size:12.5px;}
button.btn:disabled{opacity:.45;cursor:not-allowed;}

input[type=text],input[type=search],input[type=date],input[type=number],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius);
  background:var(--surface);color:var(--ink-900);font-family:inherit;font-size:13.5px;
}
textarea{resize:vertical;min-height:72px;line-height:1.65;}
input:focus,textarea:focus,select:focus,button:focus-visible,.navitem:focus-visible{
  outline:2px solid var(--blue);outline-offset:1px;
}
label.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-700);margin-bottom:5px;}
.field{margin-bottom:16px;}
.field .hint{font-size:11.5px;color:var(--ink-500);margin-top:4px;}

/* ---------- cards / grids ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.stat{border-inline-start:3px solid var(--blue);}
.stat .num{font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1;}
.stat .lbl{margin-top:6px;font-size:12px;color:var(--ink-500);}
.stat.ok{border-color:var(--ok);} .stat.warn{border-color:var(--warn);} .stat.danger{border-color:var(--danger);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.pill.draft{background:var(--sunken);color:var(--ink-500);}
.pill.review{background:var(--warn-soft);color:var(--warn);}
.pill.approved{background:var(--ok-soft);color:var(--ok);}
.pill.archived{background:var(--archive-soft);color:var(--archive);}
.pill.open{background:var(--danger-soft);color:var(--danger);}
.pill.closed{background:var(--ok-soft);color:var(--ok);}
.pill.inprogress{background:var(--warn-soft);color:var(--warn);}
.pill.verified{background:var(--blue-soft);color:var(--blue-strong);}
.pill.minor{background:var(--sunken);color:var(--ink-500);}
.pill.major{background:var(--warn-soft);color:var(--warn);}
.pill.critical{background:var(--danger-soft);color:var(--danger);}

/* ---------- accordion / doc list ---------- */
.docs-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start;}
@media(max-width:900px){.docs-layout{grid-template-columns:1fr;}}
.doc-group{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;background:var(--surface);overflow:hidden;}
.doc-group summary{
  list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:13px;background:var(--sunken);
}
.doc-group summary::-webkit-details-marker{display:none;}
.doc-group summary svg{transition:transform .15s;flex:none;}
.doc-group[open] summary svg{transform:rotate(90deg);}
.doc-row{
  display:flex;align-items:center;gap:8px;padding:8px 12px 8px 30px;border-top:1px solid var(--line);
  cursor:pointer;font-size:12.8px;
}
[dir=rtl] .doc-row{padding:8px 30px 8px 12px;}
.doc-row:hover{background:var(--sunken);}
.doc-row.active{background:var(--blue-soft);color:var(--blue-strong);font-weight:700;}
.doc-row .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-300);}
.doc-row .dot.review{background:var(--warn);} .doc-row .dot.approved{background:var(--ok);} .doc-row .dot.archived{background:var(--archive);}

/* ---------- archive ---------- */
.seg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.seg-tab{padding:7px 12px;border:1px solid var(--line-strong);border-radius:20px;background:var(--surface);color:var(--ink-700);
  font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.seg-tab:hover{background:var(--sunken);}
.seg-tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.seg-tab.active .nav-badge{background:rgba(255,255,255,.25);color:#fff;border-color:transparent;}
.archive-table{width:100%;border-collapse:collapse;font-size:13px;}
.archive-table th{text-align:start;font-size:11.5px;color:var(--ink-500);padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;}
.archive-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.archive-table tr:last-child td{border-bottom:none;}
.archive-table .actions-cell{display:flex;gap:6px;flex-wrap:nowrap;}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-flex;align-items:center;justify-content:center;box-sizing:content-box;}
.qr-box img,.qr-box svg{display:block;width:100%;height:100%;}
.doc-row .code{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);}
.doc-row .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.editor-head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px;}
.editor-head .code{font-family:var(--font-mono);font-size:11.5px;color:var(--gold);font-weight:600;}
.editor-head h3{font-size:19px;margin-top:3px;}
.editor-head .purpose{color:var(--ink-500);font-size:13px;margin-top:6px;max-width:70ch;}
.editor-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-500);}
.editor-meta b{color:var(--ink-900);}
.editor-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

/* ---------- tables (in-app) ---------- */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
table.dyn{width:100%;border-collapse:collapse;min-width:560px;}
table.dyn th{
  background:var(--sunken);text-align:start;font-size:11.5px;color:var(--ink-500);
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;
}
table.dyn td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;}
table.dyn td input,table.dyn td textarea{border:1px solid transparent;background:transparent;padding:6px 7px;min-height:36px;}
table.dyn td input:hover,table.dyn td textarea:hover{border-color:var(--line);}
table.dyn td input:focus,table.dyn td textarea:focus{background:var(--surface);border-color:var(--blue);}
table.dyn td.locked{color:var(--ink-700);font-weight:700;background:var(--sunken);font-size:12.5px;padding:9px 10px;}
table.dyn td.rmcell{width:34px;text-align:center;}
table.dyn tfoot td{padding:8px;}

/* matrix (RACI) */
.matrix select{padding:5px 4px;font-size:12px;text-align:center;font-weight:700;}
.matrix select.v-R{color:#fff;background:var(--blue);border-color:var(--blue);}
.matrix select.v-A{color:#fff;background:var(--ok);border-color:var(--ok);}
.matrix select.v-C{color:#111;background:var(--gold-soft);border-color:var(--gold);}
.matrix select.v-I{color:var(--ink-500);background:var(--sunken);}

/* ---------- toast / modal ---------- */
#toast-root{position:fixed;bottom:18px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;}
.toast{
  background:var(--ink-900);color:var(--bg);padding:10px 18px;border-radius:var(--radius);font-size:13px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:min(520px,90vw);text-align:center;line-height:1.5;
}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,25,43,.5);display:flex;align-items:center;justify-content:center;z-index:150;padding:16px;}
.modal{background:var(--surface);border-radius:6px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:88vh;overflow-y:auto;}
.modal h3{font-size:16px;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--ink-700);margin:0 0 16px;}
.modal .row{display:flex;gap:8px;justify-content:flex-end;}

/* ---------- onboarding ---------- */
.onboard-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.onboard{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 26px;}
.onboard .mark{width:44px;height:44px;border:2px solid var(--blue);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--blue);font-family:var(--font-mono);font-weight:700;margin-bottom:14px;}
.onboard h2{font-size:20px;} .onboard p.sub{color:var(--ink-500);font-size:13px;margin:6px 0 20px;}

/* ---------- gauge / bars ---------- */
.gauge-wrap{display:flex;align-items:center;gap:18px;}
.gauge-num{font-family:var(--font-display);font-size:30px;font-weight:800;}
.statusbar{display:flex;height:10px;border-radius:20px;overflow:hidden;background:var(--sunken);}
.statusbar span{height:100%;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-500);}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px;}

.activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.8px;}
.activity-item:last-child{border-bottom:none;}
.activity-item .t{color:var(--ink-500);font-size:11px;white-space:nowrap;}

.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--ink-500);font-size:13px;}
.empty b{display:block;color:var(--ink-900);font-size:14.5px;margin-bottom:6px;font-family:var(--font-display);}

.reg-table td,.reg-table th{font-size:12.6px;}
.reg-table td.title{max-width:260px;}

/* ---------- print ---------- */
#print-area{display:none;}
@media print{
  body{background:#fff !important;}
  #app{display:none !important;}
  #print-area{display:block !important;font-family:var(--font-body);color:#111;}
  .p-letterhead{display:flex;justify-content:space-between;border-bottom:2px solid #12233F;padding-bottom:10px;margin-bottom:16px;}
  .p-letterhead .org{font-weight:800;font-size:16px;}
  .p-letterhead .meta{font-size:11px;text-align:end;color:#333;}
  .p-title{font-size:18px;font-weight:800;margin-bottom:2px;}
  .p-code{font-family:var(--font-mono);color:#9C7A3C;font-size:12px;margin-bottom:14px;}
  .p-info{display:flex;gap:24px;font-size:12px;margin-bottom:14px;flex-wrap:wrap;}
  .p-section{margin-bottom:14px;}
  .p-section h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:#555;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:6px;}
  .p-section .val{font-size:13px;white-space:pre-wrap;}
  .p-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .p-table th,.p-table td{border:1px solid #999;padding:5px 7px;text-align:start;}
  .p-table th{background:#eee;}
  .p-sign{margin-top:40px;display:flex;justify-content:flex-end;text-align:center;}
  .p-sign .box{width:220px;border-top:1px solid #333;padding-top:6px;font-size:11.5px;}
  .p-footer{margin-top:30px;font-size:10px;color:#888;border-top:1px solid #ccc;padding-top:6px;}
}

@media(max-width:880px){
  .sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;z-index:80;transform:translateX(-100%);transition:transform .18s;box-shadow:0 0 30px rgba(0,0,0,.2);}
  [dir=rtl] .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;}
  .searchbox{width:auto;flex:1;}
  .brand small{display:none;}
}
</style>
</head>

<div id="app"></div>
<div id="toast-root"></div>
<div id="print-area"></div>

function qrMatrixToSvg(matrix, opts){

  const n = matrix.length;

  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(matrix[r][c]) path += `M${c+margin} ${r+margin}h1v1h-1z`;

  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" width="100%" height="100%">`
    + `<rect width="${size}" height="${size}" fill="#fff"/>`
    + `<path d="${path}" fill="#000"/>`
    + `</svg>`;
}

  return new Promise(resolve=>{
    const margin = 3;
    const n = matrix.length;
    const totalModules = n + margin*2;
    const modulePx = Math.max(4, Math.round(targetPx/totalModules));
    const size = modulePx*totalModules;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#000';

      }
    }
    canvas.toBlob(blob=>resolve(blob), 'image/png');
  });

/* ============================= STATE ============================= */
const LS_KEY = 'tqm_engine_state_v1';
const ACCOUNTS_KEY = 'tqm_accounts_v1';
const SESSION_KEY = 'tqm_session_v1';

function hashPass(pw){
  let h = 5381;
  for(let i=0;i<pw.length;i++){ h = ((h*33) ^ pw.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function loadAccounts(){
  try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}'); }catch(e){ return {}; }
}
function saveAccounts(acc){
  try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(acc)); }catch(e){}
}
function loadSessionEmail(){
  try{ return localStorage.getItem(SESSION_KEY) || null; }catch(e){ return null; }
}
function saveSessionEmail(email){
  try{ localStorage.setItem(SESSION_KEY, email); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function accountStateKey(email){ return LS_KEY+'::'+email; }

let accounts = loadAccounts();
let currentAccountEmail = loadSessionEmail();
if(currentAccountEmail && !accounts[currentAccountEmail]) currentAccountEmail = null;
let authMode = Object.keys(accounts).length ? 'login' : 'register';
let authError = '';

function defaultState(){
  return {
    lang:'ar', theme:'system',
    profile:{name:'', title:'', org:''},
    projects:[], activeProjectId:null,
    documents:{}, ncrs:[], capas:[],
    route:'dashboard', selectedDocCode:null,
  };
}
function loadAccountState(email){
  try{
    const raw = localStorage.getItem(accountStateKey(email));
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
// One-time migration: data saved before the login system existed lived under LS_KEY directly.
// The first account ever registered on this browser inherits it.
function takeLegacyStateIfAny(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    localStorage.removeItem(LS_KEY);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return null; }
}
let state = currentAccountEmail ? loadAccountState(currentAccountEmail) : defaultState();
function saveState(){
  if(!currentAccountEmail) return;
  try{ localStorage.setItem(accountStateKey(currentAccountEmail), JSON.stringify(state)); }
  catch(e){ toast(state.lang==='ar'?'تعذّر حفظ البيانات محلياً':'Could not save data locally'); }
}
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowStr(){ const d=new Date(); return d.toISOString().slice(0,16).replace('T',' '); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function activeProject(){ return state.projects.find(p=>p.id===state.activeProjectId) || null; }
function docKey(projectId, code){ return projectId+'::'+code; }
function getDoc(code){
  const p = activeProject(); if(!p) return null;
  return state.documents[docKey(p.id,code)] || null;
}
function ensureDocEntry(code){
  const p = activeProject(); if(!p) return null;
  const k = docKey(p.id,code);
  if(!state.documents[k]){
    state.documents[k] = {code, projectId:p.id, status:'draft', version:0, content:{}, history:[], updatedAt:null};
  }
  return state.documents[k];
}

/* ============================= TOAST / MODAL ============================= */
function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  root.appendChild(el);
  const dur = Math.min(6000, Math.max(2400, msg.length*45));
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, dur);
}
function confirmModal(title, msg, okLabel, danger){
  return new Promise(resolve=>{
    const back = document.createElement('div'); back.className='modal-backdrop';
    back.innerHTML = `<div class="modal">
      <h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="row">
        <button class="btn ghost" data-x="0">${esc(tr('cancel'))}</button>
        <button class="btn ${danger?'danger':'primary'}" data-x="1">${esc(okLabel)}</button>
      </div></div>`;
    document.body.appendChild(back);
    back.addEventListener('click', e=>{
      if(e.target===back){ back.remove(); resolve(false); return; }
      const b = e.target.closest('[data-x]'); if(!b) return;
      back.remove(); resolve(b.dataset.x==='1');
    });
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= HISTORY ============================= */
function pushHistory(doc, action){
  doc.history = doc.history || [];
  doc.history.unshift({v:doc.version, at:nowStr(), action});
  if(doc.history.length>12) doc.history.length = 12;
}

/* ============================= RENDER: SHELL ============================= */
function applyTheme(){
  const root = document.documentElement;
  if(state.theme==='light') root.setAttribute('data-theme','light');
  else if(state.theme==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
}
function applyDir(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr';
}

function render(){
  applyDir(); applyTheme();
  const app = document.getElementById('app');
  if(!currentAccountEmail){ app.innerHTML = renderAuth(); return; }
  app.innerHTML = renderShellHtml();
  renderRoute();
}

  return `<div class="onboard-wrap"><div class="onboard">
    <div class="mark">TQM</div>
    <h2>${esc(isLogin? tr('auth_login_title') : tr('auth_register_title'))}</h2>
    <p class="sub">${esc(tr('auth_sub'))}</p>
    <p class="hint" style="margin:-14px 0 16px;">${esc(tr('brand_owner'))}</p>
    ${errHtml}
    ${!isLogin?`
    <div class="field"><label class="field-label">${esc(tr('auth_your_name'))}</label><input type="text" id="au-name" placeholder="${esc(tr('auth_your_name_ph'))}"></div>
    <div class="field"><label class="field-label">${esc(tr('org'))}</label><input type="text" id="au-org" placeholder="${esc(tr('auth_company_ph'))}"></div>
    <div class="field"><label class="field-label">${esc(tr('title_job'))} <span class="hint">(${esc(tr('field_optional'))})</span></label><input type="text" id="au-title"></div>
    `:''}
    <div class="field"><label class="field-label">${esc(tr('auth_email'))}</label><input type="text" id="au-email" placeholder="${esc(tr('auth_email_ph'))}" autocomplete="username"></div>
    <div class="field"><label class="field-label">${esc(tr('auth_password'))}</label><input type="password" id="au-password" placeholder="${esc(tr('auth_password_ph'))}" autocomplete="${isLogin?'current-password':'new-password'}">
      ${!isLogin?`<div class="hint">${esc(tr('auth_password_hint'))}</div>`:''}
    </div>
    ${!isLogin?`<div class="field"><label class="field-label">${esc(tr('auth_confirm_password'))}</label><input type="password" id="au-password2" placeholder="${esc(tr('auth_password_ph'))}" autocomplete="new-password"></div>`:''}
    <button class="btn primary" style="width:100%;justify-content:center" data-action="${isLogin?'auth-login':'auth-register'}">${esc(isLogin? tr('auth_login_btn') : tr('auth_register_btn'))}</button>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn ghost sm" data-action="auth-switch-mode">${esc(isLogin? tr('auth_switch_to_register') : tr('auth_switch_to_login'))}</button>
    </div>
    <p class="hint" style="margin-top:16px;line-height:1.7;">${esc(tr('auth_note_local'))}</p>

  {route:'dashboard', icon:'home', key:'nav_dashboard'},
  {route:'projects', icon:'folder', key:'nav_projects'},
  {route:'documents', icon:'file', key:'nav_documents'},
  {route:'ncr', icon:'ncr', key:'nav_ncr'},
  {route:'capa', icon:'capa', key:'nav_capa'},
  {route:'export', icon:'print', key:'nav_export'},
  {route:'archive', icon:'archive', key:'nav_archive'},
  {route:'settings', icon:'settings', key:'nav_settings'},
];

function renderShellHtml(){
  const p = activeProject();
  const navHtml = NAV.map(n=>{
    let badge = '';
    if(n.route==='documents' && p){ badge = `<span class="nav-badge">${docsSummary(p.id).approved}/40</span>`; }
    if(n.route==='ncr' && p){ const c = state.ncrs.filter(x=>x.projectId===p.id && x.status==='open').length; if(c) badge = `<span class="nav-badge">${c}</span>`; }
    if(n.route==='capa' && p){ const c = state.capas.filter(x=>x.projectId===p.id && x.status!=='closed').length; if(c) badge = `<span class="nav-badge">${c}</span>`; }
    return `<div class="navitem ${state.route===n.route?'active':''}" data-action="nav" data-route="${n.route}" tabindex="0">${ic(n.icon)}<span>${esc(tr(n.key))}</span>${badge}</div>`;
  }).join('');

  const projOptions = state.projects.map(pr=>`<option value="${pr.id}" ${pr.id===state.activeProjectId?'selected':''}>${esc(pr.code)} — ${esc(pr.name)}</option>`).join('');

  return `
  <div class="topbar">
    <button class="iconbtn hamburger" data-action="toggle-sidebar" aria-label="menu">${ic('menu')}</button>
    <div class="brand"><div class="mark">TQM</div><div><div>${esc(tr('appName'))}</div><small>${esc(tr('appSub'))} — ${esc(tr('brand_owner'))}</small></div></div>
    <div class="spacer"></div>

function effectiveDark(){
  if(state.theme==='dark') return true;
  if(state.theme==='light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function docsSummary(projectId){
  let approved=0, review=0, draft=0, archived=0;
  DOCS.forEach(d=>{
    const doc = state.documents[docKey(projectId,d.code)];
    const st = doc ? doc.status : 'draft';
    if(!doc){ draft++; return; }
    if(st==='approved') approved++; else if(st==='review') review++; else if(st==='archived') archived++; else draft++;
  });
  return {approved,review,draft,archived,total:40};
}

/* ============================= ROUTES ============================= */
function renderRoute(){
  const root = document.getElementById('route-root');
  if(!root) return;
  let html = '';
  switch(state.route){
    case 'dashboard': html = renderDashboard(); break;
    case 'projects': html = renderProjects(); break;
    case 'documents': html = renderDocuments(); break;
    case 'ncr': html = renderNCR(); break;
    case 'capa': html = renderCAPA(); break;
    case 'export': html = renderExport(); break;
    case 'archive': html = renderArchive(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderDashboard();
  }
  root.innerHTML = html;
}

function buildActivity(projectId){
  const items = [];
  Object.values(state.documents).forEach(d=>{
    if(d.projectId!==projectId || !d.updatedAt) return;
    const meta = DOC_BY_CODE[d.code];
    items.push({at:d.updatedAt, text:(state.lang==='ar'?'وثيقة: ':'Doc: ')+(meta?(state.lang==='ar'?meta.ar:meta.en):d.code)+' — '+statusLabel(d.status)});
  });
  state.ncrs.filter(n=>n.projectId===projectId).forEach(n=>items.push({at:n.createdAt, text:(state.lang==='ar'?'NCR جديدة: ':'New NCR: ')+n.no}));
  state.capas.filter(c=>c.projectId===projectId).forEach(c=>items.push({at:c.createdAt, text:(state.lang==='ar'?'إجراء تصحيحي جديد':'New corrective action')}));
  items.sort((a,b)=> (b.at||'').localeCompare(a.at||''));
  return items;
}

/* ---------- AI (Gemini) drafting assist ---------- */
function buildAIPrompt(meta, entry){
  const lang = state.lang; const p = activeProject();
  const title = lang==='ar'?meta.ar:meta.en;
  const purpose = lang==='ar'?meta.par:meta.pen;
  const lines = [];
  if(lang==='ar'){
    lines.push(`أنت استشاير خبير في إدارة الجودة الشاملة (TQM) ومواصفة ISO 9001:2015. اكتب محتوى احترافياً دقيقاً لوثيقة الجودة التالية ضمن مشروع "${p?p.name:''}"${p&&p.client?(' لصالح '+p.client):''}.`);
    lines.push(`اسم الوثيقة: ${title} (${meta.code})`);
    lines.push(`الهدف من الوثيقة: ${purpose}`);
    lines.push('');
    lines.push('مهم جداً: أجب حصراً بالتنسيق التالي، بنفس الرموز والعلامات حرفياً، بدون أي مقدمة أو شرح أو نص خارج العلامات:');
  } else {
    lines.push(`You are an expert TQM / ISO 9001:2015 consultant. Write precise, professional content for the following quality document, for the project "${p?p.name:''}"${p&&p.client?(' for '+p.client):''}.`);
    lines.push(`Document: ${title} (${meta.code})`);
    lines.push(`Purpose: ${purpose}`);
    lines.push('');
    lines.push('IMPORTANT: reply using EXACTLY this format, same markers verbatim, no intro, no explanation, nothing outside the markers:');
  }
  lines.push('');
  let hasMatrix = false;
  meta.fields.forEach(f=>{
    if(f.type==='matrix'){ hasMatrix = true; return; }
    const label = lang==='ar'?f.ar:f.en;
    const existing = entry.content[f.key];
    if(f.type==='text'){
      lines.push(`[[FIELD:${f.key}]]`);
      lines.push(lang==='ar'? `(${label} — اكتب المحتوى الكامل هنا)` : `(${label} — write the full content here)`);
      lines.push('[[/FIELD]]');
      if(existing && String(existing).trim()){ lines.push((lang==='ar'?'مسودة حالية لتحسينها بدل الكتابة من الصفر: ':'Existing draft to refine rather than start from scratch: ')+existing); }
      lines.push('');
    } else if(f.type==='table'){
      const colNames = f.columns.map(c=> lang==='ar'?c.ar:c.en);
      const placeholder = colNames.map(c=>`<${c}>`).join(' || ');
      lines.push(`[[TABLE:${f.key}]]`);
      lines.push(lang==='ar'?`(كل سطر = صف واحد، الأعمدة مفصولة بـ || بهذا الترتيب: ${colNames.join(' | ')})`:`(each line = one row, columns separated by || in this order: ${colNames.join(' | ')})`);
      if(f.presetRows){
        f.presetRows.forEach(pr=> lines.push(`${lang==='ar'?pr.ar:pr.en} || ${placeholder}`));
      } else {
        lines.push(placeholder);
        lines.push(lang==='ar'?'(أضف من 3 إلى 8 أسطر/صفوف حسب المناسب)':'(add 3 to 8 lines/rows as relevant)');
      }
      lines.push('[[/TABLE]]');
      lines.push('');
    }
  });
  if(hasMatrix){ lines.push(lang==='ar'?'(تم تجاهل حقل مصفوفة RACI — يُعبّأ يدوياً في التطبيق)':'(RACI matrix field skipped — fill it manually in the app)'); }
  return lines.join('\n');
}
function preprocessAIText(text){
  // strip code fences and markdown emphasis right around our markers so slight
  // reformatting by the model (```...```, **bold**, `code`) doesn't break parsing
  let t = text.replace(/```[a-zA-Z]*\n?/g,'').replace(/```/g,'');
  t = t.replace(/[*_`]+(\[\[)/g,'$1').replace(/(\]\])[*_`]+/g,'$1');
  t = t.replace(/[*_`]+(\[\[\/)/g,'$1');
  return t;
}
function splitRowLine(line){
  let l = line.trim();
  if(/^[-|\s:]+$/.test(l)) return null; // markdown table separator row, e.g. |---|---|
  if(l.indexOf('||')>-1){
    return l.split('||').map(s=>s.trim());
  }
  if(l.indexOf('|')>-1){
    // markdown-style single-pipe row; drop leading/trailing empty cells from | ... |
    let parts = l.split('|').map(s=>s.trim());
    if(parts.length && parts[0]==='') parts.shift();
    if(parts.length && parts[parts.length-1]==='') parts.pop();
    return parts;
  }
  return null;
}
function parseAIResponse(meta, entry, rawText){
  const text = preprocessAIText(rawText);
  let applied = 0, missed = [];
  meta.fields.forEach(f=>{
    if(f.type==='matrix') return;
    const label = state.lang==='ar'?f.ar:f.en;
    if(f.type==='text'){
      const re = new RegExp('\\[\\[FIELD:'+f.key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]\\]([\\s\\S]*?)\\[\\[/FIELD\\]\\]','i');
      const m = text.match(re);
      if(m && m[1].trim()){ entry.content[f.key] = m[1].trim(); applied++; } else { missed.push(label); }
    } else if(f.type==='table'){
      const re = new RegExp('\\[\\[TABLE:'+f.key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]\\]([\\s\\S]*?)\\[\\[/TABLE\\]\\]','i');
      const m = text.match(re);
      if(!m){ missed.push(label); return; }
      const linesRaw = m[1].split('\n').map(s=>s.trim()).filter(s=>s && !/^\(.*\)$/.test(s))
        .map(s=>splitRowLine(s)).filter(parts=>parts && parts.length>1);
      if(!linesRaw.length){ missed.push(label); return; }
      if(f.presetRows){
        const rows = f.presetRows.map((pr,i)=>({id:uid(), presetIndex:i, cells:{}}));
        linesRaw.forEach((parts,i)=>{
          if(i>=rows.length) return;
          const cellVals = parts.length > f.columns.length ? parts.slice(1) : parts;
          f.columns.forEach((c,ci)=>{ if(cellVals[ci]!==undefined) rows[i].cells[c.key]=cellVals[ci]; });
        });
        entry.content[f.key] = rows; applied++;
      } else {
        const rows = linesRaw.map(parts=>{
          const row = {id:uid(), cells:{}};
          f.columns.forEach((c,ci)=>{ row.cells[c.key]=parts[ci]||''; });
          return row;
        });
        entry.content[f.key] = rows; applied++;
      }
    }
  });
  return {applied, missed};
}

function buildShareText(meta, entry, p){
  const lang = state.lang;
  const title = lang==='ar'? meta.ar : meta.en;
  const prof = state.profile || {};
  const header = [
    `${title} (${meta.code})`,
    `${tr('print_project_hdr')}: ${p.code} — ${p.name}`,
    `${tr('status')}: ${statusLabel(entry.status)}`,
    `${tr('version')}: v${entry.version}`,
    `${tr('updated')}: ${entry.updatedAt || tr('never')}`,
  ];

  const body = [];
  const purpose = (lang==='ar'? meta.par : meta.pen) || '';
  if(purpose) body.push(`${tr('purpose')}:\n${purpose}`);

  (meta.fields||[]).forEach(f=>{
    const label = lang==='ar'?f.ar:f.en;
    if(f.type==='text'){
      const val = (entry.content[f.key]||'').toString().trim();
      if(!val) return;
      body.push(`${label}:\n${val}`);
    } else if(f.type==='table'){
      const rows = entry.content[f.key]||[];
      if(!rows.length) return;
      const lines = rows.map(r=>{
        const lockedLabel = f.presetRows ? ((lang==='ar'?f.presetRows[r.presetIndex].ar:f.presetRows[r.presetIndex].en)+' — ') : '';
        const cells = f.columns.map(c=>{
          const v = r.cells[c.key];
          return v ? `${lang==='ar'?c.ar:c.en}: ${v}` : null;
        }).filter(Boolean).join(' | ');
        return cells ? `- ${lockedLabel}${cells}` : null;
      }).filter(Boolean);
      if(lines.length) body.push(`${label}:\n${lines.join('\n')}`);
    } else if(f.type==='matrix'){
      const m = entry.content[f.key]; if(!m || !m.rows || !m.rows.length) return;
      const lines = m.rows.map(row=>{
        const cells = m.roles.map(role=> row.cells[role.id] ? `${role.label}: ${row.cells[role.id]}` : null).filter(Boolean).join(' | ');
        return cells ? `- ${row.label} (${cells})` : null;
      }).filter(Boolean);
      if(lines.length) body.push(`${label}:\n${lines.join('\n')}`);
    }
  });

  if(!body.length) body.push(tr('no_content_yet'));

  const footer = [`${tr('org_letterhead')}${prof.org? ' — '+prof.org : ''}`, tr('brand_owner')];
  return [...header, '', ...body, '', ...footer].join('\n');
}

// wa.me / QR links have practical length limits; long documents are shared in full via
// copy-to-clipboard and the JSON export, but the link/QR text itself is capped.
// Cap by UTF-8 byte length (not character count) so the capped text always fits
// comfortably within a reliably-scannable QR code, even for all-Arabic content
// where each character is 2 bytes. ~1200 bytes keeps the QR around version 18-20,
// which scans reliably on an ordinary phone camera.
const SHARE_LINK_MAX_BYTES = 1200;
function buildShareLinkText(fullText){
  const enc = new TextEncoder();
  if(enc.encode(fullText).length <= SHARE_LINK_MAX_BYTES) return {text: fullText, truncated:false};
  let end = fullText.length;
  while(end > 0){
    const slice = fullText.slice(0, end);
    if(enc.encode(slice).length <= SHARE_LINK_MAX_BYTES - 3) return {text: slice + '…', truncated:true};
    end--;
  }
  return {text: '…', truncated:true};
}

function shareModalHtml(code){
  const p = activeProject(); const meta = DOC_BY_CODE[code]; const entry = ensureDocEntry(code);
  const lang = state.lang;
  const title = lang==='ar'? meta.ar : meta.en;
  const fullText = buildShareText(meta, entry, p);
  const {text, truncated} = buildShareLinkText(fullText);
  const encoded = encodeURIComponent(text);
  const waLink = `https://wa.me/?text=${encoded}`;
  const qrResult = generateQrSvg(text, {margin:3});
  // Scale the display size with module count so denser codes (longer content)
  // still get enough pixels-per-module for a phone camera to scan reliably.
  const qrPx = qrResult ? Math.max(220, Math.min(360, qrResult.modules*6)) : 220;
  return `<div class="modal-backdrop" id="share-modal-backdrop">
    <div class="modal" style="max-width:${Math.max(400, qrPx+40)}px;text-align:center;">
      <h3 style="margin-bottom:2px;">${esc(tr('share_title'))}</h3>
      <p class="hint" style="margin:0 0 14px;">${esc(title)} — ${esc(meta.code)}</p>
      ${qrResult
        ? `<div class="qr-box" style="width:${qrPx}px;height:${qrPx}px;">${qrResult.svg}</div>`
        : `<div class="hint" style="margin-top:10px;">${esc(tr('qr_unavailable'))}</div>`}
      <p class="hint" style="margin:12px 0 4px;">${esc(tr('scan_hint'))}</p>
      ${truncated?`<p class="hint" style="margin:4px 0;color:var(--warn);">${esc(tr('share_truncated_note'))}</p>`:''}
      <div class="btnrow" style="justify-content:center;margin-top:10px;">

function openShareModal(code){
  const p = activeProject(); if(!p){ toast(tr('need_active_project')); return; }
  const wrap = document.createElement('div'); wrap.innerHTML = shareModalHtml(code);
  document.body.appendChild(wrap.firstElementChild);
}
async function handleCopyShareText(code){
  const p = activeProject(); if(!p) return;
  const meta = DOC_BY_CODE[code]; const entry = ensureDocEntry(code);
  if(!entry) return;
  const text = buildShareText(meta, entry, p);
  try{ await navigator.clipboard.writeText(text); toast(tr('copied_ok')); }
  catch(err){
    try{
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); ta.remove();
      toast(tr('copied_ok'));
    }catch(err2){ toast(tr('copy_failed')); }
  }
}
async function shareOrSaveQrImage(code){
  const p = activeProject(); if(!p){ toast(tr('need_active_project')); return; }
  const meta = DOC_BY_CODE[code]; const entry = ensureDocEntry(code);
  const fullText = buildShareText(meta, entry, p);
  const {text} = buildShareLinkText(fullText);
  const matrix = generateQrMatrixSafe(text);
  if(!matrix){ toast(tr('qr_unavailable')); return; }
  let blob;
  try{ blob = await qrMatrixToPngBlob(matrix, 900); }catch(err){ blob = null; }
  if(!blob){ toast(tr('qr_unavailable')); return; }
  const filename = `${meta.code}-qr.png`;

  // Prefer the native share sheet (drops straight into WhatsApp/etc as an image)
  // where the platform supports sharing files; otherwise save it so the person
  // can attach it manually.
  try{
    const file = new File([blob], filename, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: meta.code});
      return;
    }
  }catch(err){
    if(err && err.name === 'AbortError') return; // person cancelled the share sheet
    // otherwise fall through to saving the file below
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(tr('qr_image_saved_note'));
  }catch(err){ toast(tr('downloads_unavailable')); }
}
function handleExportDocJSON(code){
  const p = activeProject(); if(!p){ toast(tr('need_active_project')); return; }
  const meta = DOC_BY_CODE[code]; const entry = ensureDocEntry(code);
  if(!entry){ toast(tr('need_active_project')); return; }
  const payload = {
    project:{code:p.code, name:p.name},
    document:{code:meta.code, title_ar:meta.ar, title_en:meta.en, status:entry.status, version:entry.version, updatedAt:entry.updatedAt, content:entry.content, history:entry.history},
    exportedAt: nowStr(),
  };
  try{
    const data = JSON.stringify(payload, null, 2);
    const filename = meta.code+'-'+todayStr()+'.json';
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(tr('doc_saved_json'));
  }catch(err){ toast(tr('downloads_unavailable')); }
}

function printDocument(code){
  const p = activeProject(); if(!p) return;
  const meta = DOC_BY_CODE[code]; const entry = ensureDocEntry(code);
  if(!meta || !entry){ toast(tr('need_active_project')); return; }
  const lang = state.lang;
  let body = '';
  meta.fields.forEach(f=>{
    const label = lang==='ar'?f.ar:f.en;
    if(f.type==='text'){
      const val = entry.content[f.key]||'';
      if(!val) return;
      body += `<div class="p-section"><h4>${esc(label)}</h4><div class="val">${esc(val)}</div></div>`;
    } else if(f.type==='table'){
      const rows = entry.content[f.key]||[];
      if(!rows.length) return;
      const ths = (f.presetRows?'<th></th>':'') + f.columns.map(c=>`<th>${esc(lang==='ar'?c.ar:c.en)}</th>`).join('');
      const trs = rows.map(r=>{
        const lockedCell = f.presetRows? `<td>${esc(lang==='ar'?f.presetRows[r.presetIndex].ar:f.presetRows[r.presetIndex].en)}</td>`:'';
        return `<tr>${lockedCell}${f.columns.map(c=>`<td>${esc(r.cells[c.key]||'')}</td>`).join('')}</tr>`;
      }).join('');
      body += `<div class="p-section"><h4>${esc(label)}</h4><table class="p-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
    } else if(f.type==='matrix'){
      const m = entry.content[f.key]; if(!m || !m.rows.length) return;
      const ths = '<th></th>'+m.roles.map(r=>`<th>${esc(r.label)}</th>`).join('');
      const trs = m.rows.map(row=>`<tr><td>${esc(row.label)}</td>${m.roles.map(role=>`<td>${esc(row.cells[role.id]||'')}</td>`).join('')}</tr>`).join('');
      body += `<div class="p-section"><h4>${esc(label)}</h4><table class="p-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
    }
  });
  const html = `${letterhead(tr('print_project_hdr')+': '+p.code+' — '+p.name)}
    <div class="p-code">${esc(meta.code)}</div>
    <div class="p-title">${esc(lang==='ar'?meta.ar:meta.en)}</div>
    <div class="p-info"><div><b>${esc(tr('status'))}:</b> ${esc(statusLabel(entry.status))}</div><div><b>${esc(tr('version'))}:</b> v${entry.version}</div><div><b>${esc(tr('updated'))}:</b> ${esc(entry.updatedAt||'')}</div></div>
    <div class="p-section"><h4>${esc(tr('purpose'))}</h4><div class="val">${esc(lang==='ar'?meta.par:meta.pen)}</div></div>
    ${body}
    ${signatureBlock()}${footerBlock()}`;
  doPrint(html);
}

/* ============================= EVENT HANDLING ============================= */
document.addEventListener('DOMContentLoaded', ()=>{ render(); wireGlobalEvents(); });

function wireGlobalEvents(){
  document.body.addEventListener('click', onClick);
  document.body.addEventListener('change', onChange);
  document.body.addEventListener('input', onInput);
  document.body.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.classList.contains('navitem')) e.target.click(); });
}

async function onClick(e){
  const t = e.target.closest('[data-action]');
  if(t){
    const act = t.dataset.action;
    switch(act){
      case 'auth-login': return handleAuthLogin();
      case 'auth-register': return handleAuthRegister();
      case 'auth-switch-mode': authMode = authMode==='login'?'register':'login'; authError=''; render(); return;
      case 'nav': state.route = t.dataset.route; state.selectedDocCode = state.route==='documents'?state.selectedDocCode:state.selectedDocCode; saveState(); render(); closeSidebarMobile(); return;
      case 'toggle-sidebar': document.getElementById('sidebar').classList.toggle('open'); return;
      case 'toggle-lang': state.lang = state.lang==='ar'?'en':'ar'; saveState(); render(); return;
      case 'toggle-theme': state.theme = effectiveDark()?'light':'dark'; saveState(); render(); return;
      case 'select-project': state.activeProjectId = t.dataset.id; saveState(); render(); return;
      case 'open-project-form': openProjectForm(); return;
      case 'close-project-form': document.getElementById('project-form-wrap').innerHTML=''; return;
      case 'edit-project': { const pr = state.projects.find(x=>x.id===t.dataset.id); openProjectForm(pr); return; }
      case 'save-project': return handleSaveProject(t.dataset.id);
      case 'delete-project': return handleDeleteProject(t.dataset.id);
      case 'select-doc': state.selectedDocCode = t.dataset.code; saveState(); renderRoute(); return;
      case 'save-doc': return handleSaveDoc(t.dataset.code);
      case 'print-doc': return printDocument(t.dataset.code);
      case 'copy-ai-prompt': return handleCopyAIPrompt();
      case 'apply-ai-response': return handleApplyAIResponse(t.dataset.code);
      case 'add-row': return handleAddRow(t.dataset.table);
      case 'rm-row': return handleRmRow(t.dataset.table, t.dataset.row);
      case 'add-role': return handleAddRole(t.dataset.matrix);
      case 'rm-role': return handleRmRole(t.dataset.matrix, t.dataset.role);
      case 'add-mrow': return handleAddMRow(t.dataset.matrix);
      case 'rm-mrow': return handleRmMRow(t.dataset.matrix, t.dataset.row);
      case 'add-ncr': openNCRForm(); return;
      case 'edit-ncr': { const n = state.ncrs.find(x=>x.id===t.dataset.id); openNCRForm(n); return; }
      case 'close-ncr-form': closeModalById('ncr-modal-backdrop'); return;
      case 'save-ncr': return handleSaveNCR(t.dataset.id);
      case 'delete-ncr': return handleDeleteNCR(t.dataset.id);
      case 'print-ncr': return printNCRSingle(t.dataset.id);
      case 'add-capa': openCAPAForm(); return;
      case 'edit-capa': { const c = state.capas.find(x=>x.id===t.dataset.id); openCAPAForm(c); return; }
      case 'close-capa-form': closeModalById('capa-modal-backdrop'); return;
      case 'save-capa': return handleSaveCAPA(t.dataset.id);
      case 'delete-capa': return handleDeleteCAPA(t.dataset.id);
      case 'print-capa': return printCAPASingle(t.dataset.id);
      case 'print-register': return printRegister();
      case 'print-ncr-register': return printNCRRegister();
      case 'print-capa-register': return printCAPARegister();
      case 'archive-filter': archiveFilter = t.dataset.status; renderRoute(); return;
      case 'select-doc-goto': state.route='documents'; state.selectedDocCode = t.dataset.code; saveState(); render(); return;
      case 'save-doc-json': return handleExportDocJSON(t.dataset.code);
      case 'share-doc': return openShareModal(t.dataset.code);
      case 'close-share-modal': return closeModalById('share-modal-backdrop');
      case 'copy-share-text': return handleCopyShareText(t.dataset.code);
      case 'share-qr-image': return shareOrSaveQrImage(t.dataset.code);
      case 'export-json': return handleExportJSON();
      case 'import-json': document.getElementById('import-file-input').click(); return;
      case 'reset-data': return handleResetData();
      case 'save-settings': return handleSaveSettings();
      case 'logout': return handleLogoutConfirm();
    }
  }
  if(!e.target.closest('.searchbox')){ const sr = document.getElementById('search-results'); if(sr) sr.classList.add('hidden'); }
  if(!e.target.closest('.sidebar') && !e.target.closest('.hamburger')){ const sb = document.getElementById('sidebar'); if(sb && window.innerWidth<=880) sb.classList.remove('open'); }
}

function closeSidebarMobile(){ const sb=document.getElementById('sidebar'); if(sb) sb.classList.remove('open'); }
function closeModalById(id){ const el = document.getElementById(id); if(el) el.remove(); }

function onChange(e){
  if(e.target.id==='active-project-select'){ state.activeProjectId = e.target.value; saveState(); render(); return; }
  if(e.target.id==='doc-status-select'){
    const code = state.selectedDocCode; const entry = ensureDocEntry(code);
    const newStatus = e.target.value;
    if(newStatus!==entry.status){ entry.version++; entry.status=newStatus; entry.updatedAt=nowStr(); pushHistory(entry, tr('action_status')+' '+statusLabel(newStatus)); saveState(); renderRoute(); toast(tr('saved_ok')); }
    return;
  }
  if(e.target.matches('[data-table]')){ return; } /* handled on input for live typing */
  if(e.target.matches('[data-action="matrix-cell"]')){
    const code = state.selectedDocCode; const entry = ensureDocEntry(code);
    const m = entry.content[e.target.dataset.matrix];
    const row = m.rows.find(r=>r.id===e.target.dataset.row);
    row.cells[e.target.dataset.role] = e.target.value;
    e.target.className = e.target.value?('v-'+e.target.value):'';
    saveState();
    return;
  }
  if(e.target.id==='import-file-input'){ return handleImportFile(e.target.files[0]); }
}

function onInput(e){
  if(e.target.id==='global-search') return handleSearch(e.target.value);
  if(e.target.matches('textarea[data-fkey]')){
    const code = state.selectedDocCode; const entry = ensureDocEntry(code);
    entry.content[e.target.dataset.fkey] = e.target.value;
    return; /* saved on explicit Save button press */
  }
  if(e.target.matches('textarea[data-table]')){
    const code = state.selectedDocCode; const entry = ensureDocEntry(code);
    const rows = entry.content[e.target.dataset.table];
    const row = rows.find(r=>r.id===e.target.dataset.row);
    if(row) row.cells[e.target.dataset.col] = e.target.value;
    return;
  }
}

/* ---------- handlers: onboarding / settings ---------- */
function isValidEmailAddr(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
function handleAuthRegister(){
  const name = document.getElementById('au-name').value.trim();
  const org = document.getElementById('au-org').value.trim();
  const title = document.getElementById('au-title').value.trim();
  const email = document.getElementById('au-email').value.trim().toLowerCase();
  const pw = document.getElementById('au-password').value;
  const pw2 = document.getElementById('au-password2').value;
  if(!name || !org || !email || !pw || !pw2){ authError = tr('auth_error_required'); render(); return; }
  if(!isValidEmailAddr(email)){ authError = tr('auth_error_email'); render(); return; }
  if(pw.length<4){ authError = tr('auth_error_password_len'); render(); return; }
  if(pw!==pw2){ authError = tr('auth_error_password_match'); render(); return; }
  if(accounts[email]){ authError = tr('auth_error_email_exists'); render(); return; }
  accounts[email] = {passHash:hashPass(pw), name, title, org, createdAt:nowStr()};
  saveAccounts(accounts);
  currentAccountEmail = email;
  saveSessionEmail(email);
  const isFirstEverAccount = Object.keys(accounts).length===1;
  const legacy = isFirstEverAccount ? takeLegacyStateIfAny() : null;
  state = legacy || defaultState();
  state.profile = {name, title, org};
  authError = '';
  saveState();
  render();
}
function handleAuthLogin(){
  const email = document.getElementById('au-email').value.trim().toLowerCase();
  const pw = document.getElementById('au-password').value;
  if(!email || !pw){ authError = tr('auth_error_required'); render(); return; }
  const acc = accounts[email];
  if(!acc || acc.passHash !== hashPass(pw)){ authError = tr('auth_error_invalid'); render(); return; }
  currentAccountEmail = email;
  saveSessionEmail(email);
  state = loadAccountState(email);
  if(!state.profile || !state.profile.name){ state.profile = {name:acc.name, title:acc.title, org:acc.org}; }
  authError = '';
  saveState();
  render();
}
function handleLogout(){
  clearSession();
  currentAccountEmail = null;
  authMode = Object.keys(accounts).length ? 'login' : 'register';
  render();
}
async function handleLogoutConfirm(){
  const ok = await confirmModal(tr('auth_logout'), tr('auth_logout_confirm'), tr('auth_logout'), false);
  if(ok) handleLogout();
}
function handleSaveSettings(){
  state.profile.name = document.getElementById('set-name').value.trim();
  state.profile.title = document.getElementById('set-title').value.trim();
  state.profile.org = document.getElementById('set-org').value.trim();
  state.lang = document.getElementById('set-lang').value;
  state.theme = document.getElementById('set-theme').value;
  if(currentAccountEmail && accounts[currentAccountEmail]){
    accounts[currentAccountEmail].name = state.profile.name;
    accounts[currentAccountEmail].title = state.profile.title;
    accounts[currentAccountEmail].org = state.profile.org;
    saveAccounts(accounts);
  }
  saveState(); render(); toast(tr('saved_ok'));
}

/* ---------- handlers: projects ---------- */
function openProjectForm(editing){
  document.getElementById('project-form-wrap').innerHTML = projectFormHtml(editing);
}
function handleSaveProject(id){
  const code = document.getElementById('pf-code').value.trim();
  const name = document.getElementById('pf-name').value.trim();
  const client = document.getElementById('pf-client').value.trim();
  if(!code || !name) { toast(tr('profile_name_req')); return; }
  if(id){
    const pr = state.projects.find(x=>x.id===id);
    pr.code=code; pr.name=name; pr.client=client;
  } else {
    const np = {id:uid(), code, name, client, createdAt:nowStr()};
    state.projects.push(np);
    if(!state.activeProjectId) state.activeProjectId = np.id;
    toast(tr('project_added'));
  }
  document.getElementById('project-form-wrap').innerHTML='';
  saveState(); renderRoute();
  const app = document.getElementById('app'); if(app) app.querySelector && render();
}
async function handleDeleteProject(id){
  const ok = await confirmModal(tr('confirm_delete_title'), tr('confirm_delete_project'), tr('yes_delete'), true);
  if(!ok) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  Object.keys(state.documents).forEach(k=>{ if(state.documents[k].projectId===id) delete state.documents[k]; });
  state.ncrs = state.ncrs.filter(n=>n.projectId!==id);
  state.capas = state.capas.filter(c=>c.projectId!==id);
  if(state.activeProjectId===id) state.activeProjectId = state.projects[0]? state.projects[0].id : null;
  saveState(); render(); toast(tr('deleted_ok'));
}

/* ---------- handlers: documents ---------- */
function handleSaveDoc(code){
  const entry = ensureDocEntry(code);
  entry.version++;
  entry.updatedAt = nowStr();
  pushHistory(entry, entry.version===1? tr('action_created') : tr('action_updated'));
  saveState(); renderRoute(); toast(tr('saved_ok'));
}
function handleAddRow(tableKey){
  const code = state.selectedDocCode; const entry = ensureDocEntry(code);
  const rows = entry.content[tableKey] || (entry.content[tableKey]=[]);
  rows.push({id:uid(), cells:{}});
  renderRoute();
}
function handleRmRow(tableKey,rowId){
  const code = state.selectedDocCode; const entry = ensureDocEntry(code);
  entry.content[tableKey] = (entry.content[tableKey]||[]).filter(r=>r.id!==rowId);
  renderRoute();
}
function handleAddRole(matrixKey){
  const label = prompt(tr('add_role')); if(!label) return;
  const code = state.selectedDocCode; const entry = ensureDocEntry(code);
  const m = entry.content[matrixKey] || (entry.content[matrixKey]={roles:[],rows:[]});
  m.roles.push({id:uid(), label});
  renderRoute();
}
function handleRmRole(matrixKey, roleId){
  const code = state.selectedDocCode; const entry = ensureDocEntry(code);
  const m = entry.content[matrixKey];
  m.roles = m.roles.filter(r=>r.id!==roleId);
  m.rows.forEach(r=>{ delete r.cells[roleId]; });
  renderRoute();
}
function handleAddMRow(matrixKey){
  const label = prompt(tr('add_decision')); if(!label) return;
  const code = state.selectedDocCode; const entry = ensureDocEntry(code);
  const m = entry.content[matrixKey] || (entry.content[matrixKey]={roles:[],rows:[]});
  m.rows.push({id:uid(), label, cells:{}});
  renderRoute();
}
function handleRmMRow(matrixKey, rowId){
  const code = state.selectedDocCode; const entry = ensureDocEntry(code);
  const m = entry.content[matrixKey];
  m.rows = m.rows.filter(r=>r.id!==rowId);
  renderRoute();
}

/* ---------- handlers: AI assist ---------- */
async function handleCopyAIPrompt(){
  const box = document.getElementById('ai-prompt-box');
  if(!box || !box.value){ toast(tr('ai_empty_prompt')); return; }
  try{
    await navigator.clipboard.writeText(box.value);
    toast(tr('copied_ok'));
  }catch(err){
    box.removeAttribute('readonly'); box.focus(); box.select();
    try{ document.execCommand('copy'); toast(tr('copied_ok')); }
    catch(err2){ toast(tr('copy_failed')); }
    box.setAttribute('readonly','readonly');
  }
}
function handleApplyAIResponse(code){
  const box = document.getElementById('ai-response-box');
  const text = box ? box.value.trim() : '';
  if(!text || (text.indexOf('[[FIELD:')===-1 && text.indexOf('[[TABLE:')===-1)){ toast(tr('ai_no_markers')); return; }
  const meta = DOC_BY_CODE[code]; const entry = ensureDocEntry(code);
  const {applied, missed} = parseAIResponse(meta, entry, text);
  if(!applied){ toast(tr('ai_no_markers')); return; }
  saveState(); renderRoute();
  const okMsg = state.lang==='ar' ? `تم ملء ${applied} حقل/جدول تلقائياً.` : `${applied} field(s)/table(s) filled automatically.`;
  toast(missed.length ? okMsg + ' — ' + (state.lang==='ar'?'لم يُعثر على: ':'not found: ') + missed.join('، ') : okMsg);
}

/* ---------- handlers: NCR ---------- */
function openNCRForm(editing){
  const wrap = document.createElement('div'); wrap.innerHTML = ncrFormHtml(editing);
  document.body.appendChild(wrap.firstElementChild);
}
function handleSaveNCR(id){
  const data = {
    no: val('nf-no'), date: val('nf-date'), desc: val('nf-desc'), severity: val('nf-sev'),
    disposal: val('nf-disp'), immediate: val('nf-imm'), cost: val('nf-cost'), status: val('nf-status')
  };
  const p = activeProject(); if(!p){ toast(tr('need_active_project')); return; }
  if(id){
    Object.assign(state.ncrs.find(n=>n.id===id), data);
  } else {
    state.ncrs.push(Object.assign({id:uid(), projectId:p.id, createdAt:nowStr()}, data));
  }
  closeModalById('ncr-modal-backdrop');
  saveState(); renderRoute(); toast(tr('saved_ok'));
}
async function handleDeleteNCR(id){
  const ok = await confirmModal(tr('confirm_delete_title'), tr('confirm_delete_generic'), tr('yes_delete'), true);
  if(!ok) return;
  state.ncrs = state.ncrs.filter(n=>n.id!==id);
  saveState(); renderRoute(); toast(tr('deleted_ok'));
}
function val(id){ const el = document.getElementById(id); return el? el.value : ''; }

/* ---------- handlers: CAPA ---------- */
function openCAPAForm(editing){
  const wrap = document.createElement('div'); wrap.innerHTML = capaFormHtml(editing);
  document.body.appendChild(wrap.firstElementChild);
}
function handleSaveCAPA(id){
  const data = {
    ncrId: val('cf-ncr')||null, rc: val('cf-rc'), plan: val('cf-plan'), owner: val('cf-owner'),
    due: val('cf-due'), verify: val('cf-verify'), status: val('cf-status')

  closeModalById('capa-modal-backdrop');
  saveState(); renderRoute(); toast(tr('saved_ok'));
}
async function handleDeleteCAPA(id){
  const ok = await confirmModal(tr('confirm_delete_title'), tr('confirm_delete_generic'), tr('yes_delete'), true);
  if(!ok) return;
  state.capas = state.capas.filter(c=>c.id!==id);
  saveState(); renderRoute(); toast(tr('deleted_ok'));

/* ---------- handlers: backup / search ---------- */
async function handleExportJSON(){
  const data = JSON.stringify(state, null, 2);
  const filename = 'tqm-backup-'+todayStr()+'.json';
  try{
    const downloads = (typeof claude!=='undefined') ? await claude.use('downloads') : null;
    if(!downloads){ toast(tr('downloads_unavailable')); return; }
    await downloads.save({filename, data});
  }catch(err){
    if(err && err.code==='declined') return;
    toast(tr('downloads_unavailable'));
  }
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.projects)) throw new Error('bad');
      state = Object.assign(defaultState(), parsed);
      saveState(); render(); toast(tr('data_imported'));
    }catch(err){ toast(tr('data_import_error')); }
  };
  reader.readAsText(file);
}
async function handleResetData(){
  const ok = await confirmModal(tr('confirm_delete_title'), tr('confirm_reset'), tr('yes_reset'), true);
  if(!ok) return;
  state = defaultState();
  saveState(); render();
}
function handleSearch(q){
  const box = document.getElementById('search-results');
  q = q.trim();
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const lang = state.lang; const lq = q.toLowerCase();
  const docMatches = DOCS.filter(d=> (lang==='ar'?d.ar:d.en).toLowerCase().includes(lq) || d.code.toLowerCase().includes(lq)).slice(0,5);
  const projMatches = state.projects.filter(p=> p.name.toLowerCase().includes(lq) || p.code.toLowerCase().includes(lq)).slice(0,3);
  let html = '';
  projMatches.forEach(p=> html += `<div class="sr-item" data-action="sr-project" data-id="${p.id}"><div class="code">${esc(tr('projects_title'))}</div>${esc(p.code)} — ${esc(p.name)}</div>`);
  docMatches.forEach(d=> html += `<div class="sr-item" data-action="sr-doc" data-code="${d.code}"><div class="code">${esc(d.code)}</div>${esc(lang==='ar'?d.ar:d.en)}</div>`);
  if(!html){ box.classList.add('hidden'); return; }
  box.innerHTML = html; box.classList.remove('hidden');
  box.querySelectorAll('[data-action="sr-doc"]').forEach(el=> el.addEventListener('click', ()=>{
    state.route='documents'; state.selectedDocCode = el.dataset.code; saveState(); render();
  }));
  box.querySelectorAll('[data-action="sr-project"]').forEach(el=> el.addEventListener('click', ()=>{
    state.activeProjectId = el.dataset.id; saveState(); render();
  }));
}

})();
